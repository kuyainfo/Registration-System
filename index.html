/* =========================================================
   匯入精靈
   ========================================================= */
function impOpen(kind){
  const e=ev()||{};
  /* 範本庫要先讀進來，欄位對應那一步才知道哪些標題在庫裡有現成翻譯。
     讀失敗不擋匯入，只是不會自動帶翻譯。 */
  loadTpls().then(()=>{if(ROUTE==='import')render()});
  /* dec：衝突的逐格決定，key 是 ri+':'+fid，有值＝採用匯入值
     manual：姓名對到多位時的人工指定，key 是 ri，值是 guest id 或 'new'
     empFid：這場活動哪一個欄位是工號（比對第二層），存在 events.emp_field_id */
  IMP={step:1,kind,fileName:'',headers:[],rows:[],map:[],
       empFid:e.emp_field_id?String(e.emp_field_id):'',
       dec:{},manual:{},
       saveTpl:false,plan:null,sheetCount:1,result:null};
  ROUTE='import';render();
}
function impClose(){IMP=null;ROUTE='guests';render()}

function impFile(list){
  const f=list&&list[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      impLoad(XLSX.utils.sheet_to_json(ws,{header:1,blankrows:false,defval:''}),f.name,wb.SheetNames.length);
    }catch(err){alert('讀不到這個檔案：'+err.message)}
  };
  r.readAsArrayBuffer(f);
}
/* Excel 儲存格取值。
   ⚠️ 全檔不要再寫 String(cell||'')。
      數字 0 與 false 在 JavaScript 裡是 falsy，`0 || ''` 會得到空字串，
      於是被當成「這一格沒填」。
      客戶名單裡用 0/1 標記的欄位（抽獎資格、是否素食、有無眷屬…）
      所有的 0 都會憑空消失，而且不報錯 —— 2026-08-27 壓測時發現，
      3,000 筆裡有 351 筆的 0 完全沒寫進資料庫。
      只有 null 與 undefined 才算沒有值。 */
function cellText(v){
  return (v===null||v===undefined)?'':String(v).trim();
}

function impLoad(aoa,name,sheets){
  if(!aoa||aoa.length<2){alert('至少要有表頭與一列資料');return}
  IMP.headers=aoa[0].map(h=>String(h||'').trim());
  /* 整列判空也要用 cellText：一列裡如果只有數字 0（例如只填了「抽獎資格 0」），
     用 ||'' 判斷會把整列當成空列丟掉。 */
  IMP.rows=aoa.slice(1).filter(r=>r.some(c=>cellText(c)!==''));
  IMP.fileName=name;IMP.sheetCount=sheets||1;
  IMP.map=IMP.headers.map(impGuess);
  IMP.step=2;
  log('讀取匯入檔：'+name,'表頭 '+IMP.headers.length+' 欄、資料 '+IMP.rows.length+' 列（尚未寫入資料庫）');
  render();
}
function impGuess(h){
  const n=norm(h); if(!n)return '__skip';
  const NAME=['姓名','名字','中文姓名','員工姓名','參加者','參加者姓名','name','fullname','參與者'];
  const MAIL=['email','mail','電子郵件','信箱','電子信箱','公司email','公司信箱','郵件'];
  const TAB =['桌次','桌號','座位','table'];
  const LNG =['語言','語系','locale','lang','language','使用語言'];
  if(NAME.some(x=>norm(x)===n))return '__name';
  if(MAIL.some(x=>norm(x)===n||n.indexOf(norm(x))>=0))return '__email';
  if(TAB.some(x=>norm(x)===n))return '__table';
  if(LNG.some(x=>norm(x)===n))return '__lang';
  const hit=FIELDS.filter(f=>Object.keys(f.t||{}).some(l=>norm(f.t[l])===n))[0];
  return hit?String(hit.id):'__new';
}
/* Excel 那一欄可能寫「英文」「English」「en」「EN-US」，一律吃下來。
   認不出來的回 null，會退回這場的預設語言，不會擋住匯入。 */
function parseLocale(v){
  const t=String(v||'').trim().toLowerCase();
  if(!t)return null;
  if(/^zh|中文|繁中|chinese|^tw|台灣/.test(t))return 'zh';
  if(/^en|英文|english|^us|^uk/.test(t))return 'en';
  if(/^ja|^jp|日文|日語|日本語|japanese/.test(t))return 'ja';
  if(/^ko|^kr|韓文|韓語|한국어|korean/.test(t))return 'ko';
  return null;
}
/* 用標題去範本庫找同名的範本。中文標題與四語翻譯任一相符都算。
   找到就能把整份翻譯帶過來，不必匯入完再一個一個補。 */
function tplByLabel(label){
  const n=String(label||'').trim().toLowerCase().replace(/\s+/g,'');
  if(!n)return null;
  return TPLS.filter(t=>{
    if(String(t.label||'').trim().toLowerCase().replace(/\s+/g,'')===n)return true;
    return Object.keys(t.t||{}).some(k=>
      String(t.t[k]||'').trim().toLowerCase().replace(/\s+/g,'')===n);
  })[0]||null;
}
function impGuessType(ci){
  const vals=IMP.rows.map(r=>String(r[ci]==null?'':r[ci]).trim()).filter(Boolean);
  if(!vals.length)return{type:'text',options:null};
  if(vals.every(v=>/^-?\d+(\.\d+)?$/.test(v)))return{type:'number',options:null};
  if(vals.every(v=>/^\d{4}[-\/]\d{1,2}[-\/]\d{1,2}$/.test(v)))return{type:'date',options:null};
  const u=[];vals.forEach(v=>{if(u.indexOf(v)<0)u.push(v)});
  if(vals.length>=3&&u.length<=12&&u.length<vals.length&&u.every(v=>v.length<=20))
    return{type:'select',options:u};
  return{type:'text',options:null};
}
/* =========================================================
   6g：比對鍵瀑布　Email → 工號 → 姓名
   每一層「有值才試、命中唯一一位才採用」。
   為什麼唯一值優先、姓名放最後：姓名是最容易打錯也最不唯一的欄位，
   拿它當第一層等於用最不可靠的資料決定要不要往下找。
   漏認（多建一筆）在名單上看得見、可以補救；
   誤認（兩個同名被合成一個）是靜默覆蓋，事後查不出來。
   ========================================================= */
function impEmpField(){
  return IMP.empFid?(FIELDS.filter(f=>f.id===+IMP.empFid)[0]||null):null;
}
async function impSetEmp(v){
  IMP.empFid=v;
  const {error}=await sb.from('events').update({emp_field_id:v?+v:null}).eq('id',EVID);
  if(error){
    log('工號欄位設定失敗',error.message+'　（若是 column 不存在，請先執行 sql_6g_匯入比對.sql）',true);
    alert('這個設定存不進資料庫，詳情看右下角操作紀錄。\n本次匯入仍會照選的欄位比對。');
    return;
  }
  const e=ev(); if(e)e.emp_field_id=v?+v:null;
  log('設定工號比對欄位',v?('update events set emp_field_id='+v):'update events set emp_field_id=null（第二層不啟用）');
}
function dkey(ri,fid){return ri+':'+fid}

/* 某一列對上某位既有賓客時，逐欄算出差異。
   via 是這次用來認人的鍵，該鍵本身不列入衝突（值必然相同）。 */
function impConf(it,r,g,via){
  const out=[],empF=impEmpField();
  /* Email：被拿來認人時不可能不同；用工號或姓名認的才需要比。
     現有是空的就直接填（沿用舊行為），不算衝突。 */
  if(via!=='email'&&it.email&&g.email&&
     String(g.email).trim().toLowerCase()!==it.email.toLowerCase())
    out.push({fid:'__email',col:IMP.map.indexOf('__email'),label:'Email（比對用）',
              old:String(g.email),neo:it.email,bad:''});
  IMP.map.forEach((m,ci)=>{
    if(m==='__skip'||m==='__new'||m==='__name'||m==='__email')return;
    /* 同樣不能用 ||''：新檔填 0、舊值是 1 時，0 會被當成「沒填」而不算衝突，
       於是舊的 1 保留下來，資料悄悄不同步。第二次匯入更新名單時會踩到。 */
    const v=cellText(r[ci]); if(v==='')return;
    if(m==='__lang'){
      const nl=parseLocale(v);
      if(nl&&g.locale&&g.locale!==nl)
        out.push({fid:'__lang',col:ci,label:'語言',old:langName(g.locale),neo:langName(nl),bad:''});
      return;
    }
    if(m==='__table'){
      if(g.table_no&&String(g.table_no)!==v)
        out.push({fid:'__table',col:ci,label:'桌次',old:String(g.table_no),neo:v,bad:''});
      return;
    }
    const f=FIELDS.filter(x=>x.id===+m)[0]; if(!f)return;
    if(via==='emp'&&empF&&f.id===empF.id)return;
    const old=ansShow(g.id,f);
    if(!old||old===v)return;
    /* 單選：比對用的是顯示文字，寫入時要轉回選項代號。
       轉不出來的話 impCommit 會靜靜跳過 —— 勾了也不會寫入。
       所以這裡先標出來，勾選框設為不可勾。 */
    let bad='';
    if(f.field_type==='select'&&f.options){
      const o=f.options.filter(x=>Object.keys(x.t||{}).some(l=>norm(x.t[l])===norm(v)))[0];
      if(!o)bad='選項不存在';
    }
    out.push({fid:f.id,col:ci,label:f.label,old,neo:v,bad});
  });
  return out;
}

function impBuildPlan(){
  const iName=IMP.map.indexOf('__name'),iMail=IMP.map.indexOf('__email');
  const newCols=[];IMP.map.forEach((m,i)=>{if(m==='__new')newCols.push(i)});
  const newFields=newCols.map(i=>{
    const g=impGuessType(i);
    return{col:i,label:IMP.headers[i]||('欄位'+(i+1)),type:g.type,options:g.options};
  });

  /* 三層索引一次建好，不要每列都掃一遍 GUESTS */
  const empF=impEmpField();
  const iEmp=empF?IMP.map.indexOf(String(empF.id)):-1;
  const byMail={},byEmp={},byName={};
  const push=(o,k,g)=>{if(!k)return;(o[k]=o[k]||[]).push(g)};
  GUESTS.forEach(g=>{
    push(byMail,String(g.email||'').trim().toLowerCase(),g);
    push(byName,String(g.name||'').trim(),g);
    if(empF)push(byEmp,norm(ansShow(g.id,empF)),g);
  });

  IMP.dec={};IMP.manual={};
  const seen={},items=[];
  IMP.rows.forEach((r,ri)=>{
    const name=iName>=0?cellText(r[iName]):'';
    const mail=iMail>=0?cellText(r[iMail]):'';
    const emp =iEmp >=0?String(r[iEmp ]||'').trim():'';
    const it={ri,name,email:mail,emp,issues:[],action:'new',match:null,via:'',
              conflicts:[],cands:[]};
    if(!name)it.issues.push('缺姓名');
    if(mail&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail))it.issues.push('Email 格式錯');

    let cands=[];
    const tryKey=(idx,k,via)=>{
      if(it.match||!k)return;
      const a=idx[k]||[];
      if(a.length===1){it.match=a[0];it.via=via}
      else if(a.length>1)cands=a.slice();   /* 命中多位：先記著，繼續往下一層試 */
    };
    tryKey(byMail,mail.toLowerCase(),'email');
    tryKey(byEmp ,norm(emp)         ,'emp');
    tryKey(byName,name              ,'name');

    /* 檔案內重複：拿這一列實際能代表身分的值當 key */
    const key=mail?('m:'+mail.toLowerCase()):(emp?('e:'+norm(emp)):(name?('n:'+name):''));
    if(key){ if(seen[key]!==undefined)it.issues.push('檔案內重複'); else seen[key]=ri }

    if(it.match){
      it.conflicts=impConf(it,r,it.match,it.via);
      it.action=it.conflicts.length?'conflict':'fill';
    }else if(cands.length){
      /* 認不出是哪一位。預設當新增（多一筆看得見、可補救），
         列進「需人工判斷」讓人指定。 */
      it.cands=cands;
    }
    if(it.issues.length)it.action='error';
    items.push(it);
  });

  IMP.plan={items,newFields,counts:{}};
  impRecount();
  IMP.step=3;render();
}

function impRecount(){
  const items=IMP.plan.items,c=IMP.plan.counts;
  c.neo =items.filter(x=>x.action==='new').length;
  c.fill=items.filter(x=>x.action==='fill').length;
  c.conf=items.filter(x=>x.action==='conflict').length;
  c.err =items.filter(x=>x.action==='error').length;
  c.amb =items.filter(x=>x.cands.length&&x.action!=='error'&&IMP.manual[x.ri]===undefined).length;
}

/* ---- 衝突決定：勾選只寫狀態、不重繪；只有批次按鈕才局部重畫 ---- */
function impDec(ri,fid,on){
  if(on)IMP.dec[dkey(ri,fid)]=1; else delete IMP.dec[dkey(ri,fid)];
  /* 只換底部那一個數字。動到衝突清單的話，已勾的框會被重建、捲軸也會跳掉。 */
  impBarPaint();
}
function impBarCnt(){
  const c=IMP.plan.counts;
  return '已勾 <b>'+Object.keys(IMP.dec).length+'</b> 格採用匯入值　·　'+
         '新增 '+c.neo+'　補齊 '+(c.fill+c.conf)+'　衝突 '+c.conf+
         (c.amb?'　需人工判斷 '+c.amb:'')+(c.err?'　略過 '+c.err:'');
}
function impBarPaint(){
  const n=document.getElementById('impbarn'); if(n)n.innerHTML=impBarCnt();
}
function impDecAll(on){
  IMP.dec={};
  if(on)IMP.plan.items.forEach(it=>{ if(it.action!=='conflict')return;
    it.conflicts.forEach(c=>{if(!c.bad)IMP.dec[dkey(it.ri,c.fid)]=1}) });
  impDynPaint();
}
function impDecField(fid,on){
  IMP.plan.items.forEach(it=>{ if(it.action!=='conflict')return;
    it.conflicts.forEach(c=>{
      if(String(c.fid)!==String(fid))return;
      if(on&&!c.bad)IMP.dec[dkey(it.ri,c.fid)]=1; else delete IMP.dec[dkey(it.ri,c.fid)];
    }) });
  impDynPaint();
}
/* 人工指定是哪一位。選完當場重算那一列的衝突，
   不然選了之後衝突清單會是空的。 */
function impPick(ri,val){
  const it=IMP.plan.items.filter(x=>x.ri===ri)[0]; if(!it)return;
  IMP.manual[ri]=String(val);
  it.conflicts.forEach(c=>delete IMP.dec[dkey(ri,c.fid)]);
  if(String(val)==='new'){
    it.match=null;it.via='';it.conflicts=[];it.action='new';
  }else{
    const g=GUESTS.filter(x=>x.id===+val)[0];
    it.match=g||null;it.via='manual';
    it.conflicts=g?impConf(it,IMP.rows[ri],g,'manual'):[];
    it.action=it.conflicts.length?'conflict':'fill';
  }
  impRecount();impDynPaint();
}


async function impCommit(){
  const P=IMP.plan,e=ev();
  try{
    busy('① 建立欄位…');
    let created=[];
    if(P.newFields.length){
      const mx=Math.max(0,...FIELDS.map(f=>f.sort_order||0));
      const stamp=Date.now();
      const rows=P.newFields.map((nf,i)=>{
        /* 範本庫有同名的就把翻譯與說明帶過來 ——
           不然匯入建的欄位永遠只有中文，還要再手動補一次四語。
           型別以 Excel 推斷的為準（實際資料長什麼樣比範本庫的設定可靠），
           但選項的翻譯只有在型別一致時才帶得過來。 */
        const tp=tplByLabel(nf.label);
        let opts=nf.options?nf.options.map((v,j)=>({key:'o'+(j+1),t:{zh:v}})):null;
        if(tp&&opts&&Array.isArray(tp.options)){
          opts=opts.map(o=>{
            const hit=tp.options.filter(x=>
              String((x.t&&x.t.zh)||'').trim()===String(o.t.zh).trim())[0];
            return hit?{key:o.key,t:Object.assign({},hit.t,{zh:o.t.zh})}:o;
          });
        }
        return{
          event_id:EVID,field_key:'f_c'+stamp+'_'+i,label:nf.label,
          t:tp?Object.assign({},tp.t,{zh:nf.label}):{zh:nf.label},
          hint:tp?(tp.hint||null):null,
          field_type:nf.type,options:opts,
          sort_order:mx+i+1,active:true,
          show_in_form:true,show_in_list:true,show_to_guest:false,include_export:true
        };
      });
      const r=await sb.from('form_fields').insert(rows).select();
      if(r.error)throw r.error;
      created=r.data||[];
      log('建立本場欄位','insert into form_fields → '+created.length+' 列：'+created.map(f=>f.label).join('、'));
      if(IMP.saveTpl){
        const t=created.map(f=>({label:f.label,t:f.t,field_type:f.field_type,options:f.options}));
        const rt=await sb.from('field_templates').insert(t);
        if(rt.error)throw rt.error;
        log('存進欄位範本庫','insert into field_templates → '+t.length+' 列');
      }
    }

    /* 欄索引 → 目標 */
    const target=IMP.map.slice();
    P.newFields.forEach((nf,i)=>{
      const f=created.filter(x=>x.field_key.endsWith('_'+i))[0];
      if(f)target[nf.col]=String(f.id);
    });
    const allFields=FIELDS.concat(created);
    const fieldById={};allFields.forEach(f=>{fieldById[f.id]=f});
    const iTable=target.indexOf('__table');
    const iLang=target.indexOf('__lang');

    /* 新增賓客 */
    busy('② 寫入名單…');
    const newItems=P.items.filter(x=>x.action==='new');
    const tokenOfRi={};
    const insertRows=newItems.map(it=>{
      const r=IMP.rows[it.ri];
      const tk=mkToken();
      tokenOfRi[tk]=it.ri;
      /* Excel 有語言欄就用它，認不出來或沒有這一欄就退回這場的第一種語言。
         邀請階段的人還沒填過表單，locale 只能從匯入來，
         否則整批都會是中文，邀請信就全部寄錯語言。 */
      const lc=(iLang>=0?parseLocale(r[iLang]):null)||(e.languages&&e.languages[0])||'zh';
      return{event_id:EVID,name:it.name,email:it.email||null,
        status:IMP.kind==='invite'?'invited':'approved',source:'import',
        locale:lc,token:tk,
        table_no:iTable>=0?(parseInt(cellText(r[iTable]),10)||null):null,
        data_complete:IMP.kind!=='invite'};
    });
    let inserted=[];
    for(const part of chunk(insertRows,400)){
      const r=await sb.from('guests').insert(part).select();
      if(r.error)throw r.error;
      inserted=inserted.concat(r.data||[]);
      busy('② 寫入名單… '+inserted.length+' / '+insertRows.length);
    }
    log('新增賓客','insert into guests → '+inserted.length+' 列');

    /* 補齊既有賓客 */
    busy('③ 補齊既有賓客…');
    const fillItems=P.items.filter(x=>x.action==='fill'||x.action==='conflict');
    const upd=[];
    fillItems.forEach(it=>{
      const g=it.match,r=IMP.rows[it.ri];const patch={};
      if(IMP.kind==='confirm'&&g.status==='invited')patch.status='approved';
      /* Email 原本只在空的時候補；現在不一樣也能覆蓋，但要勾過 */
      if(it.email&&(!g.email||IMP.dec[dkey(it.ri,'__email')]))patch.email=it.email;
      if(iTable>=0){
        const t=parseInt(cellText(r[iTable]),10);
        /* 桌次在 guests.table_no，不在答案表，寫入是獨立的一段 */
        if(t&&(!g.table_no||IMP.dec[dkey(it.ri,'__table')]))patch.table_no=t;
      }
      if(iLang>=0){
        const nl=parseLocale(r[iLang]);
        /* 自己填過表單的人，locale 是他親手選的，不讓匯入蓋掉，除非勾了覆蓋 */
        if(nl&&(g.source!=='form'||IMP.dec[dkey(it.ri,'__lang')]))patch.locale=nl;
      }
      if(Object.keys(patch).length)upd.push({id:g.id,patch});
    });
    for(const u of upd){
      const r=await sb.from('guests').update(u.patch).eq('id',u.id);
      if(r.error)throw r.error;
    }
    log('補齊既有賓客','update guests → '+upd.length+' 列（比對：Email '+
      P.items.filter(x=>x.via==='email').length+' 筆／工號 '+
      P.items.filter(x=>x.via==='emp').length+' 筆／姓名 '+
      P.items.filter(x=>x.via==='name').length+' 筆／人工指定 '+
      P.items.filter(x=>x.via==='manual').length+' 筆）');

    /* 寫答案 */
    busy('④ 寫入欄位答案…');
    const idOf={};
    inserted.forEach(g=>{const ri=tokenOfRi[g.token];if(ri!==undefined)idOf[ri]=g.id});
    fillItems.forEach(it=>{idOf[it.ri]=it.match.id});
    const valRows=[];
    Object.keys(idOf).forEach(riStr=>{
      const ri=+riStr,gid=idOf[ri],r=IMP.rows[ri];
      target.forEach((m,ci)=>{
        if(m==='__skip'||m==='__name'||m==='__email'||m==='__table'||m==='__lang')return;
        /* ⚠️ 不能寫 String(r[ci]||'')。
           數字 0 在 JavaScript 裡是 falsy，`0 || ''` 會得到空字串，
           於是整筆被下面的 if(!v) 跳過 —— 客戶名單裡用 0/1 標記的欄位
           （抽獎資格、是否素食、有無眷屬…），所有的 0 都會憑空消失，
           而且不報錯，事後怎麼篩都篩不到那些人。
           false 也是同樣的問題。
           正確做法是只把 null 與 undefined 當成沒有值。 */
        const v=cellText(r[ci]);
        if(v==='')return;
        const f=fieldById[+m];if(!f)return;
        const isNewGuest=!P.items[ri].match;
        if(!isNewGuest&&ansRaw(gid,f.id)&&!IMP.dec[dkey(ri,f.id)])return;
        let store=v;
        if(f.field_type==='select'&&f.options){
          const o=f.options.filter(x=>Object.keys(x.t||{}).some(l=>norm(x.t[l])===norm(v)))[0];
          if(!o)return;
          store=o.key;
        }
        valRows.push({guest_id:gid,field_id:f.id,value:store});
      });
    });
    let done=0;
    for(const part of chunk(valRows,500)){
      const r=await sb.from('guest_field_values').upsert(part,{onConflict:'guest_id,field_id'});
      if(r.error)throw r.error;
      done+=part.length;busy('④ 寫入欄位答案… '+done+' / '+valRows.length);
    }
    log('寫入欄位答案','upsert guest_field_values → '+valRows.length+' 列（單選存的是選項代碼）');

    /* 通知紀錄 */
    busy('⑤ 寫入通知紀錄…');
    if(inserted.length){
      const nt=inserted.map(g=>({guest_id:g.id,type:IMP.kind==='invite'?'邀請信':'核准信'}));
      for(const part of chunk(nt,500)){
        const r=await sb.from('notifications').insert(part);
        if(r.error)throw r.error;
      }
      log('寫入通知紀錄','insert into notifications → '+nt.length+' 列');
    }

    busy(null);
    IMP.result={nNew:inserted.length,nFill:upd.length,
      nSkip:P.counts.err,nOver:Object.keys(IMP.dec).length,
      created:created.map(f=>f.label)};
    IMP.step=4;
    await loadEvent(EVID);
    ROUTE='import';render();
  }catch(err){
    busy(null);
    IMP.error=err;IMP.step=3;render();
    log('匯入失敗',err.message||String(err),true);
  }
}

/* =========================================================
   畫面
   ========================================================= */
function render(){
  /* 中文輸入法組字期間絕不重繪。
     重繪會把輸入框整個換掉，正在組的注音就會被強制送出。
     不論重繪是誰觸發的（輸入、同步、核銷回應），一律擋在這裡。 */
  if(COMPOSING){PENDING_RENDER=true;return}
  PENDING_RENDER=false;
  navTrack();
  if(MODAL&&MODAL.sticky!==true)paintModal();
  document.getElementById('bar').style.display=(VIEW?'none':'');
  document.getElementById('logbox').style.display=(VIEW==='form'||VIEW==='me'||VIEW==='stage'||VIEW==='pstage')?'none':'';
  document.getElementById('bar').innerHTML=
    '<span class="tag'+(ERR?' off':'')+'">'+(ERR?'連線異常':'已連線')+'</span>'+
    '<code>'+SUPABASE_URL.replace('https://','')+'</code>'+
    '<span class="sp"></span>'+
    '<span class="note" style="color:#C9C6BC">'+(USER?esc(USER.email):'未登入')+'</span>'+(USER?'<button onclick="doLogout()">登出</button>':'')+
    '<button onclick="reloadCurrent()">重新讀取</button>';

  let h='';
  if(VIEW==='checkin'){document.getElementById('app').innerHTML=lineBar('zh')+renderCheckin();
    /* 重繪會換掉 video 元素，要把既有的鏡頭串流重新接上 */
    if(CAM.on&&CAM.stream){
      const v=document.getElementById('camv');
      if(v){v.srcObject=CAM.stream;v.muted=true;
        v.setAttribute('playsinline','');try{v.play()}catch(_){}}
    }
    const i=document.getElementById('ckinput');
    if(i&&!COMPOSING){i.focus();i.setSelectionRange(i.value.length,i.value.length)}
    return}
  if(VIEW==='form'){document.getElementById('app').innerHTML=lineBar(LANG)+renderForm();
    depApply();return}
  if(VIEW==='me'){document.getElementById('app').innerHTML=lineBar(LANG)+renderMe();return}
  if(VIEW==='paper'){document.getElementById('app').innerHTML=lineBar('zh')+renderPaper();
    /* 重繪會換掉 video 元素，要把既有的鏡頭串流重新接上（同核銷頁） */
    if(CAM.on&&CAM.stream){
      const v=document.getElementById('camv');
      if(v){v.srcObject=CAM.stream;v.muted=true;
        v.setAttribute('playsinline','');try{v.play()}catch(_){}}
    }
    return}
  if(VIEW==='pstage'){document.getElementById('app').innerHTML=renderPStage();return}
  if(VIEW==='stage'){document.getElementById('app').innerHTML=renderStage();return}
  if(!AUTHREADY)h='<div class="wrap"><p class="note">檢查登入狀態…</p></div>';
  else if(!USER)h=pgLogin();
  else if(LOADING)h='<div class="wrap"><p class="note">讀取中…</p></div>';
  else if(ERR&&ROUTE==='events')h='<div class="wrap">'+errBlock()+'</div>';
  else if(ROUTE==='events')h=pgEvents();
  else if(ROUTE==='event') h=pgEvent();
  else if(ROUTE==='fields')h=pgFields();
  else if(ROUTE==='guests')h=pgGuests();
  else if(ROUTE==='codes') h=pgCodes();
  else if(ROUTE==='items') h=pgItems();
  else if(ROUTE==='tpls')  h=pgTpls();
  else if(ROUTE==='links') h=pgLinks();
  else if(ROUTE==='import')h=pgImport();
  else if(ROUTE==='mtpl')  h=pgMTpl();
  else if(ROUTE==='mset')  h=pgMSet();
  else if(ROUTE==='mlog')  h=pgMLog();
  else if(ROUTE==='lots')  h=pgLots();
  document.getElementById('app').innerHTML=h;
}
function errBlock(){
  return '<div class="warn"><b>讀不到資料</b>下面整段複製給我。</div><pre>'+esc(errText(ERR))+'</pre>'+
    '<p class="note"><code>permission denied</code> → 這個身分沒有這張表的權限；'+
    '空結果但沒錯誤 → RLS 規則擋掉了；'+
    '後台出現這兩種，先確認左上角顯示的是你的 Email 而不是「未登入」。</p>';
}
/* =========================================================
   回上一頁（後台專用）
   在 render() 裡自動記錄，不必去改散落各處的 ROUTE='x';render()。
   登入頁不是 ROUTE，所以永遠不會被退回去；登出時整個清空。
   賓客端與核銷頁（VIEW 有值）不記錄，那些頁面沒有上一頁可回。
   ========================================================= */
let NAVSTACK=[], NAVLAST=null;
function navTrack(){
  if(VIEW||!USER)return;
  const cur=ROUTE+'|'+(EVID||'');
  if(NAVLAST&&NAVLAST!==cur){
    if(NAVSTACK[NAVSTACK.length-1]!==NAVLAST)NAVSTACK.push(NAVLAST);
    if(NAVSTACK.length>40)NAVSTACK.shift();
  }
  NAVLAST=cur;
}
function navReset(){NAVSTACK=[];NAVLAST=null}
async function goBack(){
  const prev=NAVSTACK.pop();
  if(!prev){ROUTE='events';EVID=null;NAVLAST=null;render();return}
  const bits=prev.split('|');
  const evid=bits[1]?parseInt(bits[1],10):null;
  const needLoad=(evid&&evid!==EVID);
  ROUTE=bits[0];EVID=evid;
  NAVLAST=prev;                 /* 先設好，避免這次 render 又把它推回堆疊 */
  if(needLoad){await loadEvent(evid);NAVLAST=prev}
  render();
}
function backBtn(){
  if(!NAVSTACK.length)return '';
  return '<button class="btn sec sm" onclick="goBack()">&lsaquo; 回上一頁</button>';
}
function crumb(a){
  return '<div class="navrow"><div class="crumb">'+a.map((x,i)=>i===a.length-1?'<b>'+x[0]+'</b>'
    :'<span onclick="'+x[1]+'">'+x[0]+'</span>').join(' ／ ')+'</div>'+backBtn()+'</div>';
}

      gift_enabled:m.querySelector('#fGift').checked};

    const ok=e?await updateEvent(e.id,d):await createEvent(d);
    if(ok)m.remove();else m.querySelector('#s').disabled=false;
  };
}

/* ---- 欄位設定 ---- */
/* 表格內容抽成獨立函式，拖曳與上下移動只重畫這一塊，
   不整頁重繪 —— 不會閃、不會跳捲軸，輸入中的欄位也不會被清掉 */
/* ---- 活動欄位：選項增刪與排序 ----

   與範本庫那組的差別：這裡的選項可能已經有人選了。
   刪除前一定要查有幾個人選過 —— 刪掉之後那些答案會變成孤兒
   （值還在 guest_field_values，但找不到對應的 key，名單頁顯示不出文字）。

   ⚠️ key 一律不動，理由同範本庫。 */
let FOPT=null;
function foptOpen(id){FOPT=(FOPT===id?null:id);FTR=null;DEPE=null;render()}

/* 這個選項被幾個人選了。名單頁與匯出都靠這個判斷該不該擋 */
function optUsedCount(fid,key){
  let n=0;
  GUESTS.forEach(g=>{
    const v=VALS[vKey(g.id,fid)];
    if(v!=null&&String(v)===String(key))n++;
  });
  return n;
}

async function fldOptsSave(fid,options,how){
  const {error}=await sb.from('form_fields').update({options:options}).eq('id',fid);
  if(error){alert('儲存失敗');log('修改欄位選項失敗',error.message,true);return}
  log('欄位選項'+how,'update form_fields where id='+fid+'；key 保持不變');
  await loadEvent(EVID);
}

async function fldOptAdd(fid){
  const f=FIELDS.filter(x=>x.id===fid)[0];if(!f)return;
  const v=prompt('新增選項的中文文字：');
  if(!v||!v.trim())return;
  const opts=(f.options||[]).slice();
  opts.push({key:nextOptKey(opts),t:{zh:v.trim()}});
  await fldOptsSave(fid,opts,'新增：'+v.trim());
}

/* 刪除有兩種：
     沒人選過 → 真的移除，資料保持乾淨
     有人選過 → 只標記 del:true，名稱留著

   為什麼不一律真刪：答案存的是代號，選項一旦消失，
   名單頁只剩「o3」這種東西，事後根本不知道那個人當初選了什麼。
   標記之後賓客端選不到，但後台看得到「業務部（已刪除）」。 */
async function fldOptDel(fid,key){
  const f=FIELDS.filter(x=>x.id===fid)[0];if(!f)return;
  const opts=(f.options||[]);
  if(liveOpts(f).length<=2){alert('單選至少要保留兩個可選的選項。');return}
  const o=opts.filter(x=>x.key===key)[0];
  const nm=(o&&o.t&&o.t.zh)||key;

  /* ⚠️ 先去資料庫問一次，不能只看畫面上的 VALS。
     賓客隨時會從報名表單改答案，後台這份是進頁面那一刻的快照 ——
     用舊快照判斷「沒人選」就真刪，正好刪掉剛剛才有人選的那一項。
     這一步是刪除前的最後確認，多打一次 API 換掉不可逆的誤刪。 */
  busy('確認使用中的資料…');
  const chk=await sb.from('guest_field_values')
    .select('guest_id',{count:'exact',head:true})
    .eq('field_id',fid).eq('value',key);
  busy(null);
  if(chk.error){alert('無法確認使用狀況，為安全起見不執行刪除。');
    log('查詢選項使用數失敗',chk.error.message,true);return}
  const used=chk.count||0;
  if(used>0){
    if(!confirm('已經有 '+used+' 位賓客選了「'+nm+'」\n\n'+
      '會把這個選項標記為已刪除：\n'+
      '・賓客表單不再顯示，之後沒有人選得到\n'+
      '・那 '+used+' 筆答案保留，名單與匯出顯示為「'+nm+'（已刪除）」\n'+
      '・隨時可以還原\n\n繼續嗎？'))return;
    await fldOptsSave(fid,opts.map(x=>x.key===key?Object.assign({},x,{del:true}):x),
      '標記已刪除：'+nm+'（'+used+' 人已選）');
    return;
  }
  if(!confirm('刪除選項「'+nm+'」？\n\n目前沒有人選這一項，可以直接移除。'))return;
  await fldOptsSave(fid,opts.filter(x=>x.key!==key),'刪除：'+nm);
}

/* 還原：把標記拿掉，賓客表單就又看得到了 */
async function fldOptRestore(fid,key){
  const f=FIELDS.filter(x=>x.id===fid)[0];if(!f)return;
  const o=(f.options||[]).filter(x=>x.key===key)[0];
  await fldOptsSave(fid,(f.options||[]).map(x=>{
    if(x.key!==key)return x;
    const c=Object.assign({},x);delete c.del;return c;
  }),'還原：'+((o&&o.t&&o.t.zh)||key));
}

async function fldOptMove(fid,key,dir){
  const f=FIELDS.filter(x=>x.id===fid)[0];if(!f)return;
  const opts=(f.options||[]).slice();
  const i=opts.findIndex(x=>x.key===key);
  const j=i+dir;
  if(i<0||j<0||j>=opts.length)return;
  const tmp=opts[i];opts[i]=opts[j];opts[j]=tmp;
  await fldOptsSave(fid,opts,'調整順序');
}

function foptBox(fid){
  const f=FIELDS.filter(x=>x.id===fid)[0];if(!f)return '';
  if(f.field_type!=='select')
    return '<div class="card"><p class="note">只有單選型別才有選項。</p>'+
      '<p><button class="btn sec" onclick="foptOpen('+fid+')">關閉</button></p></div>';
  const opts=f.options||[];
  const rows=opts.filter(o=>!o.del).map((o,i)=>{
    const used=optUsedCount(fid,o.key);
    const last=liveOpts(f).length-1;
    return '<div class="hit optdrag" draggable="true" '+
      'ondragstart="optDragStart(event,\'f\','+fid+',\''+esc(o.key)+'\')" '+
      'ondragover="optDragOver(event,\'f\','+fid+',\''+esc(o.key)+'\')" '+
      'ondrop="optDrop(event,\'f\','+fid+',\''+esc(o.key)+'\')" '+
      'ondragend="optDragEnd()">'+
      '<span class="nm"><span class="drag">⠿</span> '+esc((o.t&&o.t.zh)||o.key)+
      '<span class="via">'+esc(o.key)+'</span></span>'+
    '<span class="meta">'+(used?'<b>'+used+'</b> 人已選':'<span class="note">沒有人選</span>')+'</span>'+
    '<span class="fixrow">'+
      '<button class="btn sec sm" '+(i===0?'disabled':'')+
        ' onclick="fldOptMove('+fid+',\''+esc(o.key)+'\',-1)">↑</button> '+
      '<button class="btn sec sm" '+(i===last?'disabled':'')+
        ' onclick="fldOptMove('+fid+',\''+esc(o.key)+'\',1)">↓</button> '+
      '<button class="btn d sm" onclick="fldOptDel('+fid+',\''+esc(o.key)+'\')">刪除</button>'+
    '</span></div>';
  }).join('');
  /* 已刪除的獨立一區。留在畫面上是刻意的 ——
     不然你會忘記有這些東西存在，看到名單頁的「（已刪除）」也不知道怎麼處理 */
  const dead=opts.filter(o=>o.del);
  const deadRows=dead.length
    ? '<p style="margin:14px 0 6px"><b>已刪除的選項</b>'+
      '<span class="note">　賓客選不到，但舊答案仍顯示得出名稱</span></p>'+
      dead.map(o=>'<div class="hit" style="opacity:.7"><span class="nm">'+
        esc((o.t&&o.t.zh)||o.key)+'<span class="via">'+esc(o.key)+'</span></span>'+
        '<span class="meta">'+(optUsedCount(fid,o.key)||0)+' 人已選</span>'+
        '<span class="fixrow"><button class="btn sec sm" onclick="fldOptRestore('+fid+
          ',\''+esc(o.key)+'\')">還原</button></span></div>').join('')
    : '';
  return '<div class="card" style="border-color:var(--blue)"><h3>選項：'+esc(f.label)+'</h3>'+
    '<p class="note">選項文字與各語言翻譯請按「翻譯／說明」。這裡管的是增刪與順序，'+
      '可以直接拖曳調整。</p>'+
    rows+deadRows+
    '<p style="margin-top:12px"><button class="btn" onclick="fldOptAdd('+fid+')">＋ 新增選項</button> '+
      '<button class="btn sec" onclick="foptOpen('+fid+')">關閉</button></p>'+
    '<p class="note" style="margin-top:8px">「已選」人數是進入這一頁時算的，'+
      '賓客可能在這之後又改了答案 —— 按下刪除時會再去資料庫確認一次。'+
      '沒人選過的選項會直接移除；已經有人選過的只會標記為已刪除，'+
      '名稱留著讓舊答案看得懂，隨時可以還原。</p></div>';
}

/* ---- 欄位批次操作 ----

   欄位沒有 active 這種欄位，所以「停用」＝四個開關全關（哪裡都不出現）。
   ⚠️ 這個動作不可還原成原本的開關組合 —— 系統不會記得你關掉之前
      哪幾個是開的。確認視窗要把這句寫出來。

   ⚠️ 勾選時只重畫操作列，不呼叫 render()。
      這一頁的欄位標題是 inline 的 input，整頁重繪會把還沒 blur 的
      編輯內容丟掉。這跟 fldPaint 存在的理由是同一個。 */
let FSEL={};
function fselCount(){return Object.keys(FSEL).length}
function fselIds(){return Object.keys(FSEL).map(x=>parseInt(x,10))}
function fselBarPaint(){
  const box=document.getElementById('fselbar');
  if(box)box.innerHTML=fselBarHtml();
}
function fselToggle(id,on){
  if(on)FSEL[id]=1;else delete FSEL[id];
  fselBarPaint();
}
function fselAll(on){
  if(on)FIELDS.forEach(f=>{FSEL[f.id]=1});else FSEL={};
  fldPaint();fselBarPaint();
}
function fselClear(){FSEL={};fldPaint();fselBarPaint()}

function fselBarHtml(){
  const n=fselCount();
  if(!n)return '';
  return '<div class="card plain" style="margin-bottom:10px;border-color:var(--purple)">'+
    '<div class="row" style="align-items:center">'+
      '<div style="flex:none"><b>已選取 '+n+' 個欄位</b></div>'+
      '<div style="flex:none">'+
        '<button class="btn sec sm" onclick="fselOff()">停用</button> '+
        '<button class="btn d sm" onclick="fselDelete()">刪除</button> '+
        '<button class="btn sec sm" onclick="fselClear()">取消選取</button></div>'+
    '</div>'+
    '<p class="note" style="margin:8px 0 0">「停用」是把四個開關全部關掉，'+
      '欄位與答案都留著、哪裡都不出現，但<b>不會記得原本哪幾個是開的</b>，'+
      '要復原得自己重開。「刪除」會連答案一起消失。</p></div>';
}

async function fselOff(){
  const ids=fselIds();
  if(!ids.length){alert('請先勾選');return}
  const fs=FIELDS.filter(f=>FSEL[f.id]);
  if(!confirm('把 '+ids.length+' 個欄位的四個開關全部關掉？\n\n'+
    fs.map(f=>'　· '+f.label).join('\n')+'\n\n'+
    '欄位與已填的答案都會留著，只是哪裡都不出現。\n'+
    '\u26a0\ufe0f 系統不會記得原本哪幾個開關是開的，要復原得自己重開。'))return;
  busy('停用中…');
  const {error}=await sb.from('form_fields').update({
    show_in_form:false, show_in_list:false,
    show_to_guest:false, include_export:false}).in('id',ids);
  busy(null);
  if(error){alert('停用失敗');log('批次停用欄位失敗',error.message,true);return}
  log('批次停用欄位 '+ids.length+' 個',fs.map(f=>f.label).join('、')+'；四個開關全關');
  FSEL={};await loadEvent(EVID);
}

async function fselDelete(){
  const ids=fselIds();
  if(!ids.length){alert('請先勾選');return}
  const fs=FIELDS.filter(f=>FSEL[f.id]);
  /* 有多少答案會跟著消失。跟單筆刪除同一個算法 */
  let nAns=0;
  ids.forEach(id=>{nAns+=Object.keys(VALS).filter(k=>k.endsWith('_'+id)).length});
  /* 依賴這些欄位、但自己沒被勾到的，會被 cascade 一起刪掉 —— 這個最容易漏看 */
  const orphan=FIELDS.filter(f=>!FSEL[f.id]&&f.dep_field_id&&FSEL[f.dep_field_id]);
  let msg='刪除 '+ids.length+' 個欄位？\n\n'+fs.map(f=>'　· '+f.label).join('\n')+'\n\n';
  if(orphan.length){
    msg+='\u26a0\ufe0f 下列欄位設了顯示條件、依賴上面這幾個，會被一併刪除：\n'+
         orphan.map(f=>'　· '+f.label).join('\n')+'\n\n';
  }
  msg+='目前共有 '+nAns+' 筆答案會一起消失（外鍵 cascade），且無法復原。\n'+
       '只是不想讓它出現的話，改用「停用」。';
  if(!confirm(msg))return;
  busy('刪除中…');
  const {error}=await sb.from('form_fields').delete().in('id',ids);
  busy(null);
  if(error){alert('刪除失敗');log('批次刪除欄位失敗',error.message,true);return}
  log('批次刪除欄位 '+ids.length+' 個',
      fs.map(f=>f.label).join('、')+'；'+nAns+' 筆答案由 cascade 連帶刪除'+
      (orphan.length?'；另有 '+orphan.length+' 個依賴欄位一併刪除':''));
  FSEL={};await loadEvent(EVID);
}

function fldRowsHtml(){
  return FIELDS.map((f,i)=>{
    const sw=(k,lab)=>'<label class="sw"><input type="checkbox" '+(f[k]?'checked':'')+
      ' onchange="fieldPatch('+f.id+',{'+k+':this.checked},\''+esc(f.label)+'\')"> '+lab+'</label>';
    const where=[];
    if(f.show_in_form)where.push('<span class="tag2" style="border-color:#0F6E56;color:#0F6E56">表單頁</span>');
    if(f.show_in_list)where.push('<span class="tag2" style="border-color:#534AB7;color:#534AB7">名單頁</span>');
    if(f.show_to_guest)where.push('<span class="tag2" style="border-color:#185FA5;color:#185FA5">個人頁</span>');
    if(f.include_export)where.push('<span class="tag2" style="border-color:#BA7517;color:#BA7517">匯出</span>');
    if(!where.length)where.push('<span class="tag2" style="border-color:#A32D2D;color:#A32D2D">哪裡都不出現</span>');
    const done=evLangs(ev()).filter(k=>k!=='zh'&&f.t&&f.t[k]);
    if(done.length)where.push('<span class="tag2" style="border-color:#666;color:#666">譯 '+done.join('/')+'</span>');
    if(f.dep_field_id)where.push('<span class="tag2" style="border-color:#534AB7;color:#534AB7">條件：'+
      esc(depLabel(f))+'</span>');
    if(f.hint&&f.hint.zh)where.push('<span class="tag2" style="border-color:#666;color:#666">有說明</span>');
    if(sameLabel(f.label,f.id).length)
      where.push('<span class="tag2" style="border-color:#A32D2D;color:#A32D2D">名稱重複</span>');
    const T={text:'文字',number:'數字',date:'日期',select:'單選',consent:'同意條款'};
    const kid=fieldIsKid(f)?' kid':'';
    return '<tr class="fldrow'+kid+'" draggable="true" '+
      'ondragstart="dragStart(event,'+f.id+')" ondragend="dragEnd()" '+
      'ondragover="dragOver(event,'+f.id+')" ondrop="dropOn(event,'+f.id+')">'+
      '<td class="nowrap"><input type="checkbox"'+(FSEL[f.id]?' checked':'')+
        ' onclick="event.stopPropagation()"'+
        ' onchange="fselToggle('+f.id+',this.checked)"></td>'+
      '<td class="nowrap"><span class="drag" title="拖曳可調整順序">⠿</span> '+
      '<button class="btn sec sm" '+(i===0?'disabled':'')+' onclick="fieldMove('+f.id+',-1)">↑</button> '+
      '<button class="btn sec sm" '+(i===FIELDS.length-1?'disabled':'')+' onclick="fieldMove('+f.id+',1)">↓</button></td>'+
      '<td class="wrap" style="min-width:150px"><input type="text" value="'+esc(f.label)+'" '+
        'onchange="fieldRename('+f.id+',this.value,this)"></td>'+
      '<td class="nowrap"><select onchange="fieldPatch('+f.id+',{field_type:this.value},\''+esc(f.label)+'\')">'+
        ['text','number','date','select','consent'].map(t=>'<option value="'+t+'" '+(f.field_type===t?'selected':'')+
          ((t==='select'&&!(f.options&&f.options.length))?' disabled':'')+'>'+T[t]+'</option>').join('')+'</select>'+
        (f.options&&f.options.length?'<div class="mini">'+f.options.length+' 個選項</div>':'')+'</td>'+
      '<td class="nowrap">'+sw('show_in_form','賓客可填')+'<br>'+sw('show_in_list','後台顯示')+'<br>'+
        sw('show_to_guest','賓客可見')+'<br>'+sw('include_export','匯出包含')+'</td>'+
      '<td>'+where.join(' ')+'</td>'+
      '<td class="nowrap"><button class="btn sec sm" onclick="ftrOpen('+f.id+')">翻譯／說明</button> '+
        (f.field_type==='select'
          ?'<button class="btn sec sm" onclick="foptOpen('+f.id+')">選項</button> ':'')+
        '<button class="btn sec sm" onclick="depOpen('+f.id+')">條件</button> '+
        '<button class="btn sec sm" onclick="fieldDelete('+f.id+')">移除</button></td></tr>'+

/* ---- 範本庫管理（獨立頁） ---- */
/* ---- 範本庫翻譯（跨活動共用） ----

   與欄位翻譯（ftrOpen）的差別只有兩個：寫進 field_templates 而不是 form_fields，
   而且語言固定四語 —— 範本不屬於任何一場活動，
   不能拿某一場的 events.languages 來決定要填哪幾種。 */
let TTR=null;
const TPL_LANGS=['zh','en','ja','ko'];

function ttrOpen(id){TTR=(TTR===id?null:id);TOPT=null;render()}
function ttrClose(){TTR=null;render()}

async function ttrSave(id){
  const t0=TPLS.filter(x=>x.id===id)[0];if(!t0)return;
  const t={};
  TPL_LANGS.forEach(k=>{
    const el=document.getElementById('ttr_'+id+'_'+k);
    if(el){const v=el.value.trim();if(v)t[k]=v}
  });
  if(!t.zh)t.zh=t0.label;
  const hint={};
  TPL_LANGS.forEach(k=>{
    const el=document.getElementById('tth_'+id+'_'+k);
    if(el){const v=el.value.trim();if(v)hint[k]=v}
  });
  /* 選項：文字與翻譯都可以改。key 不動 ——
     賓客答案存的是 key，改了會對不上已填的資料 */
  let options=t0.options;
  if(t0.field_type==='select'&&Array.isArray(t0.options)){
    options=t0.options.map(o=>{
      const ot={};
      TPL_LANGS.forEach(k=>{
        const el=document.getElementById('tto_'+id+'_'+o.key+'_'+k);
        if(el){const v=el.value.trim();if(v)ot[k]=v}
      });
      if(!ot.zh)ot.zh=(o.t&&o.t.zh)||o.key;
      return {key:o.key,t:ot};
    });
  }
  busy('儲存中…');
  const patch={t:t,options:options,hint:Object.keys(hint).length?hint:null,label:t.zh};
  const {error}=await sb.from('field_templates').update(patch).eq('id',id);
  busy(null);
  if(error){alert('儲存失敗');log('儲存範本翻譯失敗',error.message,true);return}
  log('更新範本翻譯：'+t.zh,'update field_templates 的 t、options[].t、hint');
  TTR=null;await loadTpls();render();
}

/* ---- 從範本庫同步翻譯到這一場已建立的欄位 ----

   挑選當下是「複製」不是「引用」，所以範本之後補了翻譯，
   已經加進活動的欄位不會自己更新 —— 這是原設計的意圖
   （不會因為改了範本，導致去年辦完的活動資料跟著變）。

   但「範本填好翻譯時，這場早就加過了」是實際會發生的情況，
   所以提供這顆按鈕，由人明確按下去才同步，不是自動的。 */
async function syncTplTrans(){
  const cand=FIELDS.filter(f=>f.template_id);
  if(!cand.length){alert('這場沒有任何從範本庫加入的欄位。');return}
  await loadTpls();
  const jobs=[];
  cand.forEach(f=>{
    const t0=TPLS.filter(x=>x.id===f.template_id)[0];
    if(!t0)return;                       /* 範本被刪了就跳過，欄位維持原樣 */
    const langs=Object.keys(t0.t||{}).filter(k=>k!=='zh');
    const hasHint=t0.hint&&Object.keys(t0.hint).length;
    /* 範本後來新增的選項也要能補過來。只補多的，不刪這場已有的 —— 見下方 */
    const newOpts=(f.field_type==='select'&&Array.isArray(t0.options)&&Array.isArray(f.options))
      ? t0.options.filter(o=>!f.options.some(x=>x.key===o.key)) : [];
    if(!langs.length&&!hasHint&&!newOpts.length)return;
    jobs.push({f:f,t0:t0,newOpts:newOpts});
  });
  if(!jobs.length){alert('範本庫裡對應的範本都還沒有填翻譯，沒有東西可以同步。');return}
  const addTotal=jobs.reduce((n,j)=>n+j.newOpts.length,0);
  if(!confirm('把範本庫的內容同步到這一場的 '+jobs.length+' 個欄位？\n\n'+
    jobs.map(j=>'・'+j.f.label+
      (j.newOpts.length?'（新增 '+j.newOpts.length+' 個選項）':'')).join('\n')+'\n\n'+
    '會做的事：補上各語言翻譯與說明'+
    (addTotal?'，並新增範本有、這場沒有的 '+addTotal+' 個選項':'')+'。\n\n'+
    '不會做的事：中文標題保持這場自己的、選項代號不動、'+
    '這場多出來的選項不會被刪掉。\n'+
    '（範本刪掉的選項若這場還在，會列在同步完成的訊息裡，要不要刪由你決定。）'))return;
  busy('同步中…');
  let ok=0;
  const extra=[];
  for(const j of jobs){
    /* 中文一律保留欄位自己的 —— 這場可能已經把「所屬部門」改成
       「所屬部門（台北）」，同步翻譯不該把這個改動蓋掉 */
    const t=Object.assign({},j.t0.t||{},{zh:(j.f.t&&j.f.t.zh)||j.f.label});
    let options=j.f.options;
    if(j.f.field_type==='select'&&Array.isArray(j.f.options)&&Array.isArray(j.t0.options)){
      options=j.f.options.map(o=>{
        const to=j.t0.options.filter(x=>x.key===o.key)[0];
        if(!to)return o;                 /* 對不到 key 就不動，避免張冠李戴 */
        return {key:o.key,t:Object.assign({},to.t||{},{zh:(o.t&&o.t.zh)||o.key})};
      });
      /* A 案：只補範本有、這場沒有的選項，不刪這場多出來的。
         完全覆蓋的話，已經有人選了被刪掉的選項，那筆答案會變成孤兒 —— 
         值還在但顯示不出文字，而且是刪了才會發現。 */
      j.newOpts.forEach(o=>options.push({key:o.key,t:Object.assign({},o.t||{})}));
      /* 範本已刪、這場仍保留的選項記下來，同步完一起告訴使用者 */
      j.f.options.forEach(o=>{
        if(o.del)return;                 /* 已標記刪除的不用再提醒 */
        if(!j.t0.options.some(x=>x.key===o.key))
          extra.push(j.f.label+'：'+((o.t&&o.t.zh)||o.key));
      });
    }
    const r=await sb.from('form_fields')
      .update({t:t,options:options,hint:j.t0.hint||j.f.hint||null}).eq('id',j.f.id);
    if(!r.error)ok++;
  }
  busy(null);
  log('從範本庫同步翻譯：'+ok+'／'+jobs.length+' 個欄位',
      '中文標題與選項代號保持不變，只補各語言翻譯與說明');
  alert('已同步 '+ok+' 個欄位。'+
    (extra.length?'\n\n以下選項範本庫已經沒有了，但這場仍保留（沒有動它）：\n'+
      extra.map(x=>'・'+x).join('\n')+
      '\n\n要刪的話到該欄位的「選項」，刪除前會顯示已經有幾個人選過。':''));
  await loadEvent(EVID);
}

/* ---- 範本庫：選項增刪與排序 ----

   型別刻意不開放修改：從單選改成文字，options 就沒意義；
   反過來又得補選項。範本庫東西少、刪掉重建成本極低
   （刪除不影響已建立的欄位），開放改型別只會多一堆邊界情況。

   ⚠️ key 一律不動。賓客答案存的是 key，改了會對不上已填的資料。
      新增給新的 key、刪除直接移除、排序只動陣列順序。 */
function nextOptKey(options){
  let n=1;
  const used={};(options||[]).forEach(o=>used[o.key]=1);
  while(used['o'+n])n++;
  return 'o'+n;
}

async function tplOptsSave(id,options,how){
  const {error}=await sb.from('field_templates').update({options:options}).eq('id',id);
  if(error){alert('儲存失敗');log('修改範本選項失敗',error.message,true);return false}
  log('範本選項'+how,'update field_templates where id='+id+'；key 保持不變');
  await loadTpls();render();
  return true;
}

async function tplOptAdd(id){
  const t=TPLS.filter(x=>x.id===id)[0];if(!t)return;
  const v=prompt('新增選項的中文文字：');
  if(!v||!v.trim())return;
  const opts=(t.options||[]).slice();
  opts.push({key:nextOptKey(opts),t:{zh:v.trim()}});
  await tplOptsSave(id,opts,'新增：'+v.trim());
}

async function tplOptDel(id,key){
  const t=TPLS.filter(x=>x.id===id)[0];if(!t)return;
  const opts=(t.options||[]);
  if(opts.length<=2){alert('單選至少要保留兩個選項。');return}
  const o=opts.filter(x=>x.key===key)[0];
  if(!confirm('刪除選項「'+((o&&o.t&&o.t.zh)||key)+'」？\n\n'+
    '這只影響範本庫。已經加進活動的欄位不受影響。'))return;
  await tplOptsSave(id,opts.filter(x=>x.key!==key),'刪除：'+((o&&o.t&&o.t.zh)||key));
}

async function tplOptMove(id,key,dir){
  const t=TPLS.filter(x=>x.id===id)[0];if(!t)return;
  const opts=(t.options||[]).slice();
  const i=opts.findIndex(x=>x.key===key);
  const j=i+dir;
  if(i<0||j<0||j>=opts.length)return;
  const tmp=opts[i];opts[i]=opts[j];opts[j]=tmp;
  await tplOptsSave(id,opts,'調整順序');
}

/* 選項編輯面板。與翻譯面板分開：這裡管的是「有哪些選項、什麼順序」，
   翻譯面板管的是「每個選項各語言怎麼寫」 */
let TOPT=null;
function toptOpen(id){TOPT=(TOPT===id?null:id);TTR=null;render()}

function toptBox(id){
  const t=TPLS.filter(x=>x.id===id)[0];if(!t)return '';
  if(t.field_type!=='select')
    return '<div class="card"><p class="note">只有單選型別才有選項。'+

/* ---- 顯示條件（後台） ---- */
const DEPOPS={filled:'有填值',gt0:'數字大於 0',eq:'等於指定選項'};
function depLabel(f){
  if(!f.dep_field_id)return '';
  const src=FIELDS.filter(x=>x.id===f.dep_field_id)[0];
  if(!src)return '條件失效';
  let v='';
  if(f.dep_op==='eq'&&src.options){
    const o=src.options.filter(x=>x.key===f.dep_value)[0];
    v='「'+((o&&o.t&&o.t.zh)||f.dep_value)+'」';
  }
  return src.label+' '+(DEPOPS[f.dep_op]||'有填值')+v;
}
function depOpen(id){DEPE=(DEPE===id?null:id);FTR=null;FOPT=null;render()}
function depClose(){DEPE=null;render()}
async function depSave(id){
  const f=FIELDS.filter(x=>x.id===id)[0];if(!f)return;
  const sel=document.getElementById('dp_src');
  const opE=document.getElementById('dp_op');
  const vE=document.getElementById('dp_val');
  const srcId=sel?parseInt(sel.value,10):0;
  const op=opE?opE.value:'filled';
  const patch=srcId
    ? {dep_field_id:srcId,dep_op:op,dep_value:(op==='eq'&&vE?(vE.value||null):null)}
    : {dep_field_id:null,dep_op:null,dep_value:null};
  if(srcId&&op==='eq'&&!patch.dep_value){alert('選了「等於指定選項」就必須指定比對值');return}
  const {error}=await sb.from('form_fields').update(patch).eq('id',id);
  if(error){alert('儲存失敗');log('儲存顯示條件失敗',error.message,true);return}
  Object.assign(f,patch);
  log(srcId?('設定顯示條件：'+f.label):('取消顯示條件：'+f.label),
      srcId?('只在　'+depLabel(f)+'　時出現。被依賴的欄位若被刪除，這一欄會跟著刪'):'改為一律顯示');
  DEPE=null;render();
}
/* 比對值的選單要跟著「依賴哪個欄位」變動。
   這裡只重畫這一小塊，不呼叫 render()
   —— 整頁重繪會把使用者剛選的值換回舊值，選單就動不了了。
   跟中文輸入法那個是同一類問題。 */
function depValHtml(f,srcId,op){
  const src=FIELDS.filter(x=>x.id===srcId)[0];
  if(op!=='eq')
    return '<p class="note" style="margin:0">這個判斷方式不需要比對值</p>';
  if(src&&src.field_type==='select'&&src.options&&src.options.length)
    return '<select id="dp_val">'+liveOpts(src).map(o=>'<option value="'+esc(o.key)+'" '+
      (f.dep_value===o.key?'selected':'')+'>'+esc((o.t&&o.t.zh)||o.key)+'</option>').join('')+'</select>';
  return '<input type="text" id="dp_val" value="'+esc(f.dep_value||'')+'" '+
    'placeholder="要比對的文字">';
}
function depPaintVal(id){
  const f=FIELDS.filter(x=>x.id===id)[0];if(!f)return;
  const box=document.getElementById('dp_valbox');if(!box)return;
  const srcId=parseInt((document.getElementById('dp_src')||{}).value||'0',10);
  const op=(document.getElementById('dp_op')||{}).value||'filled';
  box.innerHTML=depValHtml(f,srcId,op);
}
function depBox(id){
  const f=FIELDS.filter(x=>x.id===id)[0];if(!f)return '';
  const idx=FIELDS.findIndex(x=>x.id===id);
  /* 只能依賴排在自己前面的欄位，避免互相依賴繞不出來 */
  const cands=FIELDS.slice(0,idx);
  if(!cands.length)return '<div class="card" style="border-color:var(--purple)"><h3>顯示條件：'+esc(f.label)+'</h3>'+
    '<p class="note">這是第一個欄位，前面沒有可以依賴的欄位。'+
    '請先用 ↑↓ 把它移到目標欄位的後面。</p>'+
    '<p><button class="btn sec" onclick="depClose()">關閉</button></p></div>';
  const cur=f.dep_field_id||0;
  const op0=f.dep_op||'filled';
  const opts='<select id="dp_src" onchange="depPaintVal('+id+')">'+
    '<option value="0">（一律顯示）</option>'+
    cands.map(c=>'<option value="'+c.id+'" '+(c.id===cur?'selected':'')+'>'+esc(c.label)+'</option>').join('')+
    '</select>';
  const opSel='<select id="dp_op" onchange="depPaintVal('+id+')">'+
    Object.keys(DEPOPS).map(k=>'<option value="'+k+'" '+(op0===k?'selected':'')+'>'+
      DEPOPS[k]+'</option>').join('')+'</select>';
  return '<div class="card" style="border-color:var(--purple)"><h3>顯示條件：'+esc(f.label)+'</h3>'+
    '<p class="note">設定後，這個欄位只在條件成立時才出現在報名表單上。</p>'+
    '<div class="row">'+
      '<div style="flex:1;min-width:150px"><label>依賴哪個欄位</label>'+opts+'</div>'+
      '<div style="flex:1;min-width:130px"><label>判斷方式</label>'+opSel+'</div>'+
      '<div style="flex:1;min-width:150px"><label>比對值</label>'+
        '<div id="dp_valbox">'+depValHtml(f,cur,op0)+'</div></div></div>'+
    '<p style="margin-top:12px"><button class="btn" onclick="depSave('+id+')">儲存</button> '+
    '<button class="btn sec" onclick="depClose()">取消</button></p>'+
    '<div class="warn" style="margin-top:10px"><b>被依賴的欄位刪掉時，這一欄會跟著刪</b>'+
    '例如刪掉「攜帶家眷人數」（這場只有員工），依賴它的「孩童年齡」也會一併消失。'+
    '由資料庫的 cascade 處理，不是程式判斷。</div>'+
    '<p class="note">只作用在報名表單。後台手動編輯與 Excel 匯入不受限制，該填還是能填。</p>'+
    '</div>';
}

/* ---- 欄位翻譯（後台） ---- */
function ftrOpen(id){FTR=(FTR===id?null:id);DEPE=null;FOPT=null;render()}
function ftrClose(){FTR=null;render()}
async function ftrSave(id){
  const f=FIELDS.filter(x=>x.id===id)[0];if(!f)return;
  const langs=evLangs(ev());
  const t=Object.assign({},f.t||{});
  langs.forEach(k=>{
    const el=document.getElementById('tr_'+id+'_'+k);
    if(el){const v=el.value.trim();if(v)t[k]=v;else delete t[k]}
  });
  if(!t.zh)t.zh=f.label;
  const hint={};
  langs.forEach(k=>{
    const el=document.getElementById('th_'+id+'_'+k);
    if(el){const v=el.value.trim();if(v)hint[k]=v}
  });
  const hintVal=Object.keys(hint).length?hint:null;
  let options=f.options;
  if(f.field_type==='select'&&Array.isArray(f.options)){
    options=f.options.map(o=>{
      const ot=Object.assign({},o.t||{});
      langs.forEach(k=>{
        const el=document.getElementById('tro_'+id+'_'+o.key+'_'+k);
        if(el){const v=el.value.trim();if(v)ot[k]=v;else delete ot[k]}
      });
      return {key:o.key,t:ot};
    });
  }
  busy('儲存中…');
  const {error}=await sb.from('form_fields').update({t:t,options:options,hint:hintVal}).eq('id',id);
  busy(null);
  if(error){alert('儲存失敗');log('儲存翻譯失敗',error.message,true);return}
  Object.assign(f,{t:t,options:options,hint:hintVal});
  log('更新欄位翻譯與說明：'+f.label,
      'update form_fields 的 t、options[].t、hint；沒填的語言會自動退回中文');
  FTR=null;render();
}
function ftrBox(id){
  const f=FIELDS.filter(x=>x.id===id)[0];if(!f)return '';
  const langs=evLangs(ev());
  /* ⚠️ 同意條款不能走這個早退 —— 條文就存在 hint 裡，
     只開中文的活動也必須進得來編輯，不然這個欄位永遠是空的。 */
  if(langs.length<2&&f.field_type!=='consent')
    return '<div class="card" style="border-color:var(--blue)"><h3>翻譯</h3>'+
    '<p class="note">這場活動目前只開放中文。請先到「表單語言與連結」勾選要開放的語言。</p>'+
    '<p><button class="btn sec" onclick="ftrClose()">關閉</button></p></div>';
  const row=(labelTxt,idAttr,val,ph)=>
    '<div style="flex:1;min-width:150px"><label>'+esc(labelTxt)+'</label>'+
    '<input type="text" id="'+idAttr+'" value="'+esc(val||'')+'" placeholder="'+esc(ph||'')+'"></div>';
  const isC=(f.field_type==='consent');
  /* 條文是多行的，用 textarea。id 沿用 th_ 開頭，ftrSave 不必改 —— 
     textarea 一樣有 .value。 */
  const rowT=(labelTxt,idAttr,val,ph)=>
    '<div style="flex:1;min-width:260px"><label>'+esc(labelTxt)+'</label>'+
    '<textarea id="'+idAttr+'" rows="8" placeholder="'+esc(ph||'')+'" '+
    'style="width:100%;font-family:inherit;font-size:14px;line-height:1.7">'+
    esc(val||'')+'</textarea></div>';
  let h='<div class="card" style="border-color:var(--blue)"><h3>'+
    (isC?'同意條款：':'翻譯與說明：')+esc(f.label)+'</h3>'+
    '<p class="note">沒填的語言會自動顯示中文，不會出現空白。</p>'+
    '<p style="margin:0 0 4px"><b>欄位標題</b></p>'+
    '<div class="row">'+langs.map(k=>
      row(langName(k),'tr_'+id+'_'+k,(f.t&&f.t[k])||(k==='zh'?f.label:''),k==='zh'?'':'（留白則顯示中文）')
    ).join('')+'</div>'+
    '<p style="margin:14px 0 4px"><b>'+(isC?'條款內文':'欄位說明')+'</b>'+
      '<span class="note">　'+(isC
        ?'賓客要看的完整條文。純文字，換行會保留。這一欄留白的話表單上只會出現一個孤零零的「我同意」'
        :'顯示在欄位下方的小字，例如「沒有攜帶孩童不用填」。留白就不顯示')+'</span></p>'+
    '<div class="row">'+langs.map(k=>
      (isC?rowT:row)(langName(k),'th_'+id+'_'+k,(f.hint&&f.hint[k])||'',
        k==='zh'?(isC?'（必填，這是賓客要同意的內容）':'（留白就不顯示）'):'（留白則顯示中文）')
    ).join('')+'</div>';
  if(f.field_type==='select'&&Array.isArray(f.options)&&f.options.length){
    h+='<p style="margin:14px 0 4px"><b>選項</b></p>';
    f.options.forEach(o=>{
      h+='<div class="row" style="margin-bottom:6px">'+langs.map(k=>
        row(langName(k)+'　'+o.key,'tro_'+id+'_'+o.key+'_'+k,
            (o.t&&o.t[k])||(k==='zh'?(o.t&&o.t.zh)||o.key:''),k==='zh'?'':'（留白則顯示中文）')
      ).join('')+'</div>';
    });
  }
  h+='<p style="margin-top:12px"><button class="btn" onclick="ftrSave('+id+')">儲存翻譯</button> '+
     '<button class="btn sec" onclick="ftrClose()">取消</button></p></div>';
  return h;
}

/* =========================================================
   報名完成設定（6u，後台）
   賓客按下送出之後那一頁，以及要不要經過人工審核。
   四個值全部存在 events：auto_approve / done_msg /
   show_review_note / show_info_btn。
   ========================================================= */
function doneOpen(){DONEOPEN=!DONEOPEN;FADD=null;TPLPICK=false;FTR=null;render()}
function doneClose(){DONEOPEN=false;render()}
/* ⚠️ 這一支絕對不能呼叫 render()。
   面板上還有四語文案的 input，重繪會把使用者還沒儲存的字全部清掉 ——
   render() 在 onchange 裡把輸入狀態洗掉，這個坑這份檔案已經踩過不只一次。
   所以警告列改用直接動 style.display 的方式開關。 */
function doneWarn(){
  const a=document.getElementById('raAuto'),b=document.getElementById('raBtn');
  const w1=document.getElementById('raW1'),w2=document.getElementById('raW2');
  if(!a||!b||!w1||!w2)return;
  w1.style.display=a.checked?'':'none';
  w2.style.display=(a.checked&&!b.checked)?'':'none';
}
async function doneSave(){
  const e=ev();
  const langs=evLangs(e);
  /* 留白 = 用系統預設。所以只收有填的，全部空的那一組就存 null，
     不要存一堆空字串進去 —— 空字串是「顯示空白」，null 才是「用預設」。 */
  const pick=(pfx)=>{
    const t={},s={};
    langs.forEach(k=>{
      const a=document.getElementById(pfx+'_t_'+k);
      if(a&&a.value.trim())t[k]=a.value.trim();
      const b=document.getElementById(pfx+'_s_'+k);
      if(b&&b.value.trim())s[k]=b.value.trim();
    });
    const o={};
    if(Object.keys(t).length)o.t=t;
    if(Object.keys(s).length)o.s=s;
    return Object.keys(o).length?o:null;
  };
  const dp=pick('dm_p'),da=pick('dm_a');
  const msg={};
  if(dp)msg.pending=dp;
  if(da)msg.approved=da;
  const dmVal=Object.keys(msg).length?msg:null;
  const auto=document.getElementById('raAuto').checked;
  const note=document.getElementById('raNote').checked;
  const btn=document.getElementById('raBtn').checked;
  busy('儲存中…');
  const {error}=await sb.from('events').update({
    auto_approve:auto,show_review_note:note,show_info_btn:btn,done_msg:dmVal
  }).eq('id',EVID);
  busy(null);
  if(error){
    alert('儲存失敗');
    log('儲存報名完成設定失敗',
        error.message+'　（若是 column 不存在，請先執行 sql_6u_報名完成設定.sql）',true);
    return;
  }
  Object.assign(e,{auto_approve:auto,show_review_note:note,show_info_btn:btn,done_msg:dmVal});
  log('更新報名完成設定',
      '自動核准='+(auto?'開':'關')+'　審核狀態說明='+(note?'開':'關')+
      '　個人頁按鈕='+(btn?'開':'關')+'　自訂文案='+(dmVal?'有':'用系統預設')+
      '　update events 的四個欄位');
  DONEOPEN=false;render();
}
function doneBox(){
  const e=ev();
  const langs=evLangs(e);
  const dm=e.done_msg||{};
  const auto=!!e.auto_approve,note=!!e.show_review_note,btn=!!e.show_info_btn;
  const sw=(idAttr,on,html)=>'<label class="sw"><input type="checkbox" id="'+idAttr+'"'+
    (on?' checked':'')+' onchange="doneWarn()"> '+html+'</label>';
  /* placeholder 放的是系統預設文案。留白時賓客看到的就是灰字那一句，
     不必自己去猜「不填會變成什麼」。 */
  const inp=(idAttr,val,lab,ph)=>
    '<div style="flex:1;min-width:170px"><label>'+esc(lab)+'</label>'+
    '<input type="text" id="'+idAttr+'" value="'+esc(val||'')+'" placeholder="'+esc(ph)+'"></div>';
  const grp=(key,pfx,head,sub)=>{
    const o=dm[key]||{};

/* =========================================================
   匯出與統計
   xlsx 用的 SheetJS 是匯入功能就已經載入的，不必再加東西。
   ⚠️ 它從 CDN 載入，離線就不能用。匯入匯出都在辦公室做，
      實務上沒問題，但這跟 jsQR 嵌進檔案的做法不一致。
   ========================================================= */
const ST_ORDER=['invited','pending','approved','checked','rejected'];

/* 統計對象：預設「已核准＋已報到」——那是確定會出席的人，
   給餐飲廠商的數字不該把待審核與退回的算進去 */
let STF='going', STATVIEW=false, EXPTOKEN=false;
/* 批次操作：SEL 存已勾選的 id。
   全選預設只選本頁，要選全部得再點一次 —— 3,000 人時這個差別很大 */
let SEL={}, SELALL=false;
function statTargets(){
  if(STF==='all')return GUESTS.slice();
  if(STF==='checked')return GUESTS.filter(g=>g.status==='checked');
  return GUESTS.filter(g=>g.status==='approved'||g.status==='checked');
}
function statLabel(){
  return {all:'全部名單',going:'已核准＋已報到',checked:'僅已報到'}[STF];
}
/* 小數一律收到第二位。
   ⚠️ 不收的話會出現 29281.10000000007 這種東西 ——
      0.1 這類小數在電腦裡存不精確，累加三千次誤差就浮上來了。
      客戶看到會覺得系統不準。 */
function num2(v){
  const n=Math.round((Number(v)||0)*100)/100;
  return (Math.abs(n-Math.round(n))<1e-9)?String(Math.round(n)):String(n);
}
/* 百分比：整數就顯示整數，否則留一位小數。
   ⚠️ 一律四捨五入到整數的話，45/3000＝1.5% 會進位成 2%，
      另一邊 98.5% 進位成 99%，加起來 101%。 */
function pct1(part, total){
  if(!total)return '0';
  const p=Math.round(part/total*1000)/10;
  return (Math.abs(p-Math.round(p))<1e-9)?String(Math.round(p)):String(p);
}

/* 單選算分佈、數字看值的種類數決定算法，文字與日期只看填答率 */
function buildStats(){
  const list=statTargets();
  const n=list.length;
  const out=[];
  FIELDS.filter(f=>f.active!==false).forEach(f=>{
    if(f.field_type==='select'&&f.options&&f.options.length){
      const cnt={},blank=[];
      f.options.forEach(o=>{cnt[o.key]=0});
      list.forEach(g=>{
        const v=ansRaw(g.id,f.id);
        if(v&&cnt.hasOwnProperty(v))cnt[v]++;else blank.push(g);
      });
      out.push({kind:'select',label:f.label,total:n,
        rows:f.options.filter(o=>!o.del||cnt[o.key]).map(o=>
          ({name:((o.t&&o.t.zh)||o.key)+(o.del?'（已刪除）':''),n:cnt[o.key]}))
          .concat(blank.length?[{name:'未填',n:blank.length,muted:true}]:[])});
    }else if(f.field_type==='number'){
      /* ⚠️ 數字欄位不能一律「加總」。
         年資的總和 29,281 沒有任何意義；
         抽獎資格的總和 2,528 更糟 —— 它剛好等於「填 1 的人數」，
         看起來像對的，其實是巧合，換成 0/2 標記就完全錯了。

         改成看「有幾種不同的值」自動決定：
           ≤ 10 種　像 0/1 旗標、攜伴人數 → 當成分類，列出分佈
                    順便給總和，因為這種欄位的總和通常真的有用
                    （攜伴人數的總和就是要準備幾份餐）
           > 10 種　像年資、金額 → 連續數值，給摘要，不給總和

         這樣不必為每個欄位多開一個設定。 */
      let sum=0,cn=0,blank=0;
      const vals=[], cnt={};
      list.forEach(g=>{
        const raw=ansRaw(g.id,f.id);
        const v=parseFloat(raw);
        if(raw===''||raw==null||isNaN(v)){blank++;return}
        sum+=v;cn++;vals.push(v);
        const k=num2(v);
        cnt[k]=(cnt[k]||0)+1;
      });
      const kinds=Object.keys(cnt);
      if(kinds.length&&kinds.length<=10){
        /* 數值排序，不要用字串排 —— 不然 10 會排在 2 前面 */
        const rows=kinds.sort((a,b)=>parseFloat(a)-parseFloat(b))
          .map(k=>({name:k,n:cnt[k]}));
        if(blank)rows.push({name:'未填',n:blank,muted:true});
        out.push({kind:'numcat',label:f.label,total:n,rows:rows,
          sum:num2(sum),cn:cn});
      }else{
        vals.sort((a,b)=>a-b);
        const mid=vals.length?(vals.length%2
          ?vals[(vals.length-1)/2]
          :(vals[vals.length/2-1]+vals[vals.length/2])/2):0;
        out.push({kind:'number',label:f.label,total:n,cn:cn,
          avg:cn?num2(sum/cn):'0',
          min:vals.length?num2(vals[0]):'0',
          max:vals.length?num2(vals[vals.length-1]):'0',
          mid:num2(mid)});
      }
    }else{
      let cn=0;
      list.forEach(g=>{if(ansRaw(g.id,f.id))cn++});
      out.push({kind:'fill',label:f.label,total:n,cn:cn});
    }
  });
  return {n:n,items:out};
}

  if(rdHtml)rdHtml='<h3 style="margin:18px 0 8px">發放狀況</h3><div class="stgrid">'+rdHtml+'</div>';

   只記「取消他人核銷」。取消自己剛才那一筆是常用操作，
   全部都記的話正常操作會灌進大量無意義紀錄，反而蓋掉真正要查的。

   後台直接查資料表（登入身分＝authenticated，有 select 權限），
   不走 Edge Function —— 那支是給核銷頁用的，後台本來就在登入牆內。

   who 有值時只看那一位操作者做的，核銷代碼頁的每一列用得到。
   ========================================================= */
let AUDIT=null;
async function showAudit(who){
  MODAL={title:who?('稽核紀錄　'+who):'稽核紀錄（取消他人核銷）',
         body:'<p class="note">讀取中…</p>'};
  paintModal();
  let q=sb.from('checkin_audit')
    .select('id, guest_name, kind, by_label, orig_by, orig_at, created_at')
    .eq('event_id',EVID).order('created_at',{ascending:false}).limit(500);
  if(who)q=q.eq('by_label',who);
  const {data,error}=await q;
  if(error){
    MODAL.body='<div class="warn"><b>讀不到稽核紀錄</b>'+esc(error.message)+
      '<br>若是 relation 不存在，請先執行 <code>sql_6j_稽核表.sql</code>。</div>';
    paintModal();log('讀取稽核紀錄失敗',error.message,true);return;
  }
  AUDIT=data||[];
  MODAL.body=auditHtml(who);
  paintModal();
  log('查看稽核紀錄'+(who?('：'+who):''),'select from checkin_audit → '+AUDIT.length+' 列');
}
function auditHtml(who){
  if(!AUDIT.length)
    return '<div class="ok"><b>沒有紀錄</b>'+
      (who?('「'+esc(who)+'」沒有取消過別人的核銷。'):'這場活動沒有人取消過別人的核銷。')+'</div>';
  /* redeem_cancel 原本沒有對照，畫面上會直接顯示英文代號。
     lottery_remove 是 6o 新增的。 */
  const K={retake:'<span class="badge b-fill">改由我核銷</span>',

           lottery_remove:'<span class="badge b-err">移除誤登錄</span>'};
  return '<p class="note" style="margin:0 0 10px">共 '+AUDIT.length+' 筆，新的在上面。'+
    '<b>「改由我核銷」代表那個人仍是已報到</b>，只是核銷人員換了；'+
    '「純取消」代表變回未報到。</p>'+
    '<div class="tblwrap"><table><tr>'+
    '<th class="nowrap">時間</th><th class="nowrap">處置</th><th>賓客</th>'+
    '<th class="nowrap">操作者</th><th class="nowrap">原核銷</th></tr>'+
    AUDIT.map(a=>'<tr><td class="nowrap note">'+esc(fmtDateTime(a.created_at))+'</td>'+
      '<td class="nowrap">'+(K[a.kind]||esc(a.kind))+'</td>'+
      '<td class="wrap"><b>'+esc(a.guest_name)+'</b></td>'+
      '<td class="nowrap">'+esc(a.by_label)+'</td>'+
      '<td class="nowrap note">'+esc(a.orig_by||'—')+'<br>'+esc(fmtDateTime(a.orig_at))+'</td></tr>').join('')+
    '</table></div>';
}
/* 用表格不用名字標籤 —— 3,000 人的場子同名幾乎是必然，
   光看「王小明、王小明」分不出勾到哪一個。

   視窗內的勾選是暫存（MSEL），按「套用」才真的改動選取；
   關閉或按 Esc 就當作放棄。勾選框比按鈕容易手滑，
   不做這一層的話會不知道自己動到了什麼。 */
let MSEL={};
function selNames(){
  MSEL={};selIds().forEach(id=>{MSEL[id]=1});
  paintSelModal();
}
function mselToggle(id,on){
  if(on)MSEL[id]=1;else delete MSEL[id];
  paintSelModal();
}
function mselAll(on){
  selIds().forEach(id=>{if(on)MSEL[id]=1;else delete MSEL[id]});
  paintSelModal();
}
function mselApply(){
  const keep=Object.keys(MSEL);
  if(!keep.length){
    if(!confirm('全部取消勾選等於清空選取，確定嗎？')){return}
    SEL={};SELALL=false;MODAL=null;paintModal();gfPaint();return;
  }
  const next={};keep.forEach(id=>{next[id]=1});
  SEL=next;SELALL=false;
  MODAL=null;paintModal();gfPaint();
}
function paintSelModal(){
  const list=selIds().map(id=>GUESTS.filter(g=>g.id===id)[0]).filter(Boolean)
    .sort((a,b)=>a.id-b.id);
  const keepN=Object.keys(MSEL).length;
  const drop=list.length-keepN;
  const allOn=keepN===list.length;
  const rows=list.map(g=>
    '<tr'+(MSEL[g.id]?'':' style="opacity:.45"')+'>'+
    '<td class="nowrap"><input type="checkbox" '+(MSEL[g.id]?'checked':'')+
      ' onchange="mselToggle('+g.id+',this.checked)"></td>'+
    '<td class="nowrap"><b>'+esc(g.name)+'</b></td>'+
    '<td class="nowrap note">'+esc(g.email||'—')+'</td>'+
    '<td class="nowrap">'+pill(g.status)+'</td>'+
    '<td class="nowrap">'+(g.table_no?g.table_no+' 桌':'<span class="note">—</span>')+'</td></tr>').join('');
  MODAL={title:'已選名單（'+list.length+' 筆）',
    body:'<p class="note" style="margin:0 0 10px">取消勾選可以把該筆移出選取，'+
      '按下方「套用」才會生效。直接關閉視窗則不會改動。</p>'+
      '<div class="tblwrap"><table><thead><tr>'+
      '<th class="nowrap"><label class="sw"><input type="checkbox" '+(allOn?'checked':'')+
        ' onchange="mselAll(this.checked)"> 全選</label></th>'+
      '<th>姓名</th><th class="nowrap">Email</th>'+
      '<th class="nowrap">狀態</th><th class="nowrap">桌次</th></tr></thead>'+
      '<tbody>'+rows+'</tbody></table></div>',
    foot:'<span class="note" style="margin-right:12px">'+
      (drop?'將移除 '+drop+' 筆，保留 '+keepN+' 筆':'未變更')+'</span>'+
      '<button class="btn sec sm" onclick="modalClose()">放棄變更</button> '+
      '<button class="btn sm" '+(drop?'':'disabled')+' onclick="mselApply()">套用</button>'};
  paintModal();
}
async function selPatch(patch,word){
  const ids=selIds();
  if(!ids.length){alert('請先勾選');return}
  if(!confirm(word+' '+ids.length+' 筆？'))return;
  busy(word+'中…');
  const {error}=await sb.from('guests').update(patch).in('id',ids);
  busy(null);
  if(error){alert(word+'失敗');log('批次'+word+'失敗',error.message,true);return}
  log('批次'+word+' '+ids.length+' 筆','update guests where id in (...)');
  SEL={};SELALL=false;
  await loadEvent(EVID);
}

async function selDelete(){
  const ids=selIds();

  if(!confirm('刪除 '+ids.length+' 筆賓客資料？\n\n'+

}

/* ---- 匯出 ---- */
function xlsxDate(){
  const d=new Date(),z=n=>String(n).padStart(2,'0');
  return d.getFullYear()+z(d.getMonth()+1)+z(d.getDate());
}
function safeName(x){return String(x||'').replace(/[\\\/\?\*\[\]:]/g,'_').slice(0,28)}
/* 資格判斷。規則要與 Edge Function 的 qualOk() 一模一樣 ——
   兩邊不同步的話，匯出說「不符資格」現場卻發得出來，那比不顯示更糟。 */
function qualPass(g,it){
  if(!it.qual_field_id)return true;
  const v=String(VALS[vKey(g.id,it.qual_field_id)]==null?'':VALS[vKey(g.id,it.qual_field_id)]).trim();
  if(it.qual_op==='filled')return v!=='';
  if(it.qual_op==='gte'){
    const n=parseFloat(v),need=parseFloat(String(it.qual_value||'0'));
    return !isNaN(n)&&!isNaN(need)&&n>=need;
  }
  if(it.qual_op==='eq')return v===String(it.qual_value||'');
  return true;
}

async function exportXlsx(){
  await loadLots();
  if(typeof XLSX==='undefined'){alert('匯出元件尚未載入，請確認網路後重新整理');return}
  const e=ev();
  const exf=FIELDS.filter(f=>f.include_export!==false);
  /* 全名單匯出，不跟頁籤走 —— 結案要的是完整資料，
     報到與否用「狀態」欄區分就好 */
  /* 欄位順序：認人的資料在前，活動狀態在後。
     打開檔案第一眼要能認出「這是誰」，狀態是查的時候才捲過去看的。

       身分　姓名 / Email / 員工編號 / 所屬部門 / 手機
       其餘自訂欄位（依後台排序）
       活動　桌次 / 來源
       狀態　報到狀態 / 報到時間 / 報到台 / 伴手禮 / 各兌換品項

     前五欄靠關鍵字比對抓出來，抓不到就跳過 —— 每場欄位名稱都不一樣，
     不能寫死。比對用既有的 norm()，全形半形與括號都會被正規化掉。 */
  const PRI=[['員工編號','工號','員編'],['所屬部門','部門'],['手機','行動電話','分機','電話']];
  const front=[];
  PRI.forEach(keys=>{
    const f=exf.filter(x=>front.indexOf(x)<0&&
      keys.some(k=>norm(x.label).indexOf(norm(k))>=0))[0];
    if(f)front.push(f);
  });
  const rest=exf.filter(x=>front.indexOf(x)<0);
  const ordf=front.concat(rest);

  /* 伴手禮與兌換各佔一欄，值是領取時間不是打勾 ——
     結案對帳時「幾點領的」比「有沒有領」有用 */
  const gift=giftOnEvent();
  const rit=ITEMS.filter(it=>it.active);
  /* 券號緊接姓名 —— 結案對帳最常見的動作是「A001 是誰」，
     兩欄相鄰才不用左右拉。沒有人有券號時整欄不出現。 */
  const hasTk=GUESTS.some(g=>g.ticket_no);
  const hasDraw=LOTS.some(p=>(p.mode||'draw')==='draw');
  const hasPaper=LOTS.some(p=>(p.mode||'draw')==='paper');

  /* 某個人在某一種抽法之下中了哪些獎，串成一格。
     一個人可能中一般獎又中加碼獎，所以用頓號串，不各開一欄 ——
     十個獎項就多十欄空白，表會爛掉。 */
  function lotCell(gid,mode){
    return LOTW.filter(w=>w.guest_id===gid).map(w=>{
      const pz=LOTS.filter(x=>x.id===w.prize_id)[0];
      if(!pz)return (mode==='draw')?('獎項#'+w.prize_id):'';   /* 獎項被刪，歸到電子那一欄 */
      if((pz.mode||'draw')!==mode)return '';
      let nm=pz.name;
      /* 停用與作廢是兩件獨立的事，可以同時發生，所以標示要疊加，
         不能用 else 二選一 —— 會漏掉「已停用而且被作廢」那一筆。 */
      if(!pz.active)nm+='（已停用）';
      /* 三種作廢的意義完全不同，標示不能混：
           redraw 被重抽換掉 —— 他確實中過，只是這一筆被替補
           remove 登錄錯誤   —— 他根本沒中，是掃錯券或打錯號
           void   作廢不補人 —— 他中了，但這個名額不發
         把 remove 標成「已作廢」的話，結案時會誤以為那個人中過獎。 */
      if(w.voided)nm+=(w.void_kind==='redraw'?'（重抽換掉）'
                      :w.void_kind==='remove'?'（登錄錯誤）':'（已作廢）');
      return nm;
    }).filter(x=>x).join('、');
  }
  const head=['姓名'].concat(hasTk?['券號']:[]).concat(['Email'])
    .concat(ordf.map(f=>f.label))
    .concat(['桌次','來源','狀態','報到時間','報到台'])
    .concat(gift?['伴手禮']:[])
    .concat(rit.map((it,i)=>'品項'+(i+1)+'（'+it.name+'）'))   // 加前綴：一眼看得出這幾欄是同一組
    /* 兩種抽法分兩欄。混在同一欄的話，結案時要看「這個獎是台上抽的還是台下抽的」
       只能回去翻獎項設定。哪一種沒有獎項就不出現那一欄。 */
    .concat(hasDraw?['中獎獎項（電子抽獎）']:[])
    .concat(hasPaper?['中獎獎項（紙本抽獎）']:[]);
  if(EXPTOKEN)head.push('個人連結');   // 個資，勾了才有，一律放最後一欄
  const body=GUESTS.slice().sort((a,b)=>a.id-b.id).map(g=>{
    const row=[g.name];
    if(hasTk)row.push(g.ticket_no||'');
    row.push(g.email||'');
    /* 單選匯出顯示文字不是代號 */
    ordf.forEach(f=>row.push(ansShow(g.id,f)||''));
    row.push(g.table_no||'');
    row.push({import:'匯入',form:'表單',onsite:'現場'}[g.source]||g.source);
    row.push((ST[g.status]||{n:g.status}).n);
    row.push(fmtDateTime(g.checked_in_at));
    row.push(g.checked_in_by||'');
    if(gift)row.push(fmtDateTime(g.gift_at));
    /* 三種情況要分得開：
         領了      → 領取時間（現場爭議只能靠時間去對稽核紀錄與班表）
         沒領      → 空白
         不符資格  → 「—」
       後兩者都空白的話，客戶問「這 30 個人為什麼沒領」就分不出
       是他們沒來領，還是根本不能領。 */
    rit.forEach(it=>{
      const r=(RECS[g.id]||[]).filter(x=>x.item_id===it.id)[0];
      if(r){row.push(fmtDateTime(r.at));return}
      row.push(qualPass(g,it)?'':'—');
    });
    if(hasDraw)row.push(lotCell(g.id,'draw'));
    if(hasPaper)row.push(lotCell(g.id,'paper'));
    /* 這一欄最常被複製貼到 LINE，所以帶 openExternalBrowser=1 */
    if(EXPTOKEN)row.push(lineUrl(baseUrl()+'?view=me&t='+g.token));
    return row;
  });
  const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.aoa_to_sheet([head].concat(body));
  /* 欄寬依內容自動算。SheetJS 不會自己量，只能自己掃一遍每一欄。

     中文字在 Excel 裡約佔兩個字元寬，所以用 charCodeAt 判斷：
     大於 0x2E80 的（中日韓文字、全形符號）算 2，其餘算 1。
     不這樣算的話，「所屬部門」四個字會被當成 4 寬，實際要 8 才放得下。

     上下限：最少 8（表頭太短時不要窄到看不出是哪一欄）、
     最多 42（一長串 email 或備註不該把整張表撐開，那種欄位讓人自己拉）。 */
  function cellW(v){
    const t=String(v==null?'':v);
    let w=0;
    for(let i=0;i<t.length;i++)w+=(t.charCodeAt(i)>0x2E80?2:1);
    return w;
  }
  ws['!cols']=head.map((h,ci)=>{
    let w=cellW(h);
    for(let ri=0;ri<body.length;ri++){
      const c=cellW(body[ri][ci]);
      if(c>w)w=c;
    }
    return {wch:Math.min(42,Math.max(8,w+2))};   // +2 給左右留白
  });
  ws['!freeze']={xSplit:0,ySplit:1};
  XLSX.utils.book_append_sheet(wb,ws,'名單');

  /* 統計放同一個檔案的第二張工作表，給廠商一份檔案就夠 */
  const st=buildStats();
  const sr=[['統計對象',statLabel()],['人數',st.n],[]];
  st.items.forEach(it=>{
    sr.push([it.label]);
    if(it.kind==='select'||it.kind==='numcat'){
      it.rows.forEach(r=>sr.push(['',r.name,r.n,pct1(r.n,it.total)+'%']));
      if(it.kind==='numcat'){
        sr.push(['','總和',it.sum]);sr.push(['','填答人數',it.cn]);
      }
    }else if(it.kind==='number'){
      sr.push(['','平均',it.avg]);
      sr.push(['','最小',it.min]);
      sr.push(['','中位數',it.mid]);
      sr.push(['','最大',it.max]);
      sr.push(['','填答人數',it.cn]);
    }else{
      sr.push(['','填答人數',it.cn]);
    }
    sr.push([]);
  });
  if(LOTS.length){
    sr.push(['抽獎']);
    LOTS.forEach(p=>sr.push(['',p.name+(p.active?'':'（已停用）'),
      lotLive(p.id)+' / '+p.total+' 位',
      (lotDone(p.id)>lotLive(p.id))?('另 '+(lotDone(p.id)-lotLive(p.id))+' 筆作廢'):'']));
    sr.push([]);
  }
  if(gift||rit.length){
    sr.push(['發放狀況']);
    if(gift)sr.push(['','伴手禮',GUESTS.filter(g=>g.gift_at).length+' 人已領']);
    rit.forEach(it=>sr.push(['',it.name,it.used+' / '+it.total+' 組',
      it.total?Math.round(it.used/it.total*100)+'%':'']));
    sr.push([]);
  }
  const ws2=XLSX.utils.aoa_to_sheet(sr);
  ws2['!cols']=[{wch:4},{wch:28},{wch:14},{wch:8}];   // 統計表欄位固定，品項名稱可能較長
  XLSX.utils.book_append_sheet(wb,ws2,'統計');

  const fn=safeName(e.name)+'_名單_'+xlsxDate()+'.xlsx';
  XLSX.writeFile(wb,fn);
  log('匯出 Excel：'+fn,
      '全名單 '+body.length+' 筆＋統計工作表（'+statLabel()+'）'+(EXPTOKEN?'，含個人連結':'，不含個人連結'));
}

      '<div style="flex:none"><button class="btn '+(gqCount()?'':'sec ')+'" onclick="gqToggle()">'+
        (GQOPEN?'收起篩選':'篩選'+(gqCount()?'（'+gqCount()+'）':''))+'</button></div>'+
      '<div style="flex:none"><button class="btn" onclick="addGuest()">＋ 新增賓客</button></div>'+
      '<div style="flex:none"><button class="btn sec" onclick="impOpen(\'invite\')">匯入邀請對象</button> '+
      '<button class="btn sec" onclick="impOpen(\'confirm\')">匯入確認名單</button></div></div>'+
    '<div id="gqbox">'+gqBoxHtml()+'</div>'+

    ('<div id="gres">'+gfResHtml()+'</div>'))+

/* 名單本體單獨產生。搜尋時只換這一塊，輸入框不重建，
   中文輸入法的組字狀態才不會被打斷（與核銷頁同一套做法） */
/* 篩選條件抽出來，批次操作與表格共用同一份結果 */
/* 單一條件的判斷。回傳 true 代表這個人通過這一條。 */
function gqPass(g,q){
  if(!q||!q.f)return true;
  const f=FIELDS.filter(x=>String(x.id)===String(q.f))[0];
  if(!f)return true;
  /* 用 ansShow 取值：單選欄位要比對「選項的中文」不是內部代碼，
     不然打「研發部」永遠找不到。 */
  const shown=String(ansShow(g.id,f)||'').trim();
  const raw=String(VALS[vKey(g.id,f.id)]==null?'':VALS[vKey(g.id,f.id)]).trim();
  const v=String(q.v==null?'':q.v).trim();
  if(q.op==='filled')return raw!=='';
  if(q.op==='empty') return raw==='';
  if(q.op==='has')   return v===''||shown.toLowerCase().indexOf(v.toLowerCase())>=0;
  if(q.op==='eq')    return shown===v||raw===v;
  if(q.op==='gte'||q.op==='lte'){
    const n=parseFloat(raw), need=parseFloat(v);
    if(isNaN(n)||isNaN(need))return false;   /* 未填或不是數字一律不符合 */
    return q.op==='gte'?(n>=need):(n<=need);
  }
  return true;
}
function gqCount(){return GQ.filter(q=>q.f).length}

function gfFiltered(){
  const ff=FIELDS.filter(f=>f.show_in_list);
  let list=GUESTS.filter(g=>GF.tab==='all'||g.status===GF.tab);
  /* 欄位條件先過，關鍵字後過。兩者是 AND。 */
  const qs=GQ.filter(q=>q.f);
  if(qs.length)list=list.filter(g=>qs.every(q=>gqPass(g,q)));
  if(GF.kw){
    const k=GF.kw.toLowerCase();
    /* 狀態與來源在資料裡是代碼（checked、onsite…），
       畫面上才翻成中文。搜尋要比對翻譯後的文字，
       不然打「現場」會找不到任何東西 */
    const SRC={import:'匯入',form:'表單',onsite:'現場'};
    list=list.filter(g=>String(g.name).toLowerCase().indexOf(k)>=0||
      String(g.email||'').toLowerCase().indexOf(k)>=0||
      String((ST[g.status]||{}).n||g.status).indexOf(GF.kw.trim())>=0||
      String(SRC[g.source]||g.source).indexOf(GF.kw.trim())>=0||
      String(g.checked_in_by||'').toLowerCase().indexOf(k)>=0||
      ff.some(f=>String(ansShow(g.id,f)).toLowerCase().indexOf(k)>=0));
  }
  return list;
}
function giftOnEvent(){const e=ev();return !!(e&&e.gift_enabled)}

/* ⚠️ 只重畫面板那一個 div，不整頁重繪 ——
   整頁重繪會把搜尋框裡打到一半的字和中文組字狀態清掉。
   這跟 lotqPaint 存在的理由是同一個。 */
function gqPaint(){
  const box=document.getElementById('gqbox');
  if(box)box.innerHTML=gqBoxHtml();
  const bar=document.getElementById('gqbar');
  if(bar)bar.innerHTML=gqBarHtml();
  gfPaint();
}
function gqAdd(){GQ.push({f:'',op:'has',v:''});GQOPEN=true;gqPaint()}
function gqDel(i){GQ.splice(i,1);GF.page=1;SEL={};SELALL=false;gqPaint()}
function gqSet(i,k,v){
  GQ[i][k]=v;
  if(k!=='v')GQ[i].v='';    /* 換欄位或換判斷方式，原本的值一定不能留 */
  GF.page=1;SEL={};SELALL=false;
  gqPaint();
}
function gqVal(i,v){        /* 只改值，不重畫，才不會打斷輸入 */
  GQ[i].v=v;GF.page=1;SEL={};SELALL=false;
  gfPaint();
  const bar=document.getElementById('gqbar');
  if(bar)bar.innerHTML=gqBarHtml();
}
function gqClear(){GQ=[];GF.page=1;SEL={};SELALL=false;gqPaint()}
function gqToggle(){GQOPEN=!GQOPEN;if(GQOPEN&&!GQ.length)GQ.push({f:'',op:'has',v:''});gqPaint()}

function gqBoxHtml(){
  if(!GQOPEN)return '';
  const rows=GQ.map((q,i)=>{
    const fo='<option value="">（請選欄位）</option>'+
      FIELDS.map(f=>'<option value="'+f.id+'"'+(String(q.f)===String(f.id)?' selected':'')+'>'+
        esc(f.label)+'</option>').join('');
    const oo=Object.keys(GQOP).map(k=>'<option value="'+k+'"'+(q.op===k?' selected':'')+'>'+
      GQOP[k]+'</option>').join('');
    let vin='';
    if(q.op==='gte'||q.op==='lte'){
      vin='<input type="number" step="any" value="'+esc(q.v||'')+'" placeholder="數字" oninput="gqVal('+i+',this.value)">';
    }else if(q.op==='eq'){
      const f=FIELDS.filter(x=>String(x.id)===String(q.f))[0];
      const opts=(f&&Array.isArray(f.options))?f.options.filter(o=>!o.del):[];
      if(opts.length){
        vin='<select onchange="gqVal('+i+',this.value);gqPaint()">'+
          '<option value="">（請選）</option>'+
          opts.map(o=>'<option value="'+esc((o.t&&o.t.zh)||o.key)+'"'+
            (String(q.v)===String((o.t&&o.t.zh)||o.key)?' selected':'')+'>'+
            esc((o.t&&o.t.zh)||o.key)+'</option>').join('')+'</select>';
      }else{
        /* ⚠️ 數字或文字欄位也要能用「完全等於」。
           抽獎那邊只給單選欄位一個下拉，遇到「抽獎資格＝1」這種
           1／0 旗標欄位就沒辦法設，只能繞道用「≥ 1」。這裡直接給輸入框。 */
        vin='<input type="text" value="'+esc(q.v||'')+'" placeholder="要等於的值" oninput="gqVal('+i+',this.value)">';
      }
    }else if(q.op==='has'){
      vin='<input type="text" value="'+esc(q.v||'')+'" placeholder="包含這段文字" oninput="gqVal('+i+',this.value)">';
    }
    return (i?'<div class="gqand">而且</div>':'')+
      '<div class="gqrow">'+
        '<select onchange="gqSet('+i+',\'f\',this.value)">'+fo+'</select>'+
        '<select onchange="gqSet('+i+',\'op\',this.value)">'+oo+'</select>'+
        vin+
        '<button type="button" class="lqx" onclick="gqDel('+i+')" title="刪除這一條">\u00d7</button>'+
      '</div>';
  }).join('');
  return '<div class="gqbox">'+
    '<b style="font-size:13px">欄位篩選</b>'+
    '<p class="note" style="margin:4px 0 8px">多條之間是「而且」，會跟上面的搜尋框一起生效。'+
      '這只是畫面篩選，不會存起來，也不影響匯出。</p>'+
    (rows||'<p class="note">按下面「加一條」開始。</p>')+
    '<button type="button" class="btn sec sm" style="margin-top:6px" onclick="gqAdd()">＋ 加一條</button> '+
    (GQ.length?'<button type="button" class="btn sec sm" onclick="gqClear()">清除全部</button>':'')+
    '</div>';
}

/* 收合狀態下顯示目前套用了哪些條件，不必展開就看得到 */
function gqBarHtml(){
  const qs=GQ.filter(q=>q.f);
  if(!qs.length||GQOPEN)return '';
  const txt=qs.map(q=>{
    const f=FIELDS.filter(x=>String(x.id)===String(q.f))[0];
    const fn=f?f.label:('欄位#'+q.f);
    if(q.op==='filled')return fn+' 有填值';
    if(q.op==='empty') return fn+' 沒有填';
    if(q.op==='gte')   return fn+' ≥ '+(q.v||'');
    if(q.op==='lte')   return fn+' ≤ '+(q.v||'');
    if(q.op==='eq')    return fn+' ＝ '+(q.v||'');
    return fn+' 包含「'+(q.v||'')+'」';
  }).map(t=>'<span class="gqtag">'+esc(t)+'</span>').join('');
  return '<div style="margin-bottom:10px">'+txt+
    '<button class="btn sec sm" onclick="gqClear()">清除篩選</button></div>';
}

        '<br>'+esc(langName(g.locale||'zh'))+'</td>'+

/* 批次設定任一自訂欄位的值。
   典型用途：把幾位標成 VIP、整批改部門、補上漏填的欄位。

   ⚠️ 寫的是 guest_field_values 不是 guests。
      那張表的鍵是 (guest_id, field_id)，同一個人同一個欄位只會有一列，
      所以用 upsert：已經有值的覆蓋，沒有的新增。

   ⚠️ 清空要用 delete 不能寫空字串。
      系統各處的判斷都是「未填一律視為不符合」，
      而空字串在資料庫裡是「有值，只是內容是空的」——
      抽獎的「有填值」條件會把它算成符合，跟直覺相反。 */
function selField(){
  const ids=selIds();
  if(!ids.length){alert('請先勾選');return}
  if(!FIELDS.length){alert('這場還沒有任何自訂欄位。先到「欄位設定」新增。');return}
  let FID=String(FIELDS[0].id);

  function valInput(){
    const f=FIELDS.filter(x=>String(x.id)===FID)[0];
    if(!f)return '';
    const opts=(f&&Array.isArray(f.options))?f.options.filter(o=>!o.del):[];
    if(f.field_type==='select'&&opts.length){
      return '<select id="sfVal">'+
        opts.map(o=>'<option value="'+esc(o.key)+'">'+esc((o.t&&o.t.zh)||o.key)+'</option>').join('')+
        '</select>';
    }
    if(f.field_type==='number')return '<input type="number" step="any" id="sfVal">';
    return '<input type="text" id="sfVal">';
  }
  function paint(){
    const box=document.getElementById('sfBox');
    if(box)box.innerHTML=valInput();
  }
  window.__sfPick=function(v){FID=v;paint()};

  const m=modal('<h3>批次設定欄位值</h3>'+
    '<p class="note" style="margin:-6px 0 12px">會套用到已選取的 <b>'+ids.length+'</b> 筆。'+
      '原本有值的會被覆蓋。</p>'+
    '<label class="f"><span>要設定哪個欄位</span>'+
      '<select onchange="__sfPick(this.value)">'+
        FIELDS.map(f=>'<option value="'+f.id+'">'+esc(f.label)+'</option>').join('')+
      '</select></label>'+
    '<label class="f"><span>設定成什麼值</span><span id="sfBox">'+valInput()+'</span></label>'+
    '<label class="lchk"><input type="checkbox" id="sfClear">'+
      '<span>改成「清空這個欄位」（忽略上面填的值）</span></label>'+
    '<p class="note" style="margin:4px 0 14px">清空是把那一列刪掉，不是填空字串 —— '+
      '空字串在系統裡算「有填」，抽獎的「有填值」條件會把它算成符合。</p>'+
    '<div class="foot"><button class="btn sec" id="c">取消</button>'+
      '<button class="btn" id="s">套用</button></div>');
  m.querySelector('#c').onclick=()=>m.remove();
  m.querySelector('#s').onclick=async()=>{
    const f=FIELDS.filter(x=>String(x.id)===FID)[0];
    if(!f){alert('請選擇欄位');return}
    const clear=m.querySelector('#sfClear').checked;
    const el=m.querySelector('#sfVal');
    const val=clear?'':String(el?el.value:'').trim();
    if(!clear&&val===''){alert('請填值，或勾選「清空這個欄位」');return}
    if(!confirm((clear?'清空':'設定')+' '+ids.length+' 筆的「'+f.label+'」'+
      (clear?'？':'為「'+val+'」？')+'\n\n原本有值的會被覆蓋，此動作無法復原。'))return;

    m.querySelector('#s').disabled=true;
    busy('寫入中…');
    let err=null;
    if(clear){
      for(const part of chunk(ids,300)){
        const r=await sb.from('guest_field_values').delete()
          .eq('field_id',f.id).in('guest_id',part);
        if(r.error){err=r.error;break}
      }
    }else{
      for(const part of chunk(ids,300)){
        const rows=part.map(gid=>({guest_id:gid,field_id:f.id,value:val}));
        const r=await sb.from('guest_field_values')
          .upsert(rows,{onConflict:'guest_id,field_id'});
        if(r.error){err=r.error;break}
      }
    }
    busy(null);
    if(err){alert('寫入失敗，詳情看操作紀錄');log('批次設定欄位值失敗',err.message,true);
      m.querySelector('#s').disabled=false;return}
    log('批次'+(clear?'清空':'設定')+'欄位「'+f.label+'」 '+ids.length+' 筆',
        clear?'delete from guest_field_values':('值＝'+val));
    m.remove();
    await loadEvent(EVID);
    toast(ids.length+' 筆已更新');
  };
}

async function saveNewGuest(m){
  const n=(document.getElementById('agName')||{}).value||'';
  if(!n.trim()){alert('姓名為必填');m.querySelector('#s').disabled=false;return}
  const st=(document.getElementById('agStatus')||{}).value||'approved';
  const tb=(document.getElementById('agTable')||{}).value||'';
  const row={event_id:EVID,name:n.trim(),
    email:((document.getElementById('agMail')||{}).value||'').trim()||null,
    status:st,source:'import',locale:(ev().languages&&ev().languages[0])||'zh',
    token:mkToken(),table_no:tb?parseInt(tb,10):null,data_complete:true};
  /* 狀態選「已報到」時要補上報到資訊，否則名單頁會出現沒有核銷人員的已報到 */
  if(st==='checked'){row.checked_in_at=new Date().toISOString();row.checked_in_by='後台新增'}
  const ins=await sb.from('guests').insert(row).select();
  if(ins.error){alert('建立失敗');log('後台新增賓客失敗',ins.error.message,true);
    m.querySelector('#s').disabled=false;return}
  const g=ins.data[0];
  const vals=[];
  m.querySelectorAll('.agf').forEach(i=>{
    if(i.value)vals.push({guest_id:g.id,field_id:parseInt(i.dataset.fid,10),value:i.value});
  });
  if(vals.length){
    const v=await sb.from('guest_field_values').insert(vals);
    if(v.error)log('欄位答案寫入失敗',v.error.message,true);
  }
  log('後台新增賓客：'+g.name+'（'+(ST[st]||{n:st}).n+'）',
      'insert into guests，欄位答案 '+vals.length+' 筆');
  m.remove();
  await loadEvent(EVID);
}
