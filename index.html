/* =========================================================
   更多資訊（個人資訊頁的第二層）

   總覽頁固定三張卡片：可兌換品項 / 闖關 / 抽獎結果。
   闖關與抽獎功能還沒做，一律暗的，先把位置留著 ——
   之後接上時只要把 MEMORE 那兩個 on 改成真的資料來源即可，版面不用再動。

   ⚠️ 這裡全部是資訊頁，沒有任何寫入。
   所有要掃碼核銷的動作一律用個人資訊頁那一張報到 QR，不另外產生 QR。
   ========================================================= */
function meGo(p){
  MEPAGE=p;render();
  try{window.scrollTo(0,0)}catch(_){}
  /* 進兌換清單要開始盯、離開就停，所以每次換頁都重排 */
  mePollReset();
}
/* 手動更新按鈕。自動更新停掉之後仍然留著。 */
function meRefBtn(L){
  return '<button class="merf" onclick="meManual()"'+(MEBUSY?' disabled':'')+'>'+
    esc(tt(MEBUSY?'refreshing':'refresh',L))+'</button>';
}
function meBack(L,to){
  return '<button class="mback" onclick="meGo(\''+(to||'main')+'\')">\u2039 '+esc(tt('back',L))+'</button>';
}
function meCard(cls,title,sub,go){
  return '<button class="mcard '+cls+(go?'':' off')+'"'+
    (go?' onclick="'+go+'"':' disabled')+'>'+esc(title)+
    (sub?'<small>'+esc(sub)+'</small>':'')+'</button>';
}
function pgMeMore(L){
  const e=MEEV||{name:''};
  const rd=(MEMORE&&MEMORE.redeem)||{on:false,items:[]};
  const items=rd.items||[];
  /* 抽獎卡片只看「這場有沒有辦抽獎」，不看他中了沒 ——
     卡片暗掉等於告訴他「你沒份」，但沒中獎跟沒資格是兩件事，
     賓客端的感受完全不同。所以有辦就進得去，進去才說中沒中。 */
  const lt=(MEMORE&&MEMORE.lottery)||{on:false,items:[]};
  /* 兌換卡片三種情況：
       這場沒建品項        → 暗，本場未開放
       有品項但這位沒資格  → 暗，未符合領取資格（不符資格的品項在函式端已濾掉，所以是空陣列）
       有任何一項看得到    → 亮，可以點進去
     「全部發完」不在這裡擋 —— 只要還有品項就進得去，進去才提示。 */
  let c1;
  if(!rd.on)           c1=meCard('c1',tt('c_redeem',L),tt('c_off',L),null);
  else if(!items.length)c1=meCard('c1',tt('c_redeem',L),tt('c_noqual',L),null);
  else                 c1=meCard('c1',tt('c_redeem',L),'',"meGo('redeem')");
  return '<div class="pub">'+
    meBack(L,'main')+
    '<div class="pubhead"><b>'+esc(tt('more_t',L))+'</b><small>'+esc(e.name)+'</small></div>'+
    '<div class="mcards">'+
      c1+
      meCard('c2',tt('c_rally',L),tt('c_soon',L),null)+
      (lt.on?meCard('c3',tt('c_lottery',L),'',"meGo('lottery')")
            :meCard('c3',tt('c_lottery',L),tt('c_off',L),null))+
    '</div></div>';
}
function pgMeLottery(L){
  const lt=(MEMORE&&MEMORE.lottery)||{items:[]};
  const items=(lt.items||[]).filter(x=>!x.voided);
  return '<div class="pub">'+
    meBack(L,'more')+
    '<div class="pubhead"><b>'+esc(tt('c_lottery',L))+'</b></div>'+
    (items.length
      ? '<p class="note" style="margin:2px 0 12px">'+esc(tt('l_win',L))+'</p>'+
        items.map(x=>'<div class="mrow mok">'+
          '<span><b>'+esc(x.name)+'</b>'+
            (x.note?'<small>'+esc(x.note)+'</small>':'')+
            (x.at?'<small>'+esc(tt('l_at',L))+'　'+esc(fmtDateTime(x.at))+'</small>':'')+
          '</span></div>').join('')
      : '<p class="note" style="margin:14px 0">'+esc(tt('l_none',L))+'</p>')+
    '<p class="note" style="margin-top:16px">'+meRefBtn(L)+'</p>'+
    '</div>';
}
function pgMeRedeem(L){
  const rd=(MEMORE&&MEMORE.redeem)||{items:[]};
  const items=rd.items||[];
  /* 只有在「一項都不能領、而且至少有一項是被領完的」才提示全數領完。
     還有任一項可領就不該跳這句 —— 那會讓人以為白跑一趟。 */
  const allout=items.length&&items.every(function(x){return x.state!=='ok'})
                            &&items.some(function(x){return x.state==='soldout'});
  const TAG={ok:tt('r_ok',L),already:tt('r_taken',L),soldout:tt('r_out',L)};
  return '<div class="pub">'+
    meBack(L,'more')+
    '<div class="pubhead"><b>'+esc(tt('c_redeem',L))+'</b></div>'+
    (allout?'<div class="warn"><b>'+esc(tt('r_out',L))+'</b>'+esc(tt('r_alloff',L))+'</div>':'')+
    items.map(function(x){
      /* 這裡用 mok 不用 live —— .live 是檔案裡既有的 8px 綠色小圓點，撞名會把整列壓成 8px 寬 */
      return '<div class="mrow '+(x.state==='ok'?'mok':'dim')+'">'+
        '<span><b>'+esc(x.name)+'</b>'+
          (x.note?'<small>'+esc(x.note)+'</small>':'')+
          (x.at?'<small>'+esc(fmtDateTime(x.at))+'</small>':'')+
        '</span>'+
        '<span class="tagr">'+esc(TAG[x.state]||'')+'</span></div>';
    }).join('')+
    '<p class="note" style="margin-top:16px">'+esc(tt('r_how',L))+'　'+esc(tt('r_live',L))+
      '<br>'+meRefBtn(L)+'</p>'+
    '</div>';
}

/* =========================================================
   紙本抽獎登錄　?view=paper
   =========================================================
   現場用紙本抽，這一頁只做一件事：把抽到的人登錄進系統。
   投影端讀同一份資料，掃一個就多一個名字。

   與核銷頁共用的部分：代碼輸入畫面（renderGate）、ops()、
   checkGate()、相機那一整套。不共用的是資料 —— 這一頁不載入名單。 */

/* 券號 QR 裡就是券號本身。
   舊的報到 QR 是一串網址，會被這裡擋掉並提示「這不是抽獎券」，
   不會靜靜地失敗讓現場人員一直重掃。 */
function ppTicket(v){
  const t=String(v||'').trim().toUpperCase();
  return /^[A-Z][0-9]{3}$/.test(t)?t:'';
}
function ppPrize(){return PP.prizes.filter(p=>p.id===PP.pid)[0]||null}

/* 四種擋下的理由要分開講。現場人員必須答得出「為什麼這張不算」，
   只說「登錄失敗」的話對方會以為系統壞了。 */
const PPFAIL={
  ticket_not_found:{t:'查無此券號',s:'這場找不到這個券號。確認一下這張券是不是這場活動的'},
  prize_full:{t:'名額已滿',s:'這個獎項已經登錄滿了。要多發請先到後台調整名額'},
  already_this_prize:{t:'已經登錄過',s:'這個人在這個獎項已經登錄過了'},
  already_won:{t:'已中過其他獎',s:'這個人已經中過獎。這個獎項若要允許重複中獎，請到後台勾選'},
  prize_not_found:{t:'獎項不存在',s:'這個獎項可能已被停用或刪除，請重新選一次'},
  wrong_event:{t:'獎項不是這一場的',s:'請重新整理後再試一次'}
};

async function bootPaper(fromGate){
  /* 代碼三個來源，與核銷頁一致：網址 → 這台裝置記住的 → 要求輸入 */
  if(!fromGate){
    CKCODE=(qp('code')||'').trim()||(function(){try{return localStorage.getItem(CKKEY)||''}catch(_){return ''}})();
  }
  if(!CKCODE){CKGATE=true;LOADING=false;render();return}

  CKGATE=false;LOADING=true;CKERR=null;render();
  const o=await ops('paper_open');
  if(checkGate(o))return;
  if(o.err||o.error){
    /* 職能不符要單獨講。講成「代碼無效」的話，現場會一直去要新代碼，
       但問題其實是拿錯用途的代碼。 */
    CKERR=/wrong_role/.test(String(o.err||''))
      ? '這組代碼不是「紙本抽獎登錄」用的。請向主管索取抽獎登錄的代碼'
      : friendlyErr(o.err);
    CODE=null;LOADING=false;render();return;
  }

  try{localStorage.setItem(CKKEY,CKCODE)}catch(_){}
  CODE={code:CKCODE,label:o.label,active:true};
  CKROLE='lottery';
  EVENTS=[o.event];EVID=o.event.id;
  PP.prizes=o.prizes||[];PP.pid=o.prize_id||null;PP.rows=o.rows||[];PP.note=null;
  SYNCAT=Date.now();LOADING=false;
  log('進入紙本抽獎登錄：'+CODE.label,
      '獎項 '+PP.prizes.length+' 項　目前獎項 '+(ppPrize()?ppPrize().name:'尚未選擇')+
      '　這一頁不載入名單，認人靠券號');
  ppStartSync();render();
}

/* 三秒同步。這一頁的變動量很小，整包回傳比算增量單純，
   也順便把「別台剛移除了一筆」帶回來。 */
function ppStartSync(){
  ppStopSync();
  PPT=setInterval(async()=>{
    if(PP.busy)return;
    const r=await ops('paper_sync',{prize_id:PP.pid||0});
    if(checkGate(r))return;
    /* 網路瞬斷什麼都不動：畫面突然清空比不更新更糟 */
    if(r.err||r.error)return;
    SYNCAT=Date.now();
    const pid=r.prize_id||null;
    PP.prizes=r.prizes||PP.prizes;
    PP.rows=r.rows||[];
    /* 獎項被別處改掉才整頁重繪（下拉選單要跟著換），
       其餘一律局部重畫 —— 券號輸入框與相機不能被重建。 */
    if(pid!==PP.pid){PP.pid=pid;render();return}
    ppPaint();
  },SYNC_MS);
}
function ppStopSync(){if(PPT){clearInterval(PPT);PPT=null}}

/* 換獎項不做二次確認（比照電子抽獎的大螢幕）。
   誤切之後掃進去的那一筆用「移除」處理，多一道確認反而拖慢現場。 */
async function ppPick(v){
  const pid=parseInt(v,10)||0;
  PP.busy=true;
  const r=await ops('paper_pick',{prize_id:pid});
  PP.busy=false;
  if(checkGate(r))return;
  if(r.err||r.error){alert('切換獎項失敗：'+friendlyErr(r.err));return}
  PP.pid=r.prize_id||null;PP.rows=r.rows||[];PP.note=null;
  camStop(true);                       /* 換獎項先關相機，避免殘留的冷卻誤觸 */
  log('切換獎項 → '+(ppPrize()?ppPrize().name:'未選'),
      '已寫進 events.paper_prize_id，投影端會跟著切');
  render();
}

/* 登錄一位。判斷全在資料庫（lottery_log_ticket），
   這裡只負責把理由翻成現場聽得懂的話。 */
async function ppLog(ticket,mode,fromCam){
  const tk=String(ticket||'').trim().toUpperCase();
  if(!PP.pid){alert('請先選擇獎項');return}
  if(!tk){alert('請輸入券號');return}
  /* ⚠️ 離線一律擋下，不進佇列。
     名額與「誰已經中過獎」只有伺服器知道，離線猜錯就是超額，而超額收不回來。
     這與核銷不同 —— 核銷是往前進，重送最多重複、會被條件擋下。 */
  if(navigator.onLine===false){
    const m='目前離線，無法登錄。抽獎登錄不做離線暫存，請先恢復網路。';
    buzz(false);
    if(fromCam)camRes('bad','目前離線',esc(m),0);else alert(m);
    return;
  }

  PP.busy=true;
  const r=await ops('paper_log',{prize_id:PP.pid,ticket:tk,mode:(mode==='scan'?'scan':'manual')});
  PP.busy=false;
  if(checkGate(r))return;

  if(r.err||r.error){
    const m=friendlyErr(r.err);
    buzz(false);
    if(fromCam)camRes('bad','登錄失敗',esc(m),0);
    else{PP.note={bad:true,t:'登錄失敗',s:esc(m)};render()}
    return;
  }
  if(!r.ok){
    const m=PPFAIL[r.reason]||{t:'無法登錄',s:'請洽主管'};
    buzz(false);
    if(fromCam)camRes('bad',m.t,esc(tk)+'　'+esc(m.s),0);
    else{PP.note={bad:true,t:m.t,s:esc(tk)+'　'+esc(m.s)};render()}
    return;
  }

  PP.rows=r.rows||PP.rows;
  const p=ppPrize();if(p&&r.used!=null)p.used=r.used;
  const w=r.winner||{};
  const big=w.f2||w.name||'已登錄';
  const sub=esc(w.ticket||tk)+(w.f1?'　'+esc(w.f1):'')+'　'+(r.used||0)+' / '+(r.total||0);
  buzz(true);
  log('登錄中獎人：'+(w.name||tk),
      '獎項 '+(p?p.name:PP.pid)+'　'+(r.used||0)+'/'+(r.total||0)+
      '　'+(mode==='scan'?'掃碼':'人工輸入'));
  const el=document.getElementById('ppin');if(el)el.value='';
  if(fromCam){camRes('good',big,sub,0);ppPaint()}
  else{PP.note={bad:false,t:big,s:sub};render()}
}

/* 移除誤登錄。走 void_kind='remove'：留痕但不算中過獎，
   之後真的抽到他仍然登錄得進去（這是與作廢最大的差別）。 */
async function ppUnlog(wid,name){
  if(!confirm('移除「'+name+'」這一筆？\n\n'+
    '這是給掃錯券、打錯號用的。移除後這個人不算中過獎，'+
    '之後真的抽到他仍然登錄得進去。\n'+
    '紀錄會留著，後台查得到。'))return;
  PP.busy=true;
  const r=await ops('paper_unlog',{winner_id:wid});
  PP.busy=false;
  if(checkGate(r))return;
  if(r.err||r.error){alert('移除失敗：'+friendlyErr(r.err));return}
  if(!r.ok){alert('移除失敗，這一筆可能已經被移除了');return}
  PP.rows=r.rows||[];
  const p=ppPrize();if(p)p.used=PP.rows.filter(x=>!x.voided).length;
  /* 稽核寫失敗不擋操作（東西已經移除了），但一定要說 */
  if(r.audit_ok===false)alert('已移除，但稽核紀錄沒有寫進去。請截圖告知主管。');
  log('移除誤登錄：'+name,'void_kind=remove，名額退回，這個人不算中過獎');
  render();
}

/* 相機掃到東西時從 onScan 轉進來 */
function ppScan(text){
  const tk=ppTicket(text);
  if(!tk){
    if(Date.now()-CAM.lastAt<2500)return;
    CAM.lastAt=Date.now();CAM.scan=false;buzz(false);
    camRes('bad','無法辨識','這不是抽獎券的 QR',0);return;
  }
  /* 相機一秒解碼十幾次，同一張券三秒內不重複觸發 */
  if(CAM.last===tk&&Date.now()-CAM.lastAt<3000)return;
  CAM.last=tk;CAM.lastAt=Date.now();
  CAM.scan=false;
  ppLog(tk,'scan',true);
}

function ppRowsHtml(){
  if(!PP.pid)return '<p class="note">先在上面選一個獎項。</p>';
  const live=PP.rows.filter(x=>!x.voided);

  return '<div class="tblwrap"><table><thead><tr>'+
    '<th class="nowrap">#</th><th class="nowrap">券號</th><th>姓名</th><th>資訊</th>'+
    '<th class="nowrap">時間</th><th class="nowrap">操作</th></tr></thead><tbody>'+
    live.map((x,i)=>{
      const info=[x.f1,x.f2].filter(y=>y&&y!==x.name).join('　');
      return '<tr><td class="nowrap">'+(i+1)+'</td>'+
      '<td class="nowrap"><b style="font-family:ui-monospace,monospace">'+esc(x.ticket)+'</b></td>'+

    }).join('')+'</tbody></table></div>';
}

/* 局部重畫：三秒同步不能整頁重繪 ——
   券號輸入框會被重建（游標跳掉），相機的 video 元素也會被換掉。
   這與 ckPaint / fldPaint 存在的理由完全相同。 */

  const b=document.getElementById('pprows');

  if(n)n.textContent=p?('已登錄 '+p.used+' / '+p.total):'尚未選獎項';
  const sy=document.getElementById('ppsync');
  if(sy)sy.textContent=syncLabel();
}

/* =========================================================
   紙本抽獎　投影畫面　?view=pstage&e=活動ID
   =========================================================
   與電子抽獎的大螢幕（?view=stage）分開的兩個入口，刻意不共用 bootStage。
   那一頁的邏輯繞著「抽選、滾動、重抽」轉，這一頁完全沒有這些 ——
   它只是一面鏡子：使用端登錄一位，這裡就多一個名字。
   在同一支函式裡加分支，往後改哪一邊都可能誤傷另一邊。

   版面（欄數、逐格字級、分頁、浮出動畫）沿用 6n 那一整套，
   ltCols / ltFont / ltCellW / ltCellFont 都直接呼叫，不另寫一份。 */

let PS={pid:null,rows:[],page:0,newWid:null,anim:false,
        badev:false,live:false,ch:null,tick:null,busy:false};

/* 這個獎項目前該顯示在投影上的名單。
   ⚠️ remove（登錄錯誤）與 redraw（被重抽換掉）都不顯示，
      只有 void（作廢不補人）留著劃掉 —— 與電子大螢幕的規則一致。 */
async function psRows(pid){
  if(!pid)return [];
  const {data,error}=await sb.from('lottery_winners')
    .select('id,guest_id,voided,void_kind,at')
    .eq('event_id',EVID).eq('prize_id',pid).order('at').order('id');
  if(error){log('讀取中獎名單失敗',error.message,true);return null}
  return (data||[])
    .filter(w=>!(w.voided&&w.void_kind!=='void'))
    .map(w=>({wid:w.id,gid:w.guest_id,voided:!!w.voided}));
}

function psLastPage(){return Math.max(0,Math.ceil(PS.rows.length/LTPAGE)-1)}

function psDot(){
  const d=document.getElementById('psdot');
  if(d)d.className='psdot'+(PS.live?'':' off');
}

/* Realtime 推來新的一筆就重撈這個獎項的名單。
   不直接用 payload 的內容：作廢、移除、別台同時登錄都要一起反映，
   重撈一次最單純，而且一個獎項最多幾十筆。 */
async function psOnChange(){
  if(PS.busy)return;
  PS.busy=true;
  try{
    const rows=await psRows(PS.pid);
    if(rows===null)return;
    const had={};PS.rows.forEach(r=>{had[r.wid]=1});
    const added=rows.filter(r=>!had[r.wid]);
    PS.rows=rows;
    PS.newWid=added.length?added[added.length-1].wid:null;
    /* 新登錄的人一定要看得到 —— 超過一頁時自動跳到最後一頁 */
    if(PS.newWid)PS.page=psLastPage();
    /* 活動當天才新增的賓客不在這一頁的快取裡，補撈一次名單，
       否則畫面會顯示「（賓客已刪除）」 */
    if(rows.some(r=>!GUESTS.filter(g=>g.id===r.gid)[0]))await loadEvent(EVID);
    render();
  }finally{PS.busy=false}
}

/* 獎項切換不走 Realtime：events 沒有加進發布清單，
   而且換獎項是換場之間的動作，慢個幾秒沒有人會發現。
   這一輪順便當成連線健檢 —— 撈得到就是通的。 */
async function psTick(){
  const {data,error}=await sb.from('events')
    .select('paper_prize_id').eq('id',EVID).limit(1);
  if(error){PS.live=false;psDot();return}
  const pid=(data&&data[0]&&data[0].paper_prize_id)||null;
  if(pid!==PS.pid){
    PS.pid=pid;
    const rows=await psRows(pid);
    PS.rows=rows||[];
    PS.page=0;PS.newWid=null;
    PS.anim=true;                 /* 換獎項＝整批重新浮出一次 */
    render();return;
  }
  psDot();
}

function renderPStage(){
  if(!USER)return '<div class="ltwrap"><div class="ltbody">'+
    '<div class="ltempty">請先在後台登入，再重新開啟這個連結。<br>'+
    '投影畫面沿用後台帳號，沒有另一組密碼。</div></div></div>';
  const e=ev();
  if(!e)return '<div class="ltwrap"><div class="ltbody"><div class="ltempty">'+
    (PS.badev?'網址裡的活動編號有誤，或這個帳號看不到這場活動。<br>'+
              '請回後台「紙本獎項」按「開啟投影畫面」。'
             :'讀取中…')+'</div></div></div>';

  /* ⚠️ 只認紙本獎項。events.paper_prize_id 可能指到一個電子獎項
     （分流之前選過的舊值），那時候要當成還沒選，不能把電子獎項投出去。 */
  const p=LOTS.filter(x=>x.id===PS.pid&&(x.mode||'draw')==='paper')[0]||null;
  const gap=e.stage_gap||800;
  let body,pgHtml='';

  if(!p){
    /* 待機：只放活動名稱。投影幕上不該出現操作說明，全場都看得到 */
    body='<div class="ltmain"><div class="ltempty">'+esc(e.name)+'</div></div>';
  }else{
    const rows=PS.rows;
    let mid;
    if(!rows.length){
      /* 已經選了獎項但還沒登錄任何人：大字放獎項名稱（在 lthead），中間留白 */
      mid='<div class="ltempty">&nbsp;</div>';
    }else{
      const tp=Math.max(1,Math.ceil(rows.length/LTPAGE));
      if(PS.page>tp-1)PS.page=tp-1;
      if(PS.page<0)PS.page=0;
      const view=rows.slice(PS.page*LTPAGE,(PS.page+1)*LTPAGE);
      const cols=ltCols(view.length);
      const base=parseFloat(ltFont(view.length))||3.4;
      const cellW=ltCellW(cols);
      const fs=base.toFixed(2)+'vw';
      const an=PS.anim;
      const list=view.map((r,i)=>{
        const nm=lotShow(r.gid);
        /* 只有剛登錄的那一位帶動畫。整頁重繪時如果全部重播，
           每掃一個人全場名字都會閃一次，看起來像當機。 */
        let st;
        if(an)                       st='animation-delay:'+(i*gap)+'ms';
        else if(r.wid===PS.newWid)   st='animation-delay:0ms';
        else                         st='animation:none;opacity:1;transform:none';
        return '<div class="ltone'+(r.voided?' gone':'')+'" style="'+st+'">'+
          /* 沒填小字也要留這一行的高度，否則那一格的名字會往上跑、跟同列對不齊 */
          '<div class="ltsec" style="font-size:'+
            ltCellFont(nm.b||'\u3000',base*0.42,cellW).toFixed(2)+'vw">'+
            (nm.b?esc(nm.b):'&nbsp;')+'</div>'+
          '<div class="ltname" style="font-size:'+
            ltCellFont(nm.a,base,cellW).toFixed(2)+'vw">'+esc(nm.a)+'</div>'+
          (r.voided?'<div class="ltsec">已作廢</div>':'')+
        '</div>';
      }).join('');
      mid='<div class="ltlist" style="--ltfs:'+fs+';--ltcols:'+cols+'">'+list+'</div>';

      /* ⚠️ 不做自動翻頁。名單是一位一位長出來的，
         自動輪播會跟「跳到最新那一頁」互相打架 ——
         現場要回頭看前面幾位時用頁碼手動翻。 */
      if(tp>1){
        const btns=[];
        for(let i=0;i<tp;i++){
          btns.push('<button class="'+(i===PS.page?'on':'')+'" onclick="PS.page='+i+';render()">'+(i+1)+'</button>');
        }
        pgHtml='<div class="ltpg">'+
          '<button onclick="PS.page=Math.max(0,PS.page-1);render()">\u2039</button>'+
          btns.join('')+
          '<button onclick="PS.page=Math.min('+(tp-1)+',PS.page+1);render()">\u203a</button>'+
          '<span class="ltpgn">共 '+rows.length+' 位　·　第 '+(PS.page+1)+' / '+tp+' 頁</span></div>';
      }
    }
    body='<div class="lthead">'+
        '<div class="lttitle">'+esc(p.name)+'</div>'+
        '<div class="ltsub">'+(p.note?esc(p.note)+'　·　':'')+
          '名額 '+p.total+' 位　·　已公布 '+rows.filter(r=>!r.voided).length+' 位</div>'+
      '</div>'+
      '<div class="ltmain">'+mid+'</div>'+
      (pgHtml?'<div class="ltfoot">'+pgHtml+'</div>':'');
  }

  PS.anim=false;PS.newWid=null;   /* 字串已經組好，清掉不影響這一次的輸出 */
  return '<div class="ltwrap">'+
    '<div id="psdot" class="psdot'+(PS.live?'':' off')+'" title="即時連線狀態"></div>'+
    '<div class="ltbody">'+body+'</div>'+
    '<div class="lttop">'+
      '<span style="font-size:13px;color:#9A8FB5">'+esc(e.name)+'　紙本抽獎</span>'+
      '<span class="ltsp"></span>'+
      '<button class="ltbtn" onclick="psTick()">重新載入</button>'+
      '<button class="ltbtn" onclick="stageFull()">全螢幕</button>'+
    '</div></div>';
}

async function bootPStage(){
  const id=parseInt(qp('e'),10);
  sb.auth.getSession().then(async ({data})=>{
    USER=data&&data.session?data.session.user:null;
    AUTHREADY=true;
    if(!USER){render();return}
    /* ⚠️ 一定要先 loadEvents()：ev() 是從 EVENTS 陣列裡找，
       而 loadEvent(id) 不會去填它。直接開網址進來的入口都要補這一步
       （電子大螢幕當初就是漏了這個，畫面停在「活動編號有誤」）。 */
    await loadEvents();
    if(id){await loadEvent(id);await loadLots(id)}
    if(!ev()){PS.badev=true;render();return}

    await psTick();

    /* Realtime 只訂 lottery_winners 這一張表。
       ⚠️ 這不影響 6n 的電子大螢幕 —— 那一頁沒有寫任何訂閱程式。
       這裡可以用 Realtime 的理由：投影端只有一台，而且走後台帳號
       （authenticated），6c 當初避開 Realtime 的兩個理由都不成立。 */
    PS.ch=sb.channel('paper_'+id)
      .on('postgres_changes',
          {event:'*',schema:'public',table:'lottery_winners',filter:'event_id=eq.'+id},
          ()=>{psOnChange()})
      .subscribe(st=>{PS.live=(st==='SUBSCRIBED');psDot();
        log('投影端即時連線：'+st,'訂閱 lottery_winners，event_id='+id)});

    /* 獎項切換與連線健檢。四秒一次，一場活動大約幾千次，額度上完全不是問題 */
    PS.tick=setInterval(psTick,4000);
    render();
  });
  render();
}
