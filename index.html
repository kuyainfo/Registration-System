/* =========================================================
   核銷頁　?view=checkin&code=XXXX
   ========================================================= */
/* 呼叫核銷函式的共用入口。代碼來自這台裝置，不出現在網址上 */
async function ops(action,payload){
  /* sid 每一個 action 都要帶：同步是 3 秒一次，被壓過的那台在空窗期內
     還是按得下核銷，只擋 sync 的話那幾筆會照樣寫入 */
  const body=Object.assign({action:action,code:CKCODE,sid:ckSid()},payload||{});
  /* 分清楚兩種失敗：
     offline = 根本沒送到（斷網、逾時）→ 值得重試
     其他    = 伺服器有回應但拒絕（代碼停用、已被核銷）→ 重試沒有意義 */
  if(navigator.onLine===false)return {err:'裝置目前離線',offline:true};
  let r;
  try{
    r=await sb.functions.invoke('checkin-ops',{body:body});
  }catch(e){
    return {err:String((e&&e.message)||e),offline:true};
  }
  if(r.error){
    let d='';try{d=await r.error.context.text()}catch(_){}
    if(!d)return {err:r.error.message||'呼叫失敗',offline:true};
    return {err:d};
  }
  return r.data||{};
}
/* 代碼失效時統一從這裡退出：清掉裝置上的代碼，退回輸入畫面 */
function gateFail(msg){
  try{localStorage.removeItem(CKKEY)}catch(_){}
  CKCODE='';CKGATE=true;CKMSG=msg||'';
  stopSync();camStop(true);
  LOADING=false;render();
}
function checkGate(r){
  if(r&&r.err&&/code_disabled/.test(r.err)){
    gateFail('這組代碼已被停用，請向主管索取新代碼');return true}
  if(r&&r.err&&/bad_code/.test(r.err)){
    gateFail('代碼不正確，請重新輸入');return true}
  /* 被別台用同一組代碼登入壓過。完全退出，不留唯讀狀態 ——
     唯讀畫面上的名單會停在被壓的那一刻，看久了會誤以為是現況。 */
  if(r&&r.err&&/code_taken/.test(r.err)){ckTaken();return true}
  return false;
}
/* 退出前先處理佇列：還沒補送的核銷一旦清掉就永遠不會寫入，
   這裡跟「切換身分」用同一套警告，不能安靜地丟掉。 */
function ckTaken(){
  stopSync();camStop(true);
  if(QUEUE.length){
    alert('這組代碼已在其他裝置登入。\n\n'+
          '⚠️ 這台還有 '+QUEUE.length+' 筆核銷尚未補送，將不會寫入。\n'+
          '請把這幾位的姓名記下來，交給主管處理。');
  }
  lsDel(qKey());lsDel(cacheKey());lsDel(undoKey());
  QUEUE=[];UNDOQ=[];LASTREPORT=null;
  gateFail('這組代碼已在其他裝置登入。代碼一組限一台，'+
           '若不是你本人操作，請聯絡主管確認。');
}
function gateEnter(){
  const el=document.getElementById('gatecode');
  const v=(el?el.value:'').trim().toUpperCase();
  if(!v){alert('請輸入代碼');return}
  CKCODE=v;CKMSG='';CKGATE=false;
  /* 代碼輸入畫面兩邊共用，進場之後才分流 */
  if(VIEW==='paper')bootPaper(true);else bootCheckin(true);
}
function ckSwitchUser(){
  if(QUEUE.length&&!confirm('還有 '+QUEUE.length+' 筆尚未補送！\n\n'+
    '切換身分會一併清除這些暫存資料，那些核銷將永遠不會寫入。\n'+
    '建議先恢復連線、等佇列清空再切換。\n\n仍要繼續嗎？'))return;
  if(!confirm('切換身分會清除這台裝置記住的代碼，確定嗎？'))return;
  lsDel(qKey());lsDel(cacheKey());lsDel(undoKey());
  QUEUE=[];UNDOQ=[];LASTREPORT=null;
  gateFail('');
}
async function bootCheckin(fromGate){
  /* 代碼三個來源：網址（後台開啟核銷頁）→ 這台裝置記住的 → 都沒有就要求輸入 */
  if(!fromGate){
    CKCODE=(qp('code')||'').trim()||(function(){try{return localStorage.getItem(CKKEY)||''}catch(_){return ''}})();
  }
  if(!CKCODE){CKGATE=true;LOADING=false;render();return}

  CKGATE=false;LOADING=true;CKERR=null;qLoad();render();
  const o=await ops('open');
  if(checkGate(o))return;
  if(o.err||o.error){
    /* 斷網時用本機快取開場，現場才不會因為重整而完全進不去 */
    if(o.offline&&cacheLoad()){
      OFFLINE=true;LOADING=false;
      log('離線模式進場：'+CODE.label,
          '連不上伺服器，改用本機快取的名單。搜尋照常，核銷會先存進佇列等補送');
      startSync();render();return;
    }
    CKERR=friendlyErr(o.err);CODE=null;LOADING=false;render();return;
  }
  OFFLINE=false;

  try{localStorage.setItem(CKKEY,CKCODE)}catch(_){}
  CODE={code:CKCODE,label:o.label,active:true};
  CKROLE=(o.role==='redeem')?'redeem':'checkin';
  CKGIFT=!!o.gift;
  EVENTS=[o.event];EVID=o.event.id;FIELDS=o.fields||[];
  GUESTS=[];VALS={};
  let page=0;
  while(page<=20){
    const r=await ops('list',{page:page});
    if(checkGate(r))return;
    if(r.err||r.error){CKERR=friendlyErr(r.err);break}
    (r.guests||[]).forEach(g=>GUESTS.push(g));
    (r.values||[]).forEach(x=>{VALS[vKey(x.guest_id,x.field_id)]=x.value});
    SINCE=r.server_now||SINCE;STATS=r.stats||STATS;
    if(!r.more)break;
    page++;
  }
  SYNCAT=Date.now();
  LOADING=false;
  cacheSave();
  if(QUEUE.length)qFlush(false);
  log('進入核銷頁：'+CODE.label,
      '代碼由 Edge Function 在伺服器端驗證，名單分批載入本機共 '+GUESTS.length+
      ' 位。之後搜尋零延遲、斷網也查得到');
  startSync();
  render();
}
/* 逐筆補送。成功或「已經處理過」都算完成，從佇列移除；
   仍然斷網就停下來等下一次。 */
async function qFlush(silent){
  if(FLUSHING||!QUEUE.length||!CKCODE)return;
  FLUSHING=true;
  const done=[],skip=[],fail=[];
  while(QUEUE.length){
    const it=QUEUE[0];
    const r=await ops(it.kind,it.payload);
    if(r.offline){fail.push(it);break}          /* 還是斷網，留著下次再送 */
    if(r.err){skip.push({it:it,why:friendlyErr(r.err)});QUEUE.shift();qSave();continue}
    if(r.ok){
      done.push(it);
      if(r.guest){
        const i=GUESTS.findIndex(x=>x.id===r.guest.id);
        if(i>=0)GUESTS[i]=r.guest;else GUESTS.push(r.guest);
      }
      if(r.stats)STATS=r.stats;
    }else{
      /* 函式回了但 ok:false —— 例如已被其他報到台核銷。
         這不是失敗，是狀況變了，要讓現場知道 */
      skip.push({it:it,why:(r.reason==='already'
        ?'已由 '+((r.guest&&r.guest.checked_in_by)||'其他報到台')+' 核銷'
        :(r.reason==='status'?'狀態為 '+((r.guest&&r.guest.status)||'?')+'，不能報到':'查無此人'))});
      if(r.guest){const i=GUESTS.findIndex(x=>x.id===r.guest.id);if(i>=0)GUESTS[i]=r.guest}
    }
    QUEUE.shift();qSave();
  }
  FLUSHING=false;
  if(done.length||skip.length){
    LASTREPORT={at:Date.now(),done:done,skip:skip,left:QUEUE.length};
    log('補送完成：成功 '+done.length+' 筆'+(skip.length?'，需注意 '+skip.length+' 筆':''),
        '離線期間暫存的核銷已送出；佇列剩 '+QUEUE.length+' 筆');
    cacheSave();
    if(!silent)showReport();
  }
  render();
}
function showReport(){
  const r=LASTREPORT;if(!r)return;
  const rows=[]
    .concat(r.done.map(x=>'<tr><td class="nowrap"><b>'+esc(x.name||'')+'</b></td>'+
      '<td class="nowrap note">'+esc(fmtTime(x.at))+'</td>'+
      '<td class="nowrap"><span class="pill p-checked">已補送</span></td>'+
      '<td class="note">—</td></tr>'))
    .concat(r.skip.map(x=>'<tr><td class="nowrap"><b>'+esc(x.it.name||'')+'</b></td>'+
      '<td class="nowrap note">'+esc(fmtTime(x.it.at))+'</td>'+
      '<td class="nowrap"><span class="pill p-rejected">需注意</span></td>'+
      '<td class="note">'+esc(x.why)+'</td></tr>'))
    .join('');
  MODAL={title:'補送報告',
    body:'<p class="note" style="margin:0 0 10px">離線期間暫存的操作已送出。'+
      '「需注意」表示送出時狀況已經改變，那幾筆<b>沒有</b>寫入。</p>'+
      '<div class="tblwrap"><table><thead><tr><th>姓名</th><th class="nowrap">原時間</th>'+
      '<th class="nowrap">結果</th><th>說明</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
      (r.left?'<p class="note" style="margin:10px 0 0">還有 '+r.left+' 筆尚未送出，連線恢復後會繼續。</p>':''),
    foot:'<button class="btn sm" onclick="LASTREPORT=null;modalClose()">知道了</button>'};
  paintModal();
}
/* 復原的兩條路：
   還在佇列裡（根本還沒送出去）→ 直接從佇列移除，不需要連線，
     也不會有「補送時覆蓋事實」的問題，這是最乾淨的情況。
   已經送出去了 → 走一般的 undo；離線的話記成待辦。 */
function qFindCheckin(id){
  for(let i=0;i<QUEUE.length;i++){
    const q=QUEUE[i];
    if(q.kind==='checkin'&&q.payload&&q.payload.guest_id===id)return i;
    if(q.kind==='add'&&q.payload){
      const g=GUESTS.filter(x=>x.id===id)[0];
      if(g&&g.token===q.payload.token)return i;
    }
  }
  return -1;
}
async function undoSmart(id){
  const i=qFindCheckin(id);
  if(i<0)return undoLast(id);
  const q=QUEUE[i];
  QUEUE.splice(i,1);qSave();
  const g=GUESTS.filter(x=>x.id===id)[0];
  if(q.kind==='add'){
    /* 離線現場新增的人還沒進資料庫，整筆從本機拿掉就好 */
    GUESTS=GUESTS.filter(x=>x.id!==id);
    CK.msg='<div class="card"><b>已取消新增 '+esc(q.name||'')+'</b>'+
      '<p class="note">這筆還沒送出去，直接從暫存移除，資料庫沒有留下任何紀錄。</p></div>';
  }else if(g){
    g.status='approved';g.checked_in_at=null;g.checked_in_by=null;
    CK.msg='<div class="card"><b>已復原 '+esc(g.name)+' 的核銷</b>'+
      '<p class="note">這筆還在等待補送，直接從暫存移除，不需要連線。</p></div>';
  }
  cacheSave();
  log('取消尚未補送的操作：'+(q.name||''),'從本機佇列移除，剩 '+QUEUE.length+' 筆');
  render();
}
/* 復原不進佇列 —— 補送時狀況可能已經變了：
   斷網時按復原，之後那個人被別台正常核銷，補送出去會把有效紀錄抹掉。
   核銷是「往前進」，重送會被條件擋下；復原是「往回退」，會覆蓋事實。
   所以只記成待辦，由人在連線後重新確認再按。 */
function undoPending(guest){
  if(UNDOQ.some(x=>x.id===guest.id))return;
  UNDOQ.push({id:guest.id,name:guest.name,at:new Date().toISOString()});
  undoSave();
}
function undoDrop(id){UNDOQ=UNDOQ.filter(x=>x.id!==id);undoSave();render()}
async function undoRetry(id){
  const item=UNDOQ.filter(x=>x.id===id)[0];if(!item)return;
  const r=await ops('undo',{guest_id:id});
  if(checkGate(r))return;
  if(r.offline){alert('還是連不上，請稍後再試');return}
  if(r.err||!r.ok){
    alert('無法復原：'+(r.reason==='not_yours'?'這筆不是這台核銷的，或已被復原':friendlyErr(r.err)));
    undoDrop(id);return;
  }
  if(r.stats)STATS=r.stats;
  const i=GUESTS.findIndex(x=>x.id===id);if(i>=0)GUESTS[i]=r.guest;
  log('補做復原：'+r.guest.name,'離線時記下的待辦，連線後由人重新確認');
  undoDrop(id);
}
window.addEventListener('online',()=>{OFFLINE=false;qFlush(false)});
window.addEventListener('offline',()=>{OFFLINE=true;render()});

/* 每 3 秒問一次「上次之後有誰變動」。沒有訂閱、沒有推播，門一直是關著的 */
function startSync(){
  if(SYNCT)return;
  SYNCT=setInterval(async()=>{
    if(document.hidden)return;
    const r=await ops('sync',{since:SINCE});
    if(checkGate(r))return;            /* 代碼被停用：這台立刻退出 */
    if(r.offline){if(!OFFLINE){OFFLINE=true;render()}return}
    if(r.err||r.error)return;          /* 其他錯誤不干擾現場，下一輪再試 */
    if(OFFLINE){OFFLINE=false;qFlush(false)}   /* 網路回來了，把佇列送出去 */
    SYNCAT=Date.now();
    const before=STATS?JSON.stringify(STATS):'';
    SINCE=r.server_now||SINCE;STATS=r.stats||STATS;
    const ch=r.changed||[];
    ch.forEach(g=>{
      const i=GUESTS.findIndex(x=>x.id===g.id);
      if(i>=0)GUESTS[i]=g;else GUESTS.push(g);
    });
    if(ch.length){
      log('同步到其他報到台的變動 '+ch.length+' 筆',
          'sync since='+String(SINCE).slice(11,19));
      cacheSave();
    }
    /* 打字中或相機開著時不整頁重繪，否則輸入法會斷、相機畫面會沒 */
    const typing=document.activeElement&&document.activeElement.id==='ckinput';
    if(ch.length||JSON.stringify(STATS)!==before){
      if(typing||CAM.on){ckPaint();paintBar()}else{render()}
    }
  },SYNC_MS);
}
function stopSync(){if(SYNCT){clearInterval(SYNCT);SYNCT=null}}
function syncLabel(){
  if(OFFLINE)return '離線'+(QUEUE.length?'（'+QUEUE.length+' 筆待送）':'');
  if(!SYNCAT)return '同步中';
  const s=Math.round((Date.now()-SYNCAT)/1000);
  return s<8?'同步正常':(s<60?s+' 秒前更新':'同步異常');
}

/* =========================================================
   相機掃碼（6d）
   相機必須在 https 才能開啟，file:// 與 http 都會被瀏覽器擋掉
   ========================================================= */
function buzz(ok){
  try{if(navigator.vibrate)navigator.vibrate(ok?60:[80,70,80])}catch(_){}
}
async function camStart(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    alert('這個環境無法開啟相機。\n相機只能在 https 網址下使用，本機檔案（file://）一定會被擋。\n請改用已部署的網址，並用 Chrome 或 Safari 開啟。');
    return;
  }
  try{
    CAM.stream=await navigator.mediaDevices.getUserMedia(
      {video:{facingMode:{ideal:'environment'}},audio:false});
  }catch(e){
    const m=(e&&e.message)||String(e);
    alert('無法開啟相機：'+m+'\n\n可能原因：未授權相機權限、或從 LINE 內建瀏覽器開啟。請用 Chrome 或 Safari。');
    log('相機開啟失敗',m,true);return;
  }
  CAM.on=true;CAM.last='';render();
  const v=document.getElementById('camv');
  if(!v){camStop(true);return}
  v.srcObject=CAM.stream;v.muted=true;
  v.setAttribute('playsinline','');v.setAttribute('webkit-playsinline','');
  try{await v.play()}catch(_){}
  CAM.scan=true;camLoop();
  log('開啟相機掃碼','getUserMedia environment，解碼用內嵌的 jsQR');
}
function camStop(silent){
  CAM.on=false;CAM.scan=false;
  if(CAM.raf){cancelAnimationFrame(CAM.raf);CAM.raf=0}
  if(CAM.stream){try{CAM.stream.getTracks().forEach(t=>t.stop())}catch(_){}CAM.stream=null}
  if(!silent){log('關閉相機','已釋放鏡頭');render()}
}
function camLoop(){
  if(!CAM.on)return;
  const v=document.getElementById('camv'),c=document.getElementById('camc');
  if(v&&c&&CAM.scan&&v.readyState>=2&&v.videoWidth){
    const w=v.videoWidth,h=v.videoHeight;
    c.width=w;c.height=h;
    const ctx=c.getContext('2d',{willReadFrequently:true});
    ctx.drawImage(v,0,0,w,h);
    try{
      const img=ctx.getImageData(0,0,w,h);
      const q=(typeof jsQR!=='undefined')?jsQR(img.data,w,h,{inversionAttempts:'dontInvert'}):null;
      if(q&&q.data)onScan(q.data);
    }catch(_){}
  }
  CAM.raf=requestAnimationFrame(camLoop);
}
function onScan(text){
  /* 紙本抽獎掃的是券號（A001），不是報到 QR 的 token，
     所以在這裡分流。相機的開關、解碼迴圈、結果覆蓋層全部沿用同一套 ——
     另寫一份 PCAM 只會多出一份要一起維護的相機程式碼。 */
  if(VIEW==='paper'){ppScan(text);return}
  const t=extractToken(text);
  if(!t){
    if(Date.now()-CAM.lastAt<2500)return;
    CAM.lastAt=Date.now();CAM.scan=false;buzz(false);
    camRes('bad','無法辨識','這不是本系統的報到 QR',0);return;
  }
  /* 相機一秒會解碼十幾次，同一張 QR 冷卻三秒內不重複觸發 */
  if(CAM.last===t&&Date.now()-CAM.lastAt<3000)return;
  CAM.last=t;CAM.lastAt=Date.now();
  CAM.scan=false;                       /* 暫停解碼，結果覆蓋層蓋住畫面 */
  const g=GUESTS.filter(x=>x.token===t)[0];
  /* 兌換模式掃碼只是認人 —— 發不發、發哪一項要人點按鈕。
     誤掃第二次只會重新載入清單，不會有東西被扣掉 */
  if(CKROLE==='redeem'){rdOpen(g?{guest_id:g.id}:{token:t},true);return}
  runCheckin(g?{guest_id:g.id}:{token:t},'scan',true);
}
/* 結果覆蓋層。成功兩秒自動關並繼續掃，失敗要人按確認 */
function camRes(kind,title,sub,gid,fixId){
  const box=document.getElementById('camres');
  if(!box){CAM.scan=true;return}
  box.className='camres on '+kind;
  let btns;
  if(kind==='good'&&gid)btns='<button class="btn sec" onclick="camUndo('+gid+')">取消核銷</button>';
  else if(fixId)btns='<div class="camfix">'+
    '<button class="btn g sm" onclick="cancelOther('+fixId+',\'retake\',1)">取消並改由我核銷</button>'+
    '<button class="btn sec sm" onclick="cancelOther('+fixId+',\'cancel\',1)">只取消，不核銷</button>'+
    '<button class="btn sec sm" onclick="camResume()">關閉</button></div>';
  else btns='<button class="btn sec" onclick="camResume()">確認</button>';
  box.innerHTML='<b>'+esc(title)+'</b><small>'+sub+'</small>'+btns;
  if(kind==='good'){
    if(CAM.timer)clearTimeout(CAM.timer);
    CAM.timer=setTimeout(camResume,2000);
  }
}
function camResume(){
  if(CAM.timer){clearTimeout(CAM.timer);CAM.timer=0}
  const box=document.getElementById('camres');
  if(box){box.className='camres';box.innerHTML=''}
  CAM.scan=true;
}
async function camUndo(id){
  if(CAM.timer){clearTimeout(CAM.timer);CAM.timer=0}
  const r=await ops('undo',{guest_id:id});
  if(checkGate(r))return;
  if(r.offline){
    const g=GUESTS.filter(x=>x.id===id)[0];
    if(g)undoPending(g);
    OFFLINE=true;
    camRes('bad','離線，尚未取消','已記為待辦，連線後請重新確認',0);
    return;
  }
  if(r.stats)STATS=r.stats;
  if(r.err||!r.ok){camRes('bad','無法取消','這筆不是這台核銷的，或已被復原',0);return}
  const i=GUESTS.findIndex(x=>x.id===id);if(i>=0)GUESTS[i]=r.guest;
  CAM.last='';
  camRes('bad','已取消核銷','<b style="font-size:20px">'+esc(r.guest.name)+'</b>',0);
  paintBar();ckPaint();
}

function ansAtLabel(g,lab){
  const f=FIELDS.filter(x=>String(x.label).indexOf(lab)>=0)[0];
  return f?ansShow(g.id,f):'';
}
/* 全欄位模糊搜尋。
   舊版只比對姓名與「手機／分機」，遇到名單上除了 Email 沒別的可認的人就搜不到。
   現在比對姓名、Email 與全部答案欄位，並記下命中哪一欄，讓現場人員知道
   這個人為什麼會被搜出來 —— 命中姓名是預設情況，不標。
   桌次刻意不納入：打「5」會把 5 桌的人與手機含 5 的人一起撈出來，雜訊太多。
   回傳的是 {g, via} —— via 是命中的欄位名稱，命中姓名時為空字串。 */
function ckSearch(kw){
  kw=(kw||'').trim();if(!kw)return[];
  const low=kw.toLowerCase();
  const out=[];
  GUESTS.forEach(g=>{
    if(g.status==='invited'||g.status==='rejected')return;
    if(String(g.name||'').toLowerCase().indexOf(low)>=0){out.push({g,via:''});return}
    if(String(g.email||'').toLowerCase().indexOf(low)>=0){out.push({g,via:'Email'});return}
    for(let i=0;i<FIELDS.length;i++){
      const f=FIELDS[i];
      const v=ansShow(g.id,f);
      if(v&&String(v).toLowerCase().indexOf(low)>=0){out.push({g,via:f.label});return}
    }
  });
  return out;
}
function extractToken(v){
  v=(v||'').trim();
  const m=v.match(/[?&]t=([a-z0-9]+)/i); if(m)return m[1];
  if(/^[a-z2-9]{10}$/.test(v))return v;
  return null;
}
/* 搜尋結果單獨產生。輸入時只換這一塊，輸入框本身不重建，
   中文輸入法的組字狀態才不會被打斷 */
/* 兌換模式的搜尋結果。與報到不同的是：
   兌換的對象一定是已報到的人，所以未報到的直接標示出來、不給按鈕 */
function rdHitsHtml(hits){
  let r='';
  if(CK.q&&!hits.length)r+='<div class="warn">查無此人。兌換頁不能新增賓客，請確認他是否已完成報到。</div>';
  r+=hits.slice(0,12).map(h=>{
    const g=h.g;
    const dept=ansAtLabel(g,'部門');
    const done=(g.status==='checked');
    return '<div class="hit"><span class="nm">'+esc(g.name)+
      (h.via?'<span class="via">命中：'+esc(h.via)+'</span>':'')+'</span>'+
      '<span class="meta">'+esc(dept||'—')+'　'+
      (g.table_no?g.table_no+' 桌':'未排桌')+'　'+pill(g.status)+'</span>'+
      (g.email?'<span class="meta em">'+esc(g.email)+'</span>':'')+
      (done
        ?'<button class="btn g sm" onclick="rdOpen({guest_id:'+g.id+'})">查看可領品項</button>'
        :'<span class="note">尚未報到，請先引導他到報到台</span>')+
    '</div>';
  }).join('');
  if(hits.length>12)r+='<p class="note">另有 '+(hits.length-12)+' 筆未顯示，請輸入更精確的條件。</p>';
  return r;
}

function ckResHtml(){
  const hits=ckSearch(CK.q);
  if(CKROLE==='redeem')return rdHitsHtml(hits);
  let r='';
  if(CK.q&&!hits.length)r+='<div class="warn">查無此人。若確定不在名單上，可用下方現場新增。</div>';
  r+=hits.slice(0,12).map(h=>{
    const g=h.g;
    const dept=ansAtLabel(g,'部門'),mob=ansAtLabel(g,'手機')||ansAtLabel(g,'分機');
    return '<div class="hit"><span class="nm">'+esc(g.name)+
      (h.via?'<span class="via">命中：'+esc(h.via)+'</span>':'')+'</span>'+
      '<span class="meta">'+esc(dept||'—')+'　後四碼 '+esc(mob?String(mob).slice(-4):'—')+'　'+
      (g.table_no?g.table_no+' 桌':'未排桌')+'　'+pill(g.status)+'</span>'+
      (g.email?'<span class="meta em">'+esc(g.email)+'</span>':'')+
      (g.status==='checked'
        ?'<span class="note">已於 '+esc(fmtTime(g.checked_in_at))+' 由 '+esc(g.checked_in_by||'')+' 核銷</span>'+
         (g.checked_in_by!==CODE.label
           ?'<span class="fixrow">'+
            '<button class="btn g sm" onclick="cancelOther('+g.id+',\'retake\')">取消並改由我核銷</button> '+
            '<button class="btn sec sm" onclick="cancelOther('+g.id+',\'cancel\')">只取消</button></span>'
           :'')
        :'<button class="btn sec sm" onclick="CK.pending=GUESTS.filter(x=>x.id==='+g.id+')[0];CK.msg=null;render()">核對並核銷</button>')+
    '</div>';
  }).join('');
  if(hits.length>12)r+='<p class="note">另有 '+(hits.length-12)+' 筆未顯示，請輸入更精確的條件。</p>';
  return r;
}
function paintBar(){
  const b=document.querySelector('.ckbar');
  if(!b||!STATS)return;
  const s1=b.querySelector('.st1'),s2=b.querySelector('.st2'),s3=b.querySelector('.st3');
  if(!s1||!s2||!s3)return;
  if(CKROLE==='redeem'){
    s1.textContent='已發放 '+(STATS.rused!=null?STATS.rused:0);
    s2.textContent='剩餘 '+(STATS.rleft!=null?STATS.rleft:0);
    s3.textContent='發放率 '+(STATS.rrate!=null?STATS.rrate:0)+'%';
  }else{
    s1.textContent='已報到 '+STATS.checked;
    s2.textContent='未報到 '+STATS.appr;
    s3.textContent='報到率 '+STATS.rate+'%';
  }
}
function ckPaint(){
  const box=document.getElementById('ckres');
  if(box)box.innerHTML=ckResHtml();else render();
}
function ckLive(){
  if(COMPOSING)return;          /* 組字中：值已存進 CK.q，等選完字再處理 */
  const t=extractToken(CK.q);
  if(t&&GUESTS.some(g=>g.token===t)){ckEnter();return}
  if(CK.msg&&CK.q){CK.msg=null;render();return}
  ckPaint();                    /* 只換結果區，不動輸入框 */
}
function ckEnter(){
  const t=extractToken(CK.q);
  const g=t?GUESTS.filter(x=>x.token===t)[0]:null;
  if(g){
    CK.q='';
    if(CKROLE==='redeem'){rdOpen({guest_id:g.id});return}
    doCheckin(g.id,'scan');return;
  }
  const hits=ckSearch(CK.q);
  /* ckSearch 回傳的是 {g, via}，不是賓客本身 —— 要取 .g */
  if(hits.length===1&&CKROLE==='redeem'){rdOpen({guest_id:hits[0].g.id});return}
  if(hits.length===1&&hits[0].g.status!=='checked'){CK.pending=hits[0].g;CK.msg=null;render();return}
  render();
}
async function runCheckin(target,how,fromCam){
  CK.pending=null;
  const at=new Date().toISOString();
  const g0=target.guest_id?GUESTS.filter(x=>x.id===target.guest_id)[0]
                          :GUESTS.filter(x=>x.token===target.token)[0];
  const r=await ops('checkin',Object.assign({at:at},target));
  if(checkGate(r))return;
  if(r.offline){
    /* 送不出去就先存起來，畫面照常放行 ——
       人不能卡在門口等網路。重送不會重複核銷，
       因為函式端是條件式更新（where status='approved'）。 */
    qPush({kind:'checkin',payload:Object.assign({at:at},target),
      name:(g0&&g0.name)||'',at:at});
    if(g0){g0.status='checked';g0.checked_in_at=at;g0.checked_in_by=(CODE&&CODE.label)||''}
    OFFLINE=true;
    log('離線核銷暫存：'+((g0&&g0.name)||''),
        '送不出去，已寫進本機佇列（目前 '+QUEUE.length+' 筆），連線後自動補送');
    if(fromCam){
      buzz(true);
      camRes('good',((g0&&g0.name)||'已記錄')+'　報到完成',
        '<b style="font-size:16px">離線暫存中</b><br>連線後會自動補送',(g0&&g0.id)||0);
      paintBar();ckPaint();return;
    }
    CK.msg='<div class="big good"><b>'+esc((g0&&g0.name)||'已記錄')+'　報到完成</b>'+
      '<small>目前離線，已暫存於本機，連線後自動補送</small>'+
      (g0?'<div style="margin-top:12px"><button class="btn sec sm" onclick="undoSmart('+g0.id+')">復原</button></div>':'')+
      '</div>';
    CK.q='';render();return;
  }
  if(r.err){
    if(fromCam){camRes('bad','核銷失敗','請確認網路後重試',0);}
    else{alert('核銷失敗');}
    log('核銷失敗',r.err,true);return;
  }
  if(r.stats)STATS=r.stats;

  if(!r.ok){
    /* 判斷與更新在資料庫是同一個動作，走到這裡代表真的已經被處理過 */
    const o=r.guest||{};
    if(o.id){const i=GUESTS.findIndex(x=>x.id===o.id);if(i>=0)GUESTS[i]=o}
    let t='',sub='';
    if(r.reason==='already'){
      t=o.name||'';sub='已經報到過了　'+esc(fmtTime(o.checked_in_at))+
        '　'+esc(o.checked_in_by||'');
    }else if(r.reason==='status'){
      t=o.name||'';sub='目前狀態是 '+esc(o.status||'')+'，不能報到。請洽現場主管';
    }else{
      t='查無此人';sub='這筆資料不屬於本場活動';
    }
    /* 相機掃到已核銷的人，正是最需要處理的時刻：
       A 台掃錯人 → 本人來到 B 台 → B 台掃出「已被核銷」。
       所以直接把兩個處置放在提示上，不必退出相機改用搜尋。
       自己核銷的不放（那是「復原」的事）。 */
    if(fromCam){
      buzz(false);
      const canFix=(r.reason==='already'&&o.id&&o.checked_in_by!==CODE.label);
      camRes('bad',t,sub,0,canFix?o.id:0);
      paintBar();ckPaint();return;
    }
    CK.msg='<div class="big bad"><b>'+esc(t)+'</b><small>'+sub+'</small></div>';
    CK.q='';render();return;
  }

  const n=r.guest;
  const i2=GUESTS.findIndex(x=>x.id===n.id);if(i2>=0)GUESTS[i2]=n;else GUESTS.push(n);
  log('核銷：'+n.name+'（'+(how==='scan'?'掃碼':'手動')+'）',
      '函式端條件式更新　where status=approved，同時只有一台會成功');

  if(fromCam){
    buzz(true);
    camRes('good',n.name+'　報到完成',
      (n.table_no?'<b style="font-size:22px">'+n.table_no+' 桌</b>':'未排桌')+
      '<br>'+esc(CODE.label),n.id);
    paintBar();ckPaint();return;
  }
  CK.msg='<div class="big good"><b>'+esc(n.name)+'　報到完成</b><small>'+
    (n.table_no?n.table_no+' 桌　':'')+(how==='scan'?'掃碼核銷':'手動核銷')+'　'+esc(CODE.label)+'</small>'+
    '<div style="margin-top:12px"><button class="btn sec sm" onclick="undoSmart('+n.id+')">復原</button></div></div>';
  CK.q='';render();
}
/* =========================================================
   取消他人核銷（第 8 項）

   兩種模式：
     cancel  純取消 —— 賓客其實沒來，撤銷報到，人變回未報到
     retake  取消並改由我核銷 —— 掃錯人的修正，人就在現場

   retake 在函式端是「一次 update」不是「先取消再核銷」：
   中間那個瞬間狀態是 approved，第三台剛好掃到就會核銷成功。

   離線時不做 —— 這是「往回退」的動作，補送等於用舊判斷覆蓋新事實，
   跟復原不進佇列是同一個道理（見「復原不進佇列」那一章）。
   ========================================================= */
async function cancelOther(id,kind,fromCam){
  const g=GUESTS.filter(x=>x.id===id)[0];
  if(!g)return;
  const who=g.checked_in_by||'（不明）', when=fmtTime(g.checked_in_at);
  const q=(kind==='retake')
    ? ('取消「'+who+'」的核銷，改由「'+CODE.label+'」重新核銷？\n\n'+
       g.name+'\n原核銷：'+who+'　'+when+'\n\n'+
       '報到時間會改成現在。這筆操作會留下紀錄。')
    : ('取消「'+who+'」對'+g.name+'的核銷？\n\n'+
       '原核銷：'+who+'　'+when+'\n\n'+
       '這個人會變回「未報到」。這筆操作會留下紀錄。');
  if(!confirm(q))return;

  if(navigator.onLine===false||OFFLINE){
    alert('目前離線，無法取消他人的核銷。\n\n'+
          '這個動作會覆蓋別台已經寫入的結果，離線暫存可能造成錯誤，'+
          '所以必須連線時才做。');
    return;
  }
  const r=await ops('cancel_other',{guest_id:id,kind:kind});
  if(checkGate(r))return;
  if(r.err||r.offline){alert('操作失敗，請確認網路後重試');log('取消他人核銷失敗',r.err||'offline',true);return}
  if(r.stats)STATS=r.stats;

  if(!r.ok){
    const m={not_checked:'這個人目前不是已報到狀態',
             is_yours:'這是你自己核銷的，請用「復原」',
             changed:'狀態剛剛被別台改過了，請重新確認',
             not_found:'查無此人'}[r.reason]||'無法取消';
    if(fromCam){camRes('bad','無法取消',esc(m),0);}else{alert(m)}
    return;
  }
  const n=r.guest;
  const i=GUESTS.findIndex(x=>x.id===n.id);if(i>=0)GUESTS[i]=n;else GUESTS.push(n);
  log((kind==='retake'?'取消他人核銷並改由本台核銷：':'取消他人核銷：')+n.name,
      '原核銷 '+esc(r.orig_by||'')+'　'+fmtTime(r.orig_at)+
      (r.audit_ok?'　已寫入稽核紀錄':'　⚠️ 稽核紀錄寫入失敗'),!r.audit_ok);
  if(!r.audit_ok)alert('操作已完成，但稽核紀錄沒有寫進去。\n請截圖告知主管。');

  if(fromCam){
    buzz(true);
    if(kind==='retake')
      camRes('good',n.name+'　報到完成',
        (n.table_no?'<b style="font-size:22px">'+n.table_no+' 桌</b>':'未排桌')+
        '<br>已取消「'+esc(r.orig_by||'')+'」的核銷', n.id);
    else camRes('bad','已取消核銷','<b style="font-size:20px">'+esc(n.name)+'</b><br>已變回未報到',0);
    paintBar();ckPaint();return;
  }
  CK.msg='<div class="big '+(kind==='retake'?'good':'bad')+'"><b>'+esc(n.name)+
    (kind==='retake'?'　報到完成':'　已取消核銷')+'</b><small>已取消「'+
    esc(r.orig_by||'')+'」於 '+esc(fmtTime(r.orig_at))+' 的核銷</small></div>';
  CK.q='';render();
}
async function doCheckin(id,how,fromCam){return runCheckin({guest_id:id},how,fromCam)}
async function undoLast(id){
  const r=await ops('undo',{guest_id:id});
  if(checkGate(r))return;
  if(r.offline){
    const g=GUESTS.filter(x=>x.id===id)[0];

    CK.msg='<div class="warn"><b>目前離線，復原尚未生效</b>'+

      '復原不自動補送 —— 補送時那個人可能已經被別台正常核銷了。</div>';
    log('離線復原記為待辦：'+((g&&g.name)||''),'復原不進佇列，避免補送時覆蓋掉後來的有效紀錄');
    render();return;
  }
  if(r.err){alert('復原失敗');log('復原失敗',r.err,true);return}

    CK.msg='<div class="warn"><b>無法復原</b>這筆不是這台核銷的，或已經被復原過。'+
      '任意取消他人報到只有管理者能做。</div>';
    render();return;
  }
  const i=GUESTS.findIndex(x=>x.id===id);if(i>=0)GUESTS[i]=r.guest;
  CK.msg='<div class="card"><b>已復原 '+esc(r.guest.name)+' 的核銷</b>'+
    '<p class="note">復原只能針對自己這台核銷的那一筆，由函式在伺服器端把關。</p></div>';
  log('復原核銷：'+r.guest.name,'函式端限定 checked_in_by = 本台代碼');

}
async function ckAdd(){
  const el=document.getElementById('ckNew');
  const n=el?el.value:'';
  if(!n||!n.trim()){alert('請輸入姓名');return}
  /* token 在本機先產好：現場新增是「新增」不是「修改」，
     重送會建出兩個人。token 有 unique 限制，補送重複時資料庫會擋下 */
  const tk=mkToken(), at=new Date().toISOString();
  const r=await ops('add',{name:n.trim(),token:tk,at:at});
  if(checkGate(r))return;
  if(r.offline){
    qPush({kind:'add',payload:{name:n.trim(),token:tk,at:at},name:n.trim(),at:at});
    GUESTS.push({id:-Date.now(),name:n.trim(),status:'checked',token:tk,
      table_no:null,checked_in_at:at,checked_in_by:(CODE&&CODE.label)||'',pendingQ:true});
    if(el)el.value='';
    OFFLINE=true;
    const nid=GUESTS[GUESTS.length-1].id;
    CK.msg='<div class="big good"><b>'+esc(n.trim())+'　已新增並報到</b>'+
      '<small>目前離線，已暫存於本機，連線後自動補送</small>'+
      '<div style="margin-top:12px"><button class="btn sec sm" onclick="undoSmart('+nid+')">取消新增</button></div></div>';
    log('離線現場新增暫存：'+n.trim(),'token 已在本機產生，補送重複時由資料庫的唯一限制擋下');
    render();return;
  }
  if(r.err||!r.ok){alert('新增失敗');log('現場新增失敗',r.err||JSON.stringify(r),true);return}
  if(r.stats)STATS=r.stats;
  const g=r.guest;GUESTS.push(g);
  if(el)el.value='';
  CK.msg='<div class="big good"><b>'+esc(g.name)+'　已新增並報到</b>'+
    '<small>資料不完整，可請對方掃 QR 進個人資訊頁自己補</small>'+
    '<div style="margin-top:12px"><button class="btn sec sm" onclick="ckShowQR('+g.id+')">顯示他的 QR</button></div></div>';
  log('現場新增並報到：'+g.name,'由函式建立，token 在伺服器端產生');
  render();
}

/* =========================================================
   兌換模式（代碼職能＝redeem）

   與報到模式的根本差別：掃碼只認人，不動任何資料。
   要發哪一項、發不發，一律要人點按鈕 ——
   誤掃第二次只會停在畫面上，不會有東西被扣掉。
   ========================================================= */

/* 資格說明。後台 qualText() 顯示什麼，這裡就要說什麼，
   不然現場人員與後台看到的理由會不一樣 */
function rdQualText(q){
  if(!q)return '';
  const f=FIELDS.filter(x=>x.id===q.field_id)[0];
  const fn=f?((f.t&&f.t.zh)||f.label):'條件';
  if(q.op==='filled')return fn+' 需有填值';
  if(q.op==='gte')   return fn+' 需 ≥ '+(q.value||'0');
  if(q.op==='eq'){
    let vt=q.value||'';
    if(f&&Array.isArray(f.options)){
      const o=f.options.filter(x=>x.key===q.value)[0];
      if(o)vt=(o.t&&o.t.zh)||o.key;
    }
    return fn+' 需為 '+vt;
  }
  return '';
}

/* 認人：把這個人與他的可領清單載進來。掃碼與手動點選都走這裡 */
async function rdOpen(target,fromCam){
  RD.guest=null;RD.items=[];CK.msg=null;
  const r=await ops('redeem_list',target);
  if(checkGate(r))return;
  if(r.offline){
    /* 兌換清單一定要連線才拿得到（庫存與已領狀態都在伺服器）。
       離線時不猜、不放行 —— 猜錯會超發，而超發收不回來。 */
    CK.msg='<div class="warn"><b>目前離線，無法兌換</b>'+
      '兌換要先確認庫存與這個人領過什麼，這些只有伺服器知道。請等連線恢復。</div>';
    if(fromCam)camRes('bad','目前離線','兌換需要連線，請稍候再試',0);
    render();return;
  }
  if(r.err){
    CK.msg='<div class="warn"><b>讀取失敗</b>'+esc(friendlyErr(r.err))+'</div>';
    if(fromCam)camRes('bad','讀取失敗','請再掃一次',0);
    render();return;
  }
  if(!r.ok){
    if(r.reason==='not_checked'){
      const g=r.guest||{};
      CK.msg='<div class="warn"><b>'+esc(g.name||'這位賓客')+' 還沒有報到</b>'+
        '兌換前必須先完成報到。請引導他到報到台，報到後再回來領取。</div>';
      if(fromCam)camRes('bad','尚未報到',esc(g.name||'')+'　請先至報到台',0);
    }else{
      CK.msg='<div class="warn"><b>查無此人</b>這組 QR 不屬於本場活動。</div>';
      if(fromCam)camRes('bad','查無此人','這組 QR 不屬於本場活動',0);
    }
    render();return;
  }
  RD.guest=r.guest;RD.items=r.items||[];CK.q='';
  /* 相機關掉：接下來要人點按鈕，畫面留著相機會一直重複掃到同一張 QR */
  if(fromCam)camStop(true);
  log('兌換：認出 '+((r.guest&&r.guest.name)||''),
      '可領 '+RD.items.filter(x=>x.state==='ok').length+' 項／共 '+RD.items.length+' 項');
  render();
}

/* 發放。扣庫存與寫紀錄在資料庫函式裡是同一個交易，這裡只負責送出與顯示結果 */
async function rdGive(iid){
  if(!RD.guest||RD.busy)return;
  RD.busy=iid;render();
  const r=await ops('redeem',{guest_id:RD.guest.id,item_id:iid,at:new Date().toISOString()});
  RD.busy=0;
  if(checkGate(r))return;
  if(r.offline){
    CK.msg='<div class="warn"><b>送不出去</b>目前離線，這一筆沒有發放成功。'+
      '請等連線恢復後再操作，不要先把東西給出去。</div>';
    render();return;
  }
  if(r.err){CK.msg='<div class="warn"><b>發放失敗</b>'+esc(friendlyErr(r.err))+'</div>';render();return}
  if(!r.ok){
    const why={sold_out:'這一項已經發完了',already:'這個人已經領過這一項',
      noqual:'這個人不符合領取資格',not_checked:'這個人還沒有報到',
      no_item:'找不到這個品項（可能剛被停用）'}[r.reason]||'無法發放';
    CK.msg='<div class="warn"><b>'+esc(why)+'</b>畫面已更新為最新狀態。</div>';
    await rdOpen({guest_id:RD.guest.id});return;
  }
  const it=r.item||{};
  CK.msg='<div class="big good"><b>'+esc(RD.guest.name)+'　'+esc(it.name||'')+' 已發放</b>'+
    '<small>'+(it.note?esc(it.note)+'　':'')+'剩餘 '+it.left+' 組</small></div>';
  log('兌換發放：'+RD.guest.name+' → '+(it.name||''),'剩餘 '+it.left+' 組');
  buzz(true);
  await rdOpen({guest_id:RD.guest.id});
}

/* 撤銷。這是「往回退」的動作，一律寫稽核，離線時不給做 */
async function rdUndo(iid,iname){
  if(!RD.guest)return;
  if(!confirm('撤銷「'+RD.guest.name+'」的「'+iname+'」？\n\n'+
    '庫存會回補一組，並留下操作紀錄（誰在什麼時候撤銷了誰）。\n'+
    '請確認東西已經收回來了再按。'))return;
  const r=await ops('redeem_undo',{guest_id:RD.guest.id,item_id:iid});
  if(checkGate(r))return;
  if(r.offline){
    CK.msg='<div class="warn"><b>目前離線，無法撤銷</b>'+
      '撤銷是把已經發生的事收回來，離線補送會用舊判斷覆蓋新事實。請等連線恢復。</div>';
    render();return;
  }
  if(r.err||!r.ok){
    CK.msg='<div class="warn"><b>撤銷失敗</b>'+esc(r.err?friendlyErr(r.err):'找不到這筆發放紀錄')+'</div>';
    render();return;
  }
  CK.msg='<div class="info"><b>已撤銷「'+esc(iname)+'」</b>庫存已回補，剩餘 '+r.left+' 組。'+
    (r.audit_ok===false?'<br>⚠️ 操作紀錄沒有寫入，請截圖告知主管。':'')+'</div>';
  log('兌換撤銷：'+RD.guest.name+' → '+iname,'庫存回補，已寫入稽核紀錄');
  await rdOpen({guest_id:RD.guest.id});
}

function rdClose(){RD.guest=null;RD.items=[];CK.msg=null;CK.q='';render()}

/* 品項清單。四種狀態各有各的畫法，能不能點一眼就看得出來 */
function rdItemsHtml(){
  if(!RD.items.length)
    return '<p class="note">這場活動還沒有設定任何兌換品項。</p>';
  return RD.items.map(it=>{
    const dis=(it.state!=='ok');
    let tag='',btn='';
    if(it.state==='already'){
      tag='<span class="pill p-checked">已領取</span>';
      btn='<span class="note">'+esc(fmtTime(it.at))+'　'+esc(it.by||'')+'</span> '+
        '<button class="btn sec sm" onclick="rdUndo('+it.id+',\''+
          esc(String(it.name).replace(/'/g,"&#39;"))+'\')">撤銷</button>';
    }else if(it.state==='noqual'){
      tag='<span class="pill p-rejected">不符資格</span>';
      btn='<span class="note">'+esc(rdQualText(it.qual))+'</span>';
    }else if(it.state==='soldout'){
      tag='<span class="pill p-rejected">已發完</span>';
      btn='<span class="note">庫存 0 組</span>';
    }else{
      tag='<span class="note">剩 '+it.left+' / '+it.total+' 組</span>';
      btn='<button class="btn g" '+(RD.busy?'disabled':'')+' onclick="rdGive('+it.id+')">'+
        (RD.busy===it.id?'發放中…':'發放')+'</button>';
    }
    return '<div class="hit"'+(dis?' style="opacity:.7"':'')+'>'+
      '<span class="nm">'+esc(it.name)+(it.note?'<span class="via">'+esc(it.note)+'</span>':'')+'</span>'+
      '<span class="meta">'+tag+'</span>'+
      '<span class="fixrow">'+btn+'</span></div>';
  }).join('');
}

/* 兌換模式的主畫面。認人前是搜尋，認人後是品項清單 */

function renderCheckin(){
  if(CKGATE)return renderGate();
  if(LOADING)return '<div class="ck"><p class="note">讀取中…</p></div>';
  if(ERR)return '<div class="ck">'+errBlock()+'</div>';
  if(!CODE){
    /* 進場失敗有兩種原因，標題要分開講：
       代碼問題 → 去找主管換代碼是對的動作
       系統錯誤 → 換幾組代碼都沒用，講成代碼問題會把人帶錯方向 */
    const sysErr=/^系統(錯誤|設定異常)/.test(CKERR||'');
    return '<div class="ck"><div class="big bad">'+
      (sysErr
        ? '<b>暫時無法進入</b><small>系統忙碌或發生錯誤，請稍後再試一次</small>'
        : '<b>無法進入</b><small>代碼無效或已停用</small>')+'</div>'+
      (sysErr?'':'<p class="note">核銷頁只接受後台產生的代碼，由伺服器端驗證。</p>')+
      (CKERR?'<p class="note">'+esc(CKERR)+'</p>':'')+'</div>';
  }
  if(!CODE.active)return '<div class="ck"><div class="big bad"><b>代碼已停用</b>'+
    '<small>'+esc(CODE.label)+'　'+esc(CODE.code)+'</small></div>'+
    '<p class="note">後台已把這組代碼停用，這台機器立刻失去存取權。</p></div>';

  const e=ev()||{name:''};
  /* 統計改由函式回傳，不在前端加總，避免各台因漏收而累積誤差 */
  const checked=STATS?STATS.checked:GUESTS.filter(g=>g.status==='checked').length;
  const appr=STATS?STATS.appr:GUESTS.filter(g=>g.status==='approved').length;
  const rate=STATS?STATS.rate:((checked+appr)?Math.round(checked/(checked+appr)*100):0);
  /* 兌換台要看的是發放率，不是報到率。全品項加總，細節在下方面板 */
  const rdm=(CKROLE==='redeem');
  const rused=STATS&&STATS.rused!=null?STATS.rused:0;
  const rleft=STATS&&STATS.rleft!=null?STATS.rleft:0;
  const rrate=STATS&&STATS.rrate!=null?STATS.rrate:0;
  let h='<div class="ckbar'+(rdm?' rdm':'')+'"><b>'+esc(e.name)+'</b><span class="sp"></span>'+
    '<span class="n">'+esc(CODE.label)+'</span>'+
    '<span class="n"><b>'+(rdm?'兌換':'報到')+'</b></span>'+
    (rdm
      ?'<span class="n st1">已發放 '+rused+'</span><span class="n st2">剩餘 '+rleft+'</span>'+
       '<span class="n st3">發放率 '+rrate+'%</span>'
      :'<span class="n st1">已報到 '+checked+'</span><span class="n st2">未報到 '+appr+'</span>'+
       '<span class="n st3">報到率 '+rate+'%</span>')+
    '<span class="n"><span class="live"></span>'+syncLabel()+'</span>'+
    '<span class="n" style="cursor:pointer" onclick="ckSwitchUser()">切換身分</span></div>';
  if(CK.msg)h+=CK.msg;

  if(CKROLE==='redeem'&&RD.guest){
    /* 兌換模式認出人之後，畫面只剩品項清單 ——
       相機已在 rdOpen 關掉，避免一直重複掃到同一張 QR */
    h+=rdPanelHtml();
  }else if(CK.pending){
    const g=CK.pending;
    const dept=ansAtLabel(g,'部門'),mob=ansAtLabel(g,'手機')||ansAtLabel(g,'分機');
    h+='<div class="card plain"><h3>手動核銷必須核對第二項資訊</h3>'+
      '<p class="note">同名同姓一定會有。請當面詢問對方下列其中一項，對得上才核銷。</p>'+
      '<div class="kv"><span>姓名</span><b>'+esc(g.name)+'</b></div>'+
      '<div class="kv"><span>部門</span><b>'+esc(dept||'—')+'</b></div>'+
      '<div class="kv"><span>號碼後四碼</span><b>'+esc(mob?String(mob).slice(-4):'—')+'</b></div>'+
      '<div class="kv"><span>桌次</span><b>'+(g.table_no?g.table_no+' 桌':'—')+'</b></div>'+
      '<div class="foot" style="margin-top:14px">'+
        '<button class="btn sec" onclick="CK.pending=null;render()">取消</button>'+
        '<button class="btn b" onclick="ckShowQR('+g.id+')">核對後顯示 QR</button>'+
        '<button class="btn g" onclick="doCheckin('+g.id+',\'manual\')">核對無誤，核銷</button></div></div>';

       'onkeydown="if(event.key===\'Enter\'&&!event.isComposing&&!COMPOSING)ckEnter()">'+

      '<div style="flex:none"><button class="btn" onclick="ckAdd()">新增並直接報到</button></div></div></div>';
  }
  h+='<div class="card" style="margin-top:18px"><h3>這個畫面不能做的事</h3>'+

  if(ERR)return '<div class="pub">'+errBlock()+'</div>';
  if(LANGPICK)return pgFormLang();

  }else{
    body=(qp('preview')==='1'
        ?'<div class="info"><b>預覽模式</b>這是賓客實際看到的畫面。'+
          (e.reg_open?'報名開放中，送出會真的寫入名單。':'報名已關閉，送出會被擋下。')+'</div>':'')+
      (!e.reg_open?'<div class="warn">報名開關目前是關閉的，只有預覽模式看得到表單，'+
        '而且送出時會被擋下 —— 開關以送出當下的資料庫狀態為準。</div>':'')+
      '<div class="card plain">'+
      '<label class="f"><span>'+esc(tt('name'))+esc(req)+'</span><input type="text" id="pfName"></label>'+
      '<label class="f"><span>'+esc(tt('email'))+esc(req)+'</span><input type="email" id="pfMail"></label>'+
      FIELDS.map(f=>{
        const lab=esc(tx(f.t,LANG,f.label));

           判斷綁在 change 事件（選完、離開欄位才觸發），不用 input
           —— input 會即時重繪，中文輸入法會被打斷，這個坑踩過一次了 */
        const dep=f.dep_field_id?' data-dep="'+f.dep_field_id+'" data-op="'+esc(f.dep_op||'filled')+

        const oc=' onchange="depApply()"';
        /* 欄位說明：標題下方一行小字。沒填就不佔空間 */

        /* 同意條款：標題 → 條文 → 一個核取方塊。一律必填。
           ⚠️ class 是 pfc 不是 pf —— 送出時收值的方式不一樣
              （核取方塊的 .value 永遠是 'on'，要的是勾選當下的時間）。 */
        if(f.field_type==='consent'){

            '<span class="clab">'+lab+'</span>'+

            '<label class="sw cchk"><input type="checkbox" class="pfc" data-fid="'+f.id+'"'+oc+'> '+
            esc(tt('c_agree'))+'</label></div>';

        if(f.field_type==='select'&&f.options)
          return '<label class="f fw" data-fw="'+f.id+'"'+dep+hide+'><span>'+lab+'</span>'+hint+
            '<select class="pf" data-fid="'+f.id+'"'+oc+'>'+
            ['<option value="">'+esc(tt('choose'))+'</option>'].concat(liveOpts(f).map(o=>
              '<option value="'+esc(o.key)+'">'+esc(tx(o.t,LANG,o.key))+'</option>')).join('')+'</select></label>';
        const t=f.field_type==='number'?'number':(f.field_type==='date'?'date':'text');
        return '<label class="f fw" data-fw="'+f.id+'"'+dep+hide+'><span>'+lab+'</span>'+hint+
          '<input type="'+t+'" class="pf" data-fid="'+f.id+'"'+oc+'></label>';
      }).join('')+

        esc(tt('submit'))+'</button></div>';

  /* 這場有開放兩種以上語言時，表單上方給賓客一排切換鈕 */
  const ls=evLangs(e);
  const sw=(ls.length>1)
    ?'<p style="text-align:center;margin:0 0 14px">'+ls.map(k=>
        (k===LANG
          ?'<b class="tag2" style="border-color:var(--green);color:var(--green)">'+esc(langName(k))+'</b>'
          :'<a class="tag2" href="?view=form&e='+e.id+'&lang='+k+(qp('preview')==='1'?'&preview=1':'')+'">'+esc(langName(k))+'</a>')
      ).join(' ')+'</p>':'';

/* 依「顯示條件」開關欄位。
   隱藏時清空已填的值，避免賓客先填了再改答案，結果送出不該有的資料。
   會重跑到穩定為止，處理一層依一層的情況（A → B → C）。 */
function depApply(){
  const boxes=Array.prototype.slice.call(document.querySelectorAll('.fw[data-dep]'));
  if(!boxes.length)return;
  for(let round=0;round<6;round++){
    let changed=false;
    boxes.forEach(box=>{
      const depId=box.getAttribute('data-dep');
      const op=box.getAttribute('data-op')||'filled';
      const want=box.getAttribute('data-val')||'';
      const srcBox=document.querySelector('.fw[data-fw="'+depId+'"]');
      const srcIn=document.querySelector('.pf[data-fid="'+depId+'"]');
      /* 依賴的欄位自己被藏起來時，這一欄也不該出現 */
      const srcVisible=!srcBox||srcBox.style.display!=='none';
      const v=srcIn?String(srcIn.value).trim():'';
      let ok=false;
      if(srcVisible){
        if(op==='gt0')      ok=(parseFloat(v)>0);
        else if(op==='eq')  ok=(v===want);
        else                ok=(v!=='');
      }
      const showing=box.style.display!=='none';
      if(ok!==showing){
        box.style.display=ok?'':'none';
        if(!ok){
          const me=box.querySelector('.pf');if(me)me.value='';
          const mc=box.querySelector('.pfc');if(mc)mc.checked=false;
        }
        changed=true;
      }
    });
    if(!changed)break;
  }
}
async function submitForm(btn){
  const n=document.getElementById('pfName').value.trim();
  const m=document.getElementById('pfMail').value.trim();
  if(!n||!m){alert(tt('need'));return}
  /* 6u：Email 格式在送出前就擋下來。
     ⚠️ 這條 regex 跟 form-submit 裡那一條必須一模一樣。
        兩邊寬嚴不同的話會出現「前端說可以、伺服器說不行」，
        賓客看到的是送不出去又不知道哪裡錯。
     這裡擋的是手滑，伺服器那一道才是把關 —— 不是重複，是兩件事。 */
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m)){
    alert(tt('f_email'));
    const el=document.getElementById('pfMail');
    if(el){if(el.scrollIntoView)el.scrollIntoView({block:'center'});el.focus()}
    return;
  }
  /* 同意條款沒勾就不能送。
     ⚠️ 這一段必須在 insert 之前 —— 先建了賓客再擋下來，
        名單裡就多了一筆沒有答案的孤兒資料，而且賓客以為自己沒報名成功。 */
  const noAgree=Array.prototype.slice.call(document.querySelectorAll('.pfc'))
    .filter(i=>{
      const box=i.closest('.fw');
      return !(box&&box.style.display==='none')&&!i.checked;
    });
  if(noAgree.length){
    alert(tt('c_need'));
    const b=noAgree[0].closest('.fw');
    if(b&&b.scrollIntoView)b.scrollIntoView({block:'center'});
    return;
  }
  btn.disabled=true;btn.textContent=tt('submitting');
  const e=ev();
  /* 送出的當下再確認一次報名開關。
     只在畫面渲染時檢查是不夠的 —— 預覽模式看得到表單、
     或是賓客開著頁面時後台才把報名關掉，兩種情況都會漏出去。
     規則：能不能送出，只看按下按鈕那一刻資料庫裡的 reg_open，
     跟預覽模式無關。 */
  /* ⚠️ 這裡刻意不直接寫資料庫。
     舊版是 sb.from('guests').insert({...}).select()，
     但 schema 對 anon 只給了 insert 沒給 select ——
     帶 .select() 的 insert 需要 SELECT 權限才能 RETURNING，
     所以真實賓客一律被擋在 permission denied。
     開發者自己測試時因為同一個瀏覽器登入著後台（authenticated）反而是通的，
     「自己測都好、真人一用就壞」，這種最難發現。

     正解不是開放 anon 讀 guests（等於整份名單對外公開），
     而是把寫入搬到 form-submit 這支函式，用 service_role 執行。
     報名開關、欄位歸屬、token 產生也一併移到伺服器端把關。 */
  const rows=[],cons=[];
  document.querySelectorAll('.pf').forEach(i=>{
    const box=i.closest('.fw');
    if(box&&box.style.display==='none')return;   /* 條件不成立而隱藏的欄位不送出 */
    if(i.value)rows.push({field_id:parseInt(i.dataset.fid,10),value:i.value});
  });
  /* 同意條款只送欄位編號，時間戳由伺服器蓋 ——
     用前端的時鐘蓋章，賓客把電腦時間調成去年，紀錄就跟著錯。 */
  document.querySelectorAll('.pfc').forEach(i=>{
    const box=i.closest('.fw');
    if(box&&box.style.display==='none')return;
    if(i.checked)cons.push(parseInt(i.dataset.fid,10));
  });

  let r=null,raw='';
  try{
    const rr=await sb.functions.invoke('form-submit',{body:{
      event_id:EVID,name:n,email:m,locale:LANG,answers:rows,consents:cons}});
    r=rr.data;
    if(rr.error&&!r){
      /* ⚠️ supabase-js 遇到非 2xx 會把 data 丟掉，只給一個 FunctionsHttpError。
         但回應本體還掛在 err.context 上，讀出來才知道到底哪裡不對 ——
         不讀的話操作紀錄只會寫「Edge Function returned a non-2xx status code」，
         那句話對查問題完全沒有幫助。 */
      try{
        const ctx=rr.error.context;
        if(ctx&&typeof ctx.text==='function')raw=await ctx.text();
        if(raw){try{r=JSON.parse(raw)}catch(_){}}
      }catch(_){}
      if(!r)throw rr.error;
    }
  }catch(err){
    btn.disabled=false;btn.textContent=tt('submit');
    alert(tt('failed'));
    log('報名送出失敗',String((err&&err.message)||err)+(raw?('　回應：'+raw.slice(0,300)):''),true);
    return;
  }
  if(!r||r.error){
    btn.disabled=false;btn.textContent=tt('submit');
    if(r&&r.error==='closed'){
      e.reg_open=false;
      alert(tt('closed_t')+'\n'+tt('closed_s'));
      log('報名送出被擋下','函式回 closed：送出當下 reg_open = false，未寫入任何資料');
      render();return;
    }
    if(r&&r.error==='need_consent'){
      alert(tt('c_need'));
      log('報名送出被擋下','函式回 need_consent：欄位 '+((r.fields||[]).join('、')),true);
      return;
    }
    /* 6u：函式的 bad_request 都會帶 reason，依 reason 給對應訊息，
       並把游標送回出問題的那一欄。
       no_event／too_many 不是賓客能修的，統一給「資料有問題，重整再試」。 */
    if(r&&r.error==='bad_request'){
      const RM={email:'f_email',name:'f_name'};
      alert(tt(RM[r.reason]||'f_data'));
      if(r.reason==='email'||r.reason==='name'){
        const el=document.getElementById(r.reason==='email'?'pfMail':'pfName');
        if(el){if(el.scrollIntoView)el.scrollIntoView({block:'center'});el.focus()}
      }
      log('報名送出被擋下','函式回 bad_request／'+(r.reason||'未指定 reason'),true);
      return;
    }
    alert(tt('failed'));
    log('報名送出失敗','form-submit　'+
      ((r&&(r.error+(r.reason?('／'+r.reason):'')+(r.ref?('　追蹤碼 '+r.ref):'')))||'無回應')+
      '　（送出的 event_id='+EVID+'、答案 '+rows.length+' 筆、同意 '+cons.length+' 項）',true);
    return;
  }
  if(r.duplicate){
    /* 網路慢的時候有人會重整再按一次。函式在 60 秒內視為同一次送出，
       回的是原本那一筆的 token，不會建第二筆。 */
    log('報名重複送出','函式判定為同一次送出，未建立第二筆');
  }
  const g={token:r.token};
  /* 6u：顯示哪一組文案，看的是函式回來的 approved，不是前端自己算的。
     自動核准的判斷只有伺服器說了算 —— 前端這邊連 auto_approve 都不該拿來判斷，
     不然報名開著的時候後台剛改設定，兩邊就會不一致。 */
  const ap=(r.approved===true);
  const dmg=(e.done_msg&&e.done_msg[ap?'approved':'pending'])||null;
  /* 自訂的沒填就退回系統預設，不會出現空白標題 */
  const dTitle=(dmg&&tx(dmg.t,LANG,''))||tt(ap?'done2_t':'done_t');
  const dSub  =(dmg&&tx(dmg.s,LANG,''))||tt(ap?'done2_s':'done_s');
  log('賓客送出報名：'+n,'form-submit　status='+(ap?'approved（自動核准）':'pending')+' ＋ '+
    (r.count||0)+' 筆答案'+(r.duplicate?'（重複送出，沿用原本那一筆）':''));
  document.getElementById('app').innerHTML=
    '<div class="pub"><div class="pubhead"><b>'+esc(e.name)+'</b><small>'+esc(e.event_date||'')+'</small></div>'+
    '<div class="ok"><b>'+esc(dTitle)+'</b>'+(e.show_review_note?esc(dSub):'')+'</div>'+
    (e.show_info_btn
      ?'<div class="card plain"><button class="btn b" onclick="newTab(\'?view=me&t='+g.token+'\')">'+
        esc(tt('open_me'))+' ↗</button></div>'
      :'')+
    '</div>';
}

/* =========================================================
   發信（2026-08-20，第一輪：只做介面）

   架構是 Neal 看了同業系統後定的：**用客戶自己的郵件伺服器寄信**。
   客戶提供主機、埠、帳號、密碼，我們連出去寄，
   所以寄件地址天生就是客戶網域，不必請客戶改 DNS。

   幾件已經確定、不要再改回去的事：

   ① 埠號不能用 25 與 587，Supabase Edge Function 封鎖這兩個，465 可以。
      客戶說「我們用 25」的時候，請他們給 465，企業伺服器幾乎都同時開著。

   ② 密碼絕不由前端寫進資料庫。
      那組密碼可以直接登入客戶信箱，等級高於本系統任何資料。
      密碼改存在 mail_secrets（6p），只有 Edge Function 碰得到；後台能寫不能讀。
      並建議要求客戶開專用帳號（event-2026@客戶網域），活動後停用。

   ③ 不接第三方拖拉編輯器（Unlayer、GrapesJS）。
      客戶不會自己進來改信，全部由 Kuya 代操，欄位式表單更快也更不容易改壞。
      Unlayer 的嵌入版本要付費，免費版會留浮水印。

   ④ 信裡不放 QR，只放連到個人資訊頁的按鈕。
      QR 內容就是個人頁網址，跟按鈕同一個目的地；
      而且信是在手機上看的，點按鈕就到了，掃自己的螢幕反而麻煩。
      這一項連帶讓「要建圖床放 QR 圖」整件事消失。

   ⑤ 圖片一律貼外部網址，不建 Supabase Storage。
      代價是那張圖不能刪、不能改路徑，一刪信裡就變破圖。

   ⑥ 退信看不到。走客戶伺服器沒有 webhook，
      退信只會回到客戶的寄件信箱，後台讀不到。這是必然結果，不是缺陷。
   ========================================================= */
let MSET=null, MTPLS=[], MLOG=[];
/* MT.g 為 null 代表停在清單頁；有值就是正在編輯那一份範本。
   同一種信可以有多份（v1、正式版、客戶改過的…），寄送時挑一份。
   四語綁在同一份底下 —— 不會出現「中文用 A 版、英文用 B 版」。 */
let MT={g:null,type:'invite',lang:'zh'};
/* 寄送區的選擇。刻意沒有「語言」這一項：語言由每位賓客的 locale 決定。 */
let MSEND={type:'invite',g:'',who:'invited',sent:'new',pick:{},pkw:'',
             busy:false,stop:false,prog:null};
/* 誰收過哪一種信。key 是「賓客 id|信件種類」，值是最後一次成功寄出的時間。
   ⚠️ 只放 status='sent' —— 失敗的不算收過，不然重寄會被自己擋下來。
   ⚠️ 不能改用 MLOG：那個只取最近 500 筆，三千人的活動寄一輪就不夠看。 */
let MSENT={}, MSENTOK=false;
/* 變數要插到「剛才在打字的那一格」。
   不能在按下按鈕時才問 document.activeElement —— 那時焦點已經是按鈕本身了，
   所以改成在主旨／內文取得焦點時就先記下來。 */
let MFOCUS='mBody';
/* 還沒儲存的編輯內容，key 是「範本 group|語言」。儲存後清掉。 */
let MDRAFT={};
/* 清單頁右側預覽的是哪一份、哪一語。null＝沒開，清單維持全寬。 */
let MPV=null, MPVL='zh';
/* 把畫面上的值收進暫存。切語言、回清單之前都要先叫一次。 */
function mGrab(){
  if(!MT.g)return;
  const V=id=>{const el=document.getElementById(id);return el?el.value:undefined};
  if(V('mSubj')===undefined)return;      // 不在編輯頁就不用收
  MDRAFT[MT.g+'|'+MT.lang]={
    title:V('mTitle'),type:V('mType'),
    subject:V('mSubj'),top_image:V('mTop'),body:V('mBody'),
    btn_text:V('mBtnT'),btn_target:V('mBtnG'),btn_url:V('mBtnU'),
    bottom_image:V('mBot')};
}

/* 四種信。btn 是這種信「預設」的按鈕目的地 —— 邀請信的收件人還沒報名，
   沒有個人頁也沒有 QR，只能給報名表單；報名確認信還在等審核，
   給任何連結都會讓人以為已經過了，所以預設不放按鈕。 */
const MTYPES=[
  {k:'invite',   n:'邀請信',   d:'名單匯入後手動寄出，附報名表單連結', btn:'form'},
  {k:'received', n:'報名確認信',d:'賓客送出表單後寄出，告知已收到、等待審核', btn:''},
  {k:'approved', n:'核准信',   d:'審核通過後寄出，附個人資訊頁連結', btn:'me'},
  {k:'reminder', n:'活動前提醒',d:'活動前幾天寄出，時間地點與個人頁連結', btn:'me'}
];
const MBTN={form:'報名表單',me:'個人資訊頁',custom:'自訂網址'};

/* 可插入的變數。本場的自訂欄位會自動接在後面，不必寫死。 */
function mVars(){
  const base=[
    {k:'姓名',      d:'賓客姓名'},
    {k:'活動名稱',  d:'本場活動名稱'},
    {k:'活動日期',  d:'本場活動日期'},
    {k:'活動地點',  d:'本場活動地點'},
    {k:'桌次',      d:'未安排時顯示「尚未安排」'},
    {k:'報名連結',  d:'依賓客語系自動帶對應語言'},
    {k:'個人頁連結',d:'每人不同，含專屬 token'}
  ];
  FIELDS.forEach(f=>{if(f.label)base.push({k:f.label,d:'本場欄位'})});
  return base;
}

/* 密碼的狀態。⚠️ 這裡永遠不會有密碼內容 ——
   mail_secrets 對 authenticated 是完全關閉的，後台連密文都讀不到，
   只能問 Edge Function「有沒有設過、什麼時候設的、誰設的」。 */
let MPW={has:false,at:null,by:null,busy:false};

/* mail-ops 與 checkin-ops 是兩支不同的函式，驗身分的方式也不同：
   這一支驗 Supabase Auth 的 JWT（後台登入者），
   checkin-ops 驗核銷代碼（現場人員沒有帳號）。
   supabase-js 會自動帶上目前的登入 token，這裡不必自己組 header。 */
async function mailOps(action,extra){
  const body=Object.assign({action:action,event_id:EVID},extra||{});
  const {data,error}=await sb.functions.invoke('mail-ops',{body:body});
  if(error){
    let detail='';
    try{detail=await error.context.text()}catch(_){}
    return {err:(detail||error.message||'呼叫失敗')};
  }
  return data||{};
}

async function loadMailPw(){
  const r=await mailOps('pw_status');
  if(r.err){MPW={has:false,at:null,by:null,busy:false};
    log('讀取密碼狀態失敗',r.err,true);return}
  MPW={has:!!r.has_pw,at:r.updated_at||null,by:r.updated_by||null,busy:false};
}

async function loadMail(){
  const a=await sb.from('mail_settings').select('*').eq('event_id',EVID).maybeSingle();
  if(a.error&&a.error.code!=='PGRST116'){ERR=a.error;log('讀取寄件設定失敗',a.error.message,true)}
  MSET=a.data||null;
  const b=await sb.from('mail_templates').select('*').eq('event_id',EVID);
  if(b.error){ERR=b.error;log('讀取信件範本失敗',b.error.message,true);return}
  MTPLS=b.data||[];
  const c=await sb.from('notifications').select('*').eq('event_id',EVID)
    .order('sent_at',{ascending:false}).limit(500);
  MLOG=(c&&c.data)||[];
  await loadMailSent();
  log('讀取發信資料','範本 '+MTPLS.length+' 筆、紀錄 '+MLOG.length+' 筆');
  /* 密碼狀態要另外問。放在最後，前面的資料先到畫面上 */
  await loadMailPw();
}
/* 一份範本的所有語言列。中文那一列是基準，名稱與種類都以它為準。 */
function mGroups(){
  const seen={},out=[];
  MTPLS.forEach(r=>{
    if(!seen[r.group_key]){
      seen[r.group_key]=1;
      const rows=MTPLS.filter(x=>x.group_key===r.group_key);
      const zh=rows.filter(x=>x.locale==='zh')[0]||rows[0];
      out.push({key:r.group_key,type:zh.type,title:zh.title||'未命名',
        rows:rows,zh:zh,
        langs:rows.filter(x=>((x.subject||'').trim()||(x.body||'').trim()))
          .map(x=>x.locale)
          .sort((a,b)=>LANGS.findIndex(l=>l.k===a)-LANGS.findIndex(l=>l.k===b)),
        updated:rows.map(x=>x.updated_at).sort().reverse()[0]});
    }
  });
  const ord=MTYPES.map(t=>t.k);
  out.sort((a,b)=>(ord.indexOf(a.type)-ord.indexOf(b.type))||
    String(a.title).localeCompare(String(b.title)));
  return out;
}
function mGroup(key){return mGroups().filter(g=>g.key===key)[0]||null}
/* 「已設定」算的是有幾種信至少有一份可用的範本，不是有幾份範本 */
function mtplDone(){
  const ok={};
  mGroups().forEach(g=>{
    if((g.zh.subject||'').trim()||(g.zh.body||'').trim())ok[g.type]=1;
  });
  return Object.keys(ok).length;
}
function mtplGet(key,lang){
  return MTPLS.filter(x=>x.group_key===key&&x.locale===lang)[0]||null;
}
/* 這種信有沒有任何一份可用的範本，決定寄送區的下拉能不能選 */
function mTypeReady(type){
  return mGroups().some(g=>g.type===type&&
    ((g.zh.subject||'').trim()||(g.zh.body||'').trim()));
}

/* ---------------- 信件範本庫 ----------------

   兩層：MT.g 為 null 是清單頁，有值就是編輯那一份。
   同一種信可以有多份範本，寄送時挑一份；四語綁在同一份底下。
   ------------------------------------------------ */
function pgMTpl(){
  const e=ev();if(!e)return '<div class="wrap"><p class="note">找不到活動</p></div>';
  return MT.g?mTplEdit(e):mTplList(e);
}

function mTplList(e){
  const gs=mGroups();
  const tyName=k=>{const t=MTYPES.filter(x=>x.k===k)[0];return t?t.n:k};
  /* 選中的那一份被刪掉或改了種類時，預覽要跟著關掉，不然會停在空的 */
  if(MPV&&!gs.some(g=>g.key===MPV))MPV=null;

  const rows=gs.map(g=>{
    const ready=(g.zh.subject||'').trim()||(g.zh.body||'').trim();
    return '<tr class="'+(MPV===g.key?'mtrow-on':'')+'">'+
      '<td class="nowrap">'+esc(tyName(g.type))+'</td>'+
      '<td><b>'+esc(g.title)+'</b>'+
        (ready?'':' <span class="note">（中文未填，還不能寄）</span>')+'</td>'+
      '<td class="nowrap note">'+(g.langs.length?g.langs.map(langName).join('、'):'—')+'</td>'+
      (MPV?'':'<td class="nowrap note">'+esc(g.updated?fmtDateTime(g.updated):'—')+'</td>')+
      '<td class="nowrap">'+
        '<button class="btn '+(MPV===g.key?'b':'sec')+' sm" onclick="mPv(\''+g.key+'\')">預覽</button> '+
        '<button class="btn b sm" onclick="mOpen(\''+g.key+'\')">編輯</button> '+
        '<button class="btn sec sm" onclick="mDup(\''+g.key+'\')">複製一份</button> '+
        '<button class="btn sec sm" onclick="mDel(\''+g.key+'\')">刪除</button></td></tr>';
  }).join('');

  const list=(gs.length
    ?'<div class="tblwrap"><table><tr><th class="nowrap">種類</th><th>名稱</th>'+
      '<th class="nowrap">已填語言</th>'+(MPV?'':'<th class="nowrap">最後修改</th>')+
      '<th class="nowrap">操作</th></tr>'+rows+'</table></div>'
    :'<div class="empty"><b>還沒有任何範本</b>'+
      '<p>先建一份，填好中文就能寄；其他語言留白會自動用中文版。</p></div>')+
    '<div class="card" style="margin-top:18px"><h3>新增範本</h3>'+
      '<div class="row">'+
        '<div style="flex:1;min-width:170px"><label style="display:block">哪一種信</label>'+
          '<select id="ntType" style="width:100%">'+MTYPES.map(t=>
            '<option value="'+t.k+'">'+esc(t.n)+'</option>').join('')+'</select></div>'+
        '<div style="flex:2;min-width:190px"><label style="display:block">這一份的名稱</label>'+
          '<input type="text" id="ntTitle" style="width:100%" '+
          'placeholder="例如：正式版、客戶修改版"></div></div>'+
      '<p style="margin-top:12px"><button class="btn" onclick="mNew()">建立</button></p>'+
      '<p class="note" style="margin:8px 0 0">四種信各自可以有好幾份。'+
        '名稱只給你們自己辨識，賓客看不到。</p>'+
    '</div>';

  return '<div class="wrap">'+
    crumb([['活動總覽頁',"ROUTE='events';EVID=null;render()"],
           [e.name,"ROUTE='event';render()"],['信件範本庫','']])+
    '<h1>信件範本庫</h1>'+
    '<p class="sub">'+esc(e.name)+'　同一種信可以存多份，寄送時挑一份。這裡的範本只屬於這一場活動</p>'+
    '<div class="mtwrap'+(MPV?' split':'')+'">'+
      '<div>'+list+'</div>'+
      (MPV?mPvBox(e):'')+
    '</div>'+
    '<div class="info"><b>四語綁在同一份底下</b>'+
    '一份範本裡有中英日韓四個分頁，寄送時每位賓客自動收到自己語言的版本，不需要挑語言。'+
    '<br>某個語言留白就寄中文，所以只填中文也能正常運作。</div>'+
    '</div>';
}
/* 開／關右側預覽。再按同一份就收起來。 */
function mPv(key){
  if(MPV===key){MPV=null}else{MPV=key;MPVL='zh'}
  render();
}
function mPvLang(k){MPVL=k;render()}
function mPvClose(){MPV=null;render()}

/* 右側預覽區。顯示的是「資料庫裡已儲存的內容」，
   跟編輯頁那個即時預覽不同 —— 沒存的東西不會出現在這裡，所以標題要講清楚。 */
function mPvBox(e){
  const g=mGroup(MPV);
  if(!g)return '';
  const on=evLangs(e);
  const r=mtplGet(MPV,MPVL)||{};
  const zh=mtplGet(MPV,'zh')||{};
  const filled=(r.subject||'').trim()||(r.body||'').trim();
  const src=filled?r:zh;          // 該語言沒填就顯示中文版，跟實際寄出的行為一致

  const gst=GUESTS[0]||{name:'王小明',table_no:null,token:'DEMO'};
  const map={
    '姓名':gst.name,'活動名稱':e.name,'活動日期':e.event_date||'',
    '活動地點':e.venue||'','桌次':gst.table_no?('桌次 '+gst.table_no):'尚未安排',
    '報名連結':baseUrl()+'?view=form&e='+e.id+'&lang='+MPVL,
    '個人頁連結':baseUrl()+'?view=me&t='+(gst.token||'DEMO')};
  const fill=t=>String(t||'').replace(/\{\{([^}]+)\}\}/g,(m,k)=>
    (map[k.trim()]!==undefined?map[k.trim()]:m));
  const url=src.btn_target==='form'?map['報名連結']
           :src.btn_target==='me'?map['個人頁連結']:(src.btn_url||'');

  const tabs=on.map(k=>{
    const rr=mtplGet(MPV,k);
    const has=rr&&((rr.subject||'').trim()||(rr.body||'').trim());
    return '<button class="btn '+(MPVL===k?'b':'sec')+' sm" '+
      'onclick="mPvLang(\''+k+'\')">'+esc(langName(k))+(has?'':'　—')+'</button> ';
  }).join('');

  return '<div class="mtpv">'+
    '<div class="h"><b>'+esc(g.title)+'</b>'+
      '<button class="btn sec sm" onclick="mOpen(\''+MPV+'\')">編輯</button>'+
      '<button class="btn sec sm" onclick="mPvClose()">✕</button></div>'+
    '<div class="bd">'+
      '<div style="margin-bottom:10px">'+tabs+'</div>'+
      (filled?'':'<p class="note" style="margin:0 0 10px">'+
        esc(langName(MPVL))+' 沒有填寫，實際寄出時會用中文版，以下顯示的就是中文版。</p>')+
      '<div style="background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden">'+
        '<div style="padding:10px 13px;border-bottom:1px solid var(--line);background:var(--card)">'+
          '<b style="font-size:13.5px">'+esc(fill(src.subject)||'（沒有主旨）')+'</b></div>'+
        '<div style="padding:16px 14px;text-align:center;max-height:52vh;overflow:auto">'+
          (src.top_image?'<img src="'+esc(src.top_image)+'" style="max-width:100%;display:block;margin:0 auto 14px">':'')+
          '<div style="text-align:left;white-space:pre-wrap;font-size:13.5px;line-height:1.7">'+
            esc(fill(src.body))+'</div>'+
          (src.btn_text?'<p style="margin:16px 0"><a href="'+esc(url)+'" target="_blank" '+
            'style="display:inline-block;background:var(--purple);color:#fff;text-decoration:none;'+
            'padding:9px 20px;border-radius:6px;font-weight:700;font-size:13.5px">'+
            esc(fill(src.btn_text))+'</a></p>':'')+
          (src.bottom_image?'<img src="'+esc(src.bottom_image)+'" style="max-width:100%;display:block;margin:14px auto 0">':'')+
        '</div></div>'+
      '<p class="note" style="margin:10px 0 0">已儲存的內容，代入「'+esc(gst.name)+'」的資料。</p>'+
    '</div></div>';
}

async function mNew(){
  const ty=document.getElementById('ntType').value;
  const ti=document.getElementById('ntTitle').value.trim()||'未命名';
  /* group_key 用時間戳＋亂數。四語是分四列寫入的，先產生 key 再一起寫最單純。 */
  const key='g_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);
  const btn=(MTYPES.filter(t=>t.k===ty)[0]||{}).btn||'';
  const {error}=await sb.from('mail_templates').insert(
    {event_id:EVID,group_key:key,type:ty,title:ti,locale:'zh',btn_target:btn});
  if(error){alert('建立失敗：'+error.message);log('建立信件範本失敗',error.message,true);return}
  await loadMail();
  MT={g:key,type:ty,lang:'zh'};render();
  toast('已建立　'+ti);
  log('建立信件範本',ty+'／'+ti);
}
/* 複製既有的一份，四語一起複製 —— 通常是要改一版但想留著原本的 */
async function mDup(key){
  const g=mGroup(key);if(!g)return;
  const nk='g_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);
  const rows=g.rows.map(r=>({event_id:EVID,group_key:nk,type:r.type,
    title:(g.title+' 複本'),locale:r.locale,subject:r.subject,top_image:r.top_image,
    body:r.body,btn_text:r.btn_text,btn_target:r.btn_target,btn_url:r.btn_url,
    bottom_image:r.bottom_image}));
  const {error}=await sb.from('mail_templates').insert(rows);
  if(error){alert('複製失敗：'+error.message);return}
  await loadMail();render();
  log('複製信件範本',g.title+' → '+g.title+' 複本');
}
async function mDel(key){
  const g=mGroup(key);if(!g)return;
  if(!confirm('刪除範本「'+g.title+'」？\n\n四種語言會一起刪除，且無法復原。\n'+
    '已經寄出去的信不受影響。'))return;
  const {error}=await sb.from('mail_templates').delete().eq('group_key',key);
  if(error){alert('刪除失敗：'+error.message);return}
  await loadMail();MT={g:null,type:MT.type,lang:'zh'};render();
  log('刪除信件範本',g.title);
}
function mOpen(key){
  const g=mGroup(key);if(!g)return;
  MT={g:key,type:g.type,lang:'zh'};render();
}
/* 離開編輯頁。暫存只活在這個分頁裡，重新整理就沒了，
   所以有未儲存內容時一定要問一聲。 */
function mBack(force){
  const g=MT.g;
  if(!force&&g){
    mGrab();
    const dirty=Object.keys(MDRAFT).filter(k=>k.indexOf(g+'|')===0&&mDirty(k));
    if(dirty.length&&!confirm('有還沒儲存的內容（'+
        dirty.map(k=>langName(k.split('|')[1])).join('、')+
        '）。\n\n離開後重新整理就會消失，確定離開？'))return;
  }

/* 打字當下不會重畫整頁，所以標記要自己更新。
   只改當前語言那一顆按鈕的文字，不重繪 —— 重繪會讓游標跳掉。 */
function mTouch(){
  mGrab();
  const k=MT.lang,el=document.getElementById('mlt_'+k);
  if(!el)return;
  const r=mtplGet(MT.g,k);
  const has=r&&((r.subject||'').trim()||(r.body||'').trim());
  el.textContent=langName(k)+(has?' ✓':'')+(mDirty(MT.g+'|'+k)?' •':'');

/* 暫存的值跟資料庫一不一樣。相同的話不算未儲存 ——
   只是切過語言頁籤就跳確認框，會很吵。 */
function mDirty(k){
  const v=MDRAFT[k];if(!v)return false;
  const g=k.split('|')[0],lang=k.split('|')[1];
  const db=mtplGet(g,lang)||{};
  return ['subject','top_image','body','btn_text','btn_target','btn_url','bottom_image']
    .some(f=>String(v[f]||'')!==String(db[f]||''));
}

function mBtnGChange(){

/* 插到游標處，不是接在最後 —— 接在最後等於每次都要再手動搬一次。
   插哪一格看 MFOCUS（最後停留的那一格），不看 activeElement：
   按鈕被點下去的瞬間焦點就是按鈕自己了。 */
function mIns(t){
  const el=document.getElementById(MFOCUS)||document.getElementById('mBody');
  if(!el)return;
  const p=el.selectionStart||0,q=el.selectionEnd||0;
  el.value=el.value.slice(0,p)+t+el.value.slice(q);
  el.focus();el.setSelectionRange(p+t.length,p+t.length);
  mTouch();
}
async function mSave(){
  /* 這支曾經「按了完全沒反應」—— 中途 return 又不說話最難查，
     所以每一條失敗路徑都要留話。 */
  try{
    const g=mGroup(MT.g);
    if(!g){alert('找不到這一份範本，請回清單重新進入。');
      log('儲存信件範本失敗','mGroup 找不到 '+MT.g,true);return}
    mGrab();                       // 先把畫面上這一語收進暫存，才能跟其他語言一起寫
    const keys=Object.keys(MDRAFT).filter(k=>k.indexOf(MT.g+'|')===0);
    if(!keys.length){toast('沒有變更');return}

    /* 名稱與種類是整份共用的，以畫面上那一格為準 */
    const cur0=MDRAFT[MT.g+'|'+MT.lang]||{};
    const title=String(cur0.title||g.title||'').trim()||'未命名';
    const type=cur0.type||g.type;

    const rows=keys.map(k=>{
      const lang=k.split('|')[1],v=MDRAFT[k];
      return{event_id:EVID,group_key:MT.g,type:type,title:title,locale:lang,
        subject:String(v.subject||'').trim(),
        top_image:String(v.top_image||'').trim(),
        body:v.body||'',
        btn_text:String(v.btn_text||'').trim(),
        btn_target:v.btn_target||'',
        btn_url:String(v.btn_url||'').trim(),
        bottom_image:String(v.bottom_image||'').trim(),
        updated_at:new Date().toISOString()};
    });

    const {error}=await sb.from('mail_templates')
      .upsert(rows,{onConflict:'group_key,locale'});
    if(error){
      /* 缺 group_key 欄位或缺唯一索引都會在這裡現形 ——
         多半是「範本多版本」那支 SQL 還沒執行 */
      const hint=/group_key|on conflict|constraint|column/i.test(error.message||'')
        ?'\n\n看起來是資料庫還沒更新，請先執行 sql_6m_範本多版本.sql。':'';
      alert('儲存失敗：'+error.message+hint);
      log('儲存信件範本失敗',error.message,true);return}

    /* 名稱或種類改過的話，沒被這次寫入的語言那幾列也要跟著改，
       否則清單頁會顯示舊名稱（清單看的是中文那一列） */
    if(g.title!==title||g.type!==type){
      const r2=await sb.from('mail_templates').update({title:title,type:type}).eq('group_key',MT.g);
      if(r2.error)log('同步範本名稱失敗',r2.error.message,true);
    }
    keys.forEach(k=>delete MDRAFT[k]);
    await loadMail();MT={g:MT.g,type:type,lang:MT.lang};render();
    toast('已儲存　'+rows.map(r=>langName(r.locale)).join('、'));
    log('儲存信件範本',title+'：'+rows.map(r=>r.locale).join('、'));
  }catch(ex){
    alert('儲存時發生錯誤：'+(ex&&ex.message||ex));
    log('儲存信件範本例外',String(ex&&ex.message||ex),true);
  }
}

          /* 每一種身分拆成「未寄過／已寄過」兩列。
             寄了邀請信不會改變 status（他還沒報名，invited 就是正確狀態），
             所以「還有誰沒寄」只能從寄送紀錄看，不能從狀態看。 */
          '<select id="sWho" onchange="mWho(this.value)">'+

            '<optgroup label="已經收過這種信（重寄）">'+mWhoOpts('done')+'</optgroup>'+
            '<optgroup label="自己挑">'+
              '<option value="pick|new"'+(MSEND.who==='pick'?' selected':'')+'>'+
              '指定賓客　已選 '+mPickCount()+' 位</option></optgroup>'+
          '</select></div></div>'+
        (MSEND.who==='pick'?mPickBox():'')+

      '<div id="msum">'+mSumHtml()+'</div>'+

      '<p class="note" style="margin:10px 0 0">'+
        '<b>不需要挑語言。</b>每位賓客收到的是他自己語系的版本 —— '+
        '報名時選的語言，或匯入時帶進來的語言。'+
        '<br>語言不對的人，可以到賓客名單勾選後按「設定語言」批次改。</p>'+
      mSendFoot()+
    '</div>'+

    '<div class="info"><b>先按「試寄一封」看過再寄</b>'+
    '試寄會用某一位賓客的資料代入變數，但收件人強制改成上面的測試信箱 —— '+
    '本人收不到，也不會寫進寄送紀錄。變數代錯、按鈕連錯、圖片破圖，這一步就看得出來。'+
    '<br>寄送會分批進行：Edge Function 單次執行上限 150 秒，'+
    '一次寄 3,000 封一定會被中斷，所以切成小批連續呼叫，畫面上看到的是一條進度。'+
    '<br><b>退信不會回到這裡。</b>信是用客戶的伺服器寄的，'+
    '地址打錯的退信會回到上面設定的寄件信箱，請於寄送後自行檢查。</div>'+
    '</div>';
}
async function msetSave(){
  const d={event_id:EVID,
    from_name:document.getElementById('sName').value.trim(),
    from_email:document.getElementById('sFrom').value.trim(),
    host:document.getElementById('sHost').value.trim(),
    port:parseInt(document.getElementById('sPort').value,10)||465,
    username:document.getElementById('sUser').value.trim(),
    test_to:document.getElementById('sTest').value.trim(),
    updated_at:new Date().toISOString()};
  /* ⚠️ 伺服器設定直接寫資料表，密碼走 Edge Function，兩條路不能合併：
     mail_settings 後台讀得到，mail_secrets 後台完全碰不到。 */
  const {error}=await sb.from('mail_settings').upsert(d,{onConflict:'event_id'});
  if(error){alert('儲存失敗：'+error.message);log('儲存寄件設定失敗',error.message,true);return}

  const pel=document.getElementById('sPass');
  const pw=pel?pel.value:'';
  if(pw){
    const r=await mailOps('pw_save',{password:pw});
    /* 不論成敗都先清掉輸入框。明文在畫面上多留一秒就多一分機會被看到或被截圖 */
    if(pel)pel.value='';
    if(r.err||r.error){
      alert('伺服器設定已存，但密碼沒存進去：'+(r.err||r.error));
      log('儲存信箱密碼失敗',r.err||r.error,true);
      await loadMail();render();return;
    }
    log('儲存信箱密碼','已加密寫入 mail_secrets，後台讀不回來');
  }

  await loadMail();render();
  toast(pw?'已儲存，密碼已加密保管':'已儲存');
  log('儲存寄件設定',d.host+':'+d.port);
}

/* 連線測試：解密 → 連 465 → 寄一封測試信。
   失敗時把伺服器的原始訊息攤開 —— 「密碼錯」與「埠號不通」的處理方式完全不同，
   收斂成一句「連線失敗」會查不下去。這一頁在登入牆內，只有自己人看得到。 */
async function mailTest(btn){
  if(MPW.busy)return;
  MPW.busy=true;
  const old=btn?btn.textContent:'';
  if(btn){btn.disabled=true;btn.textContent='測試中…'}
  const r=await mailOps('mail_test');
  MPW.busy=false;
  if(btn){btn.disabled=false;btn.textContent=old}

  if(r.err||r.error){
    alert('測試失敗：'+(r.err||r.error));
    log('連線測試失敗',r.err||r.error,true);return;
  }
  if(r.ok){
    await loadMail();render();
    alert('測試信已寄出到 '+r.to+'\n\n收得到就代表設定完全正確。'+
          '沒收到請看垃圾郵件匣。');
    log('連線測試通過','已寄出測試信到 '+r.to);return;
  }

  const M={
    no_settings:'還沒有儲存任何伺服器設定',
    incomplete:'設定不完整，缺少：'+((r.miss||[]).join('、')),
    bad_port:'埠號是 '+r.port+'。Supabase 封鎖 25 與 587，只有 465 出得去',
    no_password:'還沒有設定密碼',
    decrypt_failed:'密碼解不開。多半是 MAIL_KEY 被換過 —— 請重新填一次密碼',
    smtp_failed:'伺服器拒絕連線或驗證失敗'
  };
  const head=M[r.reason]||('無法測試（'+r.reason+'）');
  alert('測試失敗\n\n'+head+(r.detail?'\n\n伺服器回覆：\n'+r.detail:''));
  log('連線測試失敗',head+(r.detail?'　'+r.detail:''),true);
}

/* ---------------- 寄送紀錄 ---------------- */
/* =========================================================
   寄送（mail_send）

   分工：這裡算對象、切批、畫進度；Edge Function 負責組信與寄出。
   ⚠️ 前端只傳 guest_id，不傳 email —— 讓前端指定收件地址，
      等於後台任何一個登入者都能拿客戶的伺服器寄信到任意地址。
   ========================================================= */

/* 這個人收過這一種信沒有。用「種類」不是「範本」——
   換一份範本重寄同一種信，收件人的感受仍然是「我已經收過核准信了」。 */
function mSentAt(gid,type){return MSENT[gid+'|'+type]||''}

/* 測試網域一律排除，而且不給「確認後照寄」的選項。
   壓測名單三千筆全是 example.com，寄出去只會產生三千封退信
   灌回客戶的寄件信箱 —— 這種錯誤不該靠一個確認視窗來擋。 */
function mFakeMail(s){
  return /@(example\.(com|org|net)|test\.|localhost|invalid)/i.test(String(s||''));
}

/* 下拉每一列的人數。算的是「真的寄得出去的人」：
   有 Email、不是測試信箱、而且符合寄過／沒寄過。 */
function mCnt(who,which){
  const ty=MSEND.type;
  const base=(who==='all')?GUESTS:GUESTS.filter(g=>g.status===who);
  return base.filter(g=>{
    const em=(g.email||'').trim();
    if(!em||mFakeMail(em))return false;
    return which==='done'?!!mSentAt(g.id,ty):!mSentAt(g.id,ty);
  }).length;
}
function mWhoOpts(which){
  const rows=[['invited','待邀請'],['pending','待審核'],['approved','已核准'],
              ['checked','已報到'],['all','全部']];
  return rows.map(x=>{
    const on=(MSEND.who===x[0]&&MSEND.sent===which);
    return '<option value="'+x[0]+'|'+which+'"'+(on?' selected':'')+'>'+
      x[1]+'　'+mCnt(x[0],which)+' 位</option>';
  }).join('');
}
function mWho(v){
  const p=String(v||'').split('|');
  MSEND.who=p[0]||'invited';MSEND.sent=p[1]||'new';
  render();
}

/* 這一輪的對象。list 才是真的會寄的那一群。 */
function mTargets(){
  const ty=MSEND.type;
  const base=(MSEND.who==='pick')
    ?GUESTS.filter(g=>MSEND.pick[g.id])
    :GUESTS.filter(g=>MSEND.who==='all'||g.status===MSEND.who);
  const noMail=base.filter(g=>!(g.email||'').trim());
  const fake=base.filter(g=>(g.email||'').trim()&&mFakeMail(g.email));
  const ok=base.filter(g=>(g.email||'').trim()&&!mFakeMail(g.email));
  const done=ok.filter(g=>mSentAt(g.id,ty));
  const fresh=ok.filter(g=>!mSentAt(g.id,ty));
  /* 指定賓客不擋重複：既然是點名指定，收過的也照寄 ——
     擋掉的話「他說沒收到，補一封」永遠寄不出去。 */
  const list=(MSEND.who==='pick')?ok:(MSEND.sent==='done'?done:fresh);
  return {base:base,noMail:noMail,fake:fake,ok:ok,done:done,fresh:fresh,list:list};
}

/* ---------------- 指定賓客 ---------------- */
function mPickCount(){return Object.keys(MSEND.pick).filter(k=>MSEND.pick[k]).length}
function mPickRows(){
  const k=String(MSEND.pkw||'').toLowerCase().trim();
  let l=GUESTS.filter(g=>(g.email||'').trim()&&!mFakeMail(g.email));
  if(k)l=l.filter(g=>(String(g.name||'')+' '+String(g.email||'')).toLowerCase().indexOf(k)>=0);
  return l;
}
function mPickList(){
  const l=mPickRows(), show=l.slice(0,80), ty=MSEND.type;
  return (l.length>80
      ?'<p class="note" style="margin:0 0 6px">符合 '+l.length+
       ' 位，先顯示前 80 位。再打幾個字縮小範圍，已勾選的不會因為搜尋而消失。</p>':'')+
    (show.length
      ?'<div class="tblwrap" style="max-height:280px;overflow:auto"><table>'+
        show.map(g=>'<tr><td class="nowrap"><label class="sw">'+
          '<input type="checkbox" '+(MSEND.pick[g.id]?'checked':'')+
          ' onchange="mPickToggle('+g.id+',this.checked)"> <b>'+esc(g.name)+'</b></label></td>'+
          '<td class="nowrap note">'+esc(g.email)+'</td>'+
          '<td class="nowrap">'+pill(g.status)+'</td>'+
          '<td class="nowrap note">'+(mSentAt(g.id,ty)?'已收過這種信':'—')+'</td></tr>').join('')+
        '</table></div>'
      :'<p class="note" style="margin:0">沒有符合的賓客</p>');
}
function mPickBox(){
  return '<div class="card plain" style="margin:14px 0 0;border-color:var(--purple)">'+
    '<div class="row" style="align-items:center">'+
      '<div style="flex:2"><input type="text" id="pkw" placeholder="搜尋姓名或 Email…" '+
        'value="'+esc(MSEND.pkw)+'" oninput="MSEND.pkw=this.value;mPickPaint()"></div>'+

        '<button class="btn sec sm" onclick="mPickAll()">勾選搜尋結果</button> '+

    '<div id="picklist" style="margin-top:10px">'+mPickList()+'</div></div>';

/* ⚠️ 只重畫清單與摘要，不整頁 render() ——
   整頁重畫會把搜尋框重建，中文輸入法組字到一半的字會被吃掉。
   這個坑在名單頁與核銷頁已經踩過，做法一致。 */
function mPickPaint(){
  const el=document.getElementById('picklist');
  if(el)el.innerHTML=mPickList();
  mSumPaint();
}
function mPickToggle(id,on){
  if(on)MSEND.pick[id]=true;else delete MSEND.pick[id];
  mPickPaint();

     只改文字不重建元素 —— 重畫下拉會把展開中的選單關掉。 */
  const sel=document.getElementById('sWho');
  if(sel&&sel.options.length){
    sel.options[sel.options.length-1].text='指定賓客　已選 '+mPickCount()+' 位';
  }
}
function mPickAll(){mPickRows().forEach(g=>{MSEND.pick[g.id]=true});render()}
function mPickClear(){MSEND.pick={};render()}

/* ---------------- 摘要與進度 ---------------- */
function mSumHtml(){
  const T=mTargets();
  const useable=mGroups().filter(g=>g.type===MSEND.type&&
    ((g.zh.subject||'').trim()||(g.zh.body||'').trim()));
  const gsel=useable.filter(g=>g.key===MSEND.g)[0];
  const dist={};T.list.forEach(g=>{const k=g.locale||'zh';dist[k]=(dist[k]||0)+1});
  /* 照 LANGS 的固定順序，不照人數 —— 人數會變，順序跟著跳很難比對 */
  const distArr=Object.keys(dist).map(k=>[k,dist[k]])
    .sort((a,b)=>LANGS.findIndex(l=>l.k===a[0])-LANGS.findIndex(l=>l.k===b[0]));
  const distTxt=distArr.map(x=>esc(langName(x[0]))+' '+x[1]+' 位').join('　·　');
  const missLang=gsel?distArr.filter(x=>x[0]!=='zh'&&gsel.langs.indexOf(x[0])<0):[];
  const skipTxt=[];
  if(T.noMail.length)skipTxt.push('沒有 Email '+T.noMail.length+' 位');
  if(T.fake.length)skipTxt.push('測試信箱 '+T.fake.length+' 位');
  if(MSEND.who!=='pick')skipTxt.push(
    (MSEND.sent==='done'?'還沒收過 '+T.fresh.length:'已收過 '+T.done.length)+' 位');

  return '<div class="card plain" style="margin:14px 0 0">'+
    '<div class="row" style="align-items:center">'+
      '<div style="flex:none"><b>這一批會寄出 '+T.list.length+' 封</b></div>'+
      '<div class="note" style="flex:1;text-align:right">符合條件 '+T.base.length+' 位'+
        (skipTxt.length?'　·　不寄：'+skipTxt.join('、'):'')+'</div></div>'+
    '<p class="note" style="margin:8px 0 0"><b>語言分布：</b>'+(distTxt||'—')+'</p>'+
    (T.fake.length
      ?'<div class="warn" style="margin:12px 0 0"><b>有 '+T.fake.length+' 位是測試信箱，一律不寄</b>'+
        'example.com 這類地址不存在，寄出去只會產生等量的退信灌回寄件信箱。'+
        '這一項沒有「確認後照寄」的選項，要真的寄請先把信箱改成真實地址。</div>'
      :'')+
    (MSEND.sent==='done'&&MSEND.who!=='pick'&&T.list.length
      ?'<div class="warn" style="margin:12px 0 0"><b>這是重寄</b>'+
        '這 '+T.list.length+' 位已經收過同一種信，按下寄出會再收到一封。</div>'
      :'')+
    (MSEND.who==='pick'&&T.list.length
      ?'<div class="info" style="margin:12px 0 0"><b>指定賓客不擋重複</b>'+
        '既然是點名指定，收過的也照寄。</div>'
      :'')+
    (missLang.length
      ?'<div class="warn" style="margin:12px 0 0"><b>有 '+
        missLang.reduce((a,x)=>a+x[1],0)+' 位會收到中文版</b>'+
        '這一份範本的 '+missLang.map(x=>langName(x[0])).join('、')+
        ' 沒有填寫（'+missLang.map(x=>langName(x[0])+' '+x[1]+' 位').join('、')+'）。'+
        '要讓他們收到自己的語言，回信件範本庫把這一份的那幾語補上。</div>'
      :'')+
    mProgHtml()+
  '</div>';
}
function mSumPaint(){
  const el=document.getElementById('msum');
  if(el)el.innerHTML=mSumHtml();
}
function mProgHtml(){
  const P=MSEND.prog;
  if(!P)return '';
  const pct=P.total?Math.round(P.done/P.total*100):0;
  const head=MSEND.busy
    ?'<b>寄送中　'+P.done+' / '+P.total+'</b>'
    :(P.stopped?'<b>已停止　'+P.done+' / '+P.total+'</b>':'<b>寄送完成</b>');
  const fails=(!MSEND.busy&&P.fails.length)
    ?'<div class="tblwrap" style="max-height:220px;overflow:auto;margin-top:10px"><table>'+
      '<tr><th>姓名</th><th>信箱</th><th>錯誤訊息</th></tr>'+
      P.fails.map(f=>'<tr><td class="nowrap">'+esc(f.name)+'</td>'+
        '<td class="nowrap note">'+esc(f.email)+'</td>'+
        '<td class="wrap note">'+esc(f.error)+'</td></tr>').join('')+'</table></div>'+
      '<p style="margin:10px 0 0"><button class="btn sec sm" onclick="mSendRetry()">'+
      '只重寄失敗的 '+P.fails.length+' 封</button></p>'
    :'';
  return '<div class="card plain" style="margin:12px 0 0;border-color:var(--purple)">'+
    head+'<p class="note" style="margin:4px 0 0">成功 '+P.sent+'　·　失敗 '+P.failed+
      (P.skipped?'　·　跳過 '+P.skipped:'')+'</p>'+
    '<div style="height:8px;border-radius:4px;background:#E3E7EE;overflow:hidden;margin:8px 0 0">'+
      '<div style="height:8px;width:'+pct+'%;background:var(--green)"></div></div>'+
    (P.error?'<div class="warn" style="margin:10px 0 0"><b>中斷</b>'+esc(P.error)+'</div>':'')+
    (P.logErr
      ?'<div class="warn" style="margin:10px 0 0"><b>信寄出去了，但寄送紀錄沒寫進去</b>'+
       esc(P.logErr)+'<br>⚠️ 這一批不會被「已收過」擋下，再寄一次他們會收到第二封。'+
       '請先確認寄送紀錄再決定要不要重寄。</div>':'')+
    fails+'</div>';
}

/* ---------------- 按鈕 ---------------- */
function mSendFoot(){
  const T=mTargets();

           :(!MPW.has)?'要先設定密碼'
           :(!MSEND.g)?'這種信還沒有可用的範本':'';

         ' disabled title="'+esc(why||'目前沒有符合條件的收件人')+'"')+
         ' onclick="mSendRun()">寄出 '+T.list.length+' 封</button>')+
    '</div>';
}

/* 函式回 ok:false 時的白話翻譯。與連線測試用的是同一組代號。 */
function mSendReason(r){
  const M={
    no_settings:'還沒有寄件設定',
    incomplete:'寄件設定沒有填完（缺 '+((r.miss||[]).join('、'))+'）',
    bad_port:'埠號必須是 465，目前是 '+r.port,
    no_password:'還沒有設定密碼',
    decrypt_failed:'密碼解不開，多半是加密金鑰被換過。請重新填一次密碼',
    no_template:'找不到這一份範本',
    empty_template:'這一份範本的中文版是空的，不能寄',
    smtp_failed:'連不上郵件伺服器：'+(r.detail||'')
  };
  return M[r.reason]||('失敗：'+(r.reason||'未知原因'));
}

/* 試寄一封：用某位賓客的資料代入變數，收件人強制改成 test_to。
   不寫 notifications，也不擋重複 —— 試寄不該影響正式寄送的判斷。 */
async function mSendTest(btn){
  if(!MSEND.g){alert('這種信還沒有可用的範本');return}
  if(!MPW.has){alert('還沒有設定密碼，請先在上面填好並按儲存');return}
  const to=String((MSET&&MSET.test_to)||'').trim();
  if(!to){alert('請先在上面填「測試收件信箱」並按儲存');return}
  const T=mTargets();
  const one=T.list[0]||T.ok[0]||
    GUESTS.filter(g=>(g.email||'').trim()&&!mFakeMail(g.email))[0];
  if(!one){alert('名單裡沒有可以代入的賓客資料');return}
  if(!confirm('會用「'+one.name+'」的資料代入變數，寄到 '+to+'。\n\n'+
    one.name+' 本人不會收到，也不會寫進寄送紀錄。\n'+
    '信件語言用他自己的語系：'+langName(one.locale||'zh')))return;
  const old=btn.textContent;btn.disabled=true;btn.textContent='寄送中…';
  const r=await mailOps('mail_send',
    {group_key:MSEND.g,guest_ids:[one.id],test_to:to,base_url:baseUrl()});
  btn.disabled=false;btn.textContent=old;
  if(r.err){alert('試寄失敗：'+r.err);log('試寄失敗',r.err,true);return}
  if(r.ok===false){const m=mSendReason(r);alert('試寄失敗：'+m);log('試寄失敗',m,true);return}
  const one0=(r.results||[])[0]||{};
  if(one0.status!=='sent'){
    const m=one0.error||one0.reason||'未知原因';
    alert('試寄沒有成功：'+m);log('試寄失敗',m,true);return;
  }
  alert('試寄成功，已寄到 '+to+'\n\n'+
    '請檢查三件事：變數有沒有代對、按鈕連得到正確的頁面、圖片有沒有破圖。');
  log('試寄一封',one.name+' 的資料 → '+to);
}

/* 真的寄。前端切批，一批 25 封。
   ⚠️ 為什麼要切批：Edge Function 單次上限 150 秒，SMTP 一封 1–3 秒，
      一次送三千封一定會在中途被砍掉，而且不知道砍在第幾封。
   ⚠️ 進度不另外存：擋重複本身就是續傳 —— 關掉視窗再回來按一次寄出，
      已經寄成功的會被跳過，等於從斷點接上。 */
async function mSendRun(){
  const e=ev();if(!e||MSEND.busy)return;
  if(!MSEND.g){alert('這種信還沒有可用的範本');return}
  if(!MPW.has){alert('還沒有設定密碼，請先在上面填好並按儲存');return}
  const T=mTargets();
  if(!T.list.length){alert('目前沒有符合條件的收件人');return}
  const tyName=(MTYPES.filter(x=>x.k===MSEND.type)[0]||{}).n||MSEND.type;
  const g=mGroup(MSEND.g);
  if(!confirm('要把「'+tyName+'　'+((g&&g.title)||'')+'」寄給 '+T.list.length+' 位嗎？\n\n'+
    '寄出去就收不回來了。建議先按「試寄一封」看過一次。'))return;

  const force=(MSEND.who==='pick')||(MSEND.sent==='done');
  const bid='b_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,6);
  const P={total:T.list.length,done:0,sent:0,failed:0,skipped:0,
           fails:[],stopped:false,error:'',logErr:''};
  MSEND.busy=true;MSEND.stop=false;MSEND.prog=P;
  render();
  log('開始寄送',tyName+'　'+T.list.length+' 位　批次 '+bid);

  let queue=T.list.slice();
  while(queue.length){
    if(MSEND.stop){P.stopped=true;break}
    const chunk=queue.slice(0,25);
    const r=await mailOps('mail_send',{group_key:MSEND.g,
      guest_ids:chunk.map(x=>x.id),batch_id:bid,force:force,base_url:baseUrl()});
    if(r.err){P.error=r.err;break}
    if(r.ok===false){P.error=mSendReason(r);break}
    /* deferred 是函式自己提早收手留下的（快到 150 秒），下一輪再送。
       ⚠️ 用 id 比對誰處理完了，不能用「處理了幾筆」推算 ——
          函式回來的順序不保證跟送出去的順序一樣。 */
    const doneIds={};
    (r.results||[]).forEach(x=>{
      if(x.status==='deferred')return;
      doneIds[x.guest_id]=1;
      if(x.status==='sent')P.sent++;
      else if(x.status==='failed'){
        P.failed++;
        const gg=GUESTS.filter(y=>y.id===x.guest_id)[0]||{};
        P.fails.push({id:x.guest_id,name:gg.name||('#'+x.guest_id),
          email:x.to||gg.email||'',error:String(x.error||'').slice(0,200)});
      }else P.skipped++;
    });
    if(r.log_error)P.logErr=r.log_error;
    P.done=P.sent+P.failed+P.skipped;
    const before=queue.length;
    queue=queue.filter(x=>!doneIds[x.id]);
    /* 一整批一封都沒推進：再跑下去只會是同樣的結果，停下來講清楚。
       常見原因是那幾位已經被刪掉了。 */
    if(queue.length===before){
      P.error='還有 '+queue.length+' 位沒有處理（可能已被刪除），請重新整理後再試';
      break;
    }
    mSumPaint();
  }
  MSEND.busy=false;
  await loadMail();
  render();
  log('寄送結束','成功 '+P.sent+'　失敗 '+P.failed+'　跳過 '+P.skipped,P.failed>0);
  toast(P.stopped?('已停止　成功 '+P.sent+' 封'):('寄送完成　成功 '+P.sent+' 封'));
}
function mSendStop(){MSEND.stop=true;toast('停止中，這一批寄完就停')}

/* 只重寄失敗的。轉成「指定賓客」再跑一次 ——
   失敗的那幾筆在 notifications 是 status='failed'，本來就不會被「已收過」擋下，
   但走指定賓客這條路看得見自己選了誰，比較不會誤按。 */
async function mSendRetry(){
  const P=MSEND.prog;
  if(!P||!P.fails.length||MSEND.busy)return;
  MSEND.pick={};P.fails.forEach(f=>{MSEND.pick[f.id]=true});
  MSEND.who='pick';MSEND.sent='new';MSEND.pkw='';
  render();
  await mSendRun();
}

/* 讀「誰收過哪一種信」。
   ⚠️ 只撈三個欄位，三千筆也很輕；不要改用 MLOG（那個只有最近 500 筆）。 */
async function loadMailSent(){
  const r=await fetchAllFast(cnt=>sb.from('notifications')
    .select('guest_id,type,sent_at', cnt?{count:'exact',head:true}:{})
    .eq('event_id',EVID).eq('status','sent').order('id'));
  if(r.error){MSENTOK=false;log('讀取寄送對照失敗',r.error.message,true);return}
  const m={};
  (r.data||[]).forEach(x=>{
    const k=x.guest_id+'|'+x.type;
    if(!m[k]||String(x.sent_at)>String(m[k]))m[k]=x.sent_at;
  });
  MSENT=m;MSENTOK=true;
}

/* 名單頁「已寄信」欄。四種信各一個字，收過的才亮。
   ⚠️ 資料還沒到就顯示「…」，不要顯示「—」——

}

    '<div class="info"><b>「已送出」不等於「對方收到」</b>'+
