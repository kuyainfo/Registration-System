function impCfHtml(){
  const items=IMP.plan.items.filter(x=>x.action==='conflict');
  if(!items.length)return '<div class="ok"><b>沒有衝突</b>匯入的值跟現有資料沒有牴觸，直接匯入即可。</div>';
  const agg={},order=[];let tot=0;
  items.forEach(it=>it.conflicts.forEach(c=>{
    const k=String(c.fid);
    if(!agg[k]){agg[k]={label:c.label,n:0,bad:0};order.push(k)}
    agg[k].n++; if(c.bad)agg[k].bad++; tot++;
  }));
  const nDec=Object.keys(IMP.dec).length;
  let h='<h2>衝突 <span class="note">'+items.length+' 人、'+tot+' 個欄位</span></h2>'+
    '<div class="card">'+
    '<p class="note" style="margin:0"><b>勾起來＝採用匯入值，不勾＝保留現有值。</b>'+
    '預設全部不勾，也就是維持現在的行為。目前已勾 <b>'+nDec+'</b> 格。</p>'+
    '<p style="margin:10px 0 0"><button class="btn sec" onclick="impDecAll(true)">全部採用匯入值</button> '+
    '<button class="btn sec" onclick="impDecAll(false)">全部保留現有值</button></p>'+
    '<h3 style="margin:16px 0 0">依欄位快速決定</h3>'+
    '<p class="note" style="margin:4px 0 0">整批換過部門、但不想動手機號碼的時候用這個。</p>';
  order.forEach(k=>{
    h+='<div class="fq"><b>'+esc(agg[k].label)+'</b>'+
       '<span class="note">'+agg[k].n+' 筆'+(agg[k].bad?'（'+agg[k].bad+' 筆不可勾）':'')+'</span>'+
       '<span class="cfq"><button class="btn sec" onclick="impDecField(\''+k+'\',true)">全採用</button> '+
       '<button class="btn sec" onclick="impDecField(\''+k+'\',false)">全保留</button></span></div>';
  });
  h+='</div>';
  items.forEach(it=>{
    h+='<div class="cfgrp"><div class="hd">'+esc(it.name||'—')+
       '<span class="em">'+(it.email?esc(it.email):'—')+
       '　比對方式：'+(VIA[it.via]||'—')+'</span></div>';
    it.conflicts.forEach(c=>{
      const on=!!IMP.dec[dkey(it.ri,c.fid)];
      h+='<div class="cfrow'+(c.bad?' bad':'')+'">'+
        '<span class="lb">'+esc(c.label)+'</span>'+
        '<span class="ov">'+esc(c.old)+'</span> → <span class="nv">'+esc(c.neo)+'</span>'+
        '<span class="cfq">'+(c.bad
          ? '<span class="mini" style="color:var(--dred)">'+esc(c.bad)+'，勾了也寫不進去</span>'
          : '<label class="sw"><input type="checkbox" '+(on?'checked':'')+
            ' onchange="impDec('+it.ri+',\''+c.fid+'\',this.checked)"> 採用匯入值</label>')+
        '</span></div>';
    });
    h+='</div>';
  });
  return h;
}

function impPrevHtml(){
  const P=IMP.plan;

    'conflict':'<span class="badge b-conf">有衝突</span>','error':'<span class="badge b-err">略過</span>'};
  const rows=P.items.slice(0,60).map(it=>{
    let n='';
    if(it.action==='error')n=it.issues.join('、');

      const m=it.conflicts.filter(c=>IMP.dec[dkey(it.ri,c.fid)]).length;
      n='比對到（'+(VIA[it.via]||'—')+'），'+it.conflicts.length+' 欄不同，已採用匯入值 '+m+' 欄';
    }
    else if(it.action==='fill')n='比對到（'+(VIA[it.via]||'—')+'），只填空白欄位';
    else n=it.cands.length?('同名 '+it.cands.length+' 位，'+(IMP.manual[it.ri]==='new'?'已指定':'未指定')+'→ 建立新的一筆'):'比對不到，建立新的一筆';
    return '<tr><td class="nowrap">'+B[it.action]+'</td><td class="wrap">'+esc(it.name||'—')+'</td>'+
      '<td class="wrap">'+esc(it.email||'—')+'</td><td class="wrap">'+esc(n)+'</td></tr>';
  }).join('');
  return '<h2>逐列預覽</h2><p class="note" style="margin-bottom:8px">共 '+P.items.length+' 列'+
    (P.items.length>60?'，以下顯示前 60 列':'')+'</p>'+

async function bootAuth(){
  const {data}=await sb.auth.getSession();
  USER=data&&data.session?data.session.user:null;
  AUTHREADY=true;
  sb.auth.onAuthStateChange((_e,sess)=>{
    const was=USER?USER.id:null;
    USER=sess?sess.user:null;
    if((USER?USER.id:null)!==was){
      if(USER)loadEvents(); else {EVENTS=[];FIELDS=[];GUESTS=[];VALS={};ROUTE='events';EVID=null;render()}
    }
  });
  if(USER){log('已登入','身分：'+USER.email+'　RLS 會套用 authenticated 的規則');loadEvents()}
  else{LOADING=false;render()}
}
async function doLogin(btn){
  const em=document.getElementById('liMail').value.trim();
  const pw=document.getElementById('liPass').value;
  if(!em||!pw){alert('請輸入帳號與密碼');return}
  btn.disabled=true;
  const {data,error}=await sb.auth.signInWithPassword({email:em,password:pw});
  btn.disabled=false;
  if(error){
    document.getElementById('liErr').innerHTML=
      '<div class="warn"><b>登入失敗</b>'+esc(error.message)+'</div>';
    log('登入失敗',error.message,true);return;
  }
  USER=data.user;log('登入成功','身分：'+USER.email);
  await loadEvents();
}
async function doLogout(){
  navReset();
  await sb.auth.signOut();
  USER=null;EVENTS=[];FIELDS=[];GUESTS=[];VALS={};ROUTE='events';EVID=null;
  log('已登出','之後的查詢會套用 anon 的規則');
  render();

/* =========================================================
   兌換品項（活動層，全場共用）

   為什麼伴手禮不放這裡：它沒有庫存、沒有資格條件，只需要知道「誰領了」，
   所以做成 events.gift_enabled + guests.gift_at 兩個欄位。
   硬塞進品項表反而要處理一堆不適用的欄位。
   ========================================================= */
/* =========================================================
   抽獎模組

   與兌換模組的三個關鍵差別，看程式前先記住：

   ① 資格條件是「多條」不是一條
      兌換品項只有 qual_field_id / qual_op / qual_value 一組。
      抽獎是 quals 陣列，多條之間是「而且」——
      加碼獎常常是「抽獎資格＝1 而且 年資 ≥ 3」這種疊法。

   ② voided 的語意跟直覺相反
      被作廢的人不會回到抽獎池，而且仍然算「中過獎」，
      後續一般獎項都抽不到他。只有加碼獎（allow_repeat）撈得到。
      排除的是「所有出現在 lottery_winners 的人，含已作廢」。

   ③ 名額只是計畫數
      實際發出以 lottery_winners 為準。抽獎鍵旁的數字框可以改，
      改超過名額會問一句要不要同步把名額調大。
      所以不需要 used 欄位，也就不會有兌換模組那種「庫存與紀錄不同步」。
   ========================================================= */
let LOTS=[], LOTW=[];

/* 獎項分兩種：draw 電子抽獎（大螢幕隨機抽）／paper 紙本抽獎（現場實體抽、掃券登錄）。
   ⚠️ LOTS 一律是整場全部的獎項，不在載入時就過濾 ——
      匯出的「中獎獎項」欄與統計頁要的是完整的一份。
      要分的地方各自呼叫 lotsM()。 */
let LOTMODE='draw';
function lotsM(){return LOTS.filter(p=>(p.mode||'draw')===LOTMODE)}
function lotsCount(m){return LOTS.filter(p=>(p.mode||'draw')===m).length}
/* ⚠️ 這裡的判斷方式要跟名單頁的 GQOP 對齊（少了「包含文字」——
   資格條件是拿來決定誰能被抽的，模糊比對太危險，
   「部門包含研」會把「研發部」和「研究中心」一起抓進來）。 */
const LQOP={filled:'有填值',empty:'沒有填',gte:'數字大於等於',lte:'數字小於等於',eq:'完全等於'};

async function loadLots(id){
  const ev=id||EVID;
  const p=await sb.from('lottery_prizes').select('*')
    .eq('event_id',ev).order('sort_order').order('id');
  if(p.error){ERR=p.error;log('讀取抽獎獎項失敗',p.error.message,true);return}
  LOTS=p.data||[];
  /* 普獎動輒上百位，多辦幾個獎項就破千。
     order 除了 at 還要加 id：同一批抽出的時間戳是一樣的，
     只用 at 排序在分頁之間會不穩定，可能漏掉或重複。 */
  const w=await fetchAll(()=>sb.from('lottery_winners').select('*')
    .eq('event_id',ev).order('at').order('id'));
  if(w.error){ERR=w.error;log('讀取中獎紀錄失敗',w.error.message,true);return}
  LOTW=w.data||[];
  log('讀取抽獎資料','lottery_prizes '+LOTS.length+' 項、lottery_winners '+LOTW.length+' 筆');
}

/* 多條件版的資格判斷。單條的邏輯與 qualPass 一模一樣，
   差別只在外面包一層「每一條都要過」。

   ⚠️ 這裡刻意不去改既有那五份 qualOk（checkin-ops / guest-info /
      後台 qualText / 核銷頁 rdQualText / 匯出 qualPass）。
      抽獎自己一份，改判斷方式時六個地方要一起改，
      但至少單條的判斷規則三種是共通的，對照著改不會漏。 */
function lotQ1(g,q){
  if(!q||!q.f)return true;
  const fid=parseInt(q.f,10);
  const f=FIELDS.filter(x=>x.id===fid)[0];
  const raw=VALS[vKey(g.id,fid)];
  const v=String(raw==null?'':raw).trim();
  /* 單選欄位資料庫存的是選項代碼，畫面上是中文。
     兩邊都比一次，設定時挑中文或代碼都對得上。 */
  const shown=f?String(ansShow(g.id,f)||'').trim():v;
  const want=String(q.v==null?'':q.v).trim();
  if(q.op==='filled')return v!=='';
  if(q.op==='empty') return v==='';
  if(q.op==='gte'||q.op==='lte'){
    const n=parseFloat(v), need=parseFloat(want);
    if(isNaN(n)||isNaN(need))return false;   /* 未填或不是數字一律不符合 */
    return q.op==='gte'?(n>=need):(n<=need);
  }
  if(q.op==='eq')return v===want||shown===want;
  return true;
}
function lotQualOk(g,p){
  const qs=(p&&Array.isArray(p.quals))?p.quals:[];
  if(!qs.length)return true;
  return qs.every(q=>lotQ1(g,q));
}

/* 資格條件翻成人看得懂的一句話。後台列表與大螢幕共用。 */
function lotQualText(p){
  const qs=(p&&Array.isArray(p.quals))?p.quals:[];
  if(!qs.length)return '全員符合';
  return qs.map(q=>{
    const f=FIELDS.filter(x=>x.id===parseInt(q.f,10))[0];
    const fn=f?((f.t&&f.t.zh)||f.label):('欄位#'+q.f);
    if(q.op==='filled')return fn+' 有填值';
    if(q.op==='empty') return fn+' 沒有填';
    if(q.op==='gte')   return fn+' ≥ '+(q.v||'0');
    if(q.op==='lte')   return fn+' ≤ '+(q.v||'0');
    if(q.op==='eq'){
      let vt=q.v||'';
      if(f&&Array.isArray(f.options)){
        const o=f.options.filter(x=>x.key===q.v)[0];
        if(o)vt=(o.t&&o.t.zh)||o.key;
      }
      return fn+' ＝ '+vt;
    }
    return fn;
  }).join('　且　');
}

/* 這個獎項已抽出幾位（含已作廢，因為名額是被佔掉的） */
function lotDone(pid){return LOTW.filter(w=>w.prize_id===pid).length}
function lotLive(pid){return LOTW.filter(w=>w.prize_id===pid&&!w.voided).length}

/* 大螢幕上要不要顯示這一筆。
   ⚠️ 兩種作廢意義完全不同：
        redraw　被重抽換掉 —— 已經有人頂上，再顯示會讓名單筆數超過名額
        void　　作廢不補人 —— 那一格要留著劃掉，主持人才知道少了誰
   只管顯示，不管誰能被抽 —— 兩種作廢的人都仍然算「中過獎」，
   後續一般獎項一樣抽不到他們。 */
function lotOnStage(w){return !(w.voided&&w.void_kind==='redraw')}
function lotRowsOf(pid){
  return LOTW.filter(w=>w.prize_id===pid&&lotOnStage(w))
             .map(w=>({gid:w.guest_id,wid:w.id,voided:!!w.voided}));
}

/* 抽獎池：符合資格條件的人。
   排除已中獎者交給資料庫做（那一段必須是原子的），這裡只算資格。 */
/* 實際抽得到幾個人 —— 資格條件過了之後，還要扣掉已經中過獎的。

   ⚠️ 這是前端的預估，真正的排除仍然由 lottery_draw 在抽的當下做，
      那一段必須是原子的。這裡算出來只為了顯示，讓人在按下去之前
      就知道池子是空的，而不是抽完才看到「只剩 0 位」。

   會踩到的實際情境：測試時用加碼獎把 10 個人全抽完，
   後台「符合人數」還是顯示 10（因為資格條件全員符合），
   但任何沒勾「已中過獎的人也可以被抽到」的獎項都抽不到任何人。 */
function lotDrawable(p){
  const wonAny={}, wonThis={};
  LOTW.forEach(w=>{
    wonAny[w.guest_id]=1;
    if(w.prize_id===p.id)wonThis[w.guest_id]=1;
  });
  return lotPool(p).filter(id=>!wonThis[id]&&(p.allow_repeat||!wonAny[id])).length;
}

function lotPool(p){
  return GUESTS.filter(g=>g.status!=='rejected'&&lotQualOk(g,p)).map(g=>g.id);
}

/* 大螢幕可以選的欄位有兩種來源：
     固定欄位　姓名 / Email / 桌次 —— 存在 guests 表，沒有 form_fields.id
     自訂欄位　工號 / 部門 / 年資 —— 存在 form_fields，值用 id 的字串

   所以 stage_f1 / stage_f2 是 text 不是 bigint。
   一開始只給自訂欄位選是錯的：姓名根本不在 form_fields 裡，撈不到。 */
const LFIX={name:'姓名',email:'Email',table:'桌次'};

function lotFieldOpts(cur){
  return '<option value="">（不顯示）</option>'+
    Object.keys(LFIX).map(k=>'<option value="'+k+'"'+
      (String(cur||'')===k?' selected':'')+'>'+LFIX[k]+'</option>').join('')+
    FIELDS.map(x=>'<option value="'+x.id+'"'+
      (String(cur||'')===String(x.id)?' selected':'')+'>'+
      esc((x.t&&x.t.zh)||x.label)+'</option>').join('');
}
function lotFieldName(k){
  if(!k)return '—';
  if(LFIX[k])return LFIX[k];
  const f=FIELDS.filter(x=>String(x.id)===String(k))[0];
  return f?((f.t&&f.t.zh)||f.label):('欄位#'+k);
}

function lotVal(gid,key){
  if(!key)return '';
  const g=GUESTS.filter(x=>x.id===gid)[0];
  if(!g)return '';
  if(key==='name') return String(g.name||'').trim();
  if(key==='email')return String(g.email||'').trim();
  if(key==='table')return g.table_no?(g.table_no+' 桌'):'';
  const fid=parseInt(key,10);
  if(!fid)return '';
  const f=FIELDS.filter(x=>x.id===fid)[0];
  const v=VALS[vKey(gid,fid)];
  if(v==null||String(v).trim()==='')return '';
  if(f&&f.field_type==='select')return ansShow(gid,f);
  return String(v).trim();
}

/* 大螢幕上顯示的兩行字。
   ⚠️ 大字沒設定一律退回姓名 —— 大螢幕上不能出現空白，
      全場正在看那個位置。小字沒設就真的不顯示，那一行本來就是附加資訊。 */
function lotShow(gid){
  const g=GUESTS.filter(x=>x.id===gid)[0];
  if(!g)return {a:'（賓客已刪除）',b:''};
  const e=ev()||{};
  const b=lotVal(gid,e.stage_f1);                    // 小字，上面那行
  let a=lotVal(gid,e.stage_f2||'name');              // 大字，沒設就姓名
  if(!a)a=String(g.name||'').trim();                 // 設了但這個人是空的，也退回姓名
  if(!a)a='（未填姓名）';
  return {a:a,b:b};
}

/* ---- 後台：資格條件列的增刪 ----
   ⚠️ 只重畫條件區塊那一個 div，絕不整頁重繪 ——
      重繪會把已經打好的獎項名稱與名額清空。
      這個坑在「重繪抹掉使用者操作」那一章已經踩過五次。 */
let LOTQ=[];
function lotqPaint(){
  const box=document.getElementById('lqbox');
  if(!box)return;
  if(!LOTQ.length){
    box.innerHTML='<p class="note" style="margin:4px 0">沒有條件＝全員符合。</p>';
    return;
  }
  box.innerHTML=LOTQ.map((q,i)=>{
    const fo='<option value="">（請選欄位）</option>'+
      FIELDS.map(f=>'<option value="'+f.id+'"'+(String(q.f)===String(f.id)?' selected':'')+'>'+
        esc((f.t&&f.t.zh)||f.label)+'</option>').join('');
    const oo=Object.keys(LQOP).map(k=>'<option value="'+k+'"'+(q.op===k?' selected':'')+'>'+
      LQOP[k]+'</option>').join('');
    let vin='';
    if(q.op==='gte'||q.op==='lte'){
      vin='<input type="number" step="any" value="'+esc(q.v||'')+'" oninput="LOTQ['+i+'].v=this.value">';
    }else if(q.op==='eq'){
      const f=FIELDS.filter(x=>String(x.id)===String(q.f))[0];
      const opts=(f&&Array.isArray(f.options))?f.options.filter(o=>!o.del):[];
      if(opts.length){
        vin='<select onchange="LOTQ['+i+'].v=this.value">'+
          '<option value="">（請選）</option>'+
          opts.map(o=>'<option value="'+esc(o.key)+'"'+
            (String(q.v)===String(o.key)?' selected':'')+'>'+esc((o.t&&o.t.zh)||o.key)+'</option>').join('')+
          '</select>';
      }else{
        /* ⚠️ 數字或文字欄位也要能用「完全等於」。
           原本只給單選欄位一個下拉，遇到「抽獎資格 ＝ 1」這種 1／0 旗標欄位
           就完全沒辦法設，只能繞道用「≥ 1」——
           而值如果是 0 和 2，繞道也做不到。 */
        vin='<input type="text" value="'+esc(q.v||'')+'" placeholder="要等於的值" oninput="LOTQ['+i+'].v=this.value">';
      }
    }
    return (i?'<div class="lqand">而且</div>':'')+
      '<div class="lqrow">'+
        '<select onchange="lotqSet('+i+',\'f\',this.value)">'+fo+'</select>'+
        '<select onchange="lotqSet('+i+',\'op\',this.value)">'+oo+'</select>'+
        vin+
        '<button type="button" class="lqx" onclick="lotqDel('+i+')" title="刪除這一條">\u00d7</button>'+
      '</div>';
  }).join('');
}
function lotqSet(i,k,v){
  LOTQ[i][k]=v;
  if(k!=='v'){LOTQ[i].v='';lotqPaint()}   // 換欄位或換判斷方式，原本的值一定不能留
}
function lotqAdd(){LOTQ.push({f:'',op:'filled',v:''});lotqPaint()}
function lotqDel(i){LOTQ.splice(i,1);lotqPaint()}

function lotForm(id){
  const p=id?LOTS.filter(x=>x.id===id)[0]:null;
  LOTQ=p&&Array.isArray(p.quals)?JSON.parse(JSON.stringify(p.quals)):[];
  const done=p?lotLive(p.id):0;   /* 顯示有效中獎數，跟名額對得起來 */
  const dm=(p&&p.draw_mode)||'all';
  /* 編輯既有獎項時以那一筆的模式為準，不看目前停在哪一頁 */
  const paper=(((p&&p.mode)||LOTMODE)==='paper');
  if(paper)LOTQ=[];
  const m=modal('<h3>'+(p?'編輯獎項':(paper?'新增紙本獎項':'新增抽獎獎項'))+'</h3>'+
    '<label class="f"><span>獎項編號</span>'+
      '<input type="text" id="lCode" value="'+esc(p&&p.code?p.code:'')+'" placeholder="1　或　A01"></label>'+
    '<p class="note" style="margin:-6px 0 12px">顯示與對照客戶清單用，不參與排序 —— '+
      '客戶給的編號常常是 A01、特1 這種，照編號排會亂掉。順序用表格上的箭頭調。</p>'+
    '<label class="f"><span>獎項名稱（必填）</span>'+
      '<input type="text" id="lName" value="'+esc(p?p.name:'')+'" placeholder="三獎　按摩槍"></label>'+
    '<label class="f"><span>備註</span>'+
      '<input type="text" id="lNote" value="'+esc(p&&p.note?p.note:'')+'" placeholder="贊助廠商：OO 公司"></label>'+
    '<label class="f"><span>名額</span>'+
      '<input type="number" id="lTotal" min="1" value="'+(p?p.total:1)+'"></label>'+
    '<p class="note" style="margin:-6px 0 12px">'+
      (paper
        ?'名額是登錄上限，登錄滿了現場就會被擋下。要多發請先回來把名額改大。'+
         (p?'　目前已登錄 '+done+' 位。':'')
        :'名額只是計畫數。實際每次抽幾位，在大螢幕上抽的時候還能改，'+
         '超過名額會問一句要不要同步調整。'+(p?'　目前已抽出 '+done+' 位。':''))+'</p>'+
    /* ⚠️ 抽法只對電子抽獎有意義。紙本是在台下抽完再登錄的，

    (paper?''
      :'<label class="f"><span>抽法</span><select id="lMode">'+
        '<option value="all"'+(dm==='all'?' selected':'')+'>一次抽出　按一下，名額幾位一起揭曉</option>'+
        '<option value="one"'+(dm==='one'?' selected':'')+'>一個一個抽　按一下抽一位，名字累加在畫面上</option>'+
        '</select></label>'+
      '<p class="note" style="margin:-6px 0 14px">頭獎、特別獎適合一個一個抽，氣氛拉得起來；'+
        '普獎幾十位就用一次抽出，不然要按到手軟。</p>')+
    '<div class="card plain" style="padding:12px">'+
      '<b style="font-size:13px">'+(paper?'誰可以被登錄':'誰會被抽到')+'</b>'+
      '<label class="lchk">'+
        '<input type="checkbox" id="lRep"'+(p&&p.allow_repeat?' checked':'')+'>'+
        '<span>'+(paper?'已中過獎的人也可以登錄':'已中過獎的人也可以被抽到')+'</span></label>'+
      '<p class="note" style="margin:0 0 10px">'+

          ?'不勾：中過任何一個獎的人都登錄不進來（含電子抽獎抽出的人）。'+

          :'不勾：中過任何一個獎的人都抽不到（含被作廢的）。'+
           '勾了：只排除這個獎項本身已經抽中的人。')+'</p>'+
      /* ⚠️ 紙本沒有資格條件。名單本身就是「符合資格的人」，
         抽是在台下用紙本抽的，系統從頭到尾沒有篩選過任何人。
         留著這一區會讓人以為設了就會生效，那是最難查的一種誤會。 */
      (paper?''
        :'<b style="font-size:13px">資格條件</b>'+
        '<p class="note" style="margin:4px 0 8px">多條之間是「而且」，全部符合才進抽獎池。'+

      '</div>'+
    '<div class="foot"><button class="btn sec" id="c">取消</button>'+
      '<button class="btn" id="s">儲存</button></div>');
  if(!paper)lotqPaint();          /* 紙本沒有 #lqbox 這個容器 */
  m.querySelector('#c').onclick=()=>{LOTQ=[];m.remove()};
  m.querySelector('#s').onclick=async()=>{
    const name=m.querySelector('#lName').value.trim();
    if(!name){alert('請輸入獎項名稱');return}
    const total=parseInt(m.querySelector('#lTotal').value,10)||0;
    if(total<1){alert('名額至少 1 位');return}
    const bad=LOTQ.filter(q=>!q.f);
    if(bad.length){alert('有條件沒有選欄位，請補齊或刪掉那一條。');return}
    const d={event_id:EVID,name:name,
      code:m.querySelector('#lCode').value.trim()||null,
      note:m.querySelector('#lNote').value.trim()||null,
      total:total,
      /* 紙本沒有抽法欄位，存 'all' 當佔位 —— 那一欄只有電子大螢幕會讀 */
      draw_mode:(m.querySelector('#lMode')?m.querySelector('#lMode').value:'all')||'all',
      allow_repeat:m.querySelector('#lRep').checked,
      quals:LOTQ.map(q=>({f:parseInt(q.f,10),op:q.op,v:q.op==='filled'?null:(q.v||'')}))};
    m.querySelector('#s').disabled=true;
    const r=p? await sb.from('lottery_prizes').update(d).eq('id',p.id)
             : await sb.from('lottery_prizes').insert(Object.assign({sort_order:lotsM().length,mode:LOTMODE},d));
    if(r.error){alert('儲存失敗');log('儲存抽獎獎項失敗',r.error.message,true);
      m.querySelector('#s').disabled=false;return}
    log((p?'更新':'新增')+'抽獎獎項：'+name,
        '名額 '+total+'　'+(d.draw_mode==='one'?'一個一個抽':'一次抽出')+
        '　資格：'+lotQualText(d)+(d.allow_repeat?'　（已中獎者也可被抽到）':''));
    LOTQ=[];m.remove();await loadLots();render();
  };
}

/* ---- 獎項拖動排序 ----

   ⚠️ 刻意不共用欄位列那一套（DRAGID / dragStart / dropOn）。
      那一套的 dragEnd 只清 #fldrows 底下的樣式、dropOn 直接對 FIELDS 重排，
      拿來用會清不掉殘留的高亮，也會去動到欄位資料。
      這跟選項拖曳當初獨立一套是同樣的理由。

   上下箭頭保留。拖動在長清單快，箭頭在只差一格時準，兩個都要。 */
let LDRAG=null, LSCROLL=0, LDRAGY=0;
const LEDGE=90, LSPEED=18;
function lotScrollTick(){
  if(LDRAG==null){LSCROLL=0;return}
  const h=window.innerHeight;
  let dy=0;
  if(LDRAGY<LEDGE)        dy=-LSPEED*(1-LDRAGY/LEDGE);
  else if(LDRAGY>h-LEDGE) dy= LSPEED*(1-(h-LDRAGY)/LEDGE);
  if(dy)window.scrollBy(0,dy);
  LSCROLL=requestAnimationFrame(lotScrollTick);
}
function lotDragStart(ev,id){
  LDRAG=id;
  try{ev.dataTransfer.effectAllowed='move';ev.dataTransfer.setData('text/plain',String(id))}catch(_){}
  const tr=ev.target.closest('tr');if(tr)tr.classList.add('dragging');
  LDRAGY=ev.clientY||0;
  if(!LSCROLL)LSCROLL=requestAnimationFrame(lotScrollTick);
}
function lotDragEnd(){
  LDRAG=null;
  if(LSCROLL){cancelAnimationFrame(LSCROLL);LSCROLL=0}
  document.querySelectorAll('#lotrows tr').forEach(tr=>{
    tr.classList.remove('dragging');tr.classList.remove('dragover')});
}
function lotDragOver(ev,id){
  ev.preventDefault();
  LDRAGY=ev.clientY||LDRAGY;
  if(LDRAG==null||id===LDRAG)return;
  document.querySelectorAll('#lotrows tr').forEach(tr=>tr.classList.remove('dragover'));
  const tr=ev.target.closest('tr');if(tr)tr.classList.add('dragover');
}
async function lotDrop(ev,id){
  ev.preventDefault();
  const from=LDRAG; lotDragEnd();
  if(from==null||from===id)return;
  const fi=LOTS.findIndex(x=>x.id===from), ti=LOTS.findIndex(x=>x.id===id);
  if(fi<0||ti<0)return;
  const arr=LOTS.slice();
  const [mv]=arr.splice(fi,1);
  arr.splice(ti,0,mv);              /* 往下拖時 splice 之後的索引已經位移，直接插在目標位置就對 */
  await lotSaveOrder(arr);
}
async function lotSaveOrder(arr){
  for(let i=0;i<arr.length;i++){
    if(arr[i].sort_order===i)continue;          /* 沒變的不必寫，一次拖動通常只動到少數幾列 */
    const {error}=await sb.from('lottery_prizes').update({sort_order:i}).eq('id',arr[i].id);
    if(error){alert('調整順序失敗');log('調整抽獎獎項順序失敗',error.message,true);break}
  }
  log('調整抽獎獎項順序','新順序：'+arr.map(x=>x.name).join(' → '));
  await loadLots();render();
}

/* ---- 跨分頁同步 ----

   後台設定頁與大螢幕是兩個分頁，各自載入一次就不再更新，
   所以在後台改了獎項，大螢幕看不到；大螢幕抽完，後台的數字也是舊的。

   ⚠️ 不用 Realtime。三千人的場子掛著即時連線，連線數會爆
      （見「不要用 Realtime」那一節），而且抽獎是低頻動作，
      為了一分鐘一次的變動養一條長連線不划算。

   改用「切回這個分頁時補撈一次」—— 跟個人資訊頁同一個模式：
   人回來看了，那就是他在意的時刻。

   ⚠️ 有視窗開著就跳過。重載會 render()，
      而編輯中的獎項名稱、剛加好的資格條件都還沒存，
      重繪等於幫使用者按了取消。 */
function lotSyncable(){
  if(document.hidden)return false;
  if(document.querySelector('.mask'))return false;   /* 編輯視窗開著 */
  if(STG.busy||STG.roll)return false;                /* 正在抽，畫面不能被動 */
  return true;
}
async function lotSync(){
  if(!EVID)return;
  await loadEvents();      /* 大螢幕顯示設定（stage_f1/f2/gap/roll）在 events */
  await loadLots(EVID);    /* 獎項與中獎紀錄 */
  /* 大螢幕若正停在某個獎項，把名單重新對一次 ——
     可能是後台作廢了某一筆，或另一台大螢幕抽過了 */
  if(VIEW==='stage'&&STG.prize){
    const p=stagePrize();
    if(p){
      STG.rows=lotRowsOf(p.id);
      /* 抽法或名額可能剛在後台被改過，數量框要跟著重算 ——
         只鎖住框卻留著舊數字，按下去會抽出錯誤的位數。 */
      STG.n=(p.draw_mode==='one')?1:Math.max(1,stageLeft(p));
      STG.anim=false;
    }else{
      STG.prize=null;STG.rows=[];   /* 獎項被停用或刪掉了 */
    }
  }
  render();
}
document.addEventListener('visibilitychange',function(){
  if(!lotSyncable())return;
  if(VIEW==='stage'||ROUTE==='lots')lotSync();
});
/* 大螢幕通常是獨立視窗、不會切分頁，只會被點回焦點，所以 focus 也接一次 */
window.addEventListener('focus',function(){
  if(!lotSyncable())return;
  if(VIEW==='stage')lotSync();
});

async function lotMove(id,dir){
  /* 排序只在同一種抽法之內有意義，所以拿過濾後的清單來算 */
  const LS=lotsM();
  const i=LS.findIndex(x=>x.id===id);

  if(i<0||j<0||j>=LS.length)return;
  const arr=LS.slice();
  const t=arr[i];arr[i]=arr[j];arr[j]=t;
  await lotSaveOrder(arr);
}

/* =========================================================
   獎項匯入

   只吃三欄：獎項編號 / 獎項名稱 / 名額數量。
   其餘（抽法、誰會被抽到、資格條件）在匯入視窗設一次，
   整批套用，之後個別要改的再進去編輯。

   為什麼不把資格條件也放進 Excel：
     資格條件要指到「這場的欄位 id」，在 Excel 上只能寫欄位名稱，
     比對不到就整列失敗，而客戶填的欄位名稱幾乎不可能跟後台一字不差。
     一次設好整批套用，比逐列除錯快得多。

   ⚠️ 只做「附加在後面」，不做覆蓋或依名稱更新。
      獎項表牽著中獎紀錄，覆蓋等於連紀錄一起洗掉 ——
      風險遠大於省下的那點功夫。要改既有獎項就用編輯。
   ========================================================= */
let LIMP=null;   /* {rows:[{code,name,total,err}], dup:n} */

function lotImpTpl(){
  if(typeof XLSX==='undefined'){alert('匯出元件尚未載入，請確認網路後重新整理');return}
  const aoa=[['獎項編號','獎項名稱','名額數量'],
             ['1','頭獎　65吋電視',1],
             ['2','二獎　掃地機器人',3],
             ['A01','特別獎　主管加碼紅包',5]];
  const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols']=[{wch:12},{wch:30},{wch:10}];
  XLSX.utils.book_append_sheet(wb,ws,'獎項');
  XLSX.writeFile(wb,'抽獎獎項_匯入範本.xlsx');
  log('下載獎項匯入範本','三欄：獎項編號／獎項名稱／名額數量');
}

/* 表頭比對用既有的 norm()，全形半形與括號都會被正規化掉。
   找不到表頭列就當第一列是資料，不硬性要求一定要有表頭。 */
function lotImpParse(aoa){
  const KEY={code:['獎項編號','編號','項次','序號'],
             name:['獎項名稱','獎項','名稱','品名'],
             total:['名額數量','名額','數量','人數']};
  let hi=-1, map={};
  for(let i=0;i<Math.min(aoa.length,5);i++){
    const row=(aoa[i]||[]).map(x=>norm(String(x==null?'':x)));
    const m={};
    Object.keys(KEY).forEach(k=>{
      const j=row.findIndex(c=>c&&KEY[k].some(t=>c===norm(t)));
      if(j>=0)m[k]=j;
    });
    if(m.name!=null){hi=i;map=m;break}
  }
  if(hi<0){hi=-1;map={code:0,name:1,total:2}}   /* 沒表頭：照欄位順序讀 */
  const rows=[];
  for(let i=hi+1;i<aoa.length;i++){
    const r=aoa[i]||[];
    const get=k=>(map[k]==null?'':String(r[map[k]]==null?'':r[map[k]]).trim());
    const name=get('name');
    const code=get('code');
    const tRaw=get('total');
    if(!name&&!code&&!tRaw)continue;            /* 整列空白，跳過 */
    let total=parseInt(String(tRaw).replace(/[^0-9]/g,''),10);
    let err='';
    if(!name)err='沒有獎項名稱';
    else if(isNaN(total)||total<1){total=1;err='名額看不懂，先當 1 位'}
    rows.push({code:code,name:name,total:total,err:err});
  }
  return rows;
}

      '<p class="note" style="margin:4px 0 8px">多條之間是「而且」，全部符合才進抽獎池。</p>'+
      '<div id="lqbox"></div>'+
      '<button type="button" class="btn sec" style="margin-top:8px" onclick="lotqAdd()">+ 加一條</button>'+
    '</div>'+
    '<div id="lipv" style="margin-top:12px"></div>'+
    '<div class="foot"><button class="btn sec" id="c">取消</button>'+
      '<button class="btn" id="s" disabled>匯入</button></div>');
  lotqPaint();
  const btn=m.querySelector('#s');
  m.querySelector('#c').onclick=()=>{LIMP=null;LOTQ=[];m.remove()};

  m.querySelector('#lif').onchange=e=>{
    const f=e.target.files&&e.target.files[0];
    if(!f)return;
    if(typeof XLSX==='undefined'){alert('匯入元件尚未載入，請確認網路後重新整理');return}
    const rd=new FileReader();
    rd.onload=ev=>{
      let rows=[];
      try{
        const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});
        const ws=wb.Sheets[wb.SheetNames[0]];
        rows=lotImpParse(XLSX.utils.sheet_to_json(ws,{header:1,blankrows:false,defval:''}));
      }catch(_){
        m.querySelector('#lipv').innerHTML='<div class="warn"><b>讀不到這個檔案</b>請確認是 .xlsx 或 .xls。</div>';
        return;
      }
      LIMP={rows:rows};
      lotImpPreview(m);
    };
    rd.readAsArrayBuffer(f);
  };

  btn.onclick=async()=>{
    if(!LIMP||!LIMP.rows.length)return;
    const ok=LIMP.rows.filter(r=>r.name);
    const bad=LOTQ.filter(q=>!q.f);
    if(bad.length){alert('有資格條件沒有選欄位，請補齊或刪掉那一條。');return}
    btn.disabled=true;btn.textContent='匯入中…';
    const base={event_id:EVID,
      draw_mode:m.querySelector('#liMode').value||'all',
      allow_repeat:m.querySelector('#liRep').checked,
      quals:LOTQ.map(q=>({f:parseInt(q.f,10),op:q.op,v:q.op==='filled'?null:(q.v||'')}))};
    const payload=ok.map((r,i)=>Object.assign({},base,{
      code:r.code||null, name:r.name, total:r.total,
      sort_order:lotsM().length+i,mode:LOTMODE}));
    const {error}=await sb.from('lottery_prizes').insert(payload);
    if(error){alert('匯入失敗，詳情看操作紀錄');log('匯入獎項失敗',error.message,true);
      btn.disabled=false;btn.textContent='匯入';return}
    log('匯入抽獎獎項 '+payload.length+' 項',
        (base.draw_mode==='one'?'一個一個抽':'一次抽出')+
        '　資格：'+lotQualText(base)+(base.allow_repeat?'　（已中獎者也可被抽到）':''));
    LIMP=null;LOTQ=[];m.remove();
    await loadLots();render();
  };
}

function lotImpPreview(m){
  const box=m.querySelector('#lipv');
  const rows=(LIMP&&LIMP.rows)||[];
  const btn=m.querySelector('#s');
  if(!rows.length){
    box.innerHTML='<div class="warn"><b>這個檔案裡沒有讀到獎項</b>'+
      '確認第一個工作表有「獎項名稱」這一欄，或直接用範本填。</div>';
    btn.disabled=true;return;
  }
  /* 跟既有獎項同名的先標出來。不擋，只提醒 ——
     「頭獎」在同一場出現兩次通常是誤操作，但也可能是真的分兩輪抽。 */
  const names={};lotsM().forEach(p=>{names[norm(p.name)]=true});
  const okN=rows.filter(r=>r.name).length;
  const trs=rows.map((r,i)=>{
    const dup=r.name&&names[norm(r.name)];
    return '<tr'+(r.name?'':' style="opacity:.45"')+'>'+
      '<td class="nowrap note">'+(i+1)+'</td>'+
      '<td class="nowrap">'+esc(r.code||'')+'</td>'+
      '<td>'+esc(r.name||'（空白，不匯入）')+
        (dup?'<br><span class="note" style="color:#BA7517">已經有同名獎項</span>':'')+'</td>'+
      '<td class="nowrap">'+r.total+' 位</td>'+
      '<td class="note">'+esc(r.err||'')+'</td></tr>';
  }).join('');
  box.innerHTML='<b style="font-size:13px">預覽</b>'+
    '<p class="note" style="margin:4px 0 8px">共 '+rows.length+' 列，'+
      '會新增 '+okN+' 個獎項，附加在現有 '+LOTS.length+' 個之後。</p>'+
    '<div class="tblwrap" style="max-height:34vh"><table><thead><tr>'+
      '<th class="nowrap">列</th><th class="nowrap">編號</th><th>獎項名稱</th>'+
      '<th class="nowrap">名額</th><th>備註</th></tr></thead><tbody>'+trs+'</tbody></table></div>';
  btn.disabled=(okN===0);
}

/* ---- 批次操作 ----
   照賓客名單頁那一套（SEL / selToggle / selClear）的模式，
   但用自己的一組變數 —— 兩頁的 id 是不同資料表的主鍵，
   共用的話從賓客頁切過來會殘留一堆不存在的獎項 id。

   ⚠️ 抽過的獎項不擋，只做防呆：確認視窗把「會連幾筆中獎紀錄一起消失」
      算出來寫在上面。批次刪除沒有逐項確認，話要講得比單筆更清楚。 */
let LSEL={};
function lselCount(){return Object.keys(LSEL).length}
function lselIds(){return Object.keys(LSEL).map(x=>parseInt(x,10))}
function lselClear(){LSEL={};render()}
function lselToggle(id,on){
  if(on)LSEL[id]=1;else delete LSEL[id];
  render();
}
function lselAll(on){
  if(on)lotsM().forEach(p=>{LSEL[p.id]=1});else LSEL={};
  render();
}

async function lselActive(on){
  const ids=lselIds();
  if(!ids.length){alert('請先勾選');return}
  busy((on?'啟用':'停用')+'中…');
  const {error}=await sb.from('lottery_prizes').update({active:on}).in('id',ids);
  busy(null);
  if(error){alert('操作失敗');log('批次'+(on?'啟用':'停用')+'獎項失敗',error.message,true);return}
  log('批次'+(on?'啟用':'停用')+'抽獎獎項 '+ids.length+' 項','update lottery_prizes where id in (...)');
  LSEL={};await loadLots();render();
}

async function lselDelete(){
  const ids=lselIds();
  if(!ids.length){alert('請先勾選');return}
  const ps=LOTS.filter(p=>LSEL[p.id]);
  /* 有中獎紀錄的先算出來。刪除是 cascade，紀錄會一起消失，
     事後查不到誰中過 —— 這是唯一不可逆的地方，要講在前面。 */
  const drawn=ps.filter(p=>lotDone(p.id)>0);
  const nRec=drawn.reduce((a,p)=>a+lotDone(p.id),0);
  let msg='刪除 '+ids.length+' 個獎項？\n\n'+
    ps.map(p=>'　· '+p.name+(lotDone(p.id)?'（已抽出 '+lotDone(p.id)+' 位）':'')).join('\n')+'\n\n';
  if(drawn.length){
    msg+='\u26a0\ufe0f 其中 '+drawn.length+' 個已經抽過，連同 '+nRec+' 筆中獎紀錄會一起消失，\n'+
         '事後查不到誰中過。只是不想再抽的話，改用「停用」。\n\n';
  }
  msg+='此動作不可復原。';
  if(!confirm(msg))return;
  busy('刪除中…');
  const {error}=await sb.from('lottery_prizes').delete().in('id',ids);
  busy(null);
  if(error){alert('刪除失敗');log('批次刪除獎項失敗',error.message,true);return}
  log('批次刪除抽獎獎項 '+ids.length+' 項',
      ps.map(p=>p.name).join('、')+(nRec?'；連同 '+nRec+' 筆中獎紀錄 cascade 刪除':''));
  LSEL={};await loadLots();render();
}

/* =========================================================
   大螢幕抽獎頁　?view=stage&e=活動ID

   這一頁是投影用的，設計原則跟後台完全相反：
     · 一個畫面只做一件事，任何時候只有一顆主要按鈕
     · 字級以場地最後一排看得到為準，所以用 vw 不用 px
     · 重抽與作廢的按鈕平常藏著，滑到那一列才出現 ——
       全場都看著這個畫面，誤觸的代價是現場事故

   不做輪詢、不用 Realtime：按下去的那一刻才撈池子。
   三千人的場子如果掛著即時連線，連線數會爆（見「不要用 Realtime」那一節）。

   權限沿用後台帳號，不另開一組 —— 會按抽獎鍵的人本來就是後台的人。
   ========================================================= */
let STG={prize:null,n:1,rows:[],msg:'',busy:false,anim:false,badev:false,roll:false,
         page:0,pt:null,all:false,rollWid:null,newWid:null};
/* 單頁上限。24 位＝約 4 欄 6 列，字級還有 2.8vw，投影出去看得清楚。
   不做「無限縮小塞滿一頁」—— 看不清的名單等於沒公布，
   現場只會一片問「有沒有我」。 */
const LTPAGE=24;

function stagePrize(){return LOTS.filter(x=>x.id===STG.prize)[0]||null}

/* 剩餘名額 = 名額 - 已佔（含作廢，名額是被佔掉的） */
/* 剩餘名額。
   ⚠️ 用 lotLive（有效中獎）不是 lotDone（所有紀錄，含作廢）。
      兩種作廢的名額語意不同：
        重抽　　換人，替補者已經頂上，名額仍然被佔著
        作廢　　那位不算數，名額要空出來，才能再抽一位補上
      算成 lotDone 的話，作廢完再按抽獎會被當成「超出名額」，
      跳出「要不要把名額從 5 改成 6」—— 名額根本沒有變，
      是那一位不算了。按下去就把設定改壞了。 */
function stageLeft(p){return Math.max(0,(p.total||0)-lotLive(p.id))}

function stagePick(v){
  STG.prize=parseInt(v,10)||null;
  const p=stagePrize();
  /* 一個一個抽固定帶 1；一次抽出帶剩餘名額 */
  STG.n=p?(p.draw_mode==='one'?1:Math.max(1,stageLeft(p))):1;
  /* 切回抽過的獎項要看得到名單，不是空畫面。
     作廢的一起載回來、灰字劃掉 —— 主持人才知道那一位是換過的。
     LOTW 已經照 at 排序，順序就是當時抽出的順序。 */
  STG.rows=p?lotRowsOf(p.id):[];
  STG.anim=false;   /* 載回來的不重播動畫，那是舊資料不是剛抽出的 */
  STG.msg='';STG.page=0;stagePageStop();
  render();
}
function stageNum(v){STG.n=Math.max(1,parseInt(v,10)||1)}

/* 把「抽幾位」重算成目前的剩餘名額。
   ⚠️ 抽完、作廢、重抽之後都要叫一次。
      不重算的話：抽 5 位 → 作廢 1 位 → 框裡還是 5，
      按下去會抽 5 位、直接超額，還跳出「要不要把名額改成 9」。 */
function stageSyncN(p){
  if(!p)return;
  STG.n=(p.draw_mode==='one')?1:Math.max(1,stageLeft(p));
}

/* 抽之前重撈一次名單。
   資格條件可能綁在報到狀態或現場才改的欄位上，
   用進場時載入的舊資料去抽，會抽到已經不符合的人。 */
async function stageReload(){
  /* 連獎項設定一起重撈。名額、抽法、資格條件都可能在後台剛改過，
     用進場時載入的舊設定去抽，抽出來的人是錯的。

     ⚠️ 這是全系統最重的一次操作，而且發生在最不能等的時刻 ——
        大螢幕按下抽獎、全場看著。三千人的場子原本要 5 秒，
        主持人會以為當機。三個地方一起改才降得下來：

        ① 答案直接用 field_id 撈，不用「每 300 位賓客一批」。
           這場的欄位本來就只屬於這場，用 in('field_id', …) 一次就到位，
           請求數從三十幾次降到十幾次。
        ② 分頁平行發送（fetchAllFast），不用一頁等一頁。
        ③ 只取真正用得到的欄，不要 select('*') ——
           賓客表的 token、備註那些欄位在抽獎時完全用不到，
           三千筆的傳輸量差很多。

     ⚠️ 不取消「抽獎前重撈」。那是為了確保用最新的資格條件抽，
        取消的話在後台改完設定、大螢幕沒重整就按下去，抽出來的人是錯的。
        要快，不要不準。 */
  await loadEvents();
  await loadLots(EVID);

  /* 抽獎只需要這幾欄：id 用來抽、name / email / table_no 給大螢幕與名單顯示、
     status 用來排除退回的人 */
  const g=await fetchAllFast(cnt=>sb.from('guests')
    .select('id,name,email,table_no,status,locale', cnt?{count:'exact',head:true}:{})
    .eq('event_id',EVID).order('id'));
  if(g.error)return g.error;
  GUESTS=g.data||[];

  VALS={};
  const fids=FIELDS.map(f=>f.id);
  if(GUESTS.length&&fids.length){
    const v=await fetchAllFast(cnt=>sb.from('guest_field_values')
      .select('guest_id,field_id,value', cnt?{count:'exact',head:true}:{})
      .in('field_id',fids).order('guest_id').order('field_id'));
    if(v.error)return v.error;
    /* 用 field_id 撈會連同一場其他活動的賓客一起回來？不會 ——
       欄位是綁活動的，別場的賓客不會有這場欄位的答案。 */
    (v.data||[]).forEach(r=>{VALS[vKey(r.guest_id,r.field_id)]=r.value});
  }
  return null;
}

/* 中獎名字的字級。單位 vw，數字是實測投影後最後一排看得到的下限。 */
/* 一列排幾個。挑的原則是「最後一列盡量填滿」——
   10 位排 5×2 比 4×4×2 好看，9 位排 3×3 比 5+4 好看。
   欄數上限 6：再多字就小到投影看不見了。 */
function ltCols(n){
  if(n<=1) return 1;
  if(n<=2) return 2;
  if(n<=3) return 3;
  if(n<=4) return 2;   /* 2×2 */
  if(n<=6) return 3;   /* 3×2 */
  if(n<=8) return 4;   /* 4×2 */
  if(n<=9) return 3;   /* 3×3 */
  if(n<=10)return 5;   /* 5×2 */
  if(n<=12)return 4;   /* 4×3 */
  if(n<=15)return 5;   /* 5×3 */
  if(n<=16)return 4;   /* 4×4 */
  if(n<=18)return 6;   /* 6×3 */
  if(n<=20)return 5;   /* 5×4 */
  return 6;            /* 24 → 6×4 */
}

/* 名字的視覺寬度，單位是「中文字」。
   英文與數字大約是中文的 0.62 倍（700 字重），全形標點算 1。
   不用 canvas 量測 —— 為了一個字級去建 canvas context 太重，
   而且投影用的字體固定，估算誤差看不出來。 */
/* 一格的內容寬度，單位 vw。

   ⚠️ 兩個當初漏掉的東西，就是名字被切成「Emily Wa…」的原因：
        · .ltbody 左右各 3vw 的留白（所以基準是 94 不是 100）—— 這個有算到
        · .ltone 自己左右各 1vw 的內距 —— 這個漏了，等於每格少 2vw
      再加上英文字寬原本用 0.56 估，那是一般字重的值，
      名字是 700 粗體，實際更寬。 */
function ltCellW(cols){
  return (94-(cols-1)*2)/cols - 2;
}

/* 這一格該用多大的字。
   ⚠️ 每一格各自算，不是整頁統一 ——
      統一的話一個「Emily Wang」會把整頁的中文名字一起拉小，
      十個人裡九個是中文名，為了一個人全部縮一階並不划算。 */
function ltCellFont(txt, base, cellW){
  /* ⚠️ 有空格的名字可以換行，所以瓶頸不是整串的寬度，
     而是「最長的那一段」。
     「Nicholas Thompson」整串是 17 個字元，硬要塞進一格會被壓到
     只剩旁邊中文名的一半；但它可以斷成兩行，
     真正塞不下的只有「Nicholas」8 個字元，字級就能跟其他人一樣。
     中文名沒有空格，走的還是整串的寬度。 */
  const t=String(txt==null?'':txt);
  const parts=t.split(/\s+/).filter(Boolean);
  const w=(parts.length>1)?Math.max.apply(null,parts.map(ltW)):ltW(t);
  const fit=cellW/(w*1.06);             /* 留 6% 餘裕，字體渲染會比估算略寬 */
  return Math.max(0.9, Math.min(base, fit));
}

function ltW(str){
  let w=0;
  const t=String(str==null?'':str);
  /* 0.62 是 700 字重無襯線體的英數平均值。原本用 0.56（一般字重）會低估，
     估太小就會切字；寧可估寬一點讓字略小，也不要把名字切掉。 */
  for(let i=0;i<t.length;i++)w+=(t.charCodeAt(i)>255)?1:0.62;
  return w||1;
}

/* 字級同時受兩件事限制，取小的那個：
     ① 人數　　位數越多字越小（ltFont）
     ② 欄寬　　最長的名字要塞得進一格
   原本只看人數，所以「Emily Wang」這種長名字會滿出格子。 */
function ltFit(view,cols){
  let mx=1;
  for(let i=0;i<view.length;i++){
    if(view[i].__roll)continue;
    const nm=lotShow(view[i].gid);
    mx=Math.max(mx,ltW(nm.a));
  }
  const cell=(94-(cols-1)*2)/cols;          /* 每格寬度，vw */
  const byWidth=cell/(mx*1.04);             /* 留 4% 餘裕 */
  const byCount=parseFloat(ltFont(view.length))||3.4;
  return Math.max(1.1,Math.min(byWidth,byCount)).toFixed(2)+'vw';
}

function ltFont(n){
  if(n<=1) return '7.5vw';
  if(n<=2) return '5.8vw';
  if(n<=4) return '4.6vw';
  if(n<=8) return '3.6vw';
  if(n<=15)return '2.8vw';
  if(n<=30)return '2.1vw';
  return '1.6vw';
}

/* 抽選滾動動畫。
   ⚠️ 結果在這之前就已經由資料庫定案了，這一段純粹是給現場看的。
      不能反過來「滾完才決定抽誰」—— 那等於把抽選交給前端，
      重複點擊、斷線重連都會出事。

   減速做法：前 68% 的時間固定 55 毫秒換一次，
   後段把間隔從 55 拉到 260，眼睛才會覺得「慢下來、要停了」。
   等速停止看起來像當機。 */
function stageRoll(pool, ms, base, cellW){
  /* 回傳一個控制器而不是單純的 Promise：
     抽選結果一回來就餵進 ctl.final，滾動會在最後一格停在那個人身上。

     ⚠️ 為什麼非這樣不可
        原本是「隨機滾 → 時間到停 → 另外揭曉結果」，
        於是畫面會停在 A、下一瞬間跳成 B。
        現場看起來就是「本來要抽到 A，被換掉了」—— 這是會被質疑作票的畫面。
        改成滾動的最後一次就畫上真正的中獎者，慢下來、停住，
        停住的那個就是答案，不會再跳。

     ⚠️ 結果還是資料庫決定的，這裡只是把它畫在正確的時間點。
        絕不能反過來讓滾動決定抽誰。 */
  const ctl={final:null, abort:false, p:null};
  ctl.p=new Promise(res=>{
    if(!ms||!pool.length){res();return}
    const t0=Date.now();
    function paint(gid){
      const nm=lotShow(gid);
      const a=document.getElementById('ltrA');
      const b=document.getElementById('ltrB');
      /* 每換一個名字就重算字級。滾動的內容是動態的，
         用固定字級的話，滾到長名字那一瞬間會衝出格子。 */
      if(a){
        a.textContent=nm.a;
        if(base&&cellW)a.style.fontSize=ltCellFont(nm.a,base,cellW).toFixed(2)+'vw';
      }
      if(b){
        b.textContent=nm.b||'';
        if(base&&cellW)b.style.fontSize=
          Math.min(ltCellFont(nm.a,base,cellW)*0.42,
                   ltCellFont(nm.b||'',base*0.42,cellW)).toFixed(2)+'vw';
      }
    }
    function rand(){paint(pool[Math.floor(Math.random()*pool.length)])}
    function tick(){
      if(ctl.abort){res();return}
      const el=Date.now()-t0;
      if(el>=ms){
        if(ctl.final!=null){
          /* ⚠️ 畫上正確的人之後要「停住」給人看見。
             畫完立刻 resolve 的話，外面馬上 render() 成名單畫面，
             這一格只存在零毫秒 —— 觀眾看到的仍然是前一次隨機跳的名字，
             等於這個修正完全沒發生。停 700 毫秒，眼睛才認得出它停下來了。 */
          paint(ctl.final);
          setTimeout(res,700);
          return;
        }
        /* 時間到了但結果還沒回來（網路慢）。
           絕不能停在一個隨機名字上等著 —— 那就是「停住又跳」的畫面。
           繼續慢速滾，等結果到了再落定。 */
        rand();setTimeout(tick,220);return;
      }
      rand();
      const p=el/ms;
      const gap=p<0.68?55:(55+(p-0.68)/0.32*205);
      setTimeout(tick,gap);
    }
    /* 等 render() 把滾動容器畫出來再開始，不然抓不到那兩個 id */
    setTimeout(tick,30);
  });
  return ctl;
}

/* 抽完自動翻一輪給全場看，翻到最後一頁就停住。
   不做無限循環 —— 名單會一直動，主持人念名字時對不到頁。
   之後要回頭看用下面的頁碼手動點。 */
function stagePageStop(){
  if(STG.pt){clearTimeout(STG.pt);STG.pt=null}
}
function stagePageAuto(){
  stagePageStop();
  const total=Math.ceil(STG.rows.length/LTPAGE);
  if(total<2)return;
  /* ⚠️ 第一頁要等浮出跑完才能翻。
     24 位 × 800 毫秒的浮出間隔是 19 秒，固定 6 秒就翻的話，
     名字還在一個一個冒出來就被翻走了 —— 全場只看到一半。
     第二頁之後沒有浮出動畫（那是剛抽出時才播的），所以固定停 6 秒。 */
  const e=ev()||{};
  const gap=e.stage_gap||800;
  const hold=(e.stage_page==null?6000:e.stage_page);
  /* 第一頁要等浮出跑完再加停留時間 —— 24 位 × 800ms 就是 19 秒，
     不等的話名字還在冒出來就被翻走。第二頁之後沒有浮出動畫，直接停 hold。 */
  const first=Math.min(STG.rows.length,LTPAGE)*gap+hold;
  const step=()=>{
    if(STG.page>=total-1){stagePageStop();return}
    STG.page++;render();
    STG.pt=setTimeout(step,hold);
  };
  STG.pt=setTimeout(step,first);
}
function stagePageGo(i){
  stagePageStop();          /* 手動一點，自動翻頁就交出控制權 */
  STG.page=i;render();
}

async function stageDraw(){
  const p=stagePrize();
  if(!p||STG.busy)return;
  const want=STG.n;
  const left=stageLeft(p);

  /* 超過名額不擋，問一句就好 —— 現場臨時加抽是常態，
     擋下來反而逼他們回後台改設定，全場等著看。 */
  if(want>left){
    const nt=lotLive(p.id)+want;
    if(!confirm('「'+p.name+'」設定名額 '+p.total+' 位，目前有效 '+lotLive(p.id)+' 位，\n'+
      '這次要抽 '+want+' 位會超出 '+(want-left)+' 位。\n\n'+
      '按確定：照抽，並把名額同步改為 '+nt+' 位。\n按取消：不抽。'))return;
    await sb.from('lottery_prizes').update({total:nt}).eq('id',p.id);
  }

  STG.busy=true;STG.msg='';STG.all=false;stagePageStop();render();

  const t0=Date.now();
  const e1=await stageReload();
  const ms=Date.now()-t0;
  if(e1){STG.busy=false;STG.roll=false;STG.msg='讀取名單失敗，請重試';
    log('抽獎前重載名單失敗',e1.message,true);render();return}

  const p2=stagePrize();     /* 重撈後獎項物件換了新的，資格條件要用新的算 */
  if(!p2){
    STG.busy=false;STG.roll=false;
    STG.msg='這個獎項剛剛被停用或刪除了，請重新選擇。';render();return;
  }
  const pool=lotPool(p2);
  if(!pool.length){
    STG.busy=false;STG.roll=false;
    STG.msg='沒有人符合這個獎項的資格條件，請回後台確認設定。';render();return;
  }
  /* 資格過了，但人都已經中過獎。這兩種空池子的原因完全不同，
     訊息混在一起的話，現場會往錯的方向去查設定。 */
  if(lotDrawable(p2)===0){
    STG.busy=false;STG.roll=false;
    STG.msg='符合資格的 '+pool.length+' 位都已經中過獎了。'+
      '要讓他們有機會，請到後台把這個獎項的「已中過獎的人也可以被抽到」打勾。';
    render();return;
  }

  /* 先把畫面切到滾動狀態，再送出抽選。
     順序反過來的話，網路慢的時候畫面會呆住兩秒才開始滾。 */
  STG.roll=true;
  /* 滾動時也不清空，前面抽出的名字要留在畫面上 */
  render();
  const rollMs=(ev()||{}).stage_roll;
  /* 一次抽出是整畫面滾動，格寬幾乎是整個舞台；
     一個一個抽是接在名單後面的一格，尺寸要跟那一頁的格子一致。 */
  const oneM=(p2.draw_mode==='one');
  const nCell=oneM?(STG.rows.length+1):STG.n;
  const rCols=oneM?ltCols(Math.min(nCell,LTPAGE)):1;
  const roll=stageRoll(pool,(rollMs==null?2500:rollMs),
    parseFloat(ltFont(Math.min(nCell,LTPAGE)))||3.4,
    oneM?ltCellW(rCols):90);

  const r=await sb.rpc('lottery_draw',{p_prize_id:p.id,p_count:want,p_pool:pool});
  if(r.error){roll.abort=true;STG.busy=false;STG.roll=false;STG.msg='抽選失敗，請重試';
    log('抽獎失敗',r.error.message,true);render();return}
  const d=r.data||{};
  if(!d.ok){
    roll.abort=true;STG.busy=false;STG.roll=false;
    STG.msg=(d.reason==='prize_not_found')?'這個獎項已被停用或刪除':'抽選未完成：'+(d.reason||'未知原因');
    render();return;
  }

  const ids=(d.ids||[]).map(Number);
  /* 把真正的第一位餵給滾動，讓它停在這個人身上。
     多位時停在第一位，接著逐條浮出，第一格的名字是連續的、不會換。 */
  roll.final=ids.length?ids[0]:null;
  if(!ids.length)roll.abort=true;
  await roll.p;
  STG.roll=false;
  await loadLots();
  /* seq 讓每次抽獎的動畫重新開始 —— 不換 key 的話瀏覽器會沿用舊動畫，
     第二次抽名字會直接出現、沒有逐條浮出的效果 */
  STG.anim=true;   /* 只有剛抽完這一次要逐條浮出 */
  const fresh=ids.map(id=>{
    const w=LOTW.filter(x=>x.guest_id===id&&x.prize_id===p.id&&!x.voided)[0];
    return {gid:id,wid:w?w.id:null,voided:false};
  });
  /* 一個一個抽要接在前面那幾位後面，不能清空重來 ——
     清空的話全場會以為前面抽的作廢了。 */
  /* ⚠️ 一律累加，兩種抽法都是。
     原本一次抽出是整批換掉，於是「抽 5 位 → 作廢 1 位 → 補抽 1 位」時，
     畫面只剩新抽的那 1 位，前面 4 位全部消失 ——
     現場看起來像整組作廢重抽了。
     第一次抽時 rows 本來就是空的，累加的結果一樣。 */
  STG.rows=STG.rows.concat(fresh);
  STG.msg=d.short?('符合資格的人只剩 '+ids.length+' 位，少於要抽的 '+want+' 位。'):'';
  STG.busy=false;
  /* 一個一個抽是累加的，翻到最後一頁才看得到剛抽出的那位 */
  /* 停在剛抽出那幾位所在的頁。全新一輪時就是第一頁，
     補抽時則是最後一頁 —— 新的人在那裡。 */
  STG.page=Math.max(0,Math.ceil((STG.rows.length-fresh.length+1)/LTPAGE)-1);
  stageSyncN(p2);
  log('抽獎：'+p.name+' 抽出 '+ids.length+' 位',
      '池子 '+pool.length+' 人　重撈耗時 '+ms+' ms'+(d.short?'（池子不足，短少）':''));
  render();
  if(p.draw_mode!=='one')stagePageAuto();
}

async function stageRedraw(wid){
  const p=stagePrize();if(!p||STG.busy)return;
  const i=STG.rows.findIndex(x=>x.wid===wid);
  if(i<0)return;
  const nm=lotShow(STG.rows[i].gid);
  if(!confirm('重抽「'+nm.a+(nm.b?'（'+nm.b+'）':'')+'」？\n\n'+
    '這一位會被標記作廢，並立刻補抽一位替上。\n'+
    '⚠️ 他不會回到抽獎池，後續一般獎項也抽不到他。'))return;
  const reason=prompt('作廢原因（可留空，會寫進紀錄）：','人不在場');
  STG.busy=true;STG.all=false;stagePageStop();

  /* 重抽也要滾動，全場正在看那一格。
     ⚠️ 只在那一格上滾，不切成整畫面的滾動狀態 ——
        其他中獎者會消失再出現，看起來像全部重抽了。 */
  STG.rollWid=wid;STG.newWid=null;
  render();

  const rollMs=(ev()||{}).stage_roll;
  /* 重抽是就地換那一格，尺寸就是目前這一頁的格子 */
  const rCols=ltCols(Math.min(STG.rows.length,LTPAGE));
  const roll=stageRoll(lotPool(p),(rollMs==null?2500:rollMs),
    parseFloat(ltFont(Math.min(STG.rows.length,LTPAGE)))||3.4,
    ltCellW(rCols));

  const r=await sb.rpc('lottery_redraw',{p_winner_id:wid,p_pool:lotPool(p),p_reason:reason||null});
  if(r.error||!(r.data&&r.data.ok)){
    roll.abort=true;STG.busy=false;STG.rollWid=null;STG.msg='重抽失敗，請重試';
    log('重抽失敗',(r.error&&r.error.message)||JSON.stringify(r.data),true);render();return;
  }
  const nd=(r.data.redrawn&&r.data.redrawn.ids)||[];
  /* 停在補上來的那個人身上。沒人可補就中止滾動，直接顯示作廢 */
  roll.final=nd.length?Number(nd[0]):null;
  if(!nd.length)roll.abort=true;
  await roll.p;
  STG.rollWid=null;

  await loadLots();
  if(nd.length){
    const gid=Number(nd[0]);
    const w=LOTW.filter(x=>x.guest_id===gid&&x.prize_id===p.id&&!x.voided)[0];
    /* 原地換成新名字。被換掉那筆在資料庫已標成 redraw，
       重整或切回這個獎項時不會再載回來，畫面前後一致。 */
    STG.rows[i]={gid:gid,wid:w?w.id:null,voided:false};
    /* 只讓這一格浮出來。開全域 anim 的話整批重播，看起來像全部重抽了 */
    STG.newWid=w?w.id:null;
    STG.msg='';
  }else{
    STG.rows[i].voided=true;
    STG.msg='已作廢，但池子裡沒有人可以補上了。';
  }
  STG.busy=false;
  stageSyncN(stagePrize());
  log('重抽：'+p.name,'作廢 winner id='+wid+(nd.length?'，補抽 guest id='+nd[0]:'，無人可補'));
  render();
}

async function stageVoid(wid){
  if(STG.busy)return;
  const i=STG.rows.findIndex(x=>x.wid===wid);
  if(i<0)return;
  const nm=lotShow(STG.rows[i].gid);
  if(!confirm('作廢「'+nm.a+(nm.b?'（'+nm.b+'）':'')+'」？\n\n'+
    '不補人，這個獎項這一輪就少一位。\n'+
    '⚠️ 他不會回到抽獎池，後續一般獎項也抽不到他。'))return;
  const reason=prompt('作廢原因（可留空，會寫進紀錄）：','人不在場');
  STG.busy=true;render();
  const r=await sb.rpc('lottery_void',{p_winner_id:wid,p_reason:reason||null});
  if(r.error||!(r.data&&r.data.ok)){
    STG.busy=false;STG.msg='作廢失敗，請重試';
    log('作廢失敗',(r.error&&r.error.message)||JSON.stringify(r.data),true);render();return;
  }
  await loadLots();
  STG.rows[i].voided=true;
  STG.busy=false;
  stageSyncN(stagePrize());
  log('作廢中獎：winner id='+wid,'不補人');
  render();
}

function stageFull(){
  const el=document.documentElement;
  if(document.fullscreenElement){document.exitFullscreen();return}
  if(el.requestFullscreen)el.requestFullscreen();
}

function renderStage(){
  if(!USER)return '<div class="ltwrap"><div class="ltbody">'+
    '<div class="ltempty">請先在後台登入，再重新開啟這個連結。<br>'+
    '大螢幕沿用後台帳號，沒有另一組密碼。</div></div></div>';
  const e=ev();
  if(!e)return '<div class="ltwrap"><div class="ltbody"><div class="ltempty">'+
    (STG.badev?'網址裡的活動編號有誤，或這個帳號看不到這場活動。<br>請回後台「抽獎設定」按「開啟大螢幕」。'
              :'讀取中…')+'</div></div></div>';

  /* ⚠️ 大螢幕只列電子抽獎的獎項。紙本的獎項是在台下抽完再登錄的，
     出現在這裡的話會被再抽一次。 */
  const act=LOTS.filter(x=>x.active&&(x.mode||'draw')==='draw');
  const opts='<option value="">— 選擇獎項 —</option>'+
    act.map(p=>'<option value="'+p.id+'"'+(STG.prize===p.id?' selected':'')+'>'+
      esc(p.name)+'（已抽 '+lotLive(p.id)+' / '+p.total+'）</option>').join('');
  const p=stagePrize();
  const gap=e.stage_gap||800;

  let body;
  if(!act.length){
    body='<div class="ltmain"><div class="ltempty">這場還沒有啟用中的抽獎獎項。<br>回後台「抽獎設定」新增。</div></div>';
  }else if(!p){
    body='<div class="ltmain"><div class="ltempty">從下方選一個獎項開始。</div></div>';
  }else{
    /* ⚠️ render() 每次都重建整個 app.innerHTML，動畫因此會跟著重跑。
       不擋的話，按一次重抽全場名字會整批重新浮出一遍 —— 現場看起來像當機。
       所以只有剛抽完那一次帶 animation-delay，其餘重繪直接定格。 */
    const an=STG.anim;
    /* 一個一個抽的滾動格接在名單後面，當成多出來的一格。
       整畫面切成滾動容器的話，前面已經抽出的人會整批消失、滾完再冒出來，
       現場看起來像前面那幾位被作廢重抽了。 */
    const oneRoll=(STG.roll&&p.draw_mode==='one');
    const rowsAll=oneRoll?STG.rows.concat([{__roll:1}]):STG.rows;

    /* 超過一頁就切頁。頁內索引用來算浮出延遲，
       不能用全域索引 —— 第三頁的第一位會延遲 48 秒才出現。 */
    const tp=Math.max(1,Math.ceil(rowsAll.length/LTPAGE));
    if(oneRoll)STG.page=tp-1;          /* 正在滾的那一格一定要看得到 */
    if(STG.page>tp-1)STG.page=tp-1;
    if(STG.page<0)STG.page=0;
    const view=rowsAll.slice(STG.page*LTPAGE,(STG.page+1)*LTPAGE);
    const cols=ltCols(view.length);
    /* base：依人數的字級上限。cellW：一格容得下多寬。
       每一格取兩者較小的那個，所以中文名字維持大、長英文名字自己縮。 */
    const base=parseFloat(ltFont(view.length))||3.4;
    const cellW=ltCellW(cols);
    const fs=base.toFixed(2)+'vw';   /* 只當作滾動格與 CSS 的預設值 */
    const list=view.map((r,i)=>{
      /* 追加的滾動格。跟重抽共用同一組 id，同時只會有一處在滾 */
      if(r.__roll){
        return '<div class="ltone ltrolling" style="animation:none;opacity:1;transform:none">'+
          '<div class="ltrsec ltsec" id="ltrB">&nbsp;</div>'+
          '<div class="ltrname ltname" id="ltrA">&nbsp;</div></div>';
      }
      /* 這一格正在重抽：畫成滾動容器，用跟整批抽選同一組 id，
         stageRoll 直接改 textContent，不必再寫一份滾動邏輯。
         同時只會有一格在滾，id 不會重複。 */
      if(r.wid&&r.wid===STG.rollWid){
        return '<div class="ltone ltrolling" style="animation:none;opacity:1;transform:none">'+
          '<div class="ltrsec ltsec" id="ltrB">&nbsp;</div>'+
          '<div class="ltrname ltname" id="ltrA">&nbsp;</div></div>';
      }
      const nm=lotShow(r.gid);
      const fz=ltCellFont(nm.a,base,cellW);
      let st;
      if(an)                              st='animation-delay:'+(i*gap)+'ms';
      else if(r.wid&&r.wid===STG.newWid)  st='animation-delay:0ms';   /* 剛換上的那一位 */
      else                                st='animation:none;opacity:1;transform:none';
      return '<div class="ltone'+(r.voided?' gone':'')+'" style="'+st+'">'+
        /* 沒填小字也要留這一行的高度，否則那一格的名字會整個往上跑，
           跟同一列的其他人對不齊 —— 十個人裡有兩三個沒填部門是常態。 */
        '<div class="ltsec" style="font-size:'+
          ltCellFont(nm.b||'\u3000',base*0.42,cellW).toFixed(2)+'vw">'+
          (nm.b?esc(nm.b):'&nbsp;')+'</div>'+
        '<div class="ltname" style="font-size:'+fz.toFixed(2)+'vw">'+esc(nm.a)+'</div>'+
        (r.wid&&!r.voided?'<div class="ltact">'+
          '<button onclick="stageRedraw('+r.wid+')">重抽</button>'+
          '<button onclick="stageVoid('+r.wid+')">作廢</button></div>':'')+
        (r.voided?'<div class="ltsec">已作廢</div>':'')+
      '</div>';
    }).join('');
    /* 字級看「這一頁幾位」，不是總人數 —— 100 位分五頁，
       每頁還是 20 位，沒有理由縮到看不見。 */
    /* ⚠️ 頁碼列要獨立出來，不能跟名單放在同一個置中的容器裡。
       每一頁的高度不一樣（有些名字會換兩行），
       整塊在 ltmain 裡置中的話，頁碼會跟著上下跑 —— 現場看起來像在跳。 */
    let mid, pgHtml='';
    if(STG.roll&&p.draw_mode!=='one'){
      /* 一次抽出：整畫面滾動。字級固定用「抽幾位」去算，不是用已經出來幾位，
         不然滾完切到名單時字會忽然縮一階，看起來像閃了一下。 */
      const rfs=ltFont(STG.n);
      mid='<div class="ltroll">'+
        '<div class="ltrsec" id="ltrB" style="font-size:calc('+rfs+' * .42)">&nbsp;</div>'+
        '<div class="ltrname" id="ltrA" style="font-size:'+rfs+'">&nbsp;</div>'+
        '<div class="ltrhint">抽選中</div></div>';
    }else if(rowsAll.length){
      let pg='';
      if(tp>1&&!STG.roll){          /* 滾動中不顯示頁碼，畫面上只該有一件事在動 */
        const btns=[];
        for(let i=0;i<tp;i++){
          btns.push('<button class="'+(i===STG.page?'on':'')+'" onclick="stagePageGo('+i+')">'+(i+1)+'</button>');
        }
        pg='<div class="ltpg">'+
          '<button onclick="stagePageGo('+Math.max(0,STG.page-1)+')">‹</button>'+
          btns.join('')+
          '<button onclick="stagePageGo('+Math.min(tp-1,STG.page+1)+')">›</button>'+
          '<span class="ltpgn">共 '+STG.rows.length+' 位　·　第 '+(STG.page+1)+' / '+tp+' 頁'+
            (STG.pt?('　·　自動翻頁中（每 '+
              Math.round(((ev()||{}).stage_page==null?6000:ev().stage_page)/1000)+' 秒）'):'')+
            '</span></div>';
      }
      mid='<div class="ltlist" style="--ltfs:'+fs+';--ltcols:'+cols+'">'+list+'</div>';
      pgHtml=pg;
    }else{
      mid='<div class="ltempty">按右下角「開始抽獎」。</div>';
    }
    body='<div class="lthead">'+
        '<div class="lttitle">'+esc(p.name)+'</div>'+
        '<div class="ltsub">'+(p.note?esc(p.note)+'　·　':'')+
          '名額 '+p.total+' 位　·　已抽出 '+lotLive(p.id)+' 位'+
          (p.draw_mode==='one'?'　·　一個一個抽':'')+'</div>'+
      '</div>'+
      '<div class="ltmain">'+mid+
        (STG.msg?'<div class="ltmsg">'+esc(STG.msg)+'</div>':'')+'</div>'+
      (pgHtml?'<div class="ltfoot">'+pgHtml+'</div>':'');
  }

  STG.anim=false;STG.newWid=null;   /* 字串已經組好，清掉不影響這一次的輸出 */
  const nAll=p?LOTW.filter(w=>w.prize_id===p.id).length:0;
  return '<div class="ltwrap">'+
    '<div class="ltbody">'+body+'</div>'+
    '<div class="lttop">'+
      '<select onchange="stagePick(this.value)"'+(STG.busy?' disabled':'')+'>'+opts+'</select>'+
      (p?'<span style="font-size:13px;color:#9A8FB5">抽</span>'+
        '<input type="number" min="1" value="'+STG.n+'" oninput="stageNum(this.value)"'+
        ((STG.busy||p.draw_mode==='one')?' disabled':'')+'>'+
        '<span style="font-size:13px;color:#9A8FB5">位</span>'+
        (p.draw_mode==='one'?'<span style="font-size:12px;color:#6E6485">（一個一個抽）</span>':'')
       :'')+
      '<span class="ltsp"></span>'+
      (nAll?'<button class="ltbtn" onclick="stageAllOpen()">完整名單 '+nAll+' 位</button>':'')+
      '<button class="ltbtn" onclick="lotSync()" title="重新讀取後台的獎項與設定">重新載入</button>'+
      '<button class="ltbtn" onclick="stageFull()">全螢幕</button>'+
      (p?'<button class="ltbtn go" onclick="stageDraw()"'+(STG.busy?' disabled':'')+'>'+
        (STG.busy?'抽選中…':'開始抽獎')+'</button>':'')+
    '</div>'+
    (STG.all?renderStageAll():'')+
  '</div>';
}

async function bootStage(){
  const id=parseInt(qp('e'),10);
  sb.auth.getSession().then(async ({data})=>{
    USER=data&&data.session?data.session.user:null;
    AUTHREADY=true;
    if(!USER){render();return}
    /* ⚠️ 一定要先 loadEvents()。
       ev() 是從 EVENTS 陣列裡找，而 loadEvent(id) 只載 form_fields / guests /
       答案，不會去填 EVENTS —— 後台是先經過活動總覽頁才進單場，所以那邊沒事，
       大螢幕是直接開網址進來的，少這一步 ev() 永遠是 undefined，
       畫面就會停在「網址裡的活動編號有誤」。
       大螢幕還要靠 ev() 讀 stage_f1 / stage_f2 / stage_gap，不能省。 */
    await loadEvents();
    if(id){await loadEvent(id);await loadLots(id)}
    if(!ev())STG.badev=true;
    render();
  });
  render();
}

let ITEMS=[];
const QOP={filled:'有填值',gte:'數字大於等於',eq:'等於指定選項'};

async function loadItems(){
  const {data,error}=await sb.from('redeem_items')
    .select('*').eq('event_id',EVID).order('sort_order').order('id');
  if(error){ERR=error;log('讀取兌換品項失敗',error.message,true);return}
  ITEMS=data||[];
  log('讀取兌換品項','select from redeem_items → '+ITEMS.length+' 項');
}

/* 把資格條件翻成人看得懂的一句話。後台與兌換頁共用這一個函式，
   不要兩邊各寫一套 —— 現場被擋下時要看到跟後台一樣的說法 */
function qualText(it){
  if(!it.qual_field_id)return '全員可領';
  const f=FIELDS.filter(x=>x.id===it.qual_field_id)[0];
  const fn=f?((f.t&&f.t.zh)||f.label):('欄位#'+it.qual_field_id);
  if(it.qual_op==='filled')return fn+' 有填值';
  if(it.qual_op==='gte')   return fn+' ≥ '+(it.qual_value||'0');
  if(it.qual_op==='eq'){
    let vt=it.qual_value||'';
    if(f&&Array.isArray(f.options)){
      const o=f.options.filter(x=>x.key===it.qual_value)[0];
      if(o)vt=(o.t&&o.t.zh)||o.key;
    }
    return fn+' ＝ '+vt;
  }
  return '全員可領';
}

/* 資格條件三個下拉的連動。
   只切 display，絕不重繪 —— 重繪會把已經打好的名稱與組數清空。
   這個坑在「重繪抹掉使用者操作」那一章已經踩過五次。 */
function itemQualPaint(){
  const fid=document.getElementById('iqField');
  const op =document.getElementById('iqOp');
  const num=document.getElementById('iqNum');
  const sel=document.getElementById('iqSel');
  const opw=document.getElementById('iqOpWrap');
  if(!fid||!op||!num||!sel||!opw)return;
  const hasF=!!fid.value;
  opw.style.display=hasF?'':'none';
  num.style.display=(hasF&&op.value==='gte')?'':'none';
  sel.style.display=(hasF&&op.value==='eq')?'':'none';
  if(hasF&&op.value==='eq'){
    const f=FIELDS.filter(x=>String(x.id)===fid.value)[0];
    const opts=(f&&Array.isArray(f.options))?f.options:[];
    const sv=document.getElementById('iqSelV');
    if(sv){
      const cur=sv.value;
      sv.innerHTML=opts.length
        ? opts.map(o=>'<option value="'+esc(o.key)+'">'+esc((o.t&&o.t.zh)||o.key)+'</option>').join('')
        : '<option value="">（這個欄位沒有選項）</option>';
      if(cur)sv.value=cur;
    }
  }
}

function itemForm(id){
  const it=id?ITEMS.filter(x=>x.id===id)[0]:null;
  const fopts='<option value="">（全員可領，不限制）</option>'+
    FIELDS.map(f=>'<option value="'+f.id+'"'+
      (it&&it.qual_field_id===f.id?' selected':'')+'>'+
      esc((f.t&&f.t.zh)||f.label)+'</option>').join('');
  const oopts=Object.keys(QOP).map(k=>'<option value="'+k+'"'+
      (it&&it.qual_op===k?' selected':'')+'>'+QOP[k]+'</option>').join('');
  const m=modal('<h3>'+(it?'編輯品項':'新增兌換品項')+'</h3>'+
    '<label class="f"><span>品項名稱（必填）</span>'+
      '<input type="text" id="iName" value="'+esc(it?it.name:'')+'" placeholder="酒券"></label>'+
    '<label class="f"><span>份量說明</span>'+
      '<input type="text" id="iNote" value="'+esc(it&&it.note?it.note:'')+'" placeholder="3 張／份"></label>'+
    '<p class="note" style="margin:-6px 0 12px">只是給人看的文字，系統不參與計算。'+
      '改成一人 4 張時只要改這行與組數，不會動到已發出的紀錄。</p>'+
    '<label class="f"><span>總組數</span>'+
      '<input type="number" id="iTotal" min="0" value="'+(it?it.total:0)+'"></label>'+
    '<p class="note" style="margin:-6px 0 14px">以「組」為單位。60 張酒券一人 3 張就填 20。'+
      (it?'　目前已發 '+it.used+' 組，總組數不能小於這個數。':'')+'</p>'+
    '<div class="card plain" style="padding:12px"><b style="font-size:13px">領取資格</b>'+
      '<label class="f" style="margin-top:8px"><span>依據欄位</span>'+
        '<select id="iqField" onchange="itemQualPaint()">'+fopts+'</select></label>'+
      '<div id="iqOpWrap"><label class="f"><span>判斷方式</span>'+
        '<select id="iqOp" onchange="itemQualPaint()">'+oopts+'</select></label>'+
        '<label class="f" id="iqNum"><span>數值</span>'+
          '<input type="number" id="iqNumV" value="'+esc(it&&it.qual_op==='gte'?(it.qual_value||''):'')+'"></label>'+
        '<label class="f" id="iqSel"><span>指定選項</span><select id="iqSelV"></select></label></div>'+
      '<p class="note" style="margin:6px 0 0">例：年資滿 5 年送紀念品 → 依據欄位選「年資」、'+
        '判斷方式選「數字大於等於」、數值填 5。</p></div>'+
    '<div class="foot"><button class="btn sec" id="c">取消</button>'+
      '<button class="btn" id="s">儲存</button></div>');
  itemQualPaint();
  const sv=m.querySelector('#iqSelV');
  if(it&&it.qual_op==='eq'&&sv){sv.value=it.qual_value||'';}
  m.querySelector('#c').onclick=()=>m.remove();
  m.querySelector('#s').onclick=async()=>{
    const name=m.querySelector('#iName').value.trim();
    if(!name){alert('請輸入品項名稱');return}
    const total=parseInt(m.querySelector('#iTotal').value,10)||0;
    if(it&&total<it.used){alert('總組數不能小於已發出的 '+it.used+' 組。');return}
    const fid=m.querySelector('#iqField').value;
    const op =m.querySelector('#iqOp').value;
    const d={event_id:EVID,name:name,
      note:m.querySelector('#iNote').value.trim()||null,total:total,
      qual_field_id:fid?parseInt(fid,10):null,
      qual_op:fid?op:null,
      qual_value:!fid?null:(op==='gte'?String(m.querySelector('#iqNumV').value||'0')
                          :(op==='eq'?(m.querySelector('#iqSelV').value||null):null))};
    m.querySelector('#s').disabled=true;
    const r=it? await sb.from('redeem_items').update(d).eq('id',it.id)
              : await sb.from('redeem_items').insert(Object.assign({sort_order:ITEMS.length},d));
    if(r.error){alert('儲存失敗');log('儲存兌換品項失敗',r.error.message,true);
      m.querySelector('#s').disabled=false;return}
    log((it?'更新':'新增')+'兌換品項：'+name,'資格：'+qualText(d)+'　總組數 '+total);
    m.remove();await loadItems();render();

/* 為什麼不直接用 token
   token 是 6–64 字元的隨機字串（k7Fq2mXpL9wR），掃碼完全沒問題，
   但掃不到要改用打的時候沒有人打得出來、也唸不出來。
   券號存在的唯一理由，是讓「掃不到就用打的」那一道備援真的可用。 */
function tkDone(){return GUESTS.filter(g=>g.ticket_no).length}
function tkTodo(){return GUESTS.filter(g=>!g.ticket_no).length}

function ticketBox(){
  const done=tkDone(),todo=tkTodo();

    '<p class="note">格式 A001，滿 999 換下一個字母（B001、C001…）。同一場活動內不重複，'+
    '不同活動可以重複 —— 券是一場一印、活動後作廢，沒有跨場對照的需求。</p>'+
    '<div class="grid" style="margin:12px 0">'+
      '<div class="stat"><b>'+done+'</b><small>已有券號</small></div>'+
      '<div class="stat"><b>'+todo+'</b><small>尚未產生</small></div></div>'+

      '<tbody>'+sample+'</tbody></table></div>'+
      '<p class="note" style="margin-top:6px">只列前五筆，完整對照在匯出的 Excel 裡。</p>':'')+

    '<div class="foot"><button class="btn sec" onclick="closeModal(this)">關閉</button>'+

/* 編號一律由資料庫算（ticket_assign）。
   放前端的話，三千筆要自己抓最大號、自己補零、自己避開重複，
   而且兩個分頁同時按就會撞號 —— 那是唯一索引擋得住但使用者看不懂的錯誤。 */
async function ticketAssign(btn){
  btn.disabled=true;btn.textContent='產生中…';
  const {data,error}=await sb.rpc('ticket_assign',{p_event_id:EVID});
  if(error){
    alert('產生失敗：'+error.message);
    log('產生券號失敗',error.message,true);
    btn.disabled=false;btn.textContent='產生券號';return;
  }
  const n=(data&&data.assigned)||0,from=(data&&data.from)||1;
  log('產生抽獎券號 '+n+' 組','ticket_assign(event_id='+EVID+')　從第 '+from+' 號開始接續');
  closeModal(btn);
  await loadEvent(EVID);
  toast(n?('已產生 '+n+' 組券號'):'每一位都已經有券號了');
}

/* =========================================================
   核銷代碼管理
   ========================================================= */
/* 代碼職能：一組代碼只做一件事，不做複選。
   現場人員進場看到什麼就是什麼，不必切換模式，
   也不會發生「報到掃完又被當成兌換掃一次」這種誤觸。 */
const ROLES={checkin:'報到核銷',redeem:'兌換核銷',lottery:'紙本抽獎登錄'};

/* 產生代碼時讀批次區那個下拉。單獨產生也共用同一個值，
   不另外跳一次詢問視窗 —— 現場最常見的是一次產一批同職能的 */
function pickRole(){
  const el=document.getElementById('batchRole');
  const v=el?el.value:'';
  /* 對照 ROLES 而不是逐個比對字串 —— 之後再加職能時這裡不必跟著改 */
  return ROLES[v]?v:'checkin';
}

async function setCodeRole(id,role){
  const {error}=await sb.from('checkin_codes').update({role:role}).eq('id',id);
  if(error){alert('儲存失敗');log('修改代碼職能失敗',error.message,true);return}
  log('修改代碼職能 → '+(ROLES[role]||role),'update checkin_codes where id='+id);
  await loadCodes();render();
}

async function loadCodes(){
  const {data,error}=await sb.from('checkin_codes').select('*').eq('event_id',EVID).order('id');
  if(error){ERR=error;log('讀取核銷代碼失敗',error.message,true);return}
  CODES=data||[];
  log('讀取核銷代碼','select from checkin_codes → '+CODES.length+' 列');
}
async function addCode(){
  const l=prompt('用途標註（例如：王小明、報到台 3）','工作人員 '+(CODES.length+1));
  if(l===null)return;
  const code=mkToken().toUpperCase();
  const {error}=await sb.from('checkin_codes')
    .insert({event_id:EVID,code,label:l||'未標註',role:pickRole()});
  if(error){alert('產生失敗');log('產生代碼失敗',error.message,true);return}
  log('產生核銷代碼：'+code,'insert into checkin_codes（隨機亂數、綁 event_id='+EVID+'）');
  await loadCodes();render();
}
/* 一個人一組代碼，20 個工作人員就是 20 組。一次貼上名單一次產生 */
async function addCodesBatch(){
  const el=document.getElementById('batchNames');
  const raw=el?el.value:'';
  const names=raw.split('\n').map(x=>x.trim()).filter(x=>x);
  if(!names.length){alert('請一行一個名字');return}
  if(names.length>60){alert('一次最多 60 個');return}
  const role=pickRole();
  const rows=names.map(n=>({event_id:EVID,code:mkToken().toUpperCase(),label:n,role:role}));
  const {error}=await sb.from('checkin_codes').insert(rows);
  if(error){alert('產生失敗');log('批次產生代碼失敗',error.message,true);return}
  if(el)el.value='';
  log('批次產生核銷代碼 '+rows.length+' 組','一個人一組，label 存的是人名');
  await loadCodes();render();
}
async function toggleCode(id,on){
  /* 停用時一併清掉 session：那台本來就會被踢出（回 code_disabled），
     session 留著沒有意義，而且重新啟用時會擋住第一個進來的人。 */
  const patch=on?{active:true}:{active:false,session_id:null,session_at:null};
  const {error}=await sb.from('checkin_codes').update(patch).eq('id',id);
  if(error){alert('操作失敗');log('切換代碼失敗',error.message,true);return}
  log((on?'重新啟用':'停用')+'核銷代碼','update checkin_codes where id='+id);
  await loadCodes();render();
}
/* 刪除代碼採兩步：先停用，停用後才能刪。
   好處是刪除變成需要刻意走完的流程，不是點錯就沒了；
   而且停用當下那台裝置就被踢出了，刪的時候現場已經沒人在用。

   ⚠️ checked_in_by 存的是核銷當下的人名快照，不是關聯，
      所以刪掉代碼不會弄壞歷史紀錄，名單頁照樣顯示是誰核銷的。
      代價是那組代碼再也對不上是誰的。 */
async function deleteCode(id){
  const c=CODES.filter(x=>x.id===id)[0];if(!c)return;
  if(c.active){alert('請先停用這組代碼，才能刪除。');return}
  if(!confirm('刪除代碼「'+c.label+'」？\n\n'+
    (c.first_used_at?'這組已經有人用過。':'這組還沒有人用過。')+
    '\n刪除後名單上的核銷紀錄不受影響，但這組代碼將無法再對應到人。'))return;
  const {error}=await sb.from('checkin_codes').delete().eq('id',id);
  if(error){alert('刪除失敗');log('刪除核銷代碼失敗',error.message,true);return}
  log('刪除核銷代碼：'+c.label,'delete from checkin_codes；歷史核銷紀錄不受影響');
  await loadCodes();render();
}

async function deleteCodesChecked(){
  const ids=Array.prototype.slice.call(
    document.querySelectorAll('#codetbl tbody input.ckc:checked'))
    .map(x=>parseInt(x.value,10)).filter(x=>x);
  if(!ids.length){alert('請先勾選要刪除的代碼（只有已停用的可以勾選）');return}

  if(error){alert('刪除失敗');log('批次刪除代碼失敗',error.message,true);return}

  await loadCodes();render();
}
async function renameCode(id,v){

function copyText(t,btn){
  const done=()=>{if(btn){const o=btn.textContent;btn.textContent='已複製';setTimeout(()=>{btn.textContent=o},1200)}};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done,()=>fallback());
  }else fallback();
  function fallback(){
    const ta=document.createElement('textarea');ta.value=t;
    ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);
    ta.select();try{document.execCommand('copy');done()}catch(_){alert('複製失敗，請手動選取')}
    document.body.removeChild(ta);
  }
}
