<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>報到系統｜連線版 6u</title>
<style>
/* 原本是暖卡其色系（#2C2C2A / #D3D1C7 / #F1EFE8），
   在螢幕上會讀成「蒙塵、老舊」。改成冷調石板灰＋收斂的靛藍，
   商務感來自克制與對比，不是來自更多顏色。 */
:root{--ink:#1E2430;--mute:#68707E;--line:#DFE3EA;--card:#F4F6F9;--bg:#F7F8FA;
      --purple:#3A4C8F;--green:#0E7050;--blue:#1A5EA8;--amber:#B0700F;--dred:#B03A34;
--redeem:#C07C14;--rally:#2E7D5B;--lotto:#6B4EA8;}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"微軟正黑體","Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;
     color:var(--ink);background:var(--bg);font-size:15px;line-height:1.65;
     -webkit-font-smoothing:antialiased}
button{font-family:inherit}

#bar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
     padding:8px 16px;background:#232B3A;color:#fff;font-size:12.5px}
#bar .tag{background:var(--green);border-radius:3px;padding:1px 8px;font-weight:700}
#bar .tag.off{background:var(--dred)}
#bar .sp{flex:1}
#bar button{background:#38425A;color:#fff;border:1px solid #4C5872;border-radius:5px;
            padding:4px 10px;cursor:pointer;font-size:12.5px}
#bar button:hover{background:#4C5872}
#bar code{color:#A9B2C4;font-size:11.5px}

.wrap{max-width:1240px;margin:0 auto;padding:22px 20px 80px}
h1{font-size:25px;margin:0 0 4px}
h2{font-size:18px;margin:26px 0 10px}
h3{font-size:16px;margin:0 0 8px}
.sub{color:var(--mute);font-size:13.5px;margin:0 0 20px}
.crumb{font-size:12.5px;color:var(--mute);margin-bottom:10px}
.crumb span{cursor:pointer;text-decoration:underline}
.crumb b{color:var(--ink)}

.btn{display:inline-flex;align-items:center;gap:6px;background:var(--purple);color:#fff;
     border:1px solid var(--purple);border-radius:6px;padding:8px 15px;cursor:pointer;
     font-size:14px;font-weight:600;white-space:nowrap;letter-spacing:.2px;
     transition:background .12s,border-color .12s,color .12s}
.btn:hover{background:#2F3F7A;border-color:#2F3F7A;filter:none}
.btn.sec{background:#fff;color:#3C4454;border-color:#D5DAE3}
.btn.sec:hover{background:#EEF1F6;border-color:#BFC7D4;color:var(--ink)}
.btn.g{background:var(--green);border-color:var(--green)}
.btn.g:hover{background:#0B5C42;border-color:#0B5C42}
.btn.b{background:var(--blue);border-color:var(--blue)}
.btn.b:hover{background:#154E8B;border-color:#154E8B}
/* 刪除用外框式，不用實心深紅 —— 整排實心色塊是「灰暗」感的主因之一，
   而且刪除是低頻且不可逆的動作，不該在視覺上搶第一順位 */
.btn.d{background:#fff;color:var(--dred);border-color:#E4C2C0}
.btn.d:hover{background:var(--dred);color:#fff;border-color:var(--dred)}
.btn.sm{padding:4px 10px;font-size:12.5px;font-weight:400}
.btn[disabled]{opacity:.45;cursor:not-allowed}

input[type=text],input[type=email],input[type=date],input[type=number],select,textarea{
  font-family:inherit;font-size:14px;color:var(--ink);background:#fff;
  border:1px solid var(--line);border-radius:6px;padding:7px 10px;width:100%}
textarea{min-height:110px;resize:vertical}
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:12.5px;color:var(--mute);margin-bottom:4px}
    /* 報名表單的欄位標題：拉開與說明文字的層級。
       不加底色 —— 八個欄位每個都有底色會很吵，
       而且底色通常代表可點擊或有狀態，用在標題會誤導 */
    /* :not(.fhint) 很重要 —— 說明文字也是 label.f 的直接子 span，
       不排除掉的話會被這條規則一起變成 18px 粗體 */
    .pub label.f>span:not(.fhint){font-size:18px;font-weight:700;color:var(--ink);margin-bottom:6px;line-height:1.4}
.row{display:flex;gap:14px;flex-wrap:wrap}
.row>*{flex:1;min-width:200px}
.sw{display:inline-flex;align-items:center;gap:4px;cursor:pointer;font-size:12px;user-select:none}
.sw input{margin:0}

.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:15px 17px;margin-bottom:16px}
.card.plain{background:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}
.evcard{background:#fff;border:1px solid var(--line);border-radius:12px;
      padding:0;overflow:hidden;cursor:pointer;transition:border-color .12s,box-shadow .12s;
      display:flex;flex-direction:column}
    /* 離線狀態列與待辦 */
    .offbar{background:#7A4A0F;color:#fff;padding:9px 14px;border-radius:8px;
      margin-bottom:10px;font-size:13.5px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .offbar b{font-size:14px}
    .offbar .btn{margin-left:auto}
    .undoq{background:#FFF6E8;border:1px solid #E8CFA6;border-radius:8px;
      padding:11px 14px;margin-bottom:10px;font-size:13.5px}
    .undoq .it{display:flex;align-items:center;gap:8px;margin-top:7px;flex-wrap:wrap}
    .undoq .it b{flex:1;min-width:80px}
    /* 彈出視窗：畫面中央，背景變暗，點背景或 Esc 關閉 */
    .modalbg{position:fixed;inset:0;background:rgba(20,26,38,.45);z-index:900;
      display:flex;align-items:center;justify-content:center;padding:24px}
    .modal{background:#fff;border-radius:12px;max-width:720px;width:100%;
      max-height:82vh;display:flex;flex-direction:column;
      box-shadow:0 18px 50px rgba(20,26,38,.28)}
    .modal .mh{display:flex;align-items:center;gap:12px;
      padding:16px 20px;border-bottom:1px solid var(--line)}
    .modal .mh b{font-size:17px;flex:1}
    .modal .mb{padding:16px 20px;overflow:auto}
    .modal .mb .tblwrap{margin:0;max-height:none}
    .modal .mf{padding:12px 20px;border-top:1px solid var(--line);text-align:right}
    .modal .nmlist span{display:inline-block;background:var(--card);
      border:1px solid var(--line);border-radius:6px;padding:2px 9px;margin:0 5px 6px 0;font-size:13.5px}
    /* 統計檢視 */
    .strow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
    .stmini{flex:1;min-width:96px;background:#fff;border:1px solid var(--line);
      border-radius:10px;padding:12px 14px;text-align:center}
    .stmini b{display:block;font-size:22px;line-height:1.2}
    .stmini span{font-size:12px;color:var(--mute)}
    .stgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
    .stcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:15px 17px}
    .stcard h4{margin:0 0 10px;font-size:15px}
    .stbar{display:flex;align-items:center;gap:10px;margin-bottom:7px;font-size:13px}
    .stbar .nm{width:88px;flex:none;overflow-wrap:anywhere;line-height:1.3}
    .stbar .nm.mu{color:var(--mute)}
    .stbar .ba{flex:1;height:8px;background:#EDF0F5;border-radius:99px;overflow:hidden}
    .stbar .ba i{display:block;height:100%;background:var(--purple);border-radius:99px}
    /* ⚠️ 數字與百分比要各自對齊成一直線。
       整個 .vv 靠右的話，兩段文字連在一起往右推，
       數字長度一變（180 / 2528）中間那道縫就跟著跳，整欄看起來是歪的。
       拆成兩個固定寬度的格子：數字靠右、百分比靠左，
       兩排各自對齊，數字再用等寬字型讓位數對得起來。 */
    .stbar .vv{width:100px;flex:none;display:flex;align-items:baseline;
               gap:6px;white-space:nowrap}
    .stbar .vv b{flex:1;text-align:right;font-variant-numeric:tabular-nums}
    .stbar .vv em{width:46px;flex:none;text-align:left;
                  font-style:normal;color:var(--mute);font-size:12px;
                  font-variant-numeric:tabular-nums}
    .stbig{display:flex;align-items:baseline;gap:6px}
    .stbig b{font-size:28px;line-height:1}
    .stbig span{font-size:12.5px;color:var(--mute)}
    .evcard{box-shadow:0 1px 2px rgba(30,36,48,.05)}
    .evcard:hover{border-color:#B9C2D4;box-shadow:0 4px 14px rgba(30,36,48,.10)}
    .evcard .body{padding:17px 18px 15px;flex:1}
    .evcard h3{margin:0 0 6px;font-size:18px;line-height:1.35;overflow-wrap:anywhere}
    .evcard .m{color:var(--mute);font-size:12.5px;line-height:1.9;margin:0;overflow-wrap:anywhere}
    .evcard .m i{font-style:normal;color:#C2C8D4;margin:0 6px}
/* 地點只佔一行，太長就截斷（滑過看得到完整的）。
   不讓它換行，卡片高度才會一致。 */
.evcard .m.v{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 同一排的卡片等高：撐開的是內容區，操作列永遠貼在底部 */
.grid{align-items:stretch}
.evcard{display:flex;flex-direction:column}
.evcard .body{display:flex;flex-direction:column}
.evcard .st{margin-top:auto}
    .evcard .cap{display:flex;align-items:baseline;gap:7px;margin:15px 0 12px;flex-wrap:wrap}
    .evcard .cap b{font-size:30px;line-height:1;letter-spacing:-.5px;color:var(--ink)}
    .evcard .cap span{font-size:12.5px;color:var(--mute)}
    .evcard .cap em{font-style:normal;font-size:12.5px;color:var(--mute);
      margin-left:auto;padding-left:10px}
    .evcard .cap em b{font-size:15px;letter-spacing:0}
    .evcard .st{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
    .evcard .act{display:flex;gap:6px;padding:10px 14px;background:#F4F6F9;
      border-top:1px solid var(--line);flex-wrap:wrap}
    .evcard .act .btn{margin:0}
    .evcard .go{margin-left:auto;color:var(--mute);font-size:12.5px;align-self:center}
    .evcard:hover .go{color:var(--purple)}
.tile{background:#fff;border:1px solid var(--line);border-radius:8px;padding:15px 16px;cursor:pointer}
.tile:hover{border-color:var(--purple);box-shadow:0 2px 10px rgba(83,74,183,.14)}
.tile b{display:block;font-size:15.5px;margin-bottom:3px}
.tile small{color:var(--mute);font-size:12.5px;display:block}
.stat{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px;text-align:center}
.stat b{display:block;font-size:26px;line-height:1.25}
.stat small{color:var(--mute);font-size:12px}

table{width:100%;border-collapse:collapse;background:#fff;font-size:13.5px}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:middle;word-break:break-word}
th{background:var(--mute);color:#fff;font-weight:700;font-size:13px;white-space:nowrap}
tbody tr:hover{background:#FAF9F5}
td.nowrap,th.nowrap{white-space:nowrap}
td.wrap{white-space:normal;min-width:110px}
.tblwrap{overflow-x:auto;border-radius:6px}
.tblwrap.freeze table{border-collapse:separate;border-spacing:0}
.tblwrap.freeze th,.tblwrap.freeze td{border-right:none;border-bottom:none}
.tblwrap.freeze tr th:last-child,.tblwrap.freeze tr td:last-child{border-right:1px solid var(--line)}
.tblwrap.freeze tr:last-child td{border-bottom:1px solid var(--line)}
.tblwrap.freeze th:nth-child(1),.tblwrap.freeze td:nth-child(1),
.tblwrap.freeze th:nth-child(2),.tblwrap.freeze td:nth-child(2){position:sticky;z-index:3}
.tblwrap.freeze th:nth-child(1),.tblwrap.freeze td:nth-child(1){left:0}
.tblwrap.freeze td:nth-child(1),.tblwrap.freeze td:nth-child(2){background:#fff;box-shadow:1px 0 0 var(--line)}
.tblwrap.freeze th:nth-child(1),.tblwrap.freeze th:nth-child(2){background:var(--mute);box-shadow:1px 0 0 var(--line)}

.pill{display:inline-flex;align-items:center;width:fit-content;max-width:100%;border-radius:999px;padding:3px 10px;font-size:12px;line-height:1.3;font-weight:700;color:#fff;white-space:nowrap;box-sizing:border-box}
.p-invited{background:#7B8494} .p-pending{background:var(--amber)}
.p-approved{background:var(--purple)} .p-checked{background:var(--green)}
.p-rejected{background:var(--dred)}
.tag2{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:0 6px;
      font-size:11.5px;color:var(--mute);background:#fff}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{background:#fff;border:1px solid var(--line);border-radius:16px;padding:5px 14px;
             cursor:pointer;font-size:13px;color:var(--mute)}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}

.empty{border:2px dashed var(--line);border-radius:12px;background:var(--card);padding:42px 24px;text-align:center}
.empty b{display:block;font-size:19px;margin-bottom:6px}
.empty p{color:var(--mute);font-size:13.5px;margin:0 auto 18px;max-width:520px}
.note{font-size:12.5px;color:var(--mute)}
.mini{font-size:12px;color:var(--mute)}
.warn{border-left:3px solid var(--dred);background:#FCF4F3;padding:11px 14px;border-radius:0 6px 6px 0;font-size:13.5px;margin:14px 0}
.info{border-left:3px solid var(--blue);background:#F2F6FA;padding:11px 14px;border-radius:0 6px 6px 0;font-size:13px;margin:14px 0}
.ok{border-left:3px solid var(--green);background:#F1F7F4;padding:11px 14px;border-radius:0 6px 6px 0;font-size:13.5px;margin:14px 0}
.warn b,.info b,.ok b{display:block;margin-bottom:3px}
pre{background:#2C2C2A;color:#EDEBE4;padding:11px 13px;border-radius:6px;font-size:12px;
    overflow-x:auto;white-space:pre-wrap;word-break:break-all;margin:10px 0 0}

.steps{display:flex;margin-bottom:18px;flex-wrap:wrap}
.steps div{flex:1;min-width:100px;padding:8px 10px;text-align:center;font-size:12.5px;
           background:#fff;border:1px solid var(--line);border-right:none;color:var(--mute)}
.steps div:first-child{border-radius:6px 0 0 6px}
.steps div:last-child{border-right:1px solid var(--line);border-radius:0 6px 6px 0}
.steps div.on{background:var(--purple);border-color:var(--purple);color:#fff;font-weight:700}
.steps div.done{background:#EDEBFF;color:var(--purple)}
.drop{border:2px dashed var(--line);border-radius:10px;background:#fff;padding:34px 20px;text-align:center;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--purple);background:#F8F7FF}
.drop b{display:block;font-size:16px;margin-bottom:4px}
.maprow{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);
        border-radius:8px;background:#fff;margin-bottom:7px;flex-wrap:wrap}
.maprow .h0{flex:0 0 180px;font-weight:700;overflow-wrap:anywhere}
.maprow .sm0{flex:1 1 170px;color:var(--mute);font-size:12px;overflow-wrap:anywhere;min-width:120px}
.maprow .to{flex:0 0 240px}
.badge{display:inline-block;border-radius:5px;padding:1px 7px;font-size:11.5px;font-weight:700;color:#fff}
.b-new{background:var(--green)} .b-fill{background:var(--blue)}
.b-conf{background:var(--amber)} .b-err{background:var(--dred)}

/* 6g：匯入衝突逐列覆寫 */
.cfgrp{border:1px solid var(--line);border-radius:8px;background:#fff;margin-bottom:8px;padding:9px 12px}
.cfgrp>.hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700;font-size:13.5px}
.cfgrp>.hd .em{color:var(--mute);font-weight:400;font-size:12px;overflow-wrap:anywhere}
.cfrow{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:5px 0 5px 4px;
       font-size:13px;border-top:1px dotted var(--line);margin-top:6px}
.cfrow .lb{flex:0 0 120px;color:var(--mute);font-size:12px;overflow-wrap:anywhere}
.cfrow .ov{text-decoration:line-through;color:var(--mute);overflow-wrap:anywhere}
.cfrow .nv{font-weight:700;overflow-wrap:anywhere}
.cfrow.bad .nv{font-weight:400;color:var(--mute)}
.cfq{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap;margin-left:auto}
.fq{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 0;
    border-top:1px dotted var(--line);font-size:13px}
.fq b{flex:0 0 150px;overflow-wrap:anywhere}
.mcand{display:block;padding:6px 9px;border:1px solid var(--line);border-radius:6px;
       margin-top:5px;cursor:pointer;font-size:13px}
.mcand:hover{background:var(--card)}
.mcand input{margin-right:6px}
.keyst{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
.keyst span{border:1px solid var(--line);border-radius:5px;padding:2px 8px;font-size:12px;background:#fff}
.keyst span.t0{border:none;background:none;color:var(--mute);padding-left:0}
@media(max-width:560px){.cfrow .lb,.fq b{flex:1 1 100%}.cfq{margin-left:0}}
/* 匯入預覽的底部固定列：衝突一多就捲不到按鈕，把按鈕釘在視窗底部。
   用 sticky 不用 fixed —— 寬度跟著 .wrap 走，右邊留白給操作紀錄面板（z-index 60），
   按鈕靠左所以不會被那個面板蓋到。 */
.impbar{position:sticky;bottom:0;z-index:55;display:flex;align-items:center;gap:8px;
        flex-wrap:wrap;margin:18px -20px 0;padding:11px 20px;background:#fff;
        border-top:1px solid var(--line);box-shadow:0 -3px 12px rgba(0,0,0,.07)}
.impbar .n{color:var(--mute);font-size:12.5px;margin-left:6px;overflow-wrap:anywhere}
.impbar .n b{color:var(--ink);font-size:15px}
@media(max-width:560px){.impbar{margin:14px -14px 0;padding:10px 14px}
  .impbar .n{flex:1 1 100%;margin-left:0;order:-1}}

.mask{position:fixed;inset:0;background:rgba(30,29,27,.5);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:10px;max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:20px 22px}
.modal h3{font-size:17px;margin:0 0 14px}
.foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

#logbox{position:fixed;right:0;bottom:0;width:390px;max-height:46vh;background:#fff;
        border:1px solid var(--line);border-radius:10px 0 0 0;box-shadow:-3px -3px 14px rgba(0,0,0,.08);
        z-index:60;display:flex;flex-direction:column;transform:translateY(calc(100% - 38px));transition:.18s}
#logbox.open{transform:none}
#logbox .h{padding:8px 13px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;cursor:pointer;background:var(--card);border-radius:10px 0 0 0}
#logbox .h b{font-size:13px;flex:1}
#logbox .b{overflow:auto;padding:8px 13px}
.ll{border-bottom:1px dotted var(--line);padding:6px 0;font-size:12px;line-height:1.5}
.ll i{color:var(--mute);font-style:normal;font-size:11px}
.ll em{font-style:normal;font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--purple)}
.ll.bad em{color:var(--dred)}
#busy{position:fixed;inset:0;background:rgba(255,255,255,.72);z-index:90;display:flex;
      align-items:center;justify-content:center;font-size:16px;font-weight:700}

/* 公開層 */
.pub{max-width:600px;margin:0 auto;padding:26px 20px 60px}
/* LINE 內建瀏覽器的提示列。放在 .pub 外面，所以自己也要收 max-width */
.linebar{max-width:600px;margin:0 auto;padding:10px 14px;background:#FFF6E0;
         border-bottom:1px solid #E8D9A8;font-size:13.5px;line-height:1.55;color:#5A4A18}
    .linebar b{display:block;margin-bottom:2px;font-size:14px}
    .linebar .act{margin-top:8px}
    .linebar button{border:1px solid #C9B87A;background:#fff;color:#5A4A18;
      border-radius:6px;padding:5px 12px;font-size:13px;cursor:pointer}
    .linebar button.x{border-color:transparent;background:transparent;padding:5px 8px}
/* 同意條款欄位。
   ⚠️ 外層刻意用 div 不用 label —— label 包住整塊的話，
      點條文任何一個字都會勾到核取方塊，那是「不小心就同意了」。
      同意這個動作必須是明確的點擊。 */
.pub .f.cf{display:block;margin-bottom:18px}
    .pub .f.cf>span.clab{display:block;font-size:18px;font-weight:700;color:var(--ink);
      margin-bottom:6px;line-height:1.35}
    .cbody{font-size:14px;line-height:1.75;color:var(--ink);background:#fff;
      border:1px solid var(--line);border-radius:8px;padding:14px 16px;
      max-height:320px;overflow:auto;white-space:normal}
    .cchk{display:block;margin-top:12px;font-size:16px;font-weight:700}
    .cchk input{transform:scale(1.25);margin-right:8px}
.pubhead{border-bottom:2px solid var(--green);padding-bottom:12px;margin-bottom:18px;text-align:center}
    .pubhead b{font-size:21px;display:block}
/* 核銷頁搜尋結果：命中欄位標籤與 Email */
.hit .via{display:inline-block;margin-left:8px;padding:1px 7px;border-radius:5px;
          background:var(--card);border:1px solid var(--line);
          color:var(--mute);font-size:11.5px;font-weight:400;vertical-align:middle}
.hit .meta.em{word-break:break-all}
.hit .fixrow{display:block;margin-top:7px}
.camfix{display:flex;flex-direction:column;gap:7px;margin-top:12px;width:100%;max-width:300px}
/* 語言導頁：一頁只做一件事，按鈕排成一直行，手機上也不會擠 */
.langpick{display:flex;flex-direction:column;gap:10px;max-width:340px;margin:6px auto 0}
.lgbtn{display:block;text-align:center;padding:15px 12px;border:1px solid var(--line);
       border-radius:9px;background:#fff;font-size:17px;font-weight:700;
       color:var(--ink);text-decoration:none;transition:border-color .12s,box-shadow .12s,color .12s}
.lgbtn:hover{border-color:var(--green);color:var(--green);box-shadow:0 2px 10px rgba(0,0,0,.07)}
    .pubhead small{color:var(--mute)}
    /* 姓名與報到時間分靠兩端，對齊下方 QR 外框的左右緣 */
    .menm{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
      flex-wrap:wrap;gap:6px;margin:18px 0 14px}
    .menm .who{font-size:28px;font-weight:700;line-height:1.25}
    .menm .at{font-size:19px;color:var(--mute);line-height:1.25}
/* 個人資訊頁「更多資訊」：按鈕、卡片總覽、清單列 */
.mebtn{margin-left:auto;background:#fff;border:1px solid var(--line);border-radius:999px;
       padding:5px 14px;font-size:13px;font-weight:600;color:var(--purple);cursor:pointer;
       line-height:1.4;white-space:nowrap}
.mebtn:hover{border-color:var(--purple)}
.mback{display:inline-flex;align-items:center;gap:5px;background:#fff;
       border:1px solid var(--line);border-radius:999px;color:var(--ink);
       font-size:13.5px;font-weight:600;cursor:pointer;
       padding:6px 15px;margin-bottom:14px;font-family:inherit;line-height:1.4}
.mback:hover{border-color:var(--purple);color:var(--purple)}
/* 範本庫的「清單 ＋ 預覽」並排。
   沒有選任何一份時 mtwrap 只有一欄，畫面跟原本的全寬清單一樣。
   窄螢幕退回上下排列 —— 並排在平板直立會擠成兩條細長條，不如疊起來。 */
.mtwrap{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
.mtwrap.split{grid-template-columns:minmax(0,1.1fr) minmax(320px,.9fr)}
@media(max-width:980px){.mtwrap.split{grid-template-columns:1fr}}
.mtpv{background:#fff;border:1px solid var(--line);border-radius:12px;
      position:sticky;top:64px;overflow:hidden}
.mtpv .h{display:flex;align-items:center;gap:10px;padding:12px 14px;
         border-bottom:1px solid var(--line);background:var(--card)}
.mtpv .h b{flex:1;font-size:15px}
.mtpv .bd{padding:14px}
.mtrow-on{background:#EEF2FA}
/* 存檔成功的提示。存完之後畫面上的值本來就跟存之前一樣，
   沒有提示的話完全看不出來有沒有成功，會一直重複按。 */
#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);
       background:#232B3A;color:#fff;font-size:14px;font-weight:600;
       padding:10px 22px;border-radius:999px;z-index:1200;
       box-shadow:0 8px 26px rgba(20,26,38,.3);pointer-events:none;
       opacity:0;transition:opacity .18s}
#toast.on{opacity:1}
/* 手動更新。自動更新停掉之後仍然留著 ——
   不顯示「已停止自動更新」那種訊息，賓客不需要知道系統內部在做什麼，
   但要留一顆按鈕給不死心的人按。 */
.merf{background:none;border:none;color:var(--mute);font-size:12.5px;cursor:pointer;
      font-family:inherit;text-decoration:underline;padding:4px 6px}
.merf:hover{color:var(--purple)}
.merf[disabled]{opacity:.5;cursor:default;text-decoration:none}
.mcards{display:grid;gap:12px}
/* 三張卡片用顏色區分功能；沒開放的一律白底灰字並停用，點了不會有反應 */
.mcard{border-radius:12px;padding:16px 18px;color:#fff;border:1px solid transparent;
       text-align:left;font-family:inherit;font-size:16px;font-weight:700;
       cursor:pointer;line-height:1.4}
.mcard small{display:block;font-size:12.5px;font-weight:400;opacity:.92;margin-top:3px}
.mcard.c1{background:var(--redeem)}
.mcard.c2{background:var(--rally)}
.mcard.c3{background:var(--lotto)}
.mcard.off{background:#fff;color:var(--mute);border-color:var(--line);cursor:default}
.mcard.off small{opacity:1}
.mrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
      border-bottom:1px solid var(--line);padding:12px 2px}
.mrow b{font-size:15px;display:block}
.mrow small{display:block;font-size:12.5px;color:var(--mute);font-weight:400}
.mrow .tagr{font-size:13px;white-space:nowrap;color:var(--mute)}
.mrow.mok .tagr{color:var(--redeem);font-weight:700}
.mrow.dim{opacity:.45}
.qrbox{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;text-align:center}
.qrbox svg{width:210px;height:210px}
.qrbox code{display:block;margin-top:8px;font-size:12px;color:var(--mute);word-break:break-all}
.kv{display:flex;border-bottom:1px solid var(--line);padding:9px 0;font-size:14px}
.kv span{width:130px;color:var(--mute);flex:none}
    .kv b{min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px}
    /* 個人資訊頁：值要對齊頁面中線（也就是 QR 的中線）。
       做法是左右各留 130px：左邊放標籤，右邊放等寬的空白，
       中間那一段的中心自然就是整頁中心。
       不用絕對定位 —— 那會讓標籤不佔空間，整列塌掉。 */
    /* b 在這裡不要當 flex 容器：flex 子項的尺寸會被拉伸，
       綠色標籤就會比文字寬一大截。改回一般區塊，
       標籤自然縮到文字寬度，再用 text-align 置中。 */
    .pub .kv b{display:block;flex:1;text-align:center;font-weight:600}
    .pub .kv::after{content:"";width:130px;flex:none}
    /* 狀態標籤一律白字。之前被其他規則蓋掉，這裡寫死 */
    .pill,.kv b .pill,.pub .kv b .pill{color:#fff !important}
    /* 綠底若因故被撐寬，至少讓文字在裡面置中，視覺上仍對齊中線 */
    .pill{justify-content:center;text-align:center}
    /* ---- 6d：代碼輸入畫面 ---- */
    /* 欄位設定的拖曳排序 */
    /* 麵包屑與回上一頁同一水平線，返回鍵靠右 —— 兩個都是導覽元素，
       靠太近容易誤擊，所以刻意拉開 */
    /* 釘在畫面上方：名單很長時往下捲，麵包屑與回上一頁要一直看得到。
       top 取 33px 是因為上面還有一條 sticky 的 #bar，取 0 會被它蓋住。
       左右負邊距搭配同寬內距，是為了讓底色填滿整個內容區寬度，
       否則捲動時表格會從麵包屑兩側穿出來。 */
    .navrow{position:sticky;top:33px;z-index:40;
      display:flex;align-items:center;gap:12px;
      margin:0 -20px 14px;padding:10px 20px;
      background:var(--bg);border-bottom:1px solid var(--line)}
    @media(max-width:820px){.navrow{top:56px;margin:0 -13px 12px;padding:9px 13px}}
    .navrow .crumb{margin:0;flex:1;min-width:0;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .navrow .btn{flex:none;margin:0}
    .drag{cursor:grab;user-select:none;color:var(--mute);font-size:17px;padding:0 4px;line-height:1}
    .drag:active{cursor:grabbing}
    tr.dragging{opacity:.4}
    tr.dragover{box-shadow:inset 0 3px 0 var(--purple)}
    /* 選項拖曳。用獨立一套樣式與變數，不跟欄位列的拖曳共用 ——
       兩者可能同時在畫面上（選項面板就開在欄位列下方），
       共用狀態的話拖曳選項會誤觸欄位排序 */
    .hit.optdrag{cursor:grab;user-select:none}
    .hit.optdrag.dragging{opacity:.4}
    .hit.optdrag.dragover{box-shadow:inset 0 3px 0 var(--purple)}
    tr.kid td:first-child{padding-left:22px;position:relative}
    tr.kid td:first-child::before{content:"└";position:absolute;left:8px;color:var(--mute)}
    /* 報名表單的欄位說明：標題下方一行小字 */
    .pub label.f>span.fhint,.fhint{display:block;font-size:12px;color:var(--mute);line-height:1.55;
      margin:-1px 0 6px;padding-left:9px;border-left:2px solid var(--line);font-weight:400}
    .gate{max-width:430px;margin:0 auto;padding:44px 20px}
    .gate h2{font-size:24px;margin:0 0 4px}
    #gatecode{font-size:26px;letter-spacing:3px;text-align:center;text-transform:uppercase;
      width:100%;padding:15px;box-sizing:border-box;font-weight:700;border:2px solid var(--blue)}
    /* ---- 6d：相機掃碼 ---- */
    .camwrap{position:relative;background:#000;border-radius:10px;overflow:hidden;margin:12px 0}
    .camwrap video{width:100%;display:block;max-height:62vh;object-fit:cover;background:#000}
    .camwrap canvas{display:none}
    .camframe{position:absolute;left:12%;right:12%;top:14%;bottom:14%;
      border:3px solid rgba(255,255,255,.85);border-radius:14px;pointer-events:none}
    .camres{position:absolute;left:0;right:0;top:0;bottom:0;display:none;
      flex-direction:column;align-items:center;justify-content:center;
      text-align:center;padding:20px;color:#fff}
    .camres.on{display:flex}
    .camres.good{background:rgba(15,110,86,.97)}
    .camres.bad{background:rgba(163,45,45,.97)}
    .camres b{font-size:27px;display:block;margin-bottom:6px;line-height:1.3}
    .camres small{font-size:15px;opacity:.93;display:block;line-height:1.6}
    .camres .btn{margin-top:16px}
    /* ---- 6d：手機排版 ---- */
    @media(max-width:640px){
      .ck{padding:12px}
      .ckbar{font-size:12px;flex-wrap:wrap;gap:5px}
      #ckinput{font-size:18px;padding:12px}
      .hit{display:block;padding:12px 0}
      .hit .nm{font-size:20px;display:block;margin-bottom:4px}
      .hit .meta{display:block;margin:2px 0 6px;line-height:1.9}
      .hit .btn{width:100%;justify-content:center;padding:13px;margin-top:4px}
      .big b{font-size:23px}
      .wrap,.pub{padding-left:14px;padding-right:14px}
    }
/* 核銷層 */
.ck{max-width:880px;margin:0 auto;padding:18px 18px 70px}
.ckbar{display:flex;gap:10px;align-items:center;background:var(--blue);color:#fff;
       padding:10px 16px;border-radius:8px;margin-bottom:14px;flex-wrap:wrap}
/* 兌換職能換色。只換頂端 bar 與主按鈕，不染整頁 ——
   大面積色塊在現場光線下很吵，白卡片也會浮不起來。
   成功綠、警告紅維持不變：那是狀態不是職能，混用會誤導。 */
.ckbar.rdm{background:var(--redeem)}
/* 紙本抽獎登錄用抽獎紫，與報到靛藍、兌換琥珀分得開。
   只換頂端 bar，理由同兌換：大面積色塊在現場光線下很吵。 */
.ckbar.ppl{background:var(--lotto)}
/* 投影端的連線指示。正常時幾乎看不見，斷了才轉紅 ——
   Realtime 斷線時名字不會出現，而現場只會以為還沒抽到，沒有人會察覺。 */
.psdot{position:fixed;right:12px;top:12px;width:10px;height:10px;border-radius:50%;
       background:#2E7D5B;opacity:.35;z-index:60}
.psdot.off{background:#C0392B;opacity:1}
.btn.rdm{background:var(--redeem);border-color:var(--redeem)}
.btn.rdm:hover{filter:brightness(1.08)}
.ckbar b{font-size:15px}
.ckbar .sp{flex:1}
.ckbar .n{background:rgba(255,255,255,.18);border-radius:6px;padding:3px 11px;font-size:13px}
#ckinput{font-size:21px;padding:14px 16px;border:2px solid var(--blue);font-weight:700}
.hit{background:#fff;border:1px solid var(--line);border-radius:8px;padding:11px 13px;
     margin-bottom:8px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.hit .nm{font-size:16px;font-weight:700;min-width:110px}
.hit .meta{color:var(--mute);font-size:12.5px;flex:1}
.big{border-radius:10px;padding:20px;text-align:center;margin-bottom:14px}
.big.good{background:#0F6E56;color:#fff}
.big.bad{background:#A32D2D;color:#fff}
.big b{font-size:30px;display:block;line-height:1.3}
.big small{opacity:.9}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:#5FD39B;margin-right:5px}
@media(max-width:640px){
  .wrap{padding:16px 13px 60px}
  h1{font-size:21px}
  #logbox{width:100%;border-radius:10px 10px 0 0}
  .maprow .h0,.maprow .to{flex:1 1 100%}
}
/* ---- 抽獎：後台資格條件列 ---- */
.lqrow{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.lqrow select,.lqrow input{height:32px;font-size:13px;margin:0}
.lqrow select{max-width:170px}
.lqrow input{max-width:120px}
.lqx{border:1px solid #D8D4C8;background:#fff;color:#8A857A;border-radius:6px;
     width:28px;height:28px;line-height:1;cursor:pointer;font-size:15px}
.lqx:hover{border-color:#C0392B;color:#C0392B}
.lqand{font-size:12px;color:#8A857A;margin:2px 0 6px 2px}
/* 核取方塊列。不能沿用 label.f —— 那個是 display:block，
   而且 .f>span 也是 block，方塊跟文字一定會上下疊。 */
.lchk{display:flex;align-items:center;gap:8px;margin:6px 0 4px;cursor:pointer}
/* 名單頁的欄位篩選面板 */
.gqbox{border:1px solid #D8D4C8;background:#FBFAF7;border-radius:10px;
       padding:12px 14px;margin-bottom:12px}
.gqrow{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.gqrow select,.gqrow input{height:32px;font-size:13px;margin:0}
.gqrow select{max-width:180px}
.gqrow input{max-width:150px}
.gqand{font-size:12px;color:#8A857A;margin:2px 0 6px 2px}
.gqtag{display:inline-block;background:#EEF1F6;border:1px solid #C9D2E0;
       border-radius:20px;padding:3px 10px;font-size:12.5px;margin:0 6px 4px 0;color:#1A2B4A}
.lchk input{width:16px;height:16px;margin:0;flex:0 0 auto}
.lchk span{display:inline;font-size:13.5px;color:var(--ink);margin:0}

/* ---- 抽獎：大螢幕 ----
   這一頁是投影用的，跟後台完全不共用視覺：全黑底、字級以整個場地
   最後一排看得到為準。所以尺寸用 vw 不用 px。 */
.ltwrap{position:fixed;inset:0;background:#0E0B14;color:#F2EFE6;
        display:flex;flex-direction:column;font-family:inherit;overflow:hidden}
/* 控制列在畫面下緣。放上面時它會跟獎項名稱搶視線 ——
   投影出去最上面那一條應該是獎項，不是下拉選單。 */
.lttop{display:flex;align-items:center;gap:14px;padding:14px 22px;
       border-top:1px solid #2A2337;flex:0 0 auto;background:#0B0912}
.lttop select{height:34px;font-size:14px;margin:0;max-width:260px}
.lttop input{height:34px;font-size:14px;margin:0;width:74px;text-align:center}
.ltsp{flex:1}
.ltbtn{border:1px solid #5B4C7A;background:#1B1526;color:#E9E3F5;border-radius:8px;
       padding:8px 16px;font-size:14px;cursor:pointer}
.ltbtn:hover{border-color:var(--lotto);background:#241C33}
.ltbtn:disabled{opacity:.4;cursor:default}
.ltbtn.go{background:var(--lotto);border-color:var(--lotto);color:#fff;font-weight:700;padding:8px 26px}
.ltbody{flex:1;display:flex;flex-direction:column;align-items:center;
        justify-content:flex-start;padding:2vh 3vw;overflow:hidden;min-height:0}
/* 標題固定在上緣，名單在剩下的空間裡垂直置中。
   兩塊都塞在同一個 flex-start 容器裡的話，抽 1 位時名字會黏在標題下面，
   底下空一大片 —— 那是投影出來最明顯的破綻。 */
.lthead{flex:0 0 auto;width:100%}
.ltmain{flex:1;display:flex;flex-direction:column;align-items:center;
        justify-content:center;width:100%;min-height:0;
        overflow-y:auto;overflow-x:hidden}
.lttitle{font-size:4.2vw;font-weight:800;letter-spacing:.06em;margin:1vh 0 .4vh;
         color:#fff;text-align:center;line-height:1.15}
.ltsub{font-size:1.5vw;color:#9A8FB5;margin-bottom:1vh;text-align:center}
/* 固定欄數。原本是純 flex 自動換行，一列幾個由名字長度決定 ——
   「Emily Wang」佔的寬度是「王大明」的兩倍多，於是第一列 6 個、
   第二列 4 個，直行對不齊。
   改成每格寬度固定＝(100% − 間距) / 欄數，一列就一定是 N 個。
   仍然用 flex 不用 grid：最後一列不滿時 flex 會自動置中，
   grid 會把它靠左黏著，看起來像沒排完。 */
.ltlist{display:flex;flex-wrap:wrap;gap:.2vh 2vw;justify-content:center;
        align-content:center;width:100%}
.ltlist>.ltone{flex:0 0 calc((100% - (var(--ltcols,4) - 1) * 2vw) / var(--ltcols,4));
               max-width:calc((100% - (var(--ltcols,4) - 1) * 2vw) / var(--ltcols,4));
               overflow:visible}
.ltlist>.ltone .ltname,.ltlist>.ltone .ltsec{overflow:hidden;text-overflow:ellipsis}
/* 滾動中的名字。只換 textContent，不重繪整頁 ——
   每 55 毫秒 render() 一次會把整個 app.innerHTML 重建，畫面會頓。 */
.ltroll{text-align:center;animation:ltpulse .9s ease-in-out infinite}
/* 重抽時只有那一格在跳。用 !important 蓋掉 .ltone 的浮出動畫 ——
   兩個 animation 同時掛在同一個元素上，後面那個會贏，這裡要確定是脈動贏。 */
.ltone.ltrolling{animation:ltpulse .9s ease-in-out infinite !important;opacity:1}
.ltone.ltrolling .ltrname{font-size:var(--ltfs,3.4vw);text-shadow:0 0 26px rgba(122,92,190,.55)}
.ltone.ltrolling .ltrsec{font-size:calc(var(--ltfs,3.4vw) * .42);margin-bottom:0}
@keyframes ltpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.ltrname{font-weight:800;color:#fff;line-height:1.15;white-space:nowrap;
         text-shadow:0 0 26px rgba(122,92,190,.55)}
.ltrsec{color:#B9AFD1;white-space:nowrap;margin-bottom:.4vh}
.ltrhint{font-size:1.3vw;color:#6E6485;margin-top:2.5vh;letter-spacing:.4em}
/* 名字一條一條浮出來。動畫純前端，資料在按下的那一刻就已經定案 */
.ltone{opacity:0;transform:translateY(14px);animation:ltin .45s ease forwards;
       position:relative;padding:.5vh 1vw 30px;text-align:center}
@keyframes ltin{to{opacity:1;transform:none}}
/* 字級跟著人數走：抽 1 位要撐滿畫面，抽 30 位要塞得下。
   固定字級的話，一位時小得像沒中獎、三十位時擠成一團。 */
/* 允許在空格處換行（英文全名），但中文不斷字 ——
   keep-all 讓中日韓維持整串，只有空格才是斷點。 */
.ltname{font-size:var(--ltfs,3.4vw);font-weight:700;color:#fff;line-height:1.32;
        white-space:normal;word-break:keep-all;overflow-wrap:normal;
        padding-bottom:.08em}
.ltsec{font-size:calc(var(--ltfs,3.4vw) * .42);color:#B9AFD1;margin-top:.2vh;white-space:nowrap}
.ltone.gone .ltname,.ltone.gone .ltsec{color:#5C5470;text-decoration:line-through}
/* 重抽／作廢平常藏著，滑到那一列才出現 ——
   大螢幕正在投影，全場都看著，誤觸的代價是現場事故 */
/* 按鈕放格內底部置中，不用負值定位 ——
   負值會被任何一層 overflow 裁掉，而且貼在角落容易誤觸。
   深色底是必要的：底下就是名字，沒有底色會糊成一團。 */
/* 按鈕放在名字「下方」的保留區，不壓在名字上。
   位置固定，hover 只切換顯示與否，不影響版面高度。 */
.ltact{position:absolute;left:50%;bottom:0;transform:translateX(-50%);
       display:none;gap:6px;z-index:5}
.ltone:hover .ltact{display:flex}
.ltact button{border:1px solid #6B5C8A;background:#241C33;color:#D8CFEA;
              border-radius:6px;font-size:12px;padding:3px 8px;cursor:pointer}
.ltact button:hover{background:var(--lotto);color:#fff}
.ltmsg{font-size:1.4vw;color:#C9A227;margin-top:2vh;text-align:center}
/* 分頁列。字級固定不跟著名字縮 —— 這是操作用的，不是給全場看的 */
/* 固定在畫面底部，位置不隨名單高度變動 */
.ltfoot{flex:0 0 auto;width:100%;padding-top:1vh}
.ltpg{display:flex;gap:8px;align-items:center;justify-content:center;
      margin:0;flex-wrap:wrap}
.ltpg button{border:1px solid #4A3F63;background:#1B1526;color:#9A8FB5;
             border-radius:6px;min-width:34px;height:30px;font-size:13px;cursor:pointer}
.ltpg button:hover{border-color:var(--lotto);color:#E9E3F5}
.ltpg button.on{background:var(--lotto);border-color:var(--lotto);color:#fff;font-weight:700}
.ltpgn{font-size:13px;color:#6E6485;margin-left:6px}
.ltempty{font-size:1.6vw;color:#6E6485;margin-top:8vh;text-align:center;line-height:1.9}
/* 完整名單。蓋在抽獎畫面之上，看完關掉，抽獎狀態不受影響 ——
   主持人常在中場被問「剛剛三獎有誰」，不能因此把現在這一輪洗掉。 */
.ltall{position:fixed;inset:0;background:rgba(9,7,15,.97);z-index:60;
       display:flex;flex-direction:column;padding:2.5vh 3vw}
.ltallhd{display:flex;align-items:baseline;gap:16px;flex:0 0 auto;
         border-bottom:1px solid #2A2337;padding-bottom:1.4vh;margin-bottom:1.6vh}
.ltallhd b{font-size:2.2vw;color:#fff}
.ltallhd span{font-size:1.2vw;color:#9A8FB5}
.ltallbd{flex:1;overflow:auto;min-height:0;
         display:grid;grid-template-columns:repeat(auto-fill,minmax(15vw,1fr));
         gap:1.1vh 1.6vw;align-content:start}
.ltallone{padding:.4vh .6vw;border-radius:8px;background:#161022}
.ltallone .n{font-size:1.55vw;font-weight:700;color:#fff;line-height:1.25;
             white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ltallone .s{font-size:1.05vw;color:#9A8FB5;white-space:nowrap;
             overflow:hidden;text-overflow:ellipsis}
.ltallone.gone{background:#120E1A}
.ltallone.gone .n,.ltallone.gone .s{color:#5C5470;text-decoration:line-through}
.ltallidx{font-size:1.05vw;color:#5C5470;margin-right:.4vw}
/* 紙本抽獎與電子系統分區。兩者的現場作業方式完全不同
   （一個是系統隨機抽、一個是人工登錄），卡片混在一起會誤點。 */
.secdiv{margin:24px 0 10px;padding-top:14px;border-top:2px solid var(--line);
        font-size:13px;color:var(--mute);line-height:1.7}
.secdiv b{display:block;font-size:16px;color:var(--lotto);margin-bottom:3px}
</style>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;

      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate

      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var c, mc, r, mr, qrSvg='', rect;

        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {

/* 時間顯示一律走這裡。
   資料庫的 timestamptz 存的是 UTC（例如 10:30:00+00:00），
   直接切字串會少 8 小時 —— 台灣是 UTC+8。
   new Date() 會依裝置時區換算，現場人員看到的就是本地時間。 */
function fmtTime(iso){
  if(!iso)return '';
  const d=new Date(iso);
  if(isNaN(d))return String(iso).slice(11,16);
  const z=n=>String(n).padStart(2,'0');
  return z(d.getHours())+':'+z(d.getMinutes());
}
function fmtDateTime(iso){
  if(!iso)return '';
  const d=new Date(iso);
  if(isNaN(d))return String(iso).replace('T',' ').slice(0,16);
  const z=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+
    ' '+z(d.getHours())+':'+z(d.getMinutes());
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function mkToken(){const c='abcdefghijkmnpqrstuvwxyz23456789';let s='';for(let i=0;i<10;i++)s+=c[Math.floor(Math.random()*c.length)];return s}
function norm(s){return String(s==null?'':s)
  .replace(/[\uFF01-\uFF5E]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
  .replace(/[\s\u3000]/g,'').replace(/[()（）:：*＊．.、,，_\-\/]/g,'').toLowerCase()}

/* ⚠️⚠️ 一次查詢拿不到全部資料，這是 Supabase 最容易中招的地方

   Supabase 對「單次查詢回傳幾列」有伺服器端上限（專案設定的 Max rows，預設 1000）。
   超過的部分不會報錯，就是靜靜地少給你 ——
   而且前端寫 .limit(5000) 或 .limit(20000) 完全沒有用，會被壓回伺服器的上限。
   本檔原本就是這樣寫的，10 人測試永遠測不出來。

   三千人的場子會發生什麼：
     3,000 位賓客 × 4 個欄位 ＝ 12,000 筆答案，實際只拿到 1,000 筆，
     也就是只有前 250 人有答案。其餘 2,750 人的部門、抽獎資格全部是空的。
     而系統的規則是「未填一律視為不符合」，於是他們
     不會進抽獎池、匯出欄位空白、名單頁顯示不出來 —— 全程沒有任何錯誤訊息。

   解法是 range 一頁一頁撈，撈到回傳 0 筆為止。
   ⚠️ 不能用「這次回傳少於 pageSize 就當作撈完」——
      如果伺服器上限比 pageSize 小，第一頁就會被誤判成最後一頁。
      一定要撈到 0 筆才停。

   ⚠️ build 必須是「回傳新 query」的函式，不能傳 query 物件本身。
      Supabase 的 query builder 用過一次就不能再用。

   ⚠️ 一定要有穩定排序，否則分頁之間可能重複或漏掉。 */
async function fetchAll(build, pageSize){
  const N=pageSize||1000;
  let from=0, out=[];
  for(;;){
    const r=await build().range(from, from+N-1);
    if(r.error)return {data:null, error:r.error};
    const rows=r.data||[];
    if(rows.length)out=out.concat(rows);
    if(rows.length===0)break;
    from+=rows.length;
    if(out.length>200000)break;   /* 保險，正常不會到 */
  }
  return {data:out, error:null};
}
/* fetchAll 的平行版。

   ⚠️ 為什麼需要另一支：fetchAll 是一頁等一頁（撈完才知道還有沒有下一頁），
      3,000 位賓客＋12,000 筆答案要來回三十幾次，
      每次一百多毫秒疊起來就是 5 秒 —— 大螢幕按下抽獎後畫面靜止 5 秒，
      主持人會以為當機。

   做法：先用 count 問總共幾筆，再把所有分頁一次發出去。
   來回次數從「頁數」變成「1 次 count ＋ 1 輪平行」。

   ⚠️ 仍然需要穩定排序，否則各頁之間會重疊或漏掉。
   ⚠️ 併發數壓在 6：一次丟三十個請求出去，瀏覽器和 Supabase 兩邊都會塞車，
      反而更慢。 */
async function fetchAllFast(build, opt){
  const N=(opt&&opt.pageSize)||1000;
  const MAX=(opt&&opt.concurrency)||6;
  /* ⚠️ build 收一個參數 cnt，由呼叫端自己決定要不要帶 count。
     不能在這裡再接一次 .select() —— build() 回來的 query 已經 select 過了，
     再 select 一次會變成兩個 select，PostgREST 回傳 0 筆而且**不報錯**。
     症狀是名單整個空掉、大螢幕顯示「（賓客已刪除）」，
     但資料庫其實好好的。2026-08-27 踩過一次。 */
  const c=await build(true);
  if(c.error)return {data:null,error:c.error};
  const total=c.count||0;
  if(!total)return {data:[],error:null};

  const ranges=[];
  for(let f=0;f<total;f+=N)ranges.push([f,Math.min(f+N-1,total-1)]);

  const out=[];
  for(let i=0;i<ranges.length;i+=MAX){
    const batch=ranges.slice(i,i+MAX);
    const rs=await Promise.all(batch.map(r=>build(false).range(r[0],r[1])));
    for(const r of rs){
      if(r.error)return {data:null,error:r.error};
      if(r.data&&r.data.length)out.push.apply(out,r.data);
    }
  }
  return {data:out,error:null};
}

/* 把 Edge Function 回來的原始錯誤字串翻成現場看得懂的一句話。
   函式已收斂為只回 {"error":"db_error","ref":"XXXXXX"}，
   ref 是追蹤碼 —— 拿這組碼到 Supabase → Edge Functions → Logs 搜，就能定位那一次錯誤。
   需要看完整細節時，到 Edge Functions → Secrets 設 DEBUG_ERRORS=1，查完拿掉。 */
function friendlyErr(raw){
  if(!raw)return '操作失敗';
  let o=null;try{o=JSON.parse(raw)}catch(_){}
  if(!o||!o.error)return String(raw).slice(0,120);
  const ref=o.ref?'（代碼 '+o.ref+'）':'';
  const M={
    /* not_found 是正常結果不是故障：畫面上方已經說「連結無效」，
       這裡回空字串，不要再補一句系統錯誤嚇人 */
    not_found:'',
    db_error:'系統錯誤'+ref+'，請截圖告知主管',
    config_error:'系統設定異常'+ref+'，請告知主管',
    code_disabled:'這組代碼已被停用，請向主管索取新代碼',
    bad_code:'代碼不正確，請重新輸入',
    code_taken:'這組代碼已被其他裝置使用',
    bad_request:'送出的資料有問題，請重試一次',
    method_not_allowed:'系統錯誤，請截圖告知主管',
    unknown_action:'系統錯誤，請截圖告知主管'
  };
  /* 用 in 判斷不用 || ：not_found 的值是空字串，用 || 會被當成沒對到 */
  return (o.error in M)?M[o.error]:('系統錯誤'+ref+'，請截圖告知主管');
}

async function meRefresh(silent){

    const r=await sb.functions.invoke('guest-info',{body:{token:(ME&&ME.token)||qp('t')||''}});
    if(!r.error&&r.data&&r.data.guest){

      ME=r.data.guest;MEEV=r.data.event||MEEV;MEFIELDS=r.data.fields||MEFIELDS;
      MEMORE=r.data.more||MEMORE;
      const afterN=JSON.stringify(((MEMORE&&MEMORE.redeem)||{}).items||[]);

      if(before!==ME.status||beforeN!==afterN){MEBUSY=false;render();mePollReset();return}
    }

const CKDEV='kuya_checkin_device', CKTAB='kuya_checkin_tab';
function rndId(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4)}

  try{ t=sessionStorage.getItem(CKTAB)||''; if(!t){t=rndId();sessionStorage.setItem(CKTAB,t)} }catch(_){t=t||'notab'}
  return d+'_'+t;
}

function qKey(){return 'kuya_q_'+CKCODE}

function lsGet(k,fb){try{const v=localStorage.getItem(k);return v?JSON.parse(v):fb}catch(_){return fb}}

function cacheSave(){
  const ok=lsSet(cacheKey(),{
    at:Date.now(),event:EVENTS[0],label:CODE&&CODE.label,fields:FIELDS,
    role:CKROLE,gift:CKGIFT,
    guests:GUESTS,vals:VALS,since:SINCE,stats:STATS});

}
function cacheLoad(){
  const c=lsGet(cacheKey(),null);
  if(!c||!c.event)return false;
  EVENTS=[c.event];EVID=c.event.id;FIELDS=c.fields||[];
  GUESTS=c.guests||[];VALS=c.vals||{};SINCE=c.since||null;STATS=c.stats||null;
  CODE={code:CKCODE,label:c.label||'離線',active:true};
  CKROLE=(c.role==='redeem')?'redeem':'checkin';
  CKGIFT=!!c.gift;
  return true;
}

/* ---------------- LINE 內建瀏覽器對策 ----------------

   LINE 內建瀏覽器有兩個實際問題：不能用相機掃碼，
   而且底部固定列常常擋住內容、頁面滑不動。

   LINE 官方參數 openExternalBrowser=1 會改用手機的預設瀏覽器開。
   ⚠️ 這是 LINE 專屬參數，其他 App 一律忽略 ——
      所以加了不影響信箱、掃碼、桌機，也不影響我們自己解析網址。
   ⚠️ 只在「從 LINE 對話框點連結的那一刻」生效。
      人已經在內建瀏覽器裡了，再用 JS 改網址是沒用的，LINE 不會重新判斷。
      所以另外有 lineBar() 那一條提示列當第二道防線。

   哪些連結要加，是 2026-09-02 跟 Neal 逐項確認過的：
     加　匯出 Excel 的個人連結、核銷頁網址、信件裡的按鈕（在 Edge Function 那邊加）
     不加 大螢幕與投影頁（一律用桌機開）、QR 的內容（相機開的，不經過 LINE） */
function lineUrl(u){
  const t=String(u||'');
  if(t.indexOf('openExternalBrowser=')>=0)return t;   /* 已經有了就不重複加 */
  return t+(t.indexOf('?')>=0?'&':'?')+'openExternalBrowser=1';
}

function ansShow(gid,f){

   名單頁、統計、匯出三處都讀這一份，不各自查各自的 */
let RECS={};

async function loadRedeem(id){
  ITEMS=[];RECS={};
  const it=await sb.from('redeem_items').select('*')
    .eq('event_id',id).order('sort_order').order('id');
  if(it.error){log('讀取兌換品項失敗',it.error.message,true);return}
  ITEMS=it.data||[];
  if(!ITEMS.length)return;
  /* 三千人的場子，兌換紀錄輕易超過一千筆 */
  const r=await fetchAll(()=>sb.from('redeem_records').select('*')
    .eq('event_id',id).order('id'));
  if(r.error){log('讀取兌換紀錄失敗',r.error.message,true);return}
  (r.data||[]).forEach(x=>{
    if(!RECS[x.guest_id])RECS[x.guest_id]=[];
    RECS[x.guest_id].push(x);
  });

async function loadEvent(id){
  LOADING=true;ERR=null;EVID=id;render();
  const f=await sb.from('form_fields').select('*').eq('event_id',id).eq('active',true).order('sort_order');
  if(f.error){ERR=f.error;LOADING=false;log('讀取欄位失敗',f.error.message,true);render();return}
  FIELDS=f.data||[];
  /* ⚠️ 原本是 .limit(5000)，那個數字沒有作用（見 fetchAll 的說明）。
     三千人的活動只會拿到前 1,000 位。 */
  /* 後台這裡要完整的 guests（編輯、匯出、QR 都會用到別的欄位），
     所以維持 select('*')，但分頁改成平行的。 */
  const g=await fetchAllFast(cnt=>sb.from('guests')
    .select('*', cnt?{count:'exact',head:true}:{})
    .eq('event_id',id).order('id'));
  if(g.error){ERR=g.error;LOADING=false;log('讀取名單失敗',g.error.message,true);render();return}
  GUESTS=g.data||[];
  VALS={};
  const fids2=FIELDS.map(f=>f.id);
  if(GUESTS.length&&fids2.length){
    /* 直接用 field_id 撈，不用「每 300 位賓客一批」——
       欄位是綁活動的，別場的賓客不會有這場欄位的答案。
       原本的做法在三千人時要來回三十幾次。 */
    const v=await fetchAllFast(cnt=>sb.from('guest_field_values')
      .select('guest_id,field_id,value', cnt?{count:'exact',head:true}:{})
      .in('field_id',fids2).order('guest_id').order('field_id'));
    if(v.error){ERR=v.error;LOADING=false;log('讀取答案失敗',v.error.message,true);render();return}
    (v.data||[]).forEach(r=>{VALS[vKey(r.guest_id,r.field_id)]=r.value});
  }
  await loadRedeem(id);
  LOADING=false;
  log('進入活動 id='+id,
      'form_fields '+FIELDS.length+' 列、guests '+GUESTS.length+' 列、答案 '+Object.keys(VALS).length+' 列'+
      ((GUESTS.length===0)?'　\u26a0\ufe0f 一筆賓客都沒讀到 —— 如果資料庫裡明明有人，就是讀取出問題，不是名單空的':''));
  render();
}

/* 一個欄位與依賴它的子欄位視為一組，一起移動。
   依賴欄位必須排在被依賴欄位後面，否則條件判斷不成立，
   所以子欄位不會被單獨拖到父欄位前面 —— 這裡直接不讓它離開群組。 */
function fieldGroup(id){
  const out=[id];
  FIELDS.forEach(f=>{if(f.dep_field_id===id)out.push(f.id)});
  return out;
}
function fieldIsKid(f){return !!f.dep_field_id}
/* 把 FIELDS 依「群組」重排，回傳新的 id 順序 */
function reorderFields(dragId,targetId,before){
  /* 子欄位不能單獨移動，改成移動它的父欄位 */
  const dg=FIELDS.filter(x=>x.id===dragId)[0];
  const rootId=(dg&&dg.dep_field_id)?dg.dep_field_id:dragId;
  const grp=fieldGroup(rootId);
  if(grp.indexOf(targetId)>=0)return null;      /* 拖到自己那一組裡，不動 */
  const rest=FIELDS.map(f=>f.id).filter(id=>grp.indexOf(id)<0);
  let at=rest.indexOf(targetId);
  if(at<0)return null;
  /* 目標若是子欄位，一律對齊到它那一組的邊界，不會插進群組中間 */
  const tf=FIELDS.filter(x=>x.id===targetId)[0];
  if(tf&&tf.dep_field_id){
    const tg=fieldGroup(tf.dep_field_id).filter(id=>grp.indexOf(id)<0);
    at=before?rest.indexOf(tg[0]):rest.indexOf(tg[tg.length-1]);
  }
  const ins=before?at:at+1;
  return rest.slice(0,ins).concat(grp,rest.slice(ins));
}
let DRAGID=null, AUTOSCROLL=0, DRAGY=0;
/* 拖到畫面上下緣時自動捲動。
   沒有這個，欄位一多就拖不到目標位置，拖曳等於沒有用。
   HTML5 拖曳期間瀏覽器不會自己捲，必須自己算。 */
const EDGE=90;      /* 距離上下緣幾 px 開始捲 */
const SPEED=18;     /* 每一幀最多捲幾 px */
function autoScrollTick(){
  if(!DRAGID){AUTOSCROLL=0;return}
  const h=window.innerHeight;
  let dy=0;
  if(DRAGY<EDGE)          dy=-SPEED*(1-DRAGY/EDGE);
  else if(DRAGY>h-EDGE)   dy= SPEED*(1-(h-DRAGY)/EDGE);
  if(dy){
    /* 表格若自己有橫向捲動容器，垂直捲動仍然是整頁在動 */
    window.scrollBy(0,dy);
  }
  AUTOSCROLL=requestAnimationFrame(autoScrollTick);
}
document.addEventListener('dragover',function(ev){
  if(DRAGID){DRAGY=ev.clientY||DRAGY;ev.preventDefault()}
},true);
document.addEventListener('drop',function(){dragEnd()},true);
function dragStart(ev,id){
  DRAGID=id;
  try{ev.dataTransfer.effectAllowed='move';ev.dataTransfer.setData('text/plain',String(id))}catch(_){}
  const tr=ev.target.closest('tr');if(tr)tr.classList.add('dragging');
  DRAGY=ev.clientY||0;
  if(!AUTOSCROLL)AUTOSCROLL=requestAnimationFrame(autoScrollTick);
}
function dragEnd(){
  DRAGID=null;
  if(AUTOSCROLL){cancelAnimationFrame(AUTOSCROLL);AUTOSCROLL=0}
  document.querySelectorAll('#fldrows tr').forEach(tr=>{
    tr.classList.remove('dragging');tr.classList.remove('dragover')});
}
function dragOver(ev,id){
  ev.preventDefault();
  DRAGY=ev.clientY||DRAGY;
  if(!DRAGID||id===DRAGID)return;
  document.querySelectorAll('#fldrows tr').forEach(tr=>tr.classList.remove('dragover'));
  const tr=ev.target.closest('tr');if(tr)tr.classList.add('dragover');
}
async function dropOn(ev,id){
  ev.preventDefault();
  const from=DRAGID;dragEnd();
  if(!from||from===id)return;
  const fi=FIELDS.findIndex(x=>x.id===from), ti=FIELDS.findIndex(x=>x.id===id);
  const order=reorderFields(from,id,ti<fi);
  if(!order)return;
  await saveOrder(order);
}
/* ---- 選項拖曳排序（活動欄位與範本庫共用）----
   scope 'f'＝form_fields、't'＝field_templates，
   兩邊的資料形狀一樣，差別只在存回哪張表。 */
let ODRAG=null;      /* {scope,id,key} */

function optDragStart(ev,scope,id,key){
  ODRAG={scope:scope,id:id,key:key};
  try{ev.dataTransfer.effectAllowed='move';ev.dataTransfer.setData('text/plain',key)}catch(_){}
  const el=ev.target.closest('.hit');if(el)el.classList.add('dragging');
}
function optDragEnd(){
  ODRAG=null;
  document.querySelectorAll('.hit.optdrag').forEach(el=>{
    el.classList.remove('dragging');el.classList.remove('dragover')});
}
function optDragOver(ev,scope,id,key){
  ev.preventDefault();
  if(!ODRAG||ODRAG.scope!==scope||ODRAG.id!==id||ODRAG.key===key)return;
  document.querySelectorAll('.hit.optdrag').forEach(el=>el.classList.remove('dragover'));
  const el=ev.target.closest('.hit');if(el)el.classList.add('dragover');
}
async function optDrop(ev,scope,id,key){
  ev.preventDefault();
  const d=ODRAG;optDragEnd();
  /* 跨欄位拖曳直接忽略：不同欄位的選項代號體系各自獨立，
     搬過去只會製造對不上的 key */
  if(!d||d.scope!==scope||d.id!==id||d.key===key)return;
  const src=(scope==='f')
    ? (FIELDS.filter(x=>x.id===id)[0]||{}).options
    : (TPLS.filter(x=>x.id===id)[0]||{}).options;
  if(!Array.isArray(src))return;
  const opts=src.slice();
  const fi=opts.findIndex(x=>x.key===d.key);
  const ti=opts.findIndex(x=>x.key===key);
  if(fi<0||ti<0)return;
  const moved=opts.splice(fi,1)[0];
  opts.splice(ti,0,moved);          /* 放到目標的位置，其餘往後推 */
  if(scope==='f')await fldOptsSave(id,opts,'拖曳排序');
  else await tplOptsSave(id,opts,'拖曳排序');
}

/* 排序只在放開時寫一次資料庫，拖過中間每一格不會打 API */
async function saveOrder(order){
  const map={};FIELDS.forEach(f=>{map[f.id]=f});
  const next=order.map((id,i)=>{map[id].sort_order=i;return map[id]});
  FIELDS=next;
  fldPaint();                       /* 先更新畫面，不整頁重繪 */
  const rows=next.map(f=>({id:f.id,sort_order:f.sort_order}));
  for(const r of rows){
    const {error}=await sb.from('form_fields').update({sort_order:r.sort_order}).eq('id',r.id);
    if(error){alert('調整順序失敗');log('調整順序失敗',error.message,true);await loadEvent(EVID);return}
  }
  log('調整欄位順序','放開時才寫入 form_fields.sort_order，共 '+rows.length+' 筆');
}
async function fieldMove(id,dir){
  const f=FIELDS.filter(x=>x.id===id)[0];if(!f)return;
  /* 子欄位跟著父欄位走，不單獨移動 */
  const rootId=f.dep_field_id||id;
  const grp=fieldGroup(rootId);
  const ids=FIELDS.map(x=>x.id);
  const rest=ids.filter(x=>grp.indexOf(x)<0);
  const first=ids.indexOf(grp[0]);
  /* 找出這一組在「其餘欄位」裡的落點 */
  let at=0;
  for(let i=0;i<first;i++){if(grp.indexOf(ids[i])<0)at++}
  const to=at+dir;
  if(to<0||to>rest.length)return;
  const order=rest.slice(0,to).concat(grp,rest.slice(to));
  await saveOrder(order);
}

/* field_key 是程式代號，有資料後不可變更，所以自動產生就好。
   中文標題無法直接當代號，改用 f + 流水號，重複就往後找 */
/* 同名欄位：警告但允許（B）＋ 列表持續標示（C）。
   不完全禁止（A）的理由：同名常常只是中間狀態 ——
   從範本挑兩次再分別改名、Excel 表頭本來就重複、改名過程中暫時撞名。
   硬擋會卡到正常操作，而真正的技術風險（匯入寫錯欄位）
   已經由「衝突紀錄帶 field_id」解決，不需要靠禁止同名。 */
function sameLabel(label,exceptId){
  const t=String(label||'').trim();
  if(!t)return [];
  return FIELDS.filter(f=>f.id!==exceptId&&String(f.label||'').trim()===t);
}
function warnSameLabel(label,exceptId){
  const dup=sameLabel(label,exceptId);
  if(!dup.length)return true;
  return confirm('這場已經有欄位叫「'+label+'」（共 '+dup.length+' 個）。\n\n'+
    '同名不會影響資料正確性 —— 系統靠欄位編號辨識，不是名稱。\n'+
    '但匯出的 Excel 會出現兩個一樣的表頭，人工核對時容易搞混。\n\n仍要繼續嗎？');
}
function mkFieldKey(){
  const used={};FIELDS.forEach(f=>{used[f.field_key]=1});
  let n=FIELDS.length+1;
  while(used['f'+n])n++;
  return 'f'+n;
}
/* 一行一個 → [{key:'o1',t:{zh:'葷食'}}]
   存的是代號，顯示的是文字，所以之後改文字不會影響已填的答案 */
function parseOpts(raw){
  const lines=String(raw||'').split('\n').map(x=>x.trim()).filter(x=>x);
  return lines.map((t,i)=>({key:'o'+(i+1),t:{zh:t}}));
}
function optsToText(options){
  if(!options||!options.length)return '';
  return options.map(o=>(o.t&&o.t.zh)||o.key).join('\n');
}

async function tplUseChecked(){
  const ids=Array.prototype.slice.call(
    document.querySelectorAll('#tplpick input[type=checkbox]:checked'))
    .map(x=>parseInt(x.value,10)).filter(x=>x);
  if(!ids.length){alert('請先勾選要加入的範本');return}

      '\n\n仍要加入嗎？（會變成兩個同名欄位）'))return;
  await tplAddRows(ids);
}
async function tplAddRows(ids){
  const base=FIELDS.length?Math.max.apply(null,FIELDS.map(f=>f.sort_order))+1:0;
  const used={};FIELDS.forEach(f=>{used[f.field_key]=1});
  let n=FIELDS.length+1;
  const nextKey=()=>{while(used['f'+n])n++;used['f'+n]=1;return 'f'+n};
  const rows=[];
  ids.forEach((id,i)=>{
    const t=TPLS.filter(x=>x.id===id)[0];if(!t)return;
    rows.push({event_id:EVID,template_id:t.id,field_key:nextKey(),
      label:t.label,t:t.t||{zh:t.label},field_type:t.field_type,options:t.options,
      hint:t.hint||null,
      sort_order:base+i,
      show_in_form:true,show_in_list:true,show_to_guest:false,include_export:true});
  });
  if(!rows.length)return;
  busy('加入中…');
  const {error}=await sb.from('form_fields').insert(rows);
  busy(null);
  if(error){alert('加入失敗');log('從範本加入欄位失敗',error.message,true);return}
  log('從範本庫加入欄位 '+rows.length+' 個：'+rows.map(r=>r.label).join('、'),
      '複製範本內容到 form_fields，不是引用');
  TPLPICK=false;
  await loadEvent(EVID);
}
async function tplAdd(){
  const lab=(document.getElementById('tpLabel')||{}).value||'';
